     卡片塞在第 1、2 位顾客中间那道墙缝上（x 204~316）：
     订单气泡（y 53~103）是这一屏最不能挡的东西，宁可把卡片做窄；
     不放正中间是因为「对面支摊」的喇叭键就钉在 (480,272)，
     第 41 天起两个重家伙可以同时在场，正中间会撞车。 */
  function drawInspect(ctx, h, clock) {
    var S = G.S;
    var x0 = 204, y0 = 122, w = 112;
    G.box(ctx, x0, y0, w, 132, 14, 'rgba(255,248,236,.96)', 4);
    G.text(ctx, '卫 生 检 查', x0 + w / 2, y0 + 18, { size: 14, col: P.red });
    G.bar(ctx, x0 + 14, y0 + 32, w - 28, 9, h.t / h.max, P.orange);
    var rows = [
      { ok: !E.unwrapped(), t: '包好纸' },
      { ok: !(S.poop > 0),  t: '扫角落' }
    ];
    for (var i = 0; i < rows.length; i++) {
      var ry = y0 + 60 + i * 24;
      G.circle(ctx, x0 + 22, ry, 7, rows[i].ok ? P.green : P.red, 2.5, P.ink);
      G.text(ctx, rows[i].t, x0 + 36, ry,
        { size: 14, col: rows[i].ok ? P.greenDark : P.ink, align: 'left' });
    }
    // 罚款实时算：清掉一项数字就往下跳一截，玩家才知道「现在收拾还来得及」
    var bad = E.dirty();
    G.text(ctx, bad ? '不合格' : '合格 ·有奖', x0 + w / 2, y0 + 108,
      { size: 12, col: bad ? P.inkSoft : P.greenDark });
    G.text(ctx, bad ? '罚 ¥' + E.fineNow() : '+¥' + Math.round(econ(S.day) * 0.02),
      x0 + w / 2, y0 + 122, { size: 17, col: bad ? P.red : P.greenDark });

    // 指路：还没清的地方套个闪圈，别让玩家满屏找
    var pulse = 3 + Math.abs(Math.sin(clock * 5)) * 4;
    if (S.poop > 0 && G.POOP)
      G.circle(ctx, G.POOP.x, G.POOP.y, 26 + pulse, null, 3, P.red);
    for (var t2 = 0; t2 < S.tray.length; t2++) {
      var it = S.tray[t2];
      if (!it || typeof it !== 'object' || (it.wrapT || 0) >= 1) continue;
      var tp = traySlot(t2);
      G.circle(ctx, tp.x, tp.y, 30 + pulse, null, 3, P.red);
    }
  }

  /* 对面那个摊：条纹布挂在**画面最下面**那条挡板上 + 柜台上的吆喝键。
     不挂顶上是因为 y 53~103 全是订单气泡 —— 遮住「这单要什么」比事件本身还贵。
     最下面那条 506~536 是车身裙板，本来就没有任何信息。 */
  function drawRival(ctx, h, clock) {
    var y0 = 506, hh = 30;
    G.box(ctx, 8, y0, G.W - 16, hh, 10, '#E8E1D2', 4);
    ctx.save();
    G.rrect(ctx, 8, y0, G.W - 16, hh, 10); ctx.clip();
    for (var s = -1; s < 26; s++) {
      ctx.beginPath();
      ctx.moveTo(8 + s * 40 + (clock * 24) % 40, y0);
      ctx.lineTo(8 + s * 40 - 20 + (clock * 24) % 40, y0 + hh);
      G.shape(ctx, null, 13, 'rgba(228,67,58,.26)');
    }
    ctx.restore();
    G.box(ctx, 8, y0, G.W - 16, hh, 10, null, 4);
    var left = Math.max(0, h.need - h.shout);
    G.text(ctx, left ? '对面支了个摊 · 大 酬 宾 —— 点柜台上的喇叭吆喝，还差 ' + left + ' 声'
                     : '对面支了个摊 —— 你嗓门更大，客又回来了',
      G.W / 2, y0 + hh / 2, { size: 15, col: left ? P.red : P.greenDark });

    // 吆喝键：故意放在两位顾客中间那道缝上，不去抢递餐的点击
    var bx = G.W / 2, by = 272;
    var hot = h.quiet > 0;
    ctx.beginPath();
    ctx.arc(bx, by, 42, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.clamp(h.t / h.max, 0, 1));
    G.shape(ctx, null, 5, hot ? P.green : P.red);
    ctx.globalAlpha = 0.45;
    G.circle(ctx, bx, by, 34 + Math.abs(Math.sin(clock * 6)) * (hot ? 2 : 7), null, 3,
      hot ? P.green : P.red);
    ctx.globalAlpha = 1;
    G.circle(ctx, bx, by, 28, hot ? '#BFE6C4' : P.yellow, 4);
    ctx.save();
    ctx.translate(bx, by);
    ctx.beginPath();
    ctx.moveTo(-13, -8); ctx.lineTo(2, -15); ctx.lineTo(2, 15); ctx.lineTo(-13, 8);
    ctx.closePath(); G.shape(ctx, P.cream, 3);
    ctx.beginPath(); ctx.arc(4, 0, 11, -0.8, 0.8);
    G.shape(ctx, null, 3, P.ink);
    ctx.beginPath(); ctx.arc(4, 0, 17, -0.7, 0.7);
    G.shape(ctx, null, 2.5, P.ink);
    ctx.restore();
    for (var i = 0; i < h.need; i++)
      G.circle(ctx, bx - (h.need - 1) * 9 + i * 18, by - 52, 5,
        i < h.shout ? P.green : 'rgba(255,248,236,.6)', 2, P.ink);
  }

  /* 事件层给主循环提供一条“现在先救什么”的只读线索。事件本身已经有
     倒计时和颜色，但忙起来时玩家还要在顾客、工位和移动靶之间找一次；
     这里把真正临界的事件统一转成和 game.js 观察器相同的 cue 形状。
     只有跳闸 / 检查 / 抢摊 / 补货会立刻抢话筒，其余移动事件要进入最后
     约 72% 的剩余时间才提示，避免画面常年被“拍苍蝇”打断。 */
  function eventLeft(h) {
    var max = +h.max, left = +h.t;
    if (!(max > 0) || max >= 900) return 1;
    return G.clamp(left / max, 0, 1);
  }
  function eventUrgent(h) {
    if (!h) return false;
    if (h.kind === 'outage' || h.kind === 'inspect' || h.kind === 'rival' || h.kind === 'refill') return true;
    if (h.kind === 'nag') {
      var nc = G.S && G.S.cust ? G.S.cust[h.slot] : null;
      return !!(nc && (nc.urgent || nc.patience / Math.max(1, nc.pmax) < 0.58));
    }
    if (h.kind === 'bigask' || h.kind === 'friend') {
      var bc = G.S && G.S.cust ? G.S.cust[h.slot] : null;
      return eventLeft(h) < 0.78 || !!(bc && bc.urgent);
    }
    return eventLeft(h) < 0.72;
  }
  function eventRank(h) {
    var rank = { outage: 0, inspect: 1, rival: 2, refill: 3, nag: 4,
      bigask: 5, friend: 6, rat: 7, cat: 8, wind: 9, fly: 10 };
    return (rank[h.kind] === undefined ? 20 : rank[h.kind]) + eventLeft(h) * 0.18;
  }
  function eventCue(h) {
    var S = G.S, target = null, label = '', col = '#D2660A', c, i, tr;
    if (!h || !eventUrgent(h)) return null;
    if (h.kind === 'fly') {
      target = E.flyPos(h); label = '先拍苍蝇'; col = '#6E5B48';
    } else if (h.kind === 'cat') {
      target = { x: h.x, y: h.y }; label = '先赶走野猫'; col = '#8A6A48';
    } else if (h.kind === 'rat') {
      target = { x: h.x, y: h.y }; label = '先打跑老鼠 · 还差 ' + Math.max(0, h.need - h.hit) + ' 下'; col = '#6E5B48';
    } else if (h.kind === 'wind') {
      target = { x: h.x, y: h.y }; label = '接住油纸'; col = '#5E7A8C';
    } else if (h.kind === 'outage') {
      var oz = Z[h.key];
      if (!oz) return null;
      target = { x: oz.x + oz.w / 2, y: oz.y + oz.h / 2 };
      label = (h.txt || '故障') + ' · 连点修好'; col = '#8B9AA5';
    } else if (h.kind === 'refill') {
      var sauce = G.SAUCE || { x: 268, y: 4, w: 116, h: 42 };
      target = { x: sauce.x + sauce.w / 2, y: sauce.y + sauce.h / 2 };
      label = '补满辣椒油 · ' + h.fix + '/' + h.need; col = '#D2660A';
    } else if (h.kind === 'rival') {
      target = { x: G.W / 2, y: 272 }; label = '先吆喝 · 还差 ' + Math.max(0, h.need - h.shout) + ' 声'; col = '#7A4FC0';
    } else if (h.kind === 'inspect') {
      if (S && S.poop > 0 && G.POOP) {
        target = { x: G.POOP.x, y: G.POOP.y }; label = '先扫角落';
      } else if (S && S.tray) {
        for (i = 0; i < S.tray.length; i++) {
          tr = S.tray[i];
          if (tr && (tr.wrapT || 0) < 1) { target = traySlot(i); label = '先包好这份纸'; break; }
        }
      }
      if (!target) { target = { x: 260, y: 180 }; label = '先通过卫生检查'; }
      col = '#8B9AA5';
    } else if (h.kind === 'nag' || h.kind === 'bigask' || h.kind === 'friend') {
      c = S && S.cust ? S.cust[h.slot] : null;
      var sl = G.SLOT[h.slot];
      if (!c || !sl) return null;
      target = { x: sl.cx, y: 205 };
      label = h.kind === 'nag' ? '先处理催单客' : h.kind === 'bigask' ? '加肉决定 · 点他劝住' : '先决定带不带朋友';
      col = h.kind === 'nag' ? '#D2660A' : h.kind === 'bigask' ? '#8E2B22' : '#F58220';
    }
    if (!target || !isFinite(+target.x) || !isFinite(+target.y)) return null;
    return { kind: 'event', target: target, label: label, urgent: true,
      event: h.kind, col: col, ratio: eventLeft(h) };
  }

  /* ============ G.Events ============ */

  var E = G.Events = {
    haz: [],            // 活动中的危机事件
    floats: [],         // 自己的飘字
    clock: 0,
    t: 0,               // 距下次出事
    cool: {},           // 各类事件的冷却剩余秒数
    kept: false,        // 今天开摊时盆里有没有昨天盖布留下的料
    streak: 0, hot: 0,  // 连击数 / 手气正顺剩余秒数
    lastServed: 0, lastLost: 0, lastWalked: 0,
    egg: 0, eggDir: 1, eggTaps: 0, eggT: 0,
    banner: null,

    KIND: KIND,         // 自检和调参用，游戏本身不读
    econ: econ,

    _debug: {
      spawned: 0,
      hazards: 0,                      // 只数真正的意外事件（不含手气正顺 / 彩蛋）
      byType: {},
      gapMul: 1,                       // 测试用：把出事间隔按比例缩短
      force: null,                     // 测试用：下一次出事强制出这一种
      penalty: 0,                      // 所有惩罚折成钱的累计
      fined: 0,                        // 其中真的从钱包里扣走的
      worst: 0,                        // 单次最狠的一下
      reset: function () {
        this.spawned = 0; this.hazards = 0; this.byType = {};
        this.penalty = 0; this.fined = 0; this.worst = 0;
      }
    },

    /* 首遇缓冲只作用于这一只事件，避免把后期整体难度偷偷削平。 */
    prepareIntro: function (h, kind, day) {
      var bit = introBit(kind), flags = G.S.eventIntroFlags | 0;
      if (!h || !bit || (flags & bit)) return h;
      G.S.eventIntroFlags = flags | bit;
      h.intro = 1;
      h.introPaid = 0;
      h.introBonus = Math.max(3, Math.round(econ(day) * 0.008));

      /* 处理方式各不相同：移动靶放慢、倒计时多给一点、连点少一下。
         只改首遇对象，不改 KIND 表，所以常规密度与后期平衡仍可观测。 */
      if (kind === 'fly') {
        h.t += 1.6; h.max = h.t;
      } else if (kind === 'cat') {
        h.t += 3; h.max = h.t; h.sp *= 0.82;
      } else if (kind === 'nag') {
        h.rate *= 0.70;
      } else if (kind === 'outage') {
        h.t += 2.5; h.max = h.t; h.need = Math.max(3, h.need - 1);
      } else if (kind === 'refill') {
        h.t += 3; h.max = h.t; h.need = Math.max(2, h.need - 1);
      } else if (kind === 'wind') {
        h.t += 3; h.max = h.t; h.sp *= 0.80;
      } else if (kind === 'bigask' || kind === 'friend') {
        h.t += 2.5; h.max = h.t;
      } else if (kind === 'rat') {
        h.t += 3; h.max = h.t; h.need = Math.max(1, h.need - 1);
        h.hopT += 1.0;
      } else if (kind === 'inspect') {
        h.t += 3; h.max = h.t;
      } else if (kind === 'rival') {
        h.t += 4; h.max = h.t; h.need = Math.max(2, h.need - 1);
      }

      this.banner = { txt: '新事件 · ' + (INTRO_TEXT[kind] || kind) + '（首遇有缓冲）', t: 2.8 };
      if (G.Snd && G.Snd.unlock) G.Snd.unlock();
      if (G.FX && G.FX.on) G.FX.on('unlock', G.W / 2, 200, kind);
      return h;
    },

    /* 处理事件本身也是一段应得的恢复：它只减慢当前队列一小会儿，
       不加钱、不暂停，也不会因为事件自然超时触发。h.recoveryPaid 防止
       同一事件在“先劝住再递餐”等双路径里重复给窗口。 */
    recoverAfterEvent: function (h, x, y) {
      var S = G.S, rec = G.eventRecoveryForDay ? G.eventRecoveryForDay(S.day) : null;
      if (!h || h.recoveryPaid || !rec || !(rec.duration > 0)) return false;
      h.recoveryPaid = 1;
      S.eventCalmT = Math.max(0, +S.eventCalmT || 0, rec.duration);
      S.eventCalmMax = Math.max(0, +S.eventCalmMax || 0, rec.duration);
      S.eventCalmMul = Math.min(+S.eventCalmMul || 1, G.clamp(+rec.mul || 1, 0.5, 1));
      this.fx('处理好了 · 队列稳住 ' + rec.duration.toFixed(1) + 's',
        x || G.W / 2, y || 220, '#357A38', 14);
      if (G.FX && G.FX.on) G.FX.on('evclear', x || G.W / 2, y || 220, 'recovery');
      return true;
    },

    /* 只有玩家主动化解，或把对应挑战做成了好结果，才发首遇奖励。 */
    introReward: function (h, x, y) {
      var S = G.S;
      if (!h) return 0;
      this.recoverAfterEvent(h, x, y);
      if (!h.intro || h.introPaid) return 0;
      h.introPaid = 1;
      var bonus = Math.max(3, h.introBonus | 0);
      S.money += bonus; S.dayMoney = (S.dayMoney || 0) + bonus;
      this.fx('首遇处理奖励 +¥' + bonus, x || G.W / 2, y || 220, '#1D8A3C', 18);
      if (G.Snd && G.Snd.cash) G.Snd.cash();
      if (G.FX && G.FX.on) G.FX.on('cash', x || G.W / 2, y || 220, bonus);
      return bonus;
    },

    /* make() 是唯一的事件构造出口；把首遇逻辑包在这里，强制触发、主动补货
       和正常随机生成三条路都不会漏掉。 */
    make: function (kind, day, forced) {
      var h = this._make(kind, day, forced);
      return h ? this.prepareIntro(h, kind, day || G.S.day) : h;
    },

    /* ---- 生命周期 ---- */
    startDay: function (day) {
      var S = G.S;
      this.haz = [];
      this.floats = [];
      this.clock = 0;
      this.cool = {};
      this.streak = 0; this.hot = 0;
      this.lastServed = S.served | 0;
      this.lastLost   = S.lost   | 0;
      this.lastWalked = S.walked | 0;
      this.egg = 0; this.eggTaps = 0; this.eggT = 0;
      this.banner = null;
      /* game.js 的 startDay 先 freshStations()（把散料清零）再把 S.keep 倒回盆里，
         最后才叫我们。所以「开摊那一刻盆里就有料」只可能来自收摊盖布。 */
      this.kept = (S.mince > 0 || S.pep > 0);
      if (this.kept) G.Snd.leftover();      // 掀开盖布那一下，很轻
      if (this.kept && day >= SPEC.rat.day) {
        this.banner = { txt: '盆边有牙印 —— 夜里来过东西', t: 2.4 };
      }
      this.t = gap(day) * G.rand(0.6, 1.0);
    },

    update: function (dt) {
      var S = G.S, i, k;
      this.clock += dt;

      for (i = this.floats.length - 1; i >= 0; i--) {
        var f = this.floats[i];
        f.life += dt; f.y -= 34 * dt;
        if (f.life > f.ttl) this.floats.splice(i, 1);
      }
      if (this.eggT > 0) this.eggT = Math.max(0, this.eggT - dt);
      if (this.egg  > 0) this.egg  = Math.max(0, this.egg  - dt);
      if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
      for (k in this.cool) if (this.cool[k] > 0) this.cool[k] = Math.max(0, this.cool[k] - dt);

      this.trackStreak(dt);

      for (i = this.haz.length - 1; i >= 0; i--)
        if (!this.step(this.haz[i], dt)) this.haz.splice(i, 1);

      if (S.timeLeft > 0) {
        this.t -= dt;
        if (this.t <= 0) {
          this.t = gap(S.day) * G.rand(0.75, 1.3);
          this.trySpawn(S.day);
        }
      }
    },

    /* ---- 连击奖励：连续 5 单不失误 → 手气正顺 ---- */
    trackStreak: function (dt) {
      var S = G.S;
      if (this.hot > 0) this.hot = Math.max(0, this.hot - dt);

      if ((S.lost | 0) > this.lastLost || (S.walked | 0) > this.lastWalked) {
        this.lastLost = S.lost | 0;
        this.lastWalked = S.walked | 0;
        this.streak = 0;
      }
      if ((S.served | 0) > this.lastServed) {
        var got = (S.served | 0) - this.lastServed;
        this.lastServed = S.served | 0;
        if (this.hot > 0) {
          var bonus = (4 + S.day) * got;
          S.money += bonus; S.dayMoney = (S.dayMoney || 0) + bonus;
          this.fx('手气正顺 +¥' + bonus, G.W / 2, 210, '#B07800', 22);
          G.Snd.luckyStreak();
          if (G.FX) G.FX.on('cash', G.W / 2, 210, bonus);
        }
        this.streak += got;
        if (S.day >= 3 && this.hot <= 0 && this.streak >= HOT_NEED) {
          this.streak = 0;
          this.hot = HOT_DUR;
          this.banner = { txt: '手气正顺！', t: 2.2 };
          this._count('streak');
          G.Snd.bell();
          if (G.FX) G.FX.on('rush', G.W / 2, 200, '手气正顺');
        }
      }
    },

    /* ---- 出新事件：按权重抽，抽不出来的顺延给下一种 ---- */
    trySpawn: function (day) {
      var p = pool(day), i;
      if (!p.length) return;
      if (this.haz.length >= maxHaz(day)) return;

      if (this._debug.force) {                    // 自检用的定向触发
        var fk = this._debug.force;
        this._debug.force = null;
        if (!SPEC[fk] || day < SPEC[fk].day) return;   // 定向触发也照样守解锁表
        var fh = this.make(fk, day, true);
        if (fh) { this.haz.push(fh); this._count(fk); this.cool[fk] = SPEC[fk].cool; }
        return;
      }

      var heavy = 0;
      for (i = 0; i < this.haz.length; i++)
        if (SPEC[this.haz[i].kind] && SPEC[this.haz[i].kind].heavy) heavy++;

      /* 先把「现在允许出」的挑出来，再按权重逐个试。
         某类当下造不出来（出餐口空着没得偷、没人在等）就顺延到别的类型，
         不会白白浪费这次出事机会。 */
      var left = [], tot = 0;
      for (i = 0; i < p.length; i++) {
        var sp = SPEC[p[i]];
        if (this.cool[sp.k] > 0) continue;
        if (this.count(sp.k) >= sp.max) continue;
        if (sp.k === 'outage' && this.count('outage') >= MAX_OUTAGE) continue;
        if (sp.heavy && heavy >= maxHeavy(day)) continue;
        var w = sp.w(day);
        if (!(w > 0)) continue;
        left.push({ k: sp.k, w: w });
        tot += w;
      }
      while (left.length) {
        var r = Math.random() * tot, j = 0;
        for (; j < left.length - 1; j++) { r -= left[j].w; if (r <= 0) break; }
        var kind = left[j].k;
        tot -= left[j].w;
        left.splice(j, 1);
        var h = this.make(kind, day);
        if (h) {
          this.haz.push(h);
          this._count(kind);
          this.cool[kind] = SPEC[kind].cool;
          return;
        }
      }
    },

    _make: function (kind, day, forced) {
      var S = G.S, i, k;
      day = day || S.day;

      if (kind === 'fly') {
        var tg = this.flyTargets();
        if (!tg.length) return null;                       // 摊上没东西可脏，就不出
        var life = Math.max(2.4, 4.0 - 0.15 * (day - 3));
        G.Snd.flyBuzz();
        // 第 22 天起是「一团」：要打两下。同样是点，但得连着点准两次
        return { kind: 'fly', tgt: G.pick(tg), t: life, max: life, ph: G.rand(0, 9),
                 need: day >= 22 ? 2 : 1, hit: 0 };
      }

      if (kind === 'cat') {
        if (!S.tray.length) return null;                   // 出餐口空着就没得偷
        var dir = Math.random() < 0.5 ? 1 : -1;
        G.Snd.catMeow();
        return { kind: 'cat', dir: dir,
                 x: dir > 0 ? -50 : G.W + 50,
                 y: Z.tray.y - 4,
                 sp: G.rand(112, 148) + day * 4,
                 stolen: false, need: day >= 18 ? 2 : 1, t: 14, max: 14 };
      }

      if (kind === 'nag') {
        var free = [];
        for (k = 0; k < S.cust.length; k++) {
          var c = S.cust[k];
          if (c && c.state === 'wait' && !this.onCust(c)) free.push(k);
        }
        if (!free.length) return null;
        var slot = G.pick(free), ref = S.cust[slot];
        /* 催单费跟着体量走：第 5 天 ¥5，第 30 天 ¥14。
           固定 ¥4~19 到后期就是「白送一笔小钱换你双倍掉耐心」，
           玩家的最优解会变成盼着他来 —— 那就不是意外事件了。 */
        var fee = Math.max(4, Math.round(econ(day) * 0.012));
        S.money += fee; S.dayMoney = (S.dayMoney || 0) + fee;
        this.fx('催单费 +¥' + fee, G.SLOT[slot] ? G.SLOT[slot].cx : G.W / 2, 286, P.orangeDk, 19);
        G.Snd.nag();
        return { kind: 'nag', slot: slot, ref: ref, fee: fee, t: 999, max: 999,
                 rate: Math.min(1.6, 0.9 + 0.02 * (day - 5)) };
      }

      if (kind === 'outage') {
        var ks = [];
        for (i = 0; i < STATIONS.length; i++) if (unlocked(STATIONS[i])) ks.push(STATIONS[i]);
        if (!ks.length) return null;
        var dur = G.rand(13, 18);
        G.Snd.outage();
        // 连点次数跟着天数涨：第 6 天 5 下，第 33 天 8 下
        return { kind: 'outage', key: G.pick(ks), t: dur, max: dur, fix: 0,
                 need: 5 + Math.floor((day - 6) / 9),
                 txt: G.pick(['跳闸了！', '煤气不够了！']) };
      }

      /* 辣椒油见底：主动点顶栏会立刻叫后厨补货，随机事件也只在库存告急时
         生成。三下补满，放着不管则继续断供并付出一点机会成本。 */
      if (kind === 'refill') {
        if (!forced && (S.sauceStock || 0) > 1) return null;
        G.Snd.refill(0);
        return { kind: 'refill', t: 8, max: 8, fix: 0, need: 3 };
      }

      /* 穿堂风：一张油纸横着卷过柜台。接住 = 白赚一次；没接住，
         已经包好的成品被掀开纸，得回纸站重新拖一张。
         取舍在于：接它要在铁盘那一带追一个横移的靶子，而那正好是
         你要出餐的手。忙的时候放它走反而是对的 —— 前提是你敢算这笔账。 */
      if (kind === 'wind') {
        if (!S.tray.length && !(S.hand && S.hand.kind === 'paper')) return null;
        var wd = Math.random() < 0.5 ? 1 : -1;
        G.Snd.gust();
        return { kind: 'wind', dir: wd,
                 x: wd > 0 ? -60 : G.W + 60,
                 y: G.rand(406, 432), a: G.rand(0, 6),
                 spin: G.rand(-3.4, 3.4),
                 sp: G.rand(205, 250) + day * 2,
                 n: 1 + Math.floor((day - 9) / 8),
                 t: 10, max: 10 };
      }

      /* 他要加肉：一位正在等的客人临时改主意。
         头顶那块牌子点得下去 —— 点了就是劝住他（省事，但也没了 bigPay），
         不点就等着单子变成 ≥130g 的加肉单（多赚，可你手不一定抓得满）。
         这是一道明摆着的二选一，不是「看到就点一下」。 */
      if (kind === 'bigask') {
        if (day < (G.BIG_DAY || 5)) return null;
        var cands = [];
        for (i = 0; i < S.cust.length; i++) {
          var c1 = S.cust[i];
          if (!c1 || c1.state !== 'wait' || this.onCust(c1)) continue;
          if (!this.plainMain(c1)) continue;
          cands.push(i);
        }
        if (!cands.length) return null;
        var bs = -1;                                  // 优先 T 恤哥：他本来就是「多放肉」那位
        for (i = 0; i < cands.length; i++)
          if (S.cust[cands[i]].faceId === 'tee') { bs = cands[i]; break; }
        if (bs < 0) bs = G.pick(cands);
        G.Snd.holler();
        return { kind: 'bigask', slot: bs, ref: S.cust[bs], t: 6, max: 6 };
      }

      /* 常客带朋友：单子当场变长，耐心也按样数补上。
         挥手让朋友等下次 = 安稳；收下 = 多几样菜的钱 + 一笔带客小费，
         但整单是一起结的，做不完就一起黄。 */
      if (kind === 'friend') {
        var fc = [];
        for (i = 0; i < S.cust.length; i++) {
          var c2 = S.cust[i];
          if (!c2 || c2.state !== 'wait' || this.onCust(c2)) continue;
          if (!c2.faceId) continue;                   // 只有那四位常客才带得来朋友
          if (!c2.items || c2.items.length >= 4) continue;   // 单子塞满了就真放不下了
          fc.push(i);
        }
        if (!fc.length) return null;
        var fs = G.pick(fc);
        G.Snd.chatter();
        return { kind: 'friend', slot: fs, ref: S.cust[fs], t: 5.5, max: 5.5,
                 add: day >= 24 ? 2 : 1, stage: 0, worth: 0 };
      }

      /* 翻盆的老鼠：直接啃盆里的散料，按比例啃 —— 备得越满亏得越多，
         正好抵住「收摊盖布 + 开摊剁满盆」的无风险套利。
         得打中它两下（第 26 天起三下）才赶得走，中间它还会换盆，
         所以这是「停下手上的活儿去打老鼠」和「让它啃」之间的账。 */
      if (kind === 'rat') {
        if (S.mince < 80 && S.pep < 60) return null;
        var spots = ['board'];
        if (unlocked('pepper')) spots.push('pepper');
        var sp0 = G.pick(spots);
        var pos = zoneCenter(sp0);
        G.Snd.squeak();
        return { kind: 'rat', spot: sp0, spots: spots,
                 x: pos.x, y: pos.y - 8, dir: Math.random() < 0.5 ? 1 : -1,
                 bob: 0, hopT: G.rand(2.2, 3.4),
                 need: day >= 26 ? 3 : 2, hit: 0, spent: 0,
                 t: 12, max: 12 };
      }

      /* 卫生检查：十一秒之内把台面收拾干净，否则按当天流水罚款。
         「清掉角落那几坨」意味着这一天没得扔了 —— 彩蛋第一次有了成本。
         焦馍也算当天的卫生事故，和特殊城管共用同一条口径。 */
      if (kind === 'inspect') {
        if (!forced && !this.dirty()) return null;    // 台面本来就干净，没人上门
        G.Snd.clipboard();
        return { kind: 'inspect', t: 11, max: 11 };
      }

      /* 对面支了个摊：全队耐心一起承压，得每隔几秒腾出手吆喝一嗓子。
         和跳闸的「连点五下就完事」不同 —— 这是十五秒里反复被打断的节奏，
         每一嗓子都是一次没在做饭的手。 */
      if (kind === 'rival') {
        G.Snd.megaphone();
        return { kind: 'rival', t: 15, max: 15, shout: 0, need: 4, quiet: 0, paid: 0 };
      }
      return null;
    },

    /* 苍蝇能落的地方：只挑「有东西可毁」的，避免空摊挨罚 */
    flyTargets: function () {
      var S = G.S, out = [], i;
      for (i = 0; i < S.tray.length; i++) out.push({ kind: 'tray', i: i });
      if (unlocked('board')  && S.mince > 0) out.push({ kind: 'st', key: 'board'  });
      if (unlocked('pepper') && S.pep   > 0) out.push({ kind: 'st', key: 'pepper' });
      if (unlocked('make')   && S.bun   > 0) out.push({ kind: 'st', key: 'make'   });
      if (unlocked('fridge') && S.fridge !== 'empty') out.push({ kind: 'st', key: 'fridge' });
      if (unlocked('noodle') && S.noodle && S.noodle.state !== 'empty')
        out.push({ kind: 'st', key: 'noodle' });
      if (unlocked('grill')) {
        var live = S.bun > 0;
        for (i = 0; i < S.grill.length; i++) if (S.grill[i].state === 'toasting') live = true;
        if (live) out.push({ kind: 'st', key: 'grill' });
      }
      return out;
    },

    flyPos: function (h) {
      if (h.tgt.kind === 'tray')
        return traySlot(G.clamp(h.tgt.i, 0, Math.max(0, G.CFG.maxTray - 1)));
      return zoneCenter(h.tgt.key);
    },

    /* 一位顾客身上已经挂着事件了没有 —— 免得三块牌子叠在一个人头上 */
    onCust: function (c) {
      for (var i = 0; i < this.haz.length; i++)
        if (this.haz[i].ref === c) return true;
      return false;
    },
    nagOn: function (c) {
      for (var i = 0; i < this.haz.length; i++)
        if (this.haz[i].kind === 'nag' && this.haz[i].ref === c) return true;
      return false;
    },

    /* 这单里有没有「还没做、又还没加肉」的主食 */
    plainMain: function (c) {
      if (!c || !c.items) return false;
      for (var i = 0; i < c.items.length; i++) {
        var o = c.items[i];
        if (!o.done && !o.big && (o.type === 'rjm' || o.type === 'rjmp')) return true;
      }
      return false;
    },

    /* 这一下点下去能不能真的把餐递出去 —— 口径抄 game.js 的 servable()，
       外加 actServe 里那条「要加肉的，普通份糊弄不过去」 */
    servableNow: function (c) {
      var S = G.S, o, t;
      if (!c || c.state !== 'wait') return false;
      for (o = 0; o < c.items.length; o++) {
        var it = c.items[o];
        if (it.done) continue;
        if (it.type === 'bf') { if (S.drinks > 0) return true; continue; }
        for (t = 0; t < S.tray.length; t++) {
          var tr = S.tray[t];
          if (!tr || typeof tr !== 'object') continue;
          if (tr.type !== it.type || (tr.wrapT || 0) < 1) continue;
          if (it.big && (tr.meat || 0) < (G.CFG.bigNeed || 130)) continue;
          return true;
        }
      }
      return false;
    },

    /* 铁盘上有没有还没包纸的成品（卫生检查 / 穿堂风都要问） */
    unwrapped: function () {
      var S = G.S;
      for (var i = 0; i < S.tray.length; i++) {
        var it = S.tray[i];
        if (it && typeof it === 'object' && (it.wrapT || 0) < 1) return true;
      }
      return false;
    },
    dirty: function () {
      return (this.unwrapped() ? 1 : 0) + ((G.S.poop > 0) ? 1 : 0) +
        ((G.S.burntToday > 0) ? 1 : 0);
    },
    /* 现在收摊检查会罚多少：6% 打底，每项再加 3%；超过三项仍由 hurt() 封顶 */
    fineNow: function () {
      return Math.min(this.limit(), Math.round(econ(G.S.day) * (0.06 + 0.03 * this.dirty())));
    },

    /* 单次惩罚的上限（折成钱） */
    limit: function () { return Math.max(6, Math.round(econ(G.S.day) * MAX_HIT)); },

    /* 所有惩罚都从这里走：折成钱、封顶、记账。cash=true 时真的从钱包里扣。 */
    hurt: function (yuan, cash) {
      var v = Math.round(Math.max(0, yuan));
      var lim = this.limit();
      if (v > lim) v = lim;
      if (cash) { G.S.money = Math.max(0, G.S.money - v); G.S.dayCost = (G.S.dayCost || 0) + v; }
      var d = this._debug;
      d.penalty += v;
      if (cash) d.fined += v;
      if (v > d.worst) d.worst = v;
      return v;
    },

    /* ---- 每帧推进单个事件；返回 false 表示结束 ---- */
    step: function (h, dt) {
      var S = G.S, i, c, p;

      if (h.kind === 'fly') {
        h.t -= dt;
        if (h.t > 0) return true;
        this.spoil(h);
        return false;
      }

      if (h.kind === 'cat') {
        h.x += h.dir * h.sp * dt;
        h.t -= dt;
        if (!h.stolen && S.tray.length) {
          p = traySlot(0);                     // 出餐口是紧凑数组，最左边永远是 [0]
          if (Math.abs(h.x - p.x) < 26) {
            var take = Math.min(h.need, S.tray.length), val = 0;
            for (i = 0; i < take; i++) {
              val += itemValue(S.tray[0]);
              S.tray.splice(0, 1);
            }
            h.stolen = true;
            this.hurt(val, false);
            this.fx(take > 1 ? '野猫叼走 ' + take + ' 份！' : '野猫叼走一份！',
              p.x, p.y - 44, P.red, 19);
            G.Snd.steal();
            if (G.FX) G.FX.on('nope', p.x, p.y);
          }
        }
        if (h.t <= 0) return false;
        return h.dir > 0 ? h.x < G.W + 60 : h.x > -60;
      }

      if (h.kind === 'nag') {
        c = S.cust[h.slot];
        if (!c || c !== h.ref) return false;
        if (c.state === 'happy') {             // 赶在他发作之前出餐：他也认账
          this.introReward(h, G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 250);
          this.fx('大哥满意了 +¥' + h.fee, G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2,
            250, '#1D8A3C', 18);
          S.money += h.fee; S.dayMoney = (S.dayMoney || 0) + h.fee;
          G.Snd.cash();
          return false;
        }
        if (c.state !== 'wait') {              // 他真跑了 —— 骂骂咧咧，全队跟着急
          S.shockT = Math.max(S.shockT || 0, 4);
          this.hurt(econ(S.day) * 0.03, false);
          this.fx('他骂骂咧咧走了', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2,
            250, P.red, 18);
          if (G.FX) G.FX.on('angry', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 200);
          return false;
        }
        c.patience -= h.rate * dt;             // 额外掉耐心，总共约 1.9~2.6 倍
        return true;
      }

      if (h.kind === 'outage') {
        h.t -= dt;
        if (h.t > 0) return true;
        var z = Z[h.key];
        this.hurt(econ(S.day) * 0.04, false);  // 一整段瘫痪的机会成本
        this.fx('好了，通电了', z.x + z.w / 2, z.y + 40, P.green, 18);
        G.Snd.powerOn();
        return false;
      }

      if (h.kind === 'refill') {
        h.t -= dt;
        if (h.t > 0) return true;
        if (h.fix < h.need) {
          this.hurt(econ(S.day) * 0.025, false);
          this.fx('调料断供，顾客等急了', G.SAUCE.x + G.SAUCE.w / 2, 76, P.red, 17);
          G.Snd.spoil();
        }
        return false;
      }

      if (h.kind === 'wind') {
        h.x += h.dir * h.sp * dt;
        h.a += h.spin * dt;
        h.t -= dt;
        if (h.t <= 0) { this.blowAway(h); return false; }
        if (h.dir > 0 ? h.x > G.W + 70 : h.x < -70) { this.blowAway(h); return false; }
        return true;
      }

      if (h.kind === 'bigask') {
        c = S.cust[h.slot];
        if (!c || c !== h.ref || c.state !== 'wait') return false;
        h.t -= dt;
        if (h.t > 0) return true;
        var flipped = 0;
        for (i = 0; i < c.items.length && flipped < 2; i++) {
          var o = c.items[i];
          if (o.done || o.big || (o.type !== 'rjm' && o.type !== 'rjmp')) continue;
          o.big = true; flipped++;
          c.pmax += 4; c.patience += 4;        // 加肉要多花工夫，耐心得补上
        }
        if (flipped) {
          this.fx('这单要加肉！每个 ≥' + (G.CFG.bigNeed || 130) + 'g',
            G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 250, P.meatDark, 18);
          G.Snd.bigOn();
          if (G.FX) G.FX.on('rush', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 210, '加肉');
        }
        return false;
      }

      if (h.kind === 'friend') {
        c = S.cust[h.slot];
        if (!c || c !== h.ref) return false;
        if (h.stage === 0) {
          if (c.state !== 'wait') return false;
          h.t -= dt;
          if (h.t > 0) return true;
          this.addFriend(h, c);
          h.stage = 1; h.t = 999; h.max = 999;
          return true;
        }
        if (c.state === 'happy') {             // 连朋友那份一起做完了
          this.introReward(h, G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 240);
          var tipf = Math.round(econ(S.day) * 0.03);
          S.money += tipf; S.dayMoney = (S.dayMoney || 0) + tipf;
          this.fx('带客小费 +¥' + tipf, G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2,
            240, '#1D8A3C', 20);
          G.Snd.cash();
          if (G.FX) G.FX.on('cash', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 240, tipf);
          return false;
        }
        if (c.state !== 'wait') {              // 单子变长反而做不完，朋友那份也黄了
          this.hurt(h.worth, false);
          this.fx('朋友那份也黄了', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2,
            240, P.red, 18);
          return false;
        }
        return true;
      }

      if (h.kind === 'rat') {
        h.t -= dt;
        h.bob += dt * 9;
        h.hopT -= dt;
        if (h.hopT <= 0 && h.spots.length > 1) this.ratHop(h);
        var lim = this.limit();
        if (h.spent < lim) {
          /* 按比例啃：盆里越满，一秒钟没空管它的代价越大。
             下限 30 g/s 是为了让空盆时它也不至于完全没威胁。 */
          var eat, val;
          if (h.spot === 'pepper' && S.pep > 0) {
            eat = Math.min(S.pep, Math.max(22, S.pep * 0.06) * (this.kept ? 1.7 : 1) * dt);
            S.pep = Math.max(0, S.pep - eat);
            val = pepValue(eat);
          } else if (S.mince > 0) {
            eat = Math.min(S.mince, Math.max(30, S.mince * 0.06) * (this.kept ? 1.7 : 1) * dt);
            var fatRatio = G.minceFatRatio ? G.minceFatRatio() : 0.42;
            S.mince = Math.max(0, S.mince - eat);
            S.minceFat = Math.max(0, (S.minceFat || 0) - eat * fatRatio);
            val = meatValue(eat);
          } else val = 0;
          h.spent += val;
          this.hurt(val, false);
          if (val > 0) G.Snd.gnaw();        // 自带 300ms 闸，不会糊成一根锉声
        }
        if (h.t > 0) return true;
        this.fx('老鼠啃走 ¥' + Math.round(h.spent) + ' 的料',
          h.x, h.y - 52, P.red, 18);
        G.Snd.spoil();
        return false;
      }

      if (h.kind === 'inspect') {
        h.t -= dt;
        if (h.t > 0) return true;
        var bad = this.dirty();
        if (!bad) {
          this.introReward(h, G.W / 2, 200);
          var rw = Math.round(econ(S.day) * 0.02);
          S.money += rw; S.dayMoney = (S.dayMoney || 0) + rw;
          this.fx('检查过了 · 卫生先进 +¥' + rw, G.W / 2, 200, '#1D8A3C', 22);
          G.Snd.stampOk();
          // 检查结果的好坏 fx 的差分观察器判断不了，得显式告诉它
          if (G.FX) { G.FX.on('evclear', G.W / 2, 200, 'inspect'); G.FX.on('cash', G.W / 2, 200, rw); }
        } else {
          /* 罚款按当天流水走：6% + 每项 3%，一项 9%、两项 12%，正好压在天花板上 */
          var fine = this.hurt(this.fineNow(), true);
          this.fx('卫生不合格 罚 ¥' + fine, G.W / 2, 200, P.red, 24);
          G.Snd.stampBad();
          if (G.FX) G.FX.on('nope', G.W / 2, 200);
        }
        return false;
      }

      if (h.kind === 'rival') {
        h.t -= dt;
        if (h.quiet > 0) h.quiet = Math.max(0, h.quiet - dt);
        if (h.quiet <= 0) {                    // 没在吆喝的时候，全队一起多掉耐心
          for (i = 0; i < S.cust.length; i++) {
            c = S.cust[i];
            if (c && c.state === 'wait') c.patience -= 0.75 * dt;
          }
        }
        if (h.t > 0) return true;
        if (h.shout >= h.need) {
          this.introReward(h, G.W / 2, 226);
          var bw = Math.round(econ(S.day) * 0.03);
          S.money += bw; S.dayMoney = (S.dayMoney || 0) + bw;
          this.fx('把客喊回来了 +¥' + bw, G.W / 2, 226, '#1D8A3C', 22);
          G.Snd.rivalGone(); G.Snd.cash();
          if (G.FX) G.FX.on('cash', G.W / 2, 226, bw);
        } else {
          for (i = 0; i < S.cust.length; i++) {
            c = S.cust[i];
            if (c && c.state === 'wait') c.patience -= c.pmax * 0.12;
          }
          this.hurt(econ(S.day) * 0.04, false);
          this.fx('客都让对面拉走了', G.W / 2, 226, P.red, 20);
          G.Snd.crowdOff();
        }
        return false;
      }
      return false;
    },

    /* ---- 老鼠换盆：打了一下没打死，它就窜到另一个盆去 ---- */
    ratHop: function (h) {
      var other = [];
      for (var i = 0; i < h.spots.length; i++) if (h.spots[i] !== h.spot) other.push(h.spots[i]);
      if (other.length) h.spot = G.pick(other);
      var p = zoneCenter(h.spot);
      h.dir = (p.x < h.x) ? -1 : 1;
      h.x = p.x; h.y = p.y - 8;
      h.hopT = G.rand(2.2, 3.4);
      G.Snd.squeak();
    },

    /* ---- 风没接住的后果：手里的纸吹飞 + 已经包好的被掀开 ---- */
    blowAway: function (h) {
      var S = G.S, i, lost = 0, val = 0;
      if (S.hand && S.hand.kind === 'paper' && S.hand.amt > 0) {
        S.hand.amt = 0; S.hand.kind = null;
        val += 2;
        lost++;
      }
      /* 没包纸的成品是轻的 —— 风一来直接卷下台面；包好的只是被掀掉纸。
         所以「做好了赶紧包上」第一次有了防守上的意义，而不只是出餐前的一道手续。 */
      var loose = -1, wrapped = [];
      for (i = 0; i < S.tray.length; i++) {
        var it = S.tray[i];
        if (!it || typeof it !== 'object') continue;
        if ((it.wrapT || 0) < 1) { if (loose < 0) loose = i; }
        else if (it.type !== 'lp') wrapped.push(i);
      }
      var blown = 0, n = 0;
      if (loose >= 0) {
        val += itemValue(S.tray[loose]);
        S.tray.splice(loose, 1);
        blown = 1; lost++;
      } else {
        n = Math.min(h.n, wrapped.length);
        for (i = 0; i < n; i++) {
          var pick = wrapped.splice(Math.floor(Math.random() * wrapped.length), 1)[0];
          var t2 = S.tray[pick];
          t2.wrapT = 0; t2.wrapping = 0;
          val += 4;                            // 重新拖一张纸大约耽误两秒，折 ¥4
          lost++;
        }
      }
      if (!lost) {
        this.fx('风把纸吹跑了', G.W / 2, 420, P.inkSoft, 17);
        return;
      }
      this.hurt(val, false);
      this.fx(blown ? '没包纸的那份卷跑了！' :
              (n ? '纸被掀了 ' + n + ' 份，得重包' : '手里那张吹跑了'),
        G.W / 2, 418, P.red, 19);
      G.Snd.paperFly();
      if (G.FX) G.FX.on('nope', G.W / 2, 430);
    },

    /* ---- 朋友那份点什么：照着这位常客的口味来 ---- */
    friendItem: function (c, day) {
      var t = null, big = false;
      var TR = (G.Regulars && G.Regulars.TRAIT) ? G.Regulars.TRAIT[c.faceId] : null;
      if (TR && TR.order) {
        var l = TR.order(day, false);
        if (l && l.length) { var o = G.pick(l); t = o.type; big = !!o.big; }
      }
      var open = G.ITEM_DAY || { rjm: 1, bf: 2, rjmp: 3, lp: 4 };
      if (!t || open[t] === undefined || day < open[t]) t = 'rjm';
      big = big && day >= (G.BIG_DAY || 5) && (t === 'rjm' || t === 'rjmp');
      return { type: t, big: big, done: false };
    },

    addFriend: function (h, c) {
      var day = G.S.day, added = 0, i;
      var ct = (G.CTYPE && G.CTYPE[c.type]) || null;
      var TR = (G.Regulars && G.Regulars.TRAIT) ? G.Regulars.TRAIT[c.faceId] : null;
      /* 每样菜补多少耐心，和 game.js spawn() / regulars.js 一个口径：
         5 秒 × 性格倍率 × 脾气倍率。不补的话「点得多反而更催」，手感是坏的。 */
      var per = 5 * (ct ? ct.pat : 1) * (TR ? TR.pat : 1);
      for (i = 0; i < h.add && c.items.length < 4; i++) {
        var it = this.friendItem(c, day);
        c.items.push(it);
        h.worth += itemValue(it);
        c.pmax += per; c.patience += per;
        added++;
      }
      if (!added) { h.worth = 0; return; }
      this.fx('他朋友也要 ' + added + ' 份', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2,
        246, P.orangeDk, 19);
      G.Snd.friendJoin();
      if (G.FX) G.FX.on('serve', G.SLOT[h.slot] ? G.SLOT[h.slot].cx : G.W / 2, 220);
    },

    /* ---- 苍蝇没打着的后果 ---- */
    spoil: function (h) {
      var S = G.S, msg = null, p = this.flyPos(h), i, val = 0;

      if (h.tgt.kind === 'tray') {
        if (h.tgt.i < S.tray.length) {
          val = itemValue(S.tray[h.tgt.i]);
          S.tray.splice(h.tgt.i, 1);
          msg = '苍蝇沾了，扔了';
        }
      } else {
        var key = h.tgt.key;
        /* 料堆按比例毁：固定「一份」在第 30 天只有几毛钱，
           盆越满、被糟蹋的越多，才配得上后期的体量。 */
        if (key === 'board') {
          if (S.mince > 0) {
            var mg = Math.min(S.mince, Math.max(G.CFG.minceUnit || 130, S.mince * 0.16));
            S.mince = Math.max(0, S.mince - mg);
            val = meatValue(mg);
            msg = '肉馅脏了 ' + Math.round(mg) + 'g';
          }
        } else if (key === 'pepper') {
          if (S.pep > 0) {
            var pg = Math.min(S.pep, Math.max(G.CFG.pepUnit || 40, S.pep * 0.16));
            S.pep = Math.max(0, S.pep - pg);
            val = pepValue(pg);
            msg = '青椒丢 ' + Math.round(pg) + 'g';
          }
        } else if (key === 'make') {
          if (S.bun > 0) {
            S.bun = Math.max(0, S.bun - 1);
            val = (G.CFG.costDough || 1) + 3;
            msg = '一个馍废了';
          }
        } else if (key === 'fridge') {
          if (S.fridge !== 'empty') { S.fridge = 'empty'; val = 4; msg = '这瓶不能卖了'; }
        } else if (key === 'noodle') {
          if (S.noodle && S.noodle.state !== 'empty') {
            S.noodle.state = 'empty'; S.noodle.mix = 0; S.noodle.ang = null;
            val = 7;
            msg = '这碗倒了';
          }
        } else if (key === 'grill') {
          for (i = 0; i < S.grill.length; i++) {
            if (S.grill[i].state === 'toasting') {
              S.grill[i].state = 'empty'; S.grill[i].t = 0; S.grill[i].flag = 0;
              val = (G.CFG.costDough || 1) + 2;
              msg = '馍上落苍蝇了'; break;
            }
          }
          if (!msg && S.bun > 0) {
            S.bun = Math.max(0, S.bun - 1);
            val = (G.CFG.costDough || 1) + 3;
            msg = '馍上落苍蝇了';
          }
        }
      }
      if (val > 0) this.hurt(val, false);
      this.fx(msg || '苍蝇飞走了', p.x, p.y - 40, msg ? P.red : P.inkSoft, 18);
      G.Snd.spoil();
      if (msg && G.FX) G.FX.on('nope', p.x, p.y);
    },

    /* ---- 点击：判定圈一律 ≥46（真机 9.7mm），会动的给到 54 ---- */
    tap: function (x, y) {
      var S = G.S, i, h, p, sl;

      // 彩蛋只观察不吃掉（HUD 这块游戏本身也不响应）
      if (G.inRect(x, y, EGG_BOX)) {
        if (this.eggT <= 0) this.eggTaps = 0;
        this.eggTaps++;
        this.eggT = 2.5;
        if (this.eggTaps >= 5) { this.eggTaps = 0; this.eggT = 0; this.popEgg(); }
        return false;
      }

      // r=46 而不是 32：32 在手机上只有 6.8mm，还是个会跑的靶子 ——
      // 手指落点本来就有几毫米误差，判定圈比画的苍蝇大一圈才打得着
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'fly') continue;
        p = this.flyPos(h);
        if ((x - p.x) * (x - p.x) + (y - p.y) * (y - p.y) <= 46 * 46) {
          h.hit++;
          if (h.hit >= h.need) {
            this.introReward(h, p.x, p.y - 38);
            this.haz.splice(i, 1);
            this.fx('打中了！', p.x, p.y - 38, P.green, 20);
            if (G.FX) G.FX.on('chop', p.x, p.y);
          } else {
            this.fx('散了一只', p.x, p.y - 38, P.orangeDk, 17);
          }
          G.Snd.swat();
          return true;
        }
      }

      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'cat') continue;
        if ((x - h.x) * (x - h.x) + (y - h.y) * (y - h.y) <= R_MOVE * R_MOVE) {
          this.introReward(h, h.x, h.y - 42);
          this.haz.splice(i, 1);
          this.fx('去去去！', h.x, h.y - 42, P.green, 20);
          G.Snd.shoo();
          return true;
        }
      }

      // 老鼠：打一下它换个盆接着啃，打够 need 下才走
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'rat') continue;
        if ((x - h.x) * (x - h.x) + (y - h.y) * (y - h.y) > R_MOVE * R_MOVE) continue;
        h.hit++;
        if (h.hit >= h.need) {
          this.introReward(h, h.x, h.y - 44);
          this.haz.splice(i, 1);
          this.fx('打跑了！', h.x, h.y - 44, P.green, 20);
          G.Snd.ratFlee();
        } else {
          this.ratHop(h);
          this.fx('它窜到那边去了', h.x, h.y - 44, P.orangeDk, 17);
          G.Snd.shoo();
        }
        return true;
      }

      // 被风卷走的油纸
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'wind') continue;
        if ((x - h.x) * (x - h.x) + (y - h.y) * (y - h.y) <= R_MOVE * R_MOVE) {
          this.introReward(h, h.x, h.y - 40);
          this.haz.splice(i, 1);
          this.fx('接住了！', h.x, h.y - 40, P.green, 20);
          G.Snd.snatch();
          return true;
        }
      }

      /* 加肉 / 带朋友：整位顾客都是靶子，不用去戳一个小牌子 ——
         判定圈再大也大不过「他本人」，手机上这是唯一稳的做法。
         但要是这一下本来就能把餐递出去，就放行给 game.js：
         「东西已经做好了，那就趁他改口之前赶紧给他」是玩家真正想做的事，
         被一个提示牌拦住会非常憋屈。两条路都把事件收掉。 */
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'bigask' && h.kind !== 'friend') continue;
        if (h.kind === 'friend' && h.stage !== 0) continue;   // 朋友已经进单了，撤不回来
        sl = G.SLOT[h.slot]; if (!sl) continue;
        if (!G.inRect(x, y, sl.hit)) continue;
        this.haz.splice(i, 1);
        this.introReward(h, sl.cx, 240);
        if (this.servableNow(S.cust[h.slot])) return false;   // 让位给 actServe
        if (h.kind === 'bigask') this.fx('劝住了，还是普通份', sl.cx, 240, P.inkSoft, 18);
        else this.fx('让朋友下回再来', sl.cx, 240, P.inkSoft, 18);
        G.Snd.waveOff();
        return true;
      }

      // 卫生检查：点角落把那几坨扫了（代价是今天没得扔了）
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'inspect') continue;
        if (!G.POOP || G.S.poop <= 0) continue;
        if ((x - G.POOP.x) * (x - G.POOP.x) + (y - G.POOP.y) * (y - G.POOP.y) > R_TAP * R_TAP) continue;
        G.S.poop = 0;
        this.fx('扫干净了（今天没得扔了）', G.POOP.x + 60, G.POOP.y - 24, P.green, 17);
        G.Snd.sweep();
        return true;
      }

      // 对面支摊：吆喝键
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'rival') continue;
        if ((x - G.W / 2) * (x - G.W / 2) + (y - 272) * (y - 272) > R_MOVE * R_MOVE) continue;
        h.shout++;
        h.quiet = 3.0;
        this.fx('肉夹馍 —— 刚出锅 ——', G.W / 2, 236, P.orangeDk, 19);
        G.Snd.hawk();
        return true;
      }

      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'outage') continue;
        if (!G.inRect(x, y, Z[h.key])) continue;
        h.fix++;
        G.Snd.fixTick(h.fix);
        if (h.fix >= h.need) {
          this.introReward(h, Z[h.key].x + Z[h.key].w / 2, Z[h.key].y + 40);
          this.haz.splice(i, 1);
          var z = Z[h.key];
          this.fx('修好了！', z.x + z.w / 2, z.y + 40, P.green, 20);
          G.Snd.powerOn();
        }
        return true;
      }

      /* 调料补货只占顶栏这一块，玩家不需要把手指拖回某个狭窄的后厨按钮。 */
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'refill') continue;
        var sauce = G.SAUCE || { x: 268, y: 4, w: 116, h: 42 };
        if (!G.inRect(x, y, sauce)) continue;
        h.fix++;
        G.Snd.fixTick(h.fix);
        if (h.fix >= h.need) {
          this.introReward(h, sauce.x + sauce.w / 2, 76);
          this.haz.splice(i, 1);
          G.S.sauceStock = G.CFG.sauceStock || 7;
          this.fx('后厨补满辣椒油！', sauce.x + sauce.w / 2, 76, P.green, 18);
          if (G.Snd.refill) G.Snd.refill(h.fix);
          if (G.FX) G.FX.on('evclear', sauce.x + sauce.w / 2, 76, 'refill');
        }
        return true;
      }
      return false;
    },

    /* 顶栏库存见底时由 game.js 主动叫一次补货，不等待随机计时器。 */
    requestRefill: function () {
      var S = G.S;
      if ((S.sauceStock || 0) > 0) return false;
      for (var i = 0; i < this.haz.length; i++)
        if (this.haz[i].kind === 'refill') return true;
      if (this.haz.length >= maxHaz(S.day || 1)) return false;
      var h = this.make('refill', S.day || 1, true);
      if (!h) return false;
      this.haz.push(h); this._count('refill');
      this.cool.refill = SPEC.refill.cool;
      return true;
    },
    refillState: function () {
      for (var i = 0; i < this.haz.length; i++)
        if (this.haz[i].kind === 'refill') return this.haz[i];
      return null;
    },

    /* 只在事件进入紧急段时返回一个 cue；正常情况下把视觉优先权留给
       game.js 的顾客 / 工位观察器，保持画面一次只说一件事。 */
    focusForPlayer: function () {
      if (!G.S || G.S.mode !== 'play') return null;
      var best = null, score = 999;
      for (var i = 0; i < this.haz.length; i++) {
        var h = this.haz[i];
        if (!eventUrgent(h)) continue;
        var sc = eventRank(h);
        if (sc < score) { best = h; score = sc; }
      }
      return best ? eventCue(best) : null;
    },

    /* ---- 工位是否被瘫痪 ---- */
    active: function (key) {
      for (var i = 0; i < this.haz.length; i++)
        if (this.haz[i].kind === 'outage' && this.haz[i].key === key) return true;
      return false;
    },

    count: function (kind) {
      var n = 0;
      for (var i = 0; i < this.haz.length; i++) if (this.haz[i].kind === kind) n++;
      return n;
    },

    popEgg: function () {
      this.egg = EGG_DUR;
      this.eggDir = Math.random() < 0.5 ? 1 : -1;
      this._count('egg');
      G.Snd.egg();
    },

    fx: function (txt, x, y, col, size) {
      this.floats.push({
        txt: txt, x: G.clamp(x, 74, G.W - 74), y: y,
        col: col || P.ink, size: size || 18, life: 0, ttl: 1.05
      });
      if (this.floats.length > 12) this.floats.shift();
    },

    _count: function (k) {
      this._debug.spawned++;
      if (SPEC[k]) this._debug.hazards++;      // 手气正顺 / 彩蛋不算「出事」
      this._debug.byType[k] = (this._debug.byType[k] || 0) + 1;
    },

    /* ---- 渲染：工位之上、HUD 之下 ---- */
    render: function (ctx) {
      var i, h, sl;

      for (i = 0; i < this.haz.length; i++)
        if (this.haz[i].kind === 'outage') drawOutage(ctx, this.haz[i]);

      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind === 'nag') drawNag(ctx, h, this.clock);
      }
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind === 'cat') drawCat(ctx, h);
        else if (h.kind === 'rat') drawRat(ctx, h);
        else if (h.kind === 'wind') drawWind(ctx, h);
      }
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind === 'bigask') {
          sl = G.SLOT[h.slot]; if (!sl) continue;
          drawSign(ctx, sl.cx, '加肉？', '点他 = 劝住', h.t / h.max, P.meatDark);
        } else if (h.kind === 'friend' && h.stage === 0) {
          sl = G.SLOT[h.slot]; if (!sl) continue;
          drawSign(ctx, sl.cx, '带朋友', '点他 = 让他下回', h.t / h.max, P.orangeDk);
        }
      }
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind !== 'fly') continue;
        var p = this.flyPos(h);
        drawFly(ctx, p.x, p.y, this.clock * 13 + h.ph, h.t / h.max, h);
      }
      for (i = 0; i < this.haz.length; i++) {
        h = this.haz[i];
        if (h.kind === 'inspect') drawInspect(ctx, h, this.clock);
        else if (h.kind === 'rival') drawRival(ctx, h, this.clock);
      }

      // 手气正顺：柜台前的金色横条
      if (this.hot > 0) {
        G.box(ctx, 8, 356, 524, 26, 13, 'rgba(255,198,61,.92)', 3);
        G.text(ctx, '手气正顺！每单额外 +¥' + (4 + G.S.day) +
          '   还有 ' + this.hot.toFixed(1) + ' 秒', G.W / 2, 250, { size: 15, col: P.ink });
      }
      if (this.banner)
        G.text(ctx, this.banner.txt, G.W / 2, 214,
          { size: 34, col: '#B07800', stroke: P.cream, strokeW: 10 });

      // 彩蛋
      if (this.egg > 0) {
        var pr = 1 - this.egg / EGG_DUR;
        var ex = this.eggDir > 0 ? G.lerp(-90, G.W + 90, pr) : G.lerp(G.W + 90, -90, pr);
        var ey = 330 - Math.sin(pr * Math.PI) * 40;
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(Math.sin(pr * 9) * 0.18);
        if (G.Art && G.Art.roujiamo) G.Art.roujiamo(ctx, 0, 0, 2.2, true);
        ctx.restore();
        ctx.globalAlpha = Math.min(1, this.egg / 0.6);
        G.text(ctx, '嘹咋咋咧！', G.W / 2, 168,
          { size: 40, col: P.meatDark, stroke: P.cream, strokeW: 12 });
        G.text(ctx, '—— 你发现了隐藏彩蛋', G.W / 2, 206,
          { size: 14, col: P.inkSoft, stroke: P.cream, strokeW: 5 });
        ctx.globalAlpha = 1;
        for (var s = 0; s < 10; s++) {
          var sp = (pr * 1.4 + s / 10) % 1;
          G.circle(ctx, ex - this.eggDir * sp * 120,
            ey + 20 + sp * 60 + (s % 3) * 8, 2.6, P.cream, 1.5);
        }
      }

      for (i = 0; i < this.floats.length; i++) {
        var f = this.floats[i];
        ctx.globalAlpha = 1 - Math.pow(f.life / f.ttl, 3);
        G.text(ctx, f.txt, f.x, f.y,
          { size: f.size, col: f.col, stroke: P.cream, strokeW: 6 });
      }
      ctx.globalAlpha = 1;
    }
  };

  /* ---------- 调试截图入口：index.html?shot=play&day=26&ev=rival ----------
     game.js 的 debugScene 摆得出工位和顾客，但它不认识事件层。与其去改 game.js，
     不如在这儿把它包一层 —— 摘掉本文件，这段代码连同它包的那层一起消失。
     只给无头截图核对排版用，正常玩法走不到。 */
  if (G.debugScene) {
    var _scene = G.debugScene;
    G.debugScene = function (q) {
      _scene(q);
      if (!q || !q.ev) return;
      var S = G.S, names = String(q.ev).split(','), i, k;
      // 带朋友 / 加肉都挂在具体某位顾客身上，随手把台前几位换成常客
      for (k = 0; k < S.cust.length; k++) {
        if (!S.cust[k]) continue;
        var f = G.FACES[k % G.FACES.length], lk = G.faceLook(f);
        for (var kk in lk) S.cust[k][kk] = lk[kk];
        S.cust[k].items[0].big = false;
      }
      E.haz = [];
      E.clock = 1.15;                       // 让呼吸动画停在一个不难看的相位上
      for (i = 0; i < names.length; i++) {
        var h = E.make(names[i], S.day, true);
        if (!h) continue;
        // 横穿画面的那几个默认在屏幕外，截图得先挪进来
        if (h.kind === 'cat')  { h.x = G.W * 0.42; }
        if (h.kind === 'wind') { h.x = G.W * 0.52; h.a = 0.5; }
        E.haz.push(h);
      }
    };
  }
})(window.G);

/* ===== js/main.js ===== */
/* 肉夹馍传奇 —— 启动：画布自适应 / 输入 / 主循环 */
(function (G) {
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scale = 1;

  var wrap = document.getElementById('wrap');
  var rot = false, fit = 1;

  /* ============ 手机上一个游戏像素到底有多大 ============
     画面是 960×540 的横屏。手机竖着拿时整块画布转 90° 铺满，
     缩放系数 fit = min(可视长边 / 960, 可视短边 / 540)。
     短边那一项（540）几乎总是卡死的那个，所以画面高度=屏幕宽度。

       机型                     CSS 尺寸   fit      1 游戏px    9mm 折合
       iPhone SE   (163 dpi)    375×667   0.6944   0.1082mm    83.2px
       iPhone 15   (153 dpi)    393×852   0.7278   0.1206mm    74.7px
       安卓小屏    (160 dpi)    360×800   0.6667   0.1058mm    85.0px

     取最差的一台（安卓 360×800）：1 游戏像素 = 0.1058mm。
     手指的可靠命中区约 9mm ⇒ 85 个游戏像素。
     换句话说：圆形判定半径要 ≥ 43，矩形短边要 ≥ 85，才算「一指下去必中」。
     每个判定区的实测毫米数见 harness_mobile.js 打印的尺寸表。 */
  G.MM_PER_PX = 0.105833;                 // 最差参考机上 1 游戏像素 = 多少毫米
  G.TOUCH_MM  = 9;                        // 手指可靠命中区（直径，毫米）
  G.TOUCH_PX  = G.TOUCH_MM / G.MM_PER_PX; // ≈ 85 游戏像素

  /* 纯函数：可视区尺寸 → 转不转 + 缩放多少。
     抽出来是为了能脱离 DOM 直接测（见 harness_mobile.js）。 */
  G.viewFit = function (W, H) {
    var r = H > W;                        // 竖着拿：把横屏画面转过来铺满，不留死板
    var vw = r ? H : W, vh = r ? W : H;
    var f = Math.min(vw / G.W, vh / G.H);
    return { rot: r, fit: f, cssW: G.W * f, cssH: G.H * f };
  };

  /* 纯函数：指针「离 wrap 中心的偏移」→ 游戏坐标。
     画布是 translate(-50%,-50%) rotate(90deg) 绕自身中心转的。
     推一遍：局部偏移 (u,v) 先转 90°（顺时针）成 (-v,u)，再平移到 wrap 中心，
     于是屏幕偏移 dx=-v、dy=u，反解就是 u=dy、v=-dx。
     绝对不能用 getBoundingClientRect —— 旋转后它返回的是外接框，会算歪。 */
  G.viewPoint = function (dx, dy, r, f) {
    var lx = r ?  dy : dx;
    var ly = r ? -dx : dy;
    return { x: lx / f + G.W / 2, y: ly / f + G.H / 2 };
  };

  function resize() {
    var r = wrap.getBoundingClientRect();      // 已经内收过安全区
    var W = r.width || window.innerWidth, H = r.height || window.innerHeight;
    var v = G.viewFit(W, H);
    rot = v.rot; fit = v.fit;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width  = v.cssW + 'px';
    cv.style.height = v.cssH + 'px';
    cv.style.transform = 'translate(-50%, -50%)' + (rot ? ' rotate(90deg)' : '');
    cv.width  = Math.round(v.cssW * dpr);
    cv.height = Math.round(v.cssH * dpr);
    scale = fit * dpr;
  }
  window.addEventListener('resize', resize);
  // iOS 转屏时 resize 会赶在布局落定之前来一发，隔几帧必须再量一次
  window.addEventListener('orientationchange', function () {
    resize();
    if (typeof setTimeout === 'function') { setTimeout(resize, 120); setTimeout(resize, 400); }
  });
  // 地址栏收起 / 键盘弹出走的是 visualViewport，不一定触发 window.resize
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  resize();

  /* ---------- 输入 ---------- */
  /* 只跟一根手指。多指同时按在触屏上很常见（一只手按住肉堆、另一只去点炉子），
     以前第二根按下会把 curX/curY 抢走：手里那把肉瞬移过去，
     任何一根抬起又会拿错误的坐标去结算，肉直接「掉回去」。 */
  var pid = null, lastX = 0, lastY = 0, curX = 0, curY = 0;
  var downX = 0, downY = 0;
  var lastTapAt = -1e9, lastTapX = 0, lastTapY = 0;
  /* 这一按开始时是哪一屏。G.tap 在 pointerdown 就换屏，而 pid 还非空，
     于是下一帧就拿按钮的坐标在玩法层里跑 G.hold —— 标题页的「开始营业」
     正压在剁肉的判定圈上（相距 26px），按住 500ms 能剁出 65g，
     直接把新手引导第一步「按住整块肉一直剁」跳掉。 */
  var gestMode = null;

  function pos(e) {
    var r = wrap.getBoundingClientRect();
    return G.viewPoint(e.clientX - (r.left + r.width / 2),
                       e.clientY - (r.top + r.height / 2), rot, fit);
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (pid !== null) return;                  // 已经有一根在按了，后面的一律不理
    pid = e.pointerId;
    // 抓住这根指针：手指滑到画布外（上下那两条黑边）也照样收得到 move/up，
    // 不会半路 pointerleave 把长按打断、把手里的料丢掉
    if (cv.setPointerCapture) { try { cv.setPointerCapture(pid); } catch (err) {} }
    var p = pos(e); lastX = curX = p.x; lastY = curY = p.y;
    downX = p.x; downY = p.y;
    gestMode = G.S.mode;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var close = now - lastTapAt >= 0 && now - lastTapAt < 340 &&
      Math.hypot(p.x - lastTapX, p.y - lastTapY) < 62;
    if (close) lastTapAt = -1e9; else {
      lastTapAt = now; lastTapX = p.x; lastTapY = p.y;
    }
    if (close && G.doubleTap && G.doubleTap(p.x, p.y)) return;
    G.tap(p.x, p.y);
  }, { passive: false });

  cv.addEventListener('pointermove', function (e) {
    if (pid === null || e.pointerId !== pid) return;
    e.preventDefault();
    var p = pos(e);
    curX = p.x; curY = p.y;
    var d = Math.hypot(p.x - lastX, p.y - lastY);
    G.drag(p.x, p.y, d);
    if (d > 30) { lastX = p.x; lastY = p.y; }
  }, { passive: false });

  function endPtr(e) {
    if (pid === null) return;
    if (e && e.pointerId !== undefined && e.pointerId !== pid) return;
    var sx = downX, sy = downY, ex = curX, ey = curY;
    var swipe = Math.hypot(ex - sx, ey - sy) >= 88;
    if (cv.releasePointerCapture) { try { cv.releasePointerCapture(pid); } catch (err) {} }
    pid = null;
    if (G.release) G.release(curX, curY);
    if (G.up) G.up();
    if (swipe && gestMode === 'play' && G.swipe) G.swipe(sx, sy, ex, ey);
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  // 兜底：万一 capture 没生效（部分安卓 WebView），冒到 window 上也能收尾。
  // 注意这里不再监听 pointerleave —— 触屏上手指划出画布不该算松手
  window.addEventListener('pointerup', endPtr);
  window.addEventListener('pointercancel', endPtr);
  window.addEventListener('blur', function () { endPtr(null); });

  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* iOS Safari 的兜底：长按会弹选择/放大镜，双指会缩放整页。
     CSS 那边已经关了 user-select / touch-callout / touch-action，
     但 iOS 从 10 起就不认 user-scalable=no，捏合还得在这儿挡一道。 */
  ['gesturestart', 'gesturechange', 'gestureend', 'selectstart', 'dragstart', 'dblclick']
    .forEach(function (n) {
      window.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
    });

  /* 空格 / 回车：按住剁肉，各屏则是「主按钮」。
     以前不管在哪一屏都打 G.BTN.start 的坐标（标题页那个按钮的位置），
     在商店里那个点落在第三排第一张卡上 —— 按一下空格会静默替你买一个升级。
     另外玩法里打的是 G.tap(G.BLK)，而剁肉在 G.hold 里，G.tap 到那儿什么也不做。 */
  var keyChop = false;
  window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      var m = G.S.mode;
      if (m === 'play') keyChop = true;                       // 按住期间每帧剁
      else if (m === 'shop') { if (G.Shop && G.Shop.BTN)
        G.Shop.tap(G.Shop.BTN.start.x + 10, G.Shop.BTN.start.y + 10); }
      else if (m === 'night') { if (G.Night && G.Night.tap)
        G.Night.tap(G.Night.BTN.again.x + 10, G.Night.BTN.again.y + 10); }
      else if (m === 'bunmini') { if (G.BunMini && G.BunMini.tap)
        G.BunMini.tap(G.BunMini.BTN.again.x + 10, G.BunMini.BTN.again.y + 10); }
      else if (m === 'comic') { if (G.Story && G.Story.tap && G.Story.COMIC)
        G.Story.tap(G.Story.COMIC.BTN.next.x + 10, G.Story.COMIC.BTN.next.y + 10); }
      else if (m === 'result') G.tap(G.BTN.next.x + 10, G.BTN.next.y + 10);
      else if (m === 'goals')  G.toTitle();
      else G.tap(G.BTN.start.x + 10, G.BTN.start.y + 10);
    }
    if (e.key === 'm' || e.key === 'M') G.Snd.on = !G.Snd.on;
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') keyChop = false;
  });
  window.addEventListener('blur', function () { keyChop = false; });

  /* ---------- 主循环 ---------- */
  G.toTitle();

  /* 调试截图入口：index.html?shot=play&day=6 */
  (function () {
    var s = (window.location && window.location.search) || '';
    if (s.indexOf('shot=') < 0 || !G.debugScene) return;
    var q = {};
    s.replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      q[i < 0 ? kv : kv.slice(0, i)] = i < 0 ? '1' : decodeURIComponent(kv.slice(i + 1));
    });
    G.debugScene(q);
  })();
  var prev = performance.now(), still = 0;
  function frame(now) {
    var dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    if (G.frozen) dt = 0;                         // 调试截图：把画面钉住
    // 这一按引发了换屏，就整段按住都不算数
    if (pid !== null && G.hold && dt && gestMode === G.S.mode)
      G.hold(curX, curY, dt);   // 按住不放 = 抓料
    else if (keyChop && dt && G.S.mode === 'play' && G.hold && G.BLK)
      G.hold(G.BLK.x, G.BLK.y, dt);   // 空格按住 = 一直剁
    if (dt) G.update(dt);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (G.FX && G.FX.pre) G.FX.pre(ctx);
    G.render(ctx);
    if (G.FX && G.FX.post) G.FX.post(ctx);
    // 冻结时渲够几十帧就收手。留着 rAF 空转的话无头 Chrome 永远不 idle，
    // 截图出不来还一直 100% CPU；只渲一帧又不行 —— resize 会重设
    // cv.width 把画布清空，而它往往在首帧之后才触发。
    // 调试截图：无头 Chrome 的 --screenshot 有时抓不到 canvas 图层，
    // 画面明明画满了却截出一张空的。所以直接把画布导成 data URL 塞进 DOM，
    // 外面用 --dump-dom 取走再解码，完全绕开合成这一步。
    // 在好几个帧号上各导出一次，后面的覆盖前面的。
    // 只挂在第 30 帧上是不行的 —— 无头 Chrome 的虚拟时间预算常常跑不满
    // 30 帧就到期，那时 textarea 还没建出来，dump 出来是空的。
    if (G.frozen && (still === 2 || still === 6 || still === 15 || still === 34)) {
      var ta = document.getElementById('png');
      if (!ta) { ta = document.createElement('textarea'); ta.id = 'png'; }
      ta.textContent = cv.toDataURL('image/png');   // 必须是 textContent —— dump-dom 不会序列化 JS 设的 value
      if (!ta.parentNode) document.body.appendChild(ta);
      document.title = 'READY ' + cv.width + 'x' + cv.height;
    }
    if (!G.frozen || ++still <= 34) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})(window.G);

</script>
