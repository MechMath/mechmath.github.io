      if (!gate(key, ms)) return;
      fn(ac, ac.currentTime);
    } catch (e) {}
  }

  /* ---------- 层原语 ---------- */

  /* 噪声层（3 个节点：BufferSource → BiquadFilter → Gain）
     o = { t, dur, atk, peak, kind:'bp'|'lp'|'hp', f0, f1, q, pink, rate,
           hold, steps, send } */
  function nz(ac, o) {
    var buf = o.pink ? CH.pink : CH.white;
    if (!buf) return;
    var t = o.t, dur = o.dur, peak = pos(o.peak);
    var src = ac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = o.rate || rnd(0.9, 1.15);
    var f = ac.createBiquadFilter();
    f.type = o.kind === 'lp' ? 'lowpass' : o.kind === 'hp' ? 'highpass' : 'bandpass';
    f.frequency.setValueAtTime(Math.max(20, o.f0), t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + dur);
    f.Q.value = o.q === undefined ? 1.1 : o.q;
    var g = ac.createGain();

    var atk = o.atk === undefined ? 0.002 : o.atk;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    if (o.steps) {
      // 不规则碎点：纸的褶皱、油花的气泡、烤糊的噼啪。纯自动化，不占节点
      for (var k = 0; k < o.steps; k++) {
        var tt = t + atk + (dur - atk) * (k + Math.random() * 0.85) / o.steps;
        var fade = 1 - k / o.steps;
        g.gain.setValueAtTime(pos(peak * fade * rnd(0.2, 1.0)), tt);
      }
    } else if (o.hold) {
      g.gain.setValueAtTime(peak, t + Math.min(o.hold, dur * 0.8));
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(f); f.connect(g); g.connect(o.out || CH.master);
    if (o.send && CH.send) g.connect(CH.send);
    src.start(t, rnd(0, 0.45));     // 随机起点，避免连发时听着一模一样
    src.stop(t + dur + 0.03);
  }

  /* 振荡层（2 个节点：Oscillator → Gain） */
  function os(ac, o) {
    var t = o.t, dur = o.dur, peak = pos(o.peak);
    var osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f0), t);
    if (o.f1 && o.f1 !== o.f0)
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + dur);
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    var atk = o.atk === undefined ? 0.003 : o.atk;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.out || CH.master);
    if (o.send && CH.send) g.connect(CH.send);
    osc.start(t); osc.stop(t + dur + 0.03);
  }


  /* 人声层（4 个节点：Oscillator → 两条并联带通 → Gain）
   *
   * 说话声不是「某个波形」，是**声带的锯齿被口腔的两个共振峰塑形**。
   * 所以：锯齿当声门源，两条并联（不是串联 —— 串联会互相掐死）的高 Q 带通
   * 当 F1 / F2，两条并到同一个增益上求和。元音就靠这两个中心频率区分：
   *   /a/ 730+1090   /o/ 500+900   /ou/ 450+800   /e/ 530+1840   /i/ 270+2290
   *
   * 多音节不新建节点：一个源 + 两条滤波器，让 f0 和两个共振峰**沿时间滑过去**
   * 就是一句话。这也正是嘴的物理 —— 舌位在动，声带没换。
   * o.seq = [[相对时刻, f0, F1, F2], ...]，至少两项。 */
  function vox(ac, o) {
    var t = o.t, dur = o.dur, peak = pos(o.peak);
    var osc = ac.createOscillator();
    osc.type = o.type || 'sawtooth';
    var b1 = ac.createBiquadFilter(), b2 = ac.createBiquadFilter();
    b1.type = 'bandpass'; b1.Q.value = o.q1 === undefined ? 7  : o.q1;
    b2.type = 'bandpass'; b2.Q.value = o.q2 === undefined ? 11 : o.q2;
    var g = ac.createGain();

    /* 时长至少要盖住最后一个音节，否则包络的收尾会排在音节点之前 ——
       自动化事件一旦乱序，包络就会往回跳，听着像卡带。 */
    var seq = o.seq, i, s0 = seq[0];
    var last = seq[seq.length - 1][0];
    if (dur < last + 0.05) dur = last + 0.05;

    osc.frequency.setValueAtTime(Math.max(24, s0[1]), t);
    b1.frequency.setValueAtTime(Math.max(60, s0[2]), t);
    b2.frequency.setValueAtTime(Math.max(60, s0[3]), t);
    for (i = 1; i < seq.length; i++) {
      var s = seq[i], tt = t + s[0];
      // 音高走指数（听感上的「滑」是等比的），共振峰走线性（舌头是匀速挪的）
      osc.frequency.exponentialRampToValueAtTime(Math.max(24, s[1]), tt);
      b1.frequency.linearRampToValueAtTime(Math.max(60, s[2]), tt);
      b2.frequency.linearRampToValueAtTime(Math.max(60, s[3]), tt);
    }

    var atk = o.atk === undefined ? 0.02 : o.atk;
    if (atk > dur * 0.5) atk = dur * 0.5;
    /* 包络点先收集再按时刻排序：音节谷和收尾点的先后跟 dur / seq 有关，
       手写顺序总有一天会排错。排完序只留严格递增的那些。 */
    var pts = [[atk, peak]];
    if (o.syl) {
      // 音节之间嘴要合一下，不然一句话糊成一根管子
      for (i = 1; i < seq.length; i++) {
        var st = seq[i][0];
        if (st - 0.012 <= atk || st + 0.022 >= dur - 0.03) continue;
        pts.push([st - 0.012, pos(peak * 0.34)]);
        pts.push([st + 0.022, peak]);
      }
    }
    pts.push([dur - 0.03, peak]);
    pts.sort(function (a, b) { return a[0] - b[0]; });

    g.gain.setValueAtTime(0.0001, t);
    var prev = 0, first = 1;
    for (i = 0; i < pts.length; i++) {
      if (pts[i][0] <= prev + 0.0005) continue;
      // 第一个点必须是斜坡（那是起音），后面的都是硬台阶（那是嘴的开合）
      if (first) { g.gain.linearRampToValueAtTime(pts[i][1], t + pts[i][0]); first = 0; }
      else       { g.gain.setValueAtTime(pts[i][1], t + pts[i][0]); }
      prev = pts[i][0];
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(b1); osc.connect(b2);
    b1.connect(g); b2.connect(g);
    g.connect(o.out || CH.master);
    if (o.send && CH.send) g.connect(CH.send);
    osc.start(t); osc.stop(t + dur + 0.03);
  }

  /* 远处的东西（3 个节点：Oscillator → 低通 → Gain）
     「远」在物理上就是高频被空气吃掉 + 混响占比变大。
     所以远景声源一律走这条：低通截止越低 = 越远，再靠 send 拉开距离。 */
  function far(ac, o) {
    var t = o.t, dur = o.dur, peak = pos(o.peak);
    var osc = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
    osc.type = o.type || 'sawtooth';
    osc.frequency.setValueAtTime(Math.max(20, o.f0), t);
    if (o.f1 && o.f1 !== o.f0)
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + dur);
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.max(60, o.lp || 800), t);
    if (o.lp1) lp.frequency.exponentialRampToValueAtTime(Math.max(60, o.lp1), t + dur);
    lp.Q.value = o.q === undefined ? 0.6 : o.q;
    var atk = o.atk === undefined ? 0.02 : o.atk;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    if (o.hold) g.gain.setValueAtTime(peak, t + Math.min(o.hold, dur * 0.85));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(lp); lp.connect(g); g.connect(o.out || CH.master);
    if (o.send && CH.send) g.connect(CH.send);
    osc.start(t); osc.stop(t + dur + 0.03);
  }


  /* ================= 兼容旧签名的 tone ================= */
  /* game.js / events.js 里有 21 处直接调 tone，其中不少是 square / sawtooth。
     这里给它套一层低通 + 4ms 起音 + 短瞬态，让原本的方波蜂鸣听着像被敲击的实物。 */
  Snd.tone = function (f0, f1, dur, type, vol, delay) {
    try {
      var ac = ready(); if (!ac) return;
      dur = dur || 0.1;
      var t = ac.currentTime + (delay || 0);
      var harsh = (type === 'square' || type === 'sawtooth');
      var osc = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(Math.max(1, f0), t);
      if (f1 && f1 !== f0)
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(harsh ? 2100 : 6200, t);
      lp.Q.value = harsh ? 0.9 : 0.5;
      var peak = pos(vol || 0.10);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(lp); lp.connect(g); g.connect(CH.master);
      osc.start(t); osc.stop(t + dur + 0.03);
      // 短促用途补一个起音质感，长扫频不加
      if (dur < 0.25)
        nz(ac, { t: t, dur: 0.012, atk: 0.001, peak: peak * 0.5,
                 kind: 'hp', f0: rnd(2600, 3600), q: 0.7 });
    } catch (e) {}
  };

  /* 菜刀切进腊汁肉再落到木案板：刀刃噪声爆点 + 案板模态共振 + 肉的低频闷响 */

               kind: 'bp', f0: wood, q: 9, send: 1 });

  /* ================= 出餐 / 开摊 ================= */

  /* 递出一单加肉的：和 paper() 是同一张纸，但**手里的分量不一样**。
     ① 纸层的起音钝一档、时长长一点 —— 包一个更胀的馍要多绕一下
     ② 多一记低频闷响 —— 这是普通单没有的，重量感全在这一层
     ③ 结尾一个短促的实心「按」——把纸口压死。
     不加任何奖励音效：区别应该来自物理，不是来自一个更响的叮。 */
  Snd.orderBig = function () {
    fire('orderBig', 90, function (ac, t) {
      nz(ac, { t: t, dur: rnd(0.17, 0.22), atk: 0.007, peak: 0.058,
               kind: 'hp', f0: rnd(1700, 2200), q: 0.7, pink: 1, steps: 15 });
      os(ac, { t: t + 0.02, dur: rnd(0.085, 0.11), atk: 0.003, peak: 0.052,
               f0: rnd(88, 104), f1: 52, type: 'sine' });
      nz(ac, { t: t + rnd(0.13, 0.17), dur: rnd(0.05, 0.07), atk: 0.002, peak: 0.045,
               kind: 'bp', f0: rnd(900, 1150), q: 3.0, pink: 1 });
    });
  };

  /* 开摊掀开盖布，发现盆里还有昨天的料：
     厚棉布被掀起来的低沉摩擦（低通粉噪，起音很慢 —— 布是软的，没有瞬态）
     + 布角扫过不锈钢盆沿的一记短刮 + 一个很轻的上行两音「哦，还有」。
     整体比 unlock() 小一号：这是个发现，不是个成就。 */
  Snd.leftover = function () {
    fire('leftover', 500, function (ac, t) {
      nz(ac, { t: t, dur: rnd(0.34, 0.42), atk: 0.09, peak: 0.048,
               kind: 'lp', f0: rnd(560, 680), f1: rnd(240, 300),

      nz(ac, { t: t + 0.20, dur: rnd(0.10, 0.14), atk: 0.004, peak: 0.030,

  /* ================= 手上读数的档位 ================= */

  /* 抓料时那块牌子从「还不够」跳到「正好」的一声。
   *
   * 这个音的全部难点在**克制**：抓料过程中档位会来回跳，
   * 响一声是手感，响十声是噪音。三道闸一起上：
   *   ① 只有档位真的变了才响（同一档连点一百次也只有第一次出声）
   *   ② 180ms 时间闸
   *   ③ 音量 0.014 —— 比最轻的 grab(0.030) 还小一半，压在环境声之上一点点
   * 音色是指甲在台面上极短的一下 + 一个几乎听不出音高的正弦点，
   * 音高随档位抬高；只有「可能撑爆」反过来往下掉一个八度当警告。 */
  var TIER_F = {           // 档位 → [噪声亮度, 正弦音高]，和 game.js handReadout 的 line2 对上
    '还不够':    [2600,  980],
    '':          [3000, 1240],   // 中间态（牌子上显示 "lo~hi g"）
    '正好':      [3600, 1660],
    '够了':      [3600, 1660],   // 青椒那一路的说法，和「正好」同一档
    '加肉正好':  [4000, 1975],
    '可能撑爆':  [1500,  520]    // 往下掉 = 警告，不跟着往上爬
  };
  var lastTier = null;

  Snd.tier = function (name) {
    var k = (typeof name === 'string' && TIER_F[name] !== undefined) ? name : '';
    if (k === lastTier) return;          // ① 档位没变就彻底不响
    lastTier = k;
    var v = TIER_F[k];
    fire('tier', 180, function (ac, t) {  // ② 时间闸
      nz(ac, { t: t, dur: 0.010, atk: 0.001, peak: 0.010,
               kind: 'hp', f0: v[0], q: 0.8 });
      os(ac, { t: t, dur: 0.038, atk: 0.002, peak: 0.014,   // ③ 极轻
               f0: v[1], f1: v[1] * 0.985, type: 'sine' });
    });
  };
  /* 离开抓料状态时清一下，下次再抓第一档也会响 */
  Snd.tierReset = function () { lastTier = null; };


  /* =====================================================================
   *                       街 头 环 境 声 底
   * =====================================================================
   *
   * 这是常驻的东西，所以设计约束和上面那 60 个一次性音效完全不同：
   *
   *   不是音乐 —— 没有旋律、没有节拍。底噪床（三层滤波噪声）+ 偶发点缀。
   *               一切「有拍子」的东西都会立刻听成 BGM，所以点缀的间隔
   *               永远带 ±40% 随机，且最短 2.5s。
   *   不新建节点 —— 16 个长生命周期节点从头活到尾，一天里所有的变化
   *               都靠 setTargetAtTime 缓变参数。只有点缀才临时建节点，
   *               一分钟十几个，比一次剁肉还便宜。
   *   跟着光走 —— 关键帧的 p 值**逐字照抄 js/art-ambient.js 的 KEY**
   *               （0 / 0.29 / 0.50 / 0.72 / 1），那五个点正好是
   *               G.WAVE 五个波次的中心。眼睛看到天黑，耳朵同时听到街空。
   *   关得掉   —— M 静音（G.Snd.on）、单独开关（G.Snd.ambient(false)）、
   *               页面不可见（document.hidden）三条路都归零。
   *
   * 常驻节点清单（16 个）：
   *   1  ambOut   Gain        环境总线，三条路都掐在这儿
   *   2  srcLo    BufferSource 粉噪循环（rate 0.55 → 内容整体下移，更像远处）
   *   3  trafLp   Biquad lp   车流的「有多远」
   *   4  trafG    Gain
   *   5  trafLfo  Osc 0.055Hz 一辆车过去的长周期涨落
   *   6  trafLfoG Gain        LFO 深度
   *   7  voxBp    Biquad bp   人声能量带（450~510Hz，说话的 F1 就在这儿）
   *   8  voxG     Gain
   *   9  voxLfo   Osc 0.21Hz  一拨人说完换一拨的起伏
   *   10 voxLfoG  Gain
   *   11 srcHi    BufferSource 白噪循环（锅上的油）
   *   12 panHp    Biquad hp   油花只在 3k 以上
   *   13 panG     Gain
   *   14 panLfo   Osc 0.65Hz  油花的疏密
   *   15 panLfoG  Gain
   *   16 spaceG   Gain → 混响送出（人少的时候街是空的，混响占比要变大）
   *
   * srcLo 同时喂车流和人声：两条支路的通带一个在 250Hz 以下、一个在 480Hz
   * 附近，相关性听不出来，省下一个源和一份 buffer。
   */

  var AMB      = null;    // 常驻节点集合，null = 没建 / 已拆
  var AMB_ON   = true;    // G.Snd.ambient(on)
  var AMB_P    = 0.34;    // 最后一次 tick 喂进来的 prog；没人喂就停在这个「白天」值
  var AMB_SEEN = false;   // 有没有人喂过 prog（决定是不是退化成静态环境声）
  var AMB_SYNC = -1e9;    // 上次 ambSync 的时刻，节流用
  var AMB_ACC  = 0;       // 累计放过多少次点缀，自检拿它验节流
  var AMB_CAP  = 16;      // 常驻节点数上限

  /* ---- 五个时段的听觉关键帧 ----
     p 和 js/art-ambient.js 的 KEY 完全一致。每个字段都是 0~1 的强度：
       traf  车流密度      trafF 车流低通截止(Hz)，越低越远
       vox   人声密度      voxF  人声带中心(Hz)
       pan   锅上油花      space 混响送出（空旷程度）
       gap   点缀间隔区间(秒)   acc 点缀的取样池 */
  var AKEY = [
    { p: 0.00,   // 刚开摊 · 蓝调时刻：街几乎是空的，只有远处零星的车和卷帘门
      traf: 0.30, trafF: 250, vox: 0.05, voxF: 430, pan: 0.10,
      space: 0.55, gap: [9.0, 16.0], acc: 'dawn' },
    { p: 0.29,   // 午市高峰 · 正午：车声人声都顶满，锅就没停过
      traf: 1.00, trafF: 520, vox: 1.00, voxF: 500, pan: 0.85,
      space: 0.18, gap: [3.5,  7.0], acc: 'noon' },
    { p: 0.50,   // 歇口气 · 午后：人散了一半，车还在
      traf: 0.62, trafF: 400, vox: 0.34, voxF: 470, pan: 0.55,
      space: 0.30, gap: [7.0, 13.0], acc: 'noon' },
    { p: 0.72,   // 下午高峰 · 傍晚：下班车流最凶，锅也最忙
      traf: 0.92, trafF: 470, vox: 0.86, voxF: 490, pan: 1.00,
      space: 0.26, gap: [4.0,  8.0], acc: 'eve' },
    { p: 1.00,   // 收摊前 · 入夜：转空旷。混响反而变大 —— 人少了才听得见回声
      traf: 0.34, trafF: 240, vox: 0.10, voxF: 420, pan: 0.16,
      space: 0.62, gap: [10.0, 18.0], acc: 'night' }
  ];

  /* 各层的绝对音量基准。
   *
   * 这几个数不是拍脑袋定的 —— 三层噪声过完各自的滤波器之后 RMS 差了一个
   * 数量级（实测：低通 320Hz 的粉噪 0.150、带通 480Hz 的粉噪 0.033、
   * 高通 3.2k 的白噪 0.404），所以增益必须反着补，否则要么只听得见嘶声、
   * 要么人声那层等于没有。补完三层各自落在 -38 / -44 / -45 dBFS：
   *   总 RMS ≈ 0.015（-36 dBFS），比一次性音效的峰值低 15~20 dB ——
   *   底噪一直在，但任何一次操作都盖得住它。
   * 低频那层给得比算出来的高一点，是因为等响曲线：60~300Hz 要多几个 dB
   * 才和中频听着一样响。 */
  var A_TRAF = 0.085, A_VOX = 0.16, A_PAN = 0.016, A_SPACE = 0.80;

  function sstep(t) { return t * t * (3 - 2 * t); }

  /* 在关键帧之间取值。和 art-ambient 的 sample() 同一套插值，
     所以同一个 p 下画面和声音走的是同一条曲线。 */
  function ambSample(p) {
    p = +p; if (!(p >= 0)) p = 0; if (p > 1) p = 1;
    var i = 0;
    while (i < AKEY.length - 2 && p > AKEY[i + 1].p) i++;
    var a = AKEY[i], b = AKEY[i + 1];
    var span = b.p - a.p;
    var t = sstep(span > 0 ? Math.max(0, Math.min(1, (p - a.p) / span)) : 0);
    function L(x, y) { return x + (y - x) * t; }
    return {
      traf:  L(a.traf,  b.traf),  trafF: L(a.trafF, b.trafF),
      vox:   L(a.vox,   b.vox),   voxF:  L(a.voxF,  b.voxF),
      pan:   L(a.pan,   b.pan),   space: L(a.space, b.space),
      gap0:  L(a.gap[0], b.gap[0]), gap1: L(a.gap[1], b.gap[1]),
      acc:   (t < 0.5 ? a.acc : b.acc)      // 取样池是离散的，就近取
    };
  }
  Snd._ambSample = ambSample;
  Snd._ambKeys   = AKEY;

  /* ---- 可循环的噪声 buffer ----
     直接 loop 一段噪声，接缝处会有一下周期性的「哒」。
     所以把结尾 4096 个采样交叉淡入开头再截掉 —— 首尾就接得上了。 */
  function loopBuf(ac, secs, pink) {
    var X = 4096;
    var n = Math.floor(ac.sampleRate * secs) + X;
    var b = ac.createBuffer(1, n - X, ac.sampleRate), d = b.getChannelData(0);
    var raw = new Float32Array(n), i;
    if (pink) {
      var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (i = 0; i < n; i++) {
        var w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        raw[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else {
      for (i = 0; i < n; i++) raw[i] = Math.random() * 2 - 1;
    }
    var m = n - X;
    for (i = 0; i < m; i++) d[i] = raw[i];
    for (i = 0; i < X; i++) {          // 首段和尾段对拼，接缝消失
      var k = i / X;
      d[i] = raw[i] * k + raw[m + i] * (1 - k);
    }
    return b;
  }

  function docHidden() {
    try {
      return !!(typeof document !== 'undefined' && document && document.hidden);
    } catch (e) { return false; }
  }
  function ambWant() { return !!(Snd.on && AMB_ON && !docHidden()); }

  /* ---- 建常驻链 ---- */
  function ambBuild(ac) {
    var A = { ac: ac, n: 0, lvl: 0, muted: 0, offAt: 0, next: 0,
              nodes: [], srcs: [] };
    function mk(node) { A.n++; A.nodes.push(node); return node; }
    function src(node) { A.srcs.push(node); return mk(node); }
    try {
      var out = mk(ac.createGain());
      out.gain.value = 0;                       // 从 0 起，第一次 apply 再淡进来
      out.connect(CH.master);
      A.out = out;

      /* 混响送出：整条环境床分一点点到小空间 IR 上。
         人少的时段送出量拉大 —— 空街的回声本来就更明显。 */
      if (CH.send) {
        A.space = mk(ac.createGain());
        A.space.gain.value = 0;
        A.space.connect(CH.send);
      }

      /* 两份循环 buffer 挂在 CH 上复用：生成一次要跑 20 万次粉噪迭代，
         而拆了重建（切标签页、开关静音）是常事，每次都重算会掉帧。 */
      if (!CH.ambLo) CH.ambLo = loopBuf(ac, 2.6, 1);
      if (!CH.ambHi) CH.ambHi = loopBuf(ac, 1.9, 0);

      var lo = src(ac.createBufferSource());
      lo.buffer = CH.ambLo;
      lo.loop = true;
      lo.playbackRate.value = 0.55;             // 内容整体下移 ≈ 拉远
      A.lo = lo;

      /* —— 车流：低通粉噪。真实的远处车流就是一团 60~400Hz 的连续隆隆，
             偶尔某辆车近了 → 靠 0.055Hz 的 LFO 让整层缓慢涨落。 —— */
      A.trafLp = mk(ac.createBiquadFilter());
      A.trafLp.type = 'lowpass';
      A.trafLp.frequency.value = 320; A.trafLp.Q.value = 0.5;
      A.trafG = mk(ac.createGain()); A.trafG.gain.value = 0.0001;
      A.trafLfo = src(ac.createOscillator());
      A.trafLfo.type = 'sine'; A.trafLfo.frequency.value = 0.055;
      A.trafLfoG = mk(ac.createGain()); A.trafLfoG.gain.value = 0;
      lo.connect(A.trafLp); A.trafLp.connect(A.trafG); A.trafG.connect(out);
      A.trafLfo.connect(A.trafLfoG); A.trafLfoG.connect(A.trafG.gain);

      /* —— 人声：同一份粉噪，带通到 450~510Hz。
             那正是说话的第一共振峰所在，所以这团噪声听着「像有人」
             却一个字都分不出。0.21Hz 的 LFO 是一拨人说完换一拨。 —— */
      A.voxBp = mk(ac.createBiquadFilter());
      A.voxBp.type = 'bandpass';
      A.voxBp.frequency.value = 480; A.voxBp.Q.value = 1.5;
      A.voxG = mk(ac.createGain()); A.voxG.gain.value = 0.0001;
      A.voxLfo = src(ac.createOscillator());
      A.voxLfo.type = 'sine'; A.voxLfo.frequency.value = 0.21;
      A.voxLfoG = mk(ac.createGain()); A.voxLfoG.gain.value = 0;
      lo.connect(A.voxBp); A.voxBp.connect(A.voxG); A.voxG.connect(out);
      A.voxLfo.connect(A.voxLfoG); A.voxLfoG.connect(A.voxG.gain);

      /* —— 锅：白噪高通到 3k 以上。油花是纯高频，一点低频都不能有，
             不然听着像水管漏气。0.65Hz 的 LFO 做「一阵密一阵稀」。 —— */
      var hi = src(ac.createBufferSource());
      hi.buffer = CH.ambHi;
      hi.loop = true;
      hi.playbackRate.value = 1;
      A.hi = hi;
      A.panHp = mk(ac.createBiquadFilter());
      A.panHp.type = 'highpass';
      A.panHp.frequency.value = 3200; A.panHp.Q.value = 0.6;
      A.panG = mk(ac.createGain()); A.panG.gain.value = 0.0001;
      A.panLfo = src(ac.createOscillator());
      A.panLfo.type = 'sine'; A.panLfo.frequency.value = 0.65;
      A.panLfoG = mk(ac.createGain()); A.panLfoG.gain.value = 0;
      hi.connect(A.panHp); A.panHp.connect(A.panG); A.panG.connect(out);
      A.panLfo.connect(A.panLfoG); A.panLfoG.connect(A.panG.gain);

      if (A.space) { A.trafG.connect(A.space); A.voxG.connect(A.space); }

      var t0 = ac.currentTime;
      for (var i = 0; i < A.srcs.length; i++) A.srcs[i].start(t0);
      A.next = t0 + rnd(1.5, 3.5);
    } catch (e) { ambKill(A); return null; }
    return A;
  }

  function ambKill(A) {
    if (!A) return;
    var i;
    for (i = 0; i < A.srcs.length; i++) {
      try { A.srcs[i].stop(A.ac.currentTime + 0.02); } catch (e) {}
    }
    for (i = 0; i < A.nodes.length; i++) {
      try { A.nodes[i].disconnect(); } catch (e) {}
    }
    A.nodes.length = 0; A.srcs.length = 0;
  }
  function ambTeardown() { if (AMB) { ambKill(AMB); AMB = null; } }

  /* ---- 把关键帧的值缓变到常驻节点上 ----
     全部用 setTargetAtTime：它是一阶低通，天然平滑，而且每次只往参数
     时间线上压一个事件。时间常数 1.6s ≈ 一天 135 秒里走过五段的速度。 */
  function ambApply(A, now) {
    var k = ambSample(AMB_P), TC = 1.6;
    function tgt(param, v) {
      try { param.setTargetAtTime(v, now, TC); } catch (e) {}
    }
    tgt(A.trafG.gain,      A_TRAF * k.traf);
    tgt(A.trafLp.frequency, k.trafF);
    tgt(A.trafLfoG.gain,   A_TRAF * k.traf * 0.45);   // 涨落幅度跟着密度走
    tgt(A.voxG.gain,       A_VOX * k.vox);
    tgt(A.voxBp.frequency, k.voxF);
    tgt(A.voxBp.Q,         1.9 - 0.7 * k.vox);        // 人多了带宽松开＝更杂
    tgt(A.voxLfoG.gain,    A_VOX * k.vox * 0.55);
    tgt(A.panG.gain,       A_PAN * k.pan);
    tgt(A.panLfoG.gain,    A_PAN * k.pan * 0.6);
    if (A.space) tgt(A.space.gain, A_SPACE * k.space);
    return k;
  }

  /* ---- 总线开合。归零走线性斜坡到**确切的 0**，
         不是指数逼近 —— 「关掉之后真的没声」必须是字面意义上的 0。 ---- */
  function ambLevel(A, to, secs) {
    var t = A.ac.currentTime;
    try {
      A.out.gain.cancelScheduledValues(t);
      A.out.gain.setValueAtTime(A.lvl, t);
      A.out.gain.linearRampToValueAtTime(to, t + secs);
      if (to === 0) A.out.gain.setValueAtTime(0, t + secs + 0.001);
    } catch (e) {}
    A.lvl = to;
  }

  /* ---- 偶发点缀 ----
     取样池按时段换。每个点缀都是一次性节点（≤6 个），放完就自己 stop。
     间隔带 ±40% 随机且不短于 2.5s —— 规律的间隔会立刻被听成节拍。 */
  var ACC = {
    dawn:  [['bike', 34], ['shutter', 30], ['vox', 14], ['moped', 12], ['horn', 10]],
    noon:  [['horn', 28], ['vox', 30], ['moped', 22], ['bike', 14], ['hawkFar', 6]],
    eve:   [['horn', 24], ['vox', 28], ['moped', 20], ['bike', 12], ['hawkFar', 16]],
    night: [['shutter', 30], ['bike', 20], ['moped', 16], ['vox', 14],
            ['horn', 10], ['hawkFar', 10]]
  };

  function ambAccent(A, now, k) {
    var pool = ACC[k.acc] || ACC.noon, tot = 0, i;
    for (i = 0; i < pool.length; i++) tot += pool[i][1];
    var r = Math.random() * tot, pick = pool[0][0];
    for (i = 0; i < pool.length; i++) { r -= pool[i][1]; if (r <= 0) { pick = pool[i][0]; break; } }

    var t = now + rnd(0.02, 0.25);
    var lv = 0.45 + 0.55 * k.traf;      // 街越空点缀越轻，不然夜里一声喇叭吓人
    var o = A.out, sp = A.space ? 1 : 0;
    try {
      if (pick === 'bike') {
        /* 自行车铃：两个非谐分音（比 ≈1.48，铃铛本来就不是整数倍）+ 一记敲击瞬态。
           拨片弹回来还会再蹭一下，所以第二声更轻、晚 90ms。 */
        var bf = rnd(2280, 2620);
        nz(ac0(A), { t: t, dur: 0.006, atk: 0.001, peak: 0.012 * lv,
                     kind: 'hp', f0: rnd(5200, 6400), q: 0.8, out: o });
        os(ac0(A), { t: t, dur: rnd(0.42, 0.55), atk: 0.002, peak: 0.030 * lv,
                     f0: bf, f1: bf * 0.995, type: 'sine', out: o, send: sp });
        os(ac0(A), { t: t + 0.09, dur: rnd(0.26, 0.34), atk: 0.002, peak: 0.014 * lv,
                     f0: bf * 1.48, type: 'sine', out: o, send: sp });
      } else if (pick === 'horn') {
        /* 远处汽车喇叭：国内车喇叭基本都是双音（差不多一个小三度），
           所以两条 far() 一起响；低通 900Hz 把它推到一条街之外。 */
        var hf = rnd(340, 400);
        far(ac0(A), { t: t, dur: rnd(0.30, 0.44), atk: 0.012, hold: 0.2,
                      peak: 0.026 * lv, f0: hf, lp: 900, out: o, send: sp });
        far(ac0(A), { t: t + 0.01, dur: rnd(0.28, 0.40), atk: 0.012, hold: 0.2,
                      peak: 0.020 * lv, f0: hf * 1.19, lp: 950, out: o, send: sp });
      } else if (pick === 'moped') {
        /* 电摩/摩托驶过：锯齿基频下滑 = 多普勒，低通同步下滑 = 越走越远。
           两件事必须一起动，只滑音高会像在拧收音机。 */
        var mf = rnd(96, 128);
        far(ac0(A), { t: t, dur: rnd(1.1, 1.5), atk: 0.35, peak: 0.030 * lv,
                      f0: mf, f1: mf * 0.66, lp: rnd(700, 900), lp1: 260,
                      q: 0.7, out: o, send: sp });
        nz(ac0(A), { t: t, dur: rnd(1.0, 1.3), atk: 0.3, peak: 0.014 * lv,
                     kind: 'bp', f0: rnd(420, 520), f1: 200, q: 1.0,
                     pink: 1, out: o, send: sp });
      } else if (pick === 'vox') {
        /* 一阵人声：一个含混音节，共振峰随机落 —— 听得出是人，听不出是什么话 */
        var vf = rnd(112, 190);
        vox(ac0(A), { t: t, dur: rnd(0.30, 0.55), atk: 0.06, peak: 0.020 * lv, syl: 1,
                      seq: [[0, vf, rnd(420, 740), rnd(850, 1900)],
                            [0.16, vf * rnd(0.9, 1.14), rnd(420, 740), rnd(850, 1900)],
                            [0.34, vf * rnd(0.82, 1.0), rnd(420, 700), rnd(820, 1500)]],
                      q1: 6, q2: 9, out: o, send: sp });

  // 夹馍位是高频落点：做成 88px 直径，正好跨过最差安卓小屏的
  // 9mm 手指命中线；向右挪 4px 后仍和肉堆留出 2px 缓冲，不会抢抓肉。
  // 右缘 512px 仍在案板 214..514 内，画面和判定一起移动，瞄准感不变。
  G.BSLOT = { x: bc.x + 244, y: bc.y + 46, r: 44 };   // 夹馍位
  /* 青椒板：整根 / 青椒堆 */
  var pc = Art.content(G.ZONE.pepper);
  G.PBLK  = { x: pc.x + 40,  y: pc.y + 38, r: 40 };
  G.PPILE = { x: pc.x + 96,  y: pc.y + 54, r: 38 };
  /* 凉皮碗的搅拌判定圈 */
  var nc = Art.content(G.ZONE.noodle);
  G.BOWL = { x: nc.x + 70, y: nc.y + 56, r: 44 };
  /* 兼容：夹馍台按钮已经并进案板，保留空壳免得别处引用报错 */
  G.MK = { a: G.BSLOT, b: G.BSLOT };

  function nearer(x, y, c) { var dx = x - c.x, dy = y - c.y; return dx * dx + dy * dy <= c.r * c.r; }

  /* 彩椒板只有 150px 宽 —— 真机上 15.9mm，塞不下两个 9mm 的判定圈
     （圈心才隔 58px = 6.2mm，还互相啃掉近 20px，抓料的实际可用面积只剩
     42.75mm²，比一根手指的接触面还小）。所以整块板一刀切：左半剁、右半抓。 */
  function pepSide(x, y) {
    var db = (x - G.PBLK.x) * (x - G.PBLK.x) + (y - G.PBLK.y) * (y - G.PBLK.y);
    var dp = (x - G.PPILE.x) * (x - G.PPILE.x) + (y - G.PPILE.y) * (y - G.PPILE.y);
    return db <= dp ? 'blk' : 'pile';
  }

  /* 铁盘第 i 格：固定 86px 间距、整体居中 —— 成品挨得近，看着舒服 */
  G.traySlot = function (i) {
    var z = G.ZONE.tray, n = G.CFG.maxTray, pitch = 86;
    return { x: z.x + z.w / 2 - (n - 1) * pitch / 2 + i * pitch, y: z.y + z.h / 2 };
  };
  /* 纸站的抓取判定圈 */
  G.PAPER = { x: G.ZONE.paper.x + G.ZONE.paper.w / 2,
              y: G.ZONE.paper.y + G.ZONE.paper.h / 2, r: 46 };
  // r=43 而不是 30：画的那一小坨只有 58×30，但判定圈可以比画面大。
  // buildSlots 会按这个外沿留出 12px 安全缝，彩蛋不会和四人队列抢点击。
  G.POOP  = { x: G.ZONE.poop.x + G.ZONE.poop.w / 2,
              y: G.ZONE.poop.y + G.ZONE.poop.h / 2 + 2, r: 43 };
  /* 顶栏上的两个轻量控制：不占用工位，手机上也有足够大的点按面。 */
  G.PREF  = { x: 148, y: 4, w: 112, h: 42 };
  G.SAUCE = { x: 268, y: 4, w: 116, h: 42 };
  G.BUNSTYLE = { x: 650, y: 4, w: 118, h: 42 };
  G.WEATHERHUD = { x: 778, y: 4, w: 142, h: 42 };
  var PEPCOL = ['#D6342B', '#E8B62C', '#4FA83D'];   // 红 / 黄 / 绿，一根一换

  /* 门口的位置：数量可变（第 8 天从 3 个加到 4 个，破掉后期的产能天花板） */
  G.SLOT = [];
  G.QUEUE_DAY4 = 8;
  G.queueAt = function (day) { return day >= G.QUEUE_DAY4 ? 4 : G.CFG.queue; };
  G.buildSlots = function (n) {
    G.SLOT.length = 0;
    var lim = Math.max(G.ZONE.poop.x + G.ZONE.poop.w + 12,
      G.POOP.x + G.POOP.r + 12);                   // 让开角落那一堆及其判定圈
    // 四个人时整排往内收，否则最左边那位会压住墙上的菜单牌
    var m = n >= 4 ? 150 : G.W / (2 * n);
    var span = n > 1 ? (G.W - 2 * m) / (n - 1) : 0;
    for (var i = 0; i < n; i++) {
      var cx = n > 1 ? m + span * i : G.W / 2;
      var w = (n > 1 ? span : G.W) - 20, x0 = cx - w / 2;
      if (x0 < lim) { w -= lim - x0; x0 = lim; }
      G.SLOT.push({ cx: cx, hit: { x: x0, y: 44, w: w, h: 252 } });
    }
  };
  G.buildSlots(3);

  var BTN = G.BTN = {
    start: { x: 110, y: 336, w: 280, h: 74 },
    book:  { x: 110, y: 416, w: 152, h: 34 },   // 手账入口，只有 goals.js 挂上才画
    comic: { x: 270, y: 416, w: 120, h: 34 },   // 序章 / 当前章节漫画
    next:  { x: 268, y: 452, w: 288, h: 62 },
    home:  { x: 572, y: 452, w: 132, h: 62 }
  };

  var S = G.S = {};

  /* ---------- 难度 & 订单 ---------- */
  /* 难度曲线是两段的，最前面再铺一段短短的练习缓冲。
   *
   * 原来只有第一段，出摊间隔第 12 天撞上 4.6 的地板、耐心第 14 天撞上 18，
   * 之后基础难度就冻住了 —— 可玩家还有 42 级升级要买，于是越往后越轻松
   * （耐久自检实测净赚 302 → 1139 → 2085）。第二段用一个平缓得多的斜率
   * 接下去，让后期仍然在缓慢收紧。
   *
   * 前 7 天是建立手感的窗口：来客间隔略放慢、耐心略抬高；第 8~13 天
   * 只留一点余温。第 14 天以后仍然收紧，但尾端放缓一档，让玩家有时间
   * 把外卖、特殊客和升级逐个学会，而不是单纯被更密的队列压垮。
   */
  function diff(day) {
    var iv = Math.max(4.6, 8.4 - 0.36 * (day - 1));
    if (day > 13) iv = Math.max(3.45, 4.7 - 0.043 * (day - 13));
    var pat = Math.max(18, 34 - 1.3 * (day - 1));
    if (day > 13) pat = Math.max(13.5, 18.2 - 0.115 * (day - 13));
    var practice = G.practiceForDay ? G.practiceForDay(day) : { interval: 0, patience: 0 };
    return { interval: iv + (practice.interval || 0),
      patience: pat + (practice.patience || 0) + (G.CFG.patienceBonus || 0) +
        (G.CFG.waitingBonus || 0) };
  }

  function makeOrder(day, type) {
    var big = type === 'big';
    var it = [];
    var mains = day >= G.ITEM_DAY.rjmp ? ['rjm', 'rjm', 'rjmp'] : ['rjm'];
    // 第 14 天起单子慢慢变大（第 30 天前后到顶 0.62）；第 1~13 天不变
    var p2 = day <= 1 ? 0.20 : day <= 2 ? 0.25 : day <= 4 ? 0.32
           : day <= 13 ? 0.42 : Math.min(0.62, 0.42 + 0.012 * (day - 13));
    var nMain = (big || Math.random() < p2) ? 2 : 1;
    var pBig = day >= G.BIG_DAY ? (big ? 0.34 : 0.24) : 0;
    for (var i = 0; i < nMain; i++)
      it.push({ t: G.pick(mains), b: Math.random() < pBig });
    if (day >= G.ITEM_DAY.bf && Math.random() < (big ? 0.90 : day >= 4 ? 0.55 : 0.50)) it.push({ t: 'bf' });
    if (day >= G.ITEM_DAY.lp && Math.random() < (big ? 0.90 : 0.50)) it.push({ t: 'lp' });
    while (big && it.length < 3) it.push({ t: G.pick(mains), b: false });   // 大单至少三样
    /* 酷暑时冰峰不是装饰：有一部分顾客会把它临时加进单里。
       仍受 4 样气泡上限约束，玩家必须在冰柜和主食之间分配手。 */
    if (day >= G.ITEM_DAY.bf && S.weather && S.weather.id === 'heat' &&
        it.length < 4 && !it.some(function (o) { return o.t === 'bf'; }) &&
        Math.random() < (G.WEATHERS[3].bfBoost || 0)) it.push({ t: 'bf' });
    if (it.length > 4) it.length = 4;                      // 气泡最多放 4 样
    return it.map(function (o) {
      return { type: o.t, big: !!o.b, done: false };
    });
  }

  G.BIG_DAY = 5;                 // 从这天起会有人点「加肉」

  /* 各品类从第几天起会出现在订单里。regulars.js 的安全网也读这张表 ——
     之前两边各写一份常量，改一处忘另一处就会造出「没解锁却点得到」的单子。 */
  G.ITEM_DAY = { rjm: 1, bf: 2, rjmp: 3, lp: 4 };

  /* 菜谱奖励：订单依旧由单品组成，但完成整套后会给一个清晰的经营目标。
     老三样来自天然套餐；隐藏菜单由 spawn() 偶尔挂在一份主食上。 */
  G.RECIPES = [
    { id: 'old3',  label: '经典老三样', short: '老三样', bonus: 'recipeBonus', unlock: 4 },
    { id: 'soul',  label: '老陕魂之馍', short: '秘制',   bonus: 'secretBonus', unlock: 10 }
  ];
  function hasType(items, t) {
    for (var i = 0; i < (items || []).length; i++) if (items[i].type === t) return true;
    return false;
  }
  function mainItem(items) {
    for (var i = 0; i < (items || []).length; i++)
      if (items[i].type === 'rjm' || items[i].type === 'rjmp') return items[i];
    return null;
  }
  G.recipeFor = function (c) {
    if (!c || !c.items) return null;
    if (c.secretId === 'soul') {
      var si = c.secretIndex | 0, secret = c.items[si];
      if (secret && secret.done && secret.big && secret.qualityScore >= 0.999 &&
          (secret.servedJuice || 0) >= 2)
        return G.RECIPES[1];
    }
    if (c.items.length >= 3 && hasType(c.items, 'bf') && hasType(c.items, 'lp') && mainItem(c.items))
      return G.RECIPES[0];
    return null;
  };

  function tagRecipe(c) {
    if (!c || !c.items) return;
    var r = G.recipeFor(c);
    /* 隐藏菜单需要等出餐后才判定，先把提示挂上去；老三样可以直接显示。 */
    if (c.secretId === 'soul') c.recipeTag = '秘制';
    else if (r) c.recipeTag = r.short;
    else c.recipeTag = null;
  }

  function maybeSecret(c, day) {
    if (!c || c.special || c.faceId || day < 10 || Math.random() >= 0.10) return;
    var target = mainItem(c.items), idx = -1;
    for (var i = 0; i < c.items.length; i++) if (c.items[i] === target) { idx = i; break; }
    if (!target || idx < 0 || target.done) return;
    target.big = true; target.secret = true;
    target.fatNeed = 'fatty'; target.juiceNeed = 'juicy'; target.bunNeed = 'crispy';
    target.sauceNeed = 2;
    c.secretId = 'soul'; c.secretIndex = idx; c.recipeTag = '秘制';
    c.secretHint = '神秘提示：双倍肉 · 多汁 · 酥馍';
    c.pmax += 5; c.patience += 5;
  }

  /* 收摊时台面上剩的料 —— 钱早就付过了，卖不出去就是打水漂。
     成本机制是这游戏的核心张力之一，不把这笔账摆出来玩家根本感觉不到。 */
  G.leftoverCost = function () {
    var c = S.mince / BLOCK_G * G.CFG.costBlock
          + S.pep   / PBLOCK_G * G.CFG.costPep
          + (S.bun || 0) * G.CFG.costDough;
    for (var i = 0; i < S.grill.length; i++)          // 炉子上没取走的也算
      if (S.grill[i].state !== 'empty') c += G.CFG.costDough;
    if (S.slot) c += S.slot.meat / BLOCK_G * G.CFG.costBlock
                   + S.slot.pep  / PBLOCK_G * G.CFG.costPep + G.CFG.costDough;
    return Math.round(c);
  };

  function unlocked(key) { return S.day >= G.UNLOCK[key]; }

  /* ---------- 生命周期 ---------- */
  function freshStations(resetStyles) {
    /* 换天只清空台面，不清空玩家已经选好的刀法 / 馍胚；反复点三次
       顶栏才能回到刚学会的做法，会把经营节奏打断。resetStyles 只给
       明确的清档路径使用，普通回标题 / 继续营业也保留这份操作记忆。 */
    var rememberedChop = S.chopStyle | 0, rememberedBun = S.bunStyle | 0;
    S.grill = [];
    for (var i = 0; i < G.CFG.grillSlots; i++)
      S.grill.push({ state: 'empty', press: 0, pressing: 0, t: 0, flag: 0 });
    S.fridge = 'empty';
    S.noodle = { state: 'empty', mix: 0, ang: null };

    S.mince = 0; S.pep = 0;             // 肉馅堆 / 青椒堆（克）
    S.minceFat = 0;                     // 肉馅里的肥肉克数
    S.chopStyle = resetStyles ? 0 :
      (rememberedChop >= 0 && rememberedChop < G.CUT_STYLES.length ? rememberedChop : 0);
    S.bunStyle = resetStyles ? 0 :
      (rememberedBun >= 0 && rememberedBun < G.BUN_STYLES.length ? rememberedBun : 0);
    S.rhythm = 0; S.rhythmBest = 0; S.rhythmBoostT = 0; S.rhythmLast = null;
    S.chopT = 0; S.chopTapAt = null; S.chopBeatSeen = false;
    S.autoChopT = 0;

    S.tray = [];                        // [{ type, wrapT, meat, fat, juice, bun }]
    S.madeToday = 0;                    // 已成型的馍数：给非完美但有效的成品一口正反馈
    S.drinks = 0;
    S.bunQual = [];                     // 烤好的馍按出炉顺序记录软 / 酥脆
    S.burntToday = 0;
    S.sauceStock = G.CFG.sauceStock;
    S.dayRating = 0; S.qualityBonus = 0; S.recipeBonus = 0; S.recipeCount = 0;
    S.shapeBonus = 0; S.shapeQuality = 0;
    S.secretWins = 0; S.specialWins = 0;
    S.specialMask = 0; S.takeoutOrders = 0;
    S.gestureHint = null; S.gestureHintT = 0; S.gestureHintDone = false;
    S.softHintT = 0; S.softHintKey = '';
    S.focusQuietT = 0;                  // 庆祝浮字先完整看见，再恢复下一步指引
    S.poop = G.CFG.poopMax; S.throwFly = null; S.shockT = 0;
    S.combo = 0; S.comboBest = 0;
    S.comboGuardUsed = 0;               // 第 4~7 天每轮一次“擦边保连”
    S.flowT = 0; S.flowMul = 1;
    S.serveBufferT = 0; S.serveBufferMax = 0;
    S.eventCalmT = 0; S.eventCalmMax = 0; S.eventCalmMul = 1;

  /* 手账层自己挂上去之后，标题页才会长出那个入口按钮 */
  G.toGoals = function () { S.mode = 'goals'; if (G.Goals && G.Goals.open) G.Goals.open(); };

  G.startDay = function (day) {
    if (G.Shop) G.Shop.apply();          // 先把升级效果写进 CFG
    S.mode = 'play';
    S.day = day;
    if (S.hype > 0) S.hype = Math.max(0, S.hype - 1);
    S.scene = G.sceneFor ? G.sceneFor(day) : null;
    S.weather = G.weatherFor ? G.weatherFor(day) : null;
    S.dayBrothQuality = G.clamp(+S.brothQuality || 0, 0, 1);
    S.brothQuality = 0;                 // 卤香只服务下一天，避免跳过小游戏重复吃加成
    S.dayShapeQuality = G.clamp(+S.shapeQuality || 0, 0, 1);
    S.shapeQuality = 0;                 // 捏坯成绩只服务紧接着的一天
    S.d = diff(day);
    S.dayMoney = 0;
    S.timeLeft = G.CFG.dayLength;
    S.served = 0; S.lost = 0; S.walked = 0; S.dayCost = 0; S.thrown = 0;
    S.feedback = {};                    // 每天重新给一轮“我做对了”的小里程碑
    S.focusQuietT = 0;
    S.readyFeedback = 0;                 // 今天第一次出现对口成品时的呼吸提示
    S.queueGrace = G.queueGraceForDay ? G.queueGraceForDay(day) : (day <= 22 ? 1 : 0);
                                        // 前 7 天给两张候场票，连续满位也有学习空间
    S.queueHoldT = 0; S.queueHoldNotice = 0;
    S.serveBufferT = 0; S.serveBufferMax = 0;
    S.why = null;
    S.wave = 0;
    S.bun = 0;
    S.cleaverY = S.pknifeY = 0;
    S.tut = (day === 1) ? 0 : null;        // 只有第一天带引导
    S.uTip = null;                         // 今天有没有新解锁的工位
    for (var uk in G.UNLOCK) if (G.UNLOCK[uk] === day && UTIP[uk]) S.uTip = uk;
    if (day === G.QUEUE_DAY4)
      fx('门口加到 4 个位置了', G.W / 2, 210, P.meatDark, 22);
    if (day === G.BIG_DAY)
      fx('有人要「加肉」了 —— 气泡上带标的，得多抓一把', G.W / 2, 210, P.meatDark, 20);
    if (S.uTip || day === G.QUEUE_DAY4 || day === G.BIG_DAY) G.Snd.unlock();
    S.wrapped = 0;
    G.buildSlots(G.queueAt(day));
    S.cust = [];
    for (var qi = 0; qi < G.SLOT.length; qi++) S.cust.push(null);
    S.spawnT = 1.0;
    S.floats = []; S.parts = []; S.flies = [];
    freshStations(false);
    if (S.keep) {                      // 昨天盖布留下的散料，开摊就在盆里
      var keptFat = +S.keep.fat;
      S.mince = Math.min(G.CFG.maxMince * G.CFG.minceUnit, S.keep.mince || 0);
      S.pep   = Math.min(G.CFG.maxPep   * G.CFG.pepUnit,   S.keep.pep   || 0);
      /* 盖布留料也要保留肥瘦比例。只存 mince 会让第二天的第一锅
         变成「看起来有肉、实际全是默认肥瘦」，口味系统会被跨天重置。 */
      S.minceFat = Math.min(S.mince,
        isFinite(keptFat) && keptFat >= 0 ? keptFat : S.mince * 0.42);
      S.keep = null;
      // 不吭声的话玩家不会发现盆里已经有肉了，只会照旧先剁一轮 ——
      // 那这个升级就白买了
      if (S.mince + S.pep > 1)
        fx('盖布留下的：肉 ' + Math.round(S.mince) + 'g' +
           (S.pep > 1 ? ' · 椒 ' + Math.round(S.pep) + 'g' : ''),
           G.BLK.x + 40, G.BLK.y - 52, P.meatDark, 17);
    }
    if (S.scene && S.day >= S.scene.from)
      fx(S.scene.name + ' · ' + (S.weather ? S.weather.name : '晴天'),
        G.W / 2, 214, S.weather && S.weather.col ? S.weather.col : P.meatDark, 20);
    if (S.dayBrothQuality > 0)
      fx('昨夜卤汤香气 ' + Math.round(S.dayBrothQuality * 100) + '% · 今日小费加成',
        G.W / 2, 238, '#B07800', 15);
    if (G.Story && G.Story.startDay) G.Story.startDay(day);
    if (G.Events && G.Events.startDay) G.Events.startDay(day);
    fxOn('daystart', G.W / 2, G.H / 2, day);
    G.Snd.bell();
  };

  /* 今天最该改的一件事。只给一句 —— 报三条等于没报，玩家不会挨个消化。
     优先级：做好了没包纸（最冤）> 某样菜老是供不上 > 门口老是站满。 */
  G.dayLesson = function () {
    var w = S.why;
    if (w && w.undone > 0) {
      if (w.unwrapped >= Math.max(2, w.undone * 0.4))
        return ['其中做好了没包纸', w.unwrapped + ' 单'];
      var top = null, n = 0;
      for (var t in w.type) if (w.type[t] > n) { n = w.type[t]; top = t; }
      if (top && n >= 2 && G.ITEM[top])
        return ['多数人在等', G.ITEM[top].name];
    }
    if (S.walked >= 3 && S.walked >= S.served * 0.25)
      return ['门口站满走掉的', S.walked + ' 位（出餐是瓶颈）'];
    return null;
  };

  function endDay(reason) {
    S.dayWaste = G.leftoverCost();     // 得在 freshStations 清台面之前算
    /* 「收摊盖布」（shop.js 的 night）：台面上的散料按 keepRate 留到明天。
       只留肉馅和青椒 —— 烤好的馍、炉子上的坯子放一夜就硬了。 */
    var kr = G.CFG.keepRate || 0;
    if (kr > 0) {
      S.keep = { mince: S.mince * kr, pep: S.pep * kr,
                 fat: Math.min(S.mince * kr, (S.minceFat || 0) * kr) };
      // 留下来的这部分不算今天白扔的，否则同一笔料在结算页记两次亏
      S.dayWaste = Math.max(0, S.dayWaste - Math.round(
        S.keep.mince / BLOCK_G * G.CFG.costBlock +
        S.keep.pep   / PBLOCK_G * G.CFG.costPep));
    } else S.keep = null;

    /* 场景迁移后的固定租金：从流水里单独记出，玩家能看见「客流变旺但成本也变重」。 */
    var rent = S.scene && S.scene.rent ? Math.round(S.scene.rent) : 0;
    if (rent > 0) {
      S.money = Math.max(0, S.money - rent);
      S.dayCost = (S.dayCost || 0) + rent;
      fx('场地租金 -¥' + rent, G.W / 2, 286, P.red, 16);
    }

    /* 剧情奖励在手账记账之前结算：它是今天真的拿到的钱，
       结算页和账本的流水口径因此保持一致。 */
    var story = G.Story && G.Story.endDay ? G.Story.endDay() : null;

    /* 摊主手账（js/goals.js，可选）：把这一天的账交出去，它自己决定记什么。
       必须排在盖布之后 —— 否则手账记的是「扣掉留料之前」的白扔额，
       和结算页那行对不上（顶级盖布下差了五倍）。
       传的是快照不是引用，下一天 freshStations 会把台面清了。 */
    if (G.Goals && G.Goals.dayEnd) G.Goals.dayEnd({
      day: S.day, reason: reason, money: S.money,
      revenue: S.dayMoney, cost: S.dayCost, waste: S.dayWaste || 0,
      served: S.served, lost: S.lost, walked: S.walked,
      thrown: S.thrown, comboBest: S.comboBest || 0,
      qualityBonus: S.qualityBonus || 0, dayRating: S.dayRating || 0,
      specialWins: S.specialWins || 0, recipeBonus: S.recipeBonus || 0,
      recipeCount: S.recipeCount || 0,
      shapeBonus: S.shapeBonus || 0,
      secretWins: S.secretWins || 0, takeoutOrders: S.takeoutOrders || 0,
      brothQuality: S.dayBrothQuality || 0,
      specialMask: S.specialMask || 0,
      storyReward: story ? story.reward : (S.storyReward || 0),
      chapter: story ? story.id : '',
      scene: S.scene ? S.scene.id : '', weather: S.weather ? S.weather.id : '',
      why: S.why ? { unwrapped: S.why.unwrapped, undone: S.why.undone } : null
    });
    S.mode = 'result';
    S.reason = reason;
    S.nextDay = reason === 'ok' ? S.day + 1 : S.day;   // 存档记住下次从哪天开
    fxOn('dayend', G.W / 2, G.H / 2, S.day);
    if (G.Save) G.Save.save();
    G.Snd.dayEnd();
  }

  /* 结算之后先进商店，再开下一天（商店由 js/shop.js 提供） */
  G.toShop = function (day) {
    if (G.Shop && G.Shop.clearTransient) G.Shop.clearTransient();
    S.nextDay = day; S.mode = 'shop';
  };

  /* ---------- 小特效 ---------- */
  var FLOAT_CAP = 28;
  function floatY(x, y, size) {
    var fy = G.clamp(isFinite(+y) ? +y : G.H / 2, 28, G.H - 18);
    var minGap = Math.max(18, Math.min(30, (size || 20) * 0.92));
    /* 同一顾客 / 工位在一帧里可能连续产出“+钱、小费、口味、套餐”四类
       文案。沿 y 轴向上找一条空位，保留原 x 和上浮速度，让它们各自可读
       而不是叠成一团；只避让仍在明显可见阶段的浮字。 */
    for (var pass = 0; pass < 8; pass++) {
      var hit = false;
      for (var i = 0; i < S.floats.length; i++) {
        var f = S.floats[i];
        if (!f || f.life > 0.62 || Math.abs((f.x || 0) - x) > 132) continue;
        if (Math.abs((f.y || 0) - fy) < minGap) {
          fy -= minGap + 2;
          if (fy < 30) fy = Math.min(G.H - 18, y + minGap + 2);
          hit = true; break;
        }
      }
      if (!hit) break;
    }
    return G.clamp(fy, 28, G.H - 18);
  }
  function fx(txt, x, y, col, size) {
    var fs = size || 20;
    S.floats.push({ txt: txt, x: x, y: floatY(x, y, fs), col: col || P.ink,
      size: fs, life: 0, ttl: 0.95 });
    if (S.floats.length > FLOAT_CAP)
      S.floats.splice(0, S.floats.length - FLOAT_CAP);
  }
  /* 一次性里程碑反馈：同一营业日只弹一次，避免把普通的“+¥”淹没；
     但第一只馍、三连、首单外卖、首位特殊客和每五单都会给玩家一个
     清晰的“我做对了”节点。 */
  function cheer(key, txt, x, y, col, size) {
    if (!S.feedback) S.feedback = {};
    if (S.feedback[key]) return;
    S.feedback[key] = 1;
    /* 完成反馈是玩家刚刚做对的证据：留出半秒让“成了！”先被看见，
       再恢复下一步环，避免导航标签盖住庆祝浮字造成信息抢话筒。 */
    S.focusQuietT = Math.max(+S.focusQuietT || 0, 0.62);
    fx(txt, x, y, col || '#1D8A3C', size || 16);
    if (G.Snd && G.Snd.tier) G.Snd.tier(2);
    if (typeof burst === 'function') burst(x, y, 5, [P.yellow, P.cream, P.orange]);
  }
  /* story.js 只负责章节规则，不直接碰主循环的浮字队列。 */
  G.notice = fx;
  function burst(x, y, n, cols) {
    for (var i = 0; i < n; i++)
      S.parts.push({
        x: x, y: y, vx: G.rand(-140, 140), vy: G.rand(-250, -90),
        s: G.rand(4, 9), col: G.pick(cols), life: 0, ttl: G.rand(0.35, 0.7)
      });
  }
  /* 拿新料要花钱 */
  function charge(amt, x, y, label) {
    if (!amt) return;
    S.dayCost += amt;
    S.money = Math.max(0, S.money - amt);
    fx('-¥' + amt + ' ' + label, x, y, P.red, 14);
    fxOn('cost', x, y, amt);   // 硬币从钱袋飞到手上，把「抓多了」和「亏钱了」连起来
    G.Snd.nope();
  }

  function lockedMsg(key) {
    G.Snd.nope();
    var z = G.ZONE[key];
    fx('第 ' + G.UNLOCK[key] + ' 天才解锁', z.x + z.w / 2, z.y + z.h / 2 - 46, P.orangeDk, 18);
  }

  /* 轻量纠错：点到一个“看起来能操作、其实需要按住/拖动”的区域时，
     不让玩家只听见一声空响。它不是教程，也不改变订单、时间和收益；
     同一类误触在 0.78 秒内只提示一次，避免连点把浮字刷满。 */
  function softHint(key, txt, x, y, col) {
    if (!G.S || G.S.mode !== 'play') return false;
    if ((+G.S.softHintT || 0) > 0) return false;
    G.S.softHintT = 0.78; G.S.softHintKey = key || '';
    if (G.Snd && G.Snd.nope) G.Snd.nope();
    fx(txt, x, y, col || P.inkSoft, 13);
    return true;
  }

  /* 顶栏「刀法」按钮：下一锅可以切成不同肥瘦。已经剁进盆里的肉不回溯，
     这样选择是有取舍的，也避免点击时把手上的连续量凭空改掉。 */
  G.cycleChopStyle = function () {
    if (S.mode !== 'play') return false;
    S.chopStyle = ((S.chopStyle || 0) + 1) % G.CUT_STYLES.length;
    S.rhythm = 0; S.rhythmLast = null; S.rhythmBoostT = 0;
    S.chopT = 0; S.chopTapAt = null; S.chopBeatSeen = false;
    var st = cutStyle();
    if (G.Snd.profile) G.Snd.profile(S.chopStyle);
    else G.Snd.put();
    fx('刀法：' + st.label, G.PREF.x + G.PREF.w / 2, G.PREF.y + 64, P.meatDark, 15);
    return true;
  };

  /* 顶栏「馍胚」按钮：只影响之后新放上炉的面团，炉上的馍不会中途变形。 */
  G.cycleBunStyle = function () {
    if (S.mode !== 'play') return false;
    S.bunStyle = ((S.bunStyle || 0) + 1) % G.BUN_STYLES.length;
    var st = G.BUN_STYLES[S.bunStyle];
    if (G.Snd.profile) G.Snd.profile(S.bunStyle + 3); else G.Snd.put();
    fx('馍胚：' + st.label, G.BUNSTYLE.x + G.BUNSTYLE.w / 2, G.BUNSTYLE.y + 64, P.meatDark, 15);
    return true;
  };

  /* 顶栏辣椒油按钮：每勺都是真实库存，先做出「多汁 / 干爽」的订单差异。
     没油时留给 events.js 的补货事件一个接缝，事件没加载也能正常提示。 */
  G.actSauce = function () {
    if (S.mode !== 'play') return false;
    if (!S.slot) { G.Snd.nope(); fx('先放一个馍', G.SAUCE.x + G.SAUCE.w / 2, 70, P.orangeDk, 14); return false; }
    if ((S.slot.juice || 0) >= G.CFG.sauceMax) {
      G.Snd.nope(); fx('已经够多汁了', G.SAUCE.x + G.SAUCE.w / 2, 70, P.orangeDk, 14); return false;
    }
    if ((S.sauceStock || 0) <= 0) {
      if (G.Events && G.Events.requestRefill && G.Events.requestRefill()) return true;
      G.Snd.nope(); fx('辣椒油用完了', G.SAUCE.x + G.SAUCE.w / 2, 70, P.red, 14); return false;
    }
    S.sauceStock--;
    S.slot.juice = (S.slot.juice || 0) + 1;
    if (G.Snd.sauce) G.Snd.sauce(S.slot.juice); else G.Snd.put();
    fx('加辣椒油 ' + S.slot.juice + '/' + G.CFG.sauceMax,
      G.SAUCE.x + G.SAUCE.w / 2, 70, P.orangeDk, 15);
    fxOn('sauce', G.BSLOT.x, G.BSLOT.y, S.slot.juice);
    burst(G.BSLOT.x + 8, G.BSLOT.y - 10, 4, [P.chili || P.red, P.orange, P.yellow]);
    return true;
  };

  /* 表现层（js/fx.js）的事件入口，缺席时静默 */
  function fxOn(name, x, y, extra) { if (G.FX && G.FX.on) G.FX.on(name, x, y, extra); }

  /* 事件系统（js/events.js）是否把某个工位瘫痪了 */
  function evBlocked(key) {
    return !!(G.Events && G.Events.active && G.Events.active(key));
  }
  function blocked(key) {
    if (!evBlocked(key)) return false;
    G.Snd.nope();
    fxOn('nope');
    var z = G.ZONE[key];
    fx('这儿现在用不了', z.x + z.w / 2, z.y + z.h / 2 - 44, P.red, 17);
    return true;
  }

  /* ---------- 动作：切配 ---------- */
  /* 一次真正落刀：长按和单击都走同一套节奏 / 音效 / 碎屑，避免两条手感分叉。 */
  function chopBeat(gap) {
    if (S.chopBeatSeen && gap !== null &&
        Math.abs(gap - G.CFG.rhythmBeat) <= G.CFG.rhythmWindow)
      S.rhythm = (S.rhythm || 0) + 1;
    else
      S.rhythm = 1;
    S.rhythmLast = gap;
    S.chopBeatSeen = true;
    if (S.rhythm > (S.rhythmBest || 0)) S.rhythmBest = S.rhythm;
    if (S.rhythm >= 3) S.rhythmBoostT = G.CFG.rhythmBoostTime;
    S.cleaverY = 34;
    if (S.rhythm >= 3 && G.Snd.rhythm) G.Snd.rhythm(S.rhythm);
    else G.Snd.chop();
    fxOn(S.rhythm >= 3 ? 'rhythm' : 'chop', G.BLK.x, G.BLK.y, S.rhythm);
    if (S.rhythm === 3)
      cheer('rhythm3', '节奏连上！剁肉加速', G.BLK.x, G.BLK.y - 64, '#B07800', 16);
    burst(G.BLK.x + 18, G.BLK.y - 6, 2, [P.meat, P.meatLite, P.meatDark]);
  }

  /* 长按整块肉 = 连续剁。dt 驱动，所以量是连续的；manual=true 时由真实点击
     提供节拍，长按则继续用稳定的内部落刀节拍。 */
  function chopHold(dt, manual) {
    if (S.mince >= minceCap()) {
      if (!S.chopFull) { S.chopFull = 1; G.Snd.nope(); fx('肉馅盆满了', G.PILE.x, G.PILE.y - 42, P.orangeDk, 15); }
      S.rhythm = 0; S.rhythmLast = null; S.rhythmBoostT = 0;
      S.chopT = 0; S.chopTapAt = null; S.chopBeatSeen = false;
      return false;
    }
    S.chopFull = 0;
    var speed = G.CFG.chopHoldRate * (S.rhythmBoostT > 0 ? G.CFG.rhythmBoost : 1);
    var amt = Math.min(speed * dt, S.block * BLOCK_G, minceCap() - S.mince);
    if (amt <= 0) return false;
    S.block -= amt / BLOCK_G;
    S.mince += amt;
    S.minceFat = (S.minceFat || 0) + amt * cutStyle().fat;
    if (!manual) {
      S.chopT = (S.chopT || 0) + dt;
      if (S.chopT > G.CFG.rhythmBeat) {          // 长按刀声按节奏走，不是每帧一响
        var gap = S.chopT;
        S.chopT = 0;
        chopBeat(gap);
      }
    } else S.chopT = 0;
    if (S.block <= 0.002) {                  // 这块剁完了，换新的要花钱
      S.block = 1;
      charge(G.CFG.costBlock, G.BLK.x, G.BLK.y - 46, '新肉');
      G.Snd.sweep(); fxOn('mince', G.PILE.x, G.PILE.y);
    }
    return true;
  }

  function actChop() {                       // 单击 / 键盘空格的一次落刀
    var now = S.anim || 0;
    var gap = S.chopTapAt === null ? null : now - S.chopTapAt;
    S.chopTapAt = now;
    if (chopHold(0.16, true)) chopBeat(gap);
  }

  /* 电动剁肉机：自动补料降低疲劳，但主动把节奏连击清掉，保留「手工更值钱」的取舍。 */
  function autoChop(dt) {
    if (!(G.CFG.autoChopRate > 0) || S.mince >= minceCap()) return;
    var before = S.mince;
    chopHold(dt * G.CFG.autoChopRate / Math.max(1, G.CFG.chopHoldRate), true);
    if (S.mince > before) {
      S.rhythm = 0; S.rhythmLast = null; S.rhythmBoostT = 0; S.chopBeatSeen = false;
      S.autoChopT = (S.autoChopT || 0) + dt;
      if (S.autoChopT >= 0.32) {
        S.autoChopT = 0; S.cleaverY = 18; G.Snd.chop();
        fxOn('chop', G.BLK.x, G.BLK.y, 0);
      }
    }
  }

  function pepHold(dt) {
    if (S.pep >= pepCap()) return;
    var amt = Math.min(G.CFG.pepHoldRate * dt, S.pblock * PBLOCK_G, pepCap() - S.pep);
    if (amt > 0) {
      S.pblock -= amt / PBLOCK_G;
      S.pep += amt;
      if (S.pep >= 1) cheer('firstPepper', '青椒切好啦！', G.PBLK.x, G.PBLK.y - 56,
        '#357A38', 15);
      S.pchopT = (S.pchopT || 0) + dt;
      if (S.pchopT > 0.14) {
        S.pchopT = 0; S.pknifeY = 32;
        G.Snd.chopVeg();
        fxOn('cut', G.PBLK.x, G.PBLK.y);
        burst(G.PBLK.x + 14, G.PBLK.y - 6, 2, [P.pepper, P.pepperLt, P.pepperDk]);
      }
    }
    if (S.pblock <= 0.002) {
      S.pblock = 1;
      S.pepI = (S.pepI + 1) % PEPCOL.length; S.pepCol = PEPCOL[S.pepI];
      charge(G.CFG.costPep, G.PBLK.x, G.PBLK.y - 40, '新彩椒');
      fxOn('pep', G.PPILE.x, G.PPILE.y);
    }
  }

  function actPepper() { pepHold(0.16); }

  /* ---------- 动作：烤馍 ---------- */
  function actGrill(k) {
    var g = S.grill[k];
    var c = Art.content(G.ZONE.grill);
    var n = G.CFG.grillSlots;
    var cx = c.x + c.w * ((k + 0.5) / n), cy = c.y + (c.h - 4) / 2;

    if (g.state === 'empty') {                 // 摔一块面团上去（要钱）
      g.state = 'dough'; g.press = 0; g.t = 0; g.flag = 0;
      g.style = G.BUN_STYLES[S.bunStyle || 0].id;
      g.shapeQuality = G.clamp(+S.dayShapeQuality || 0, 0, 1);
      G.Snd.slap(); fxOn('bunput', cx, cy);
      charge(G.CFG.costDough, cx, cy - 32, '面团');
      return;
    }
    if (g.state === 'dough') {                 // 拍一下 → 之后自动摊开
      if (g.pressing) { G.Snd.nope(); return; }
      g.pressing = 1;
      G.Snd.slap(); fxOn('chop', cx, cy);
      return;
    }
    var burnAt = G.bunTiming(g, 'burn');
    var goodAt = G.bunTiming(g, 'good');
    var grace = G.practiceForDay ? (G.practiceForDay(S.day).grace || 0) : 0;
    if (g.t >= burnAt) {
      g.state = 'empty'; g.t = 0; g.press = 0;
      S.burntToday = (S.burntToday || 0) + 1;
      G.Snd.nope(); fxOn('burn', cx, cy); fx('糊了，扔了', cx, cy - 28, P.red, 15);
    } else if (g.t >= Math.max(0, goodAt - grace)) {
      if (S.bun >= G.CFG.maxBun) { G.Snd.nope(); fx('馍架满了', cx, cy - 28, P.orangeDk, 14); return; }
      var crisp = g.t >= G.bunTiming(g, 'crispy');
      g.state = 'empty'; g.t = 0; g.press = 0; S.bun++;
      if (!S.bunQual) S.bunQual = [];
      S.bunQual.push({ quality: crisp ? 'crispy' : 'soft', shape: g.shapeQuality || 0 });
      G.Snd.take(); fxOn('bun', cx, cy); fx('+1 馍', cx, cy - 28, P.orangeDk, 16);
      if (S.bun === 1) cheer('firstBun', '第一只热馍出炉！', cx, cy - 58, '#B07800', 15);
      if (crisp) cheer('firstCrispy', '酥脆火候达成！', cx, cy - 76, '#D4512B', 16);
    } else {
      G.Snd.nope(); fxOn('nope', cx, cy); fx('还没烤透', cx, cy - 28, P.inkSoft, 14);
    }
  }

  /* ---------- 动作：冰峰 ---------- */
  function actFridge() {
    if (S.fridge === 'empty') { S.fridge = 'capped'; G.Snd.glass(); return; }
    if (S.fridge === 'capped') {
      S.fridge = 'open';
      G.Snd.uncap();
      var c = Art.content(G.ZONE.fridge);
      fxOn('pop', c.x + c.w / 2, c.y + 40);
      burst(c.x + c.w / 2, c.y + 34, 7, [P.ice, P.iceDk, P.cream]);
      return;
    }
    softHint('fridgeFull', '先把现有冰峰递掉，再取下一瓶', G.ZONE.fridge.x + G.ZONE.fridge.w / 2,
      G.ZONE.fridge.y + 48, '#357A9B');
  }

  /* ---------- 动作：凉皮 ---------- */
  function actNoodle() {
    var n = S.noodle;
    if (n.state === 'empty')  { n.state = 'noodle'; n.mix = 0; G.Snd.put(); return; }
    if (n.state === 'noodle') {
      n.state = 'seasoned'; n.ang = null;
      G.Snd.season();
      burst(G.BOWL.x, G.BOWL.y - 16, 5, [P.chili, P.chiliOil, P.pepper]);
      return;
    }
    if (n.state === 'seasoned') {   // 点击也能拌，只是比画圈慢
      mix(0.55);
      return;
    }
    softHint('noodleDone', '凉皮已拌好 · 点顾客递出去', G.BOWL.x, G.BOWL.y - 48, '#357A9B');
  }

  function mix(amount) {
    var n = S.noodle;
    n.mix += amount;
    if (n.mix >= G.CFG.mixNeed) {
      n.state = 'done'; n.ang = null;
      G.Snd.done();
      fxOn('mixdone', G.BOWL.x, G.BOWL.y - 16);
      burst(G.BOWL.x, G.BOWL.y - 16, 8, [P.chiliOil, P.noodle, P.pepperLt]);
    } else {
      fxOn('mix', G.BOWL.x, G.BOWL.y - 12);
      G.Snd.stir();                 // 自带 90ms 节流，不用再掷骰子控密度
    }
  }

  /* ---------- 第一天的分步引导 ----------
     只在第 1 天、且没有存档进度时出现。纯提示，不挡任何操作。 */
  function grillSpot(i) {
    var c = Art.content(G.ZONE.grill), n = G.CFG.grillSlots;
    return { x: c.x + c.w * ((i + 0.5) / n), y: c.y + (c.h - 4) / 2 };
  }
  function anyGrill(f) {
    for (var i = 0; i < S.grill.length; i++) if (f(S.grill[i])) return true;
    return false;
  }
  var TUT = [
    { t: '按住整块肉不放，一直剁',
      at: function () { return G.BLK; },
      ok: function () { return S.mince >= 60; } },
    { t: '点烤馍炉的空灶眼，放个面团',
      at: function () { return grillSpot(0); },
      ok: function () { return anyGrill(function (g) { return g.state !== 'empty'; }); } },
    { t: '再点一下，把面团拍平',
      at: function () {
        for (var i = 0; i < S.grill.length; i++)
          if (S.grill[i].state === 'dough') return grillSpot(i);
        return grillSpot(0);
      },
      ok: function () { return anyGrill(function (g) { return g.state === 'toasting'; }); } },
    { t: '等计时环变绿，再点一下取出',
      at: function () {
        for (var i = 0; i < S.grill.length; i++)
          if (S.grill[i].state === 'toasting') return grillSpot(i);
        return grillSpot(0);
      },
      ok: function () { return S.bun >= 1; } },
    { t: '点夹馍位，把馍放上去',
      at: function () { return G.BSLOT; },
      ok: function () { return !!S.slot; } },
    { t: '按住肉堆抓一把，拖到馍上松手',
      at: function () { return G.PILE; },
      ok: function () { return !!S.slot && S.slot.meat > 0; } },
    { t: '肉够 80g 了就点一下夹好',
      at: function () { return G.BSLOT; },
      ok: function () { return S.tray.length >= 1; } },
    { t: '按住纸站抽一张纸，拖到肉夹馍上',
      at: function () { return G.PAPER; },
      ok: function () { return (S.wrapped || 0) >= 1; } },
    { t: '包好了，点顾客递给她',
      at: function () {
        for (var i = 0; i < G.SLOT.length; i++)
          if (S.cust[i] && S.cust[i].state === 'wait') return { x: G.SLOT[i].cx, y: 228 };
        return { x: G.SLOT[0].cx, y: 228 };
      },
      ok: function () { return S.served >= 1; } }
  ];
  G.TUT = TUT;

  /* 工位第一次解锁那天，给一句话的上手提示，用过一次就消失 */
  var UTIP = {
    fridge: { t: '冰柜点两下：取瓶 → 开盖',
      at: function () { var c = Art.content(G.ZONE.fridge);
        return { x: c.x + c.w / 2, y: c.y + 70 }; },
      ok: function () { return S.drinks > 0 || S.fridge !== 'empty'; } },
    pepper: { t: '按住整根彩椒连切，再抓一把填进馍',
      at: function () { return G.PBLK; },
      ok: function () { return S.pep > 0; } },
    noodle: { t: '抓凉皮 → 加调料 → 在碗里画圈搅拌',
      at: function () { return G.BOWL; },
      ok: function () { return S.noodle.state !== 'empty'; } }
  };
  G.UTIP = UTIP;

  /* 跑单的人当时还在等什么 —— 结算页只报「跑单 3 位」，玩家看不出是哪一环
     卡住了，也就不知道明天该改什么。被自己砸走的不算，那是故意的。 */
  function noteLost(c) {
    var w = S.why || (S.why = { type: {}, unwrapped: 0, undone: 0 });
    for (var q = 0; q < c.items.length; q++) {
      var it = c.items[q];
      if (it.done) continue;
      w.type[it.type] = (w.type[it.type] || 0) + 1;
      w.undone++;
      for (var t = 0; t < S.tray.length; t++)   // 东西其实做好了，只差一张纸
        if (S.tray[t].type === it.type && S.tray[t].wrapT < 1) { w.unwrapped++; break; }
    }
  }

  /* ---------- 彩蛋：扔过去 ---------- */
  function hitCustomer(k) {
    var c = S.cust[k];
    if (!c || c.state !== 'wait') return false;
    c.state = 'hit'; c.anim = 0; c.dirty = true; c.splat = 0;
    c.expr = Math.random() < 0.5 ? 'scared' : 'furious';
    S.thrown++; S.lost++;
    S.shockT = 6;                       // 旁边的人看见了，接下来一阵更没耐心
    G.Snd.splat();
    fxOn('angry', G.SLOT[k].cx, 170);
    burst(G.SLOT[k].cx, 176, 10, ['#6B4423', '#7A5029', '#5A3A1E']);
    fx(c.expr === 'scared' ? '啊啊啊！' : '你干什么！', G.SLOT[k].cx, 140, P.red, 24);
    return true;
  }

  /* ---------- 动作：夹馍位 ---------- */
  function actSlot() {
    if (!S.slot) {                             // 放一个烤好的馍上来
      if (S.bun < 1) { G.Snd.nope(); fx('先烤个馍', G.BSLOT.x, G.BSLOT.y - 40, P.orangeDk, 15); return; }
      S.bun--;
      var bunData = S.bunQual && S.bunQual.length ? S.bunQual.shift() : 'soft';
      var bunQ = typeof bunData === 'string' ? bunData : (bunData.quality || 'soft');
      var bunShape = typeof bunData === 'string' ? 0 : G.clamp(+bunData.shape || 0, 0, 1);
      S.slot = { meat: 0, pep: 0, fat: 0, juice: 0, bun: bunQ, shape: bunShape };
      G.Snd.put(); fxOn('bunput', G.BSLOT.x, G.BSLOT.y);
      return;
    }
    if (S.slot.meat < G.CFG.bunNeed) {         // 肉还不够
      G.Snd.nope();
      fx('肉不够，去肉堆抓一把', G.BSLOT.x, G.BSLOT.y - 40, P.orangeDk, 14);
      return;
    }
    if (S.tray.length >= G.CFG.maxTray) {
      G.Snd.nope(); fx('铁盘满了', G.BSLOT.x, G.BSLOT.y - 40, P.orangeDk, 15); return;
    }
    var type = S.slot.pep >= G.CFG.bunPep ? 'rjmp' : 'rjm';
    var m = S.slot.meat;
    var sweet = G.justRightForDay ? G.justRightForDay(S.day) : G.CFG.justRight;
    var just = m <= G.CFG.bunNeed * sweet ||
               (m >= G.CFG.bigNeed && m <= G.CFG.bigNeed * sweet);
    /* 前三天是读数练习，不该因为“普通档上沿”和“加肉档下沿”之间的
       一小段空白就立刻给新手一个红色断连。它仍不是加肉馍，也不改变
       正式区间；只在训练期把这次近似命中算作 1 连，奖励按当前连击
       正常递增，第四天起恢复严格死区。 */
    var practiceJust = !just && S.day <= 3 &&
      m >= G.CFG.bunNeed * sweet && m < G.CFG.bigNeed;
    /* 第 4~7 天从“练习命中”过渡到正式死区时，给已经连起来的玩家一
       次可见的纠错机会。它不改变这份馍的普通/加肉分类，也不增加售价，
       只让一次擦边失误不至于把刚建立的节奏全部清零。 */
    var comboGuardJust = !just && !practiceJust && S.day >= 4 && S.day <= 7 &&
      S.combo > 0 && !S.comboGuardUsed &&
      m > G.CFG.bunNeed * sweet && m < G.CFG.bigNeed;
    if (comboGuardJust) S.comboGuardUsed = 1;
    S.tray.push({ type: type, wrapT: 0, meat: m,
      fat: S.slot.fat || 0, juice: S.slot.juice || 0,
      bun: S.slot.bun || 'soft', shape: S.slot.shape || 0 });
    S.slot = null;
    S.madeToday = (S.madeToday || 0) + 1;
    if (!S.gestureHintDone && !S.gestureHint) {
      S.gestureHint = '快捷：点绿色成品直递 · 双击快包 · 滑动快递';
      S.gestureHintT = 12;
    }
    G.Snd.done(); fxOn('make', G.BSLOT.x, G.BSLOT.y, type);
    burst(G.BSLOT.x, G.BSLOT.y, 6, [P.yellow, P.orange, P.cream]);
    if (just || practiceJust || comboGuardJust) {
      S.combo = (S.combo || 0) + 1;
      if (S.combo > (S.comboBest || 0)) S.comboBest = S.combo;
      var bonus = Math.min(1 + S.combo, G.CFG.comboMax);
      S.money += bonus; S.dayMoney += bonus;
      G.Snd.combo(S.combo);
      if (comboGuardJust) cheer('comboGuard', '擦边也算！连击护栏保住',
        G.BSLOT.x, G.BSLOT.y - 78, '#357A38', 15);
      else if (S.combo === 1) cheer('firstJust', practiceJust ? '练习命中！先保住连击' : '份量进入甜蜜区！',
        G.BSLOT.x, G.BSLOT.y - 78, '#1D8A3C', 15);
      if (S.combo === 3 && !comboGuardJust) cheer('combo3', '三连手稳 · 节奏起来了！', G.BSLOT.x, G.BSLOT.y - 96, '#B07800', 17);
      fx(comboGuardJust ? '擦边命中！护栏保住 +¥' + bonus
        : practiceJust ? '练习份量也算稳 +¥' + bonus
        : S.combo > 1 ? '手稳 ×' + S.combo + '  +¥' + bonus : '份量正好 +¥' + bonus,
        G.BSLOT.x, G.BSLOT.y - 44, '#1D8A3C', S.combo > 1 ? 17 : 15);
      if (S.combo >= 3) burst(G.BSLOT.x, G.BSLOT.y - 20, 6, [P.yellow, '#FFE08A', P.cream]);
    } else if (S.combo) {                // 手抖了，连击断
      fx('手稳断了 · 馍已成型', G.BSLOT.x, G.BSLOT.y - 44, P.inkSoft, 13);
      S.combo = 0;
    }
    /* 份量没进甜蜜区并不等于“白做”：只要没有超过溢出上限，这个馍仍
       能包纸、递给顾客。前几份给一次低噪声的成型反馈，把“连击断了”
       和“这单还能继续”同时说清楚；完美命中 / 练习命中 / 护栏命中沿用
       上面的更强奖励，避免一份馍弹两套庆祝。 */
    if (!just && !practiceJust && !comboGuardJust && S.madeToday <= 3)
      cheer('madeSafe' + S.madeToday, type === 'rjmp' ? '青椒馍成型！先去包纸' :
        '馍成型！先去包纸', G.BSLOT.x, G.BSLOT.y - 78, '#357A38', 14);
  }

  /* 手里这把有多少克，松手会落到哪
   *
   * 落进去的量是随机的（±grabVar），堆头大小只是个模糊暗示 —— 玩家其实
   * 没法判断松手会不会落进「正好」窗口，而这恰恰是每个馍最需要判断的一步。
   * 所以把手上克数和落点区间直接摆出来：区间整个落进窗口才给绿，
   * 可能撑爆给红。信息本来就是玩家能自己算的，摆出来只是省掉心算。 */
  function handReadout(ctx) {
    var h = S.hand, C = G.CFG;
    var line1 = Math.round(h.amt) + ' g', line2 = null, col = P.ink;

    if (h.kind === 'meat' && S.slot) {
      var v = G.grabVarForDay ? G.grabVarForDay(S.day) : C.grabVar;
      var sweet = G.justRightForDay ? G.justRightForDay(S.day) : C.justRight;
      var lo = S.slot.meat + h.amt * (1 - v);
      var hi = S.slot.meat + h.amt * (1 + v);
      var justSmall = [C.bunNeed, C.bunNeed * sweet];
      var justBig   = [C.bigNeed, C.bigNeed * sweet];
      if (hi > C.bunOver)                                  { col = P.red;      line2 = '可能撑爆'; }
      else if (lo >= justSmall[0] && hi <= justSmall[1])   { col = '#1D8A3C';  line2 = '正好'; }
      else if (lo >= justBig[0]   && hi <= justBig[1])     { col = '#1D8A3C';  line2 = '加肉正好'; }
      else if (hi < C.bunNeed)                             { col = P.inkSoft;  line2 = '还不够'; }
      else                                                 { col = P.orangeDk; line2 = Math.round(lo) + '~' + Math.round(hi) + 'g'; }
    } else if (h.kind === 'pep' && S.slot) {
      line2 = S.slot.pep >= C.bunPep ? '够了' : null;
      if (line2) col = '#1D8A3C';
    }
    /* 档位一变就极轻地点一下。tier() 自带变化检测 + 180ms 闸，
       所以从渲染里每帧调是安全的 —— 档位不动它一声不出。 */
    G.Snd.tier(line2);

    var w = Math.max(46, (line2 ? Math.max(line1.length, line2.length) : line1.length) * 9 + 16);
    var bh = line2 ? 34 : 20;
    // 摆在手的上方而不是下方 —— 下方正是肉堆和夹馍位，这块牌子
    // 会把它要帮你看的东西盖住。顶到画布上沿了才退回下方。
    var bx = G.clamp(h.x - w / 2, 2, G.W - w - 2);
    var by = h.y - bh - 30;
    if (by < 2) by = G.clamp(h.y + 26, 2, G.H - bh - 2);
    G.box(ctx, bx, by, w, bh, 6, 'rgba(255,250,238,.94)', 2, col);
    G.text(ctx, line1, bx + w / 2, by + (line2 ? 11 : 10), { size: 13, col: P.ink });
    if (line2) G.text(ctx, line2, bx + w / 2, by + 25, { size: 12, col: col, weight: 700 });
  }

  /* ---------- 动作：包纸 ---------- */
  /* 视觉铁盘只有 56px 高，但手机上要给每格完整的 86×86 触控方块。
     触控带以格心为中心，上沿会吃掉工位底部那条没有操作内容的留白；
     烤炉/案板在这条带内不再接收 tap，因而既够大又没有歧义。 */
  var TRAY_HIT_HALF = 43;
  var TRAY_HIT_TOP = G.ZONE.tray.y + G.ZONE.tray.h / 2 - TRAY_HIT_HALF;
  var TRAY_HIT_BOTTOM = TRAY_HIT_TOP + 86;
  function trayIndexAt(x, y) {
    for (var i = 0; i < G.CFG.maxTray; i++) {
      // 格子是方的：86×86 的矩形判定与 86px 间距正好相切，相邻格不重叠，
      // 比原先被铁盘 56px 高度削掉的圆判定更容易点中，而画面一点没动。
      var c = G.traySlot(i);
      // 左闭右开：两格正中那一列只归左边那格，否则边界会同时命中两格。
      // 上边沿避开烤炉，下边沿留在画布内；这是有意的非对称安全区。
      var dx = x - c.x;
      if (dx >= -TRAY_HIT_HALF && dx < TRAY_HIT_HALF &&
          y >= TRAY_HIT_TOP && y < TRAY_HIT_BOTTOM) return i;
    }
    return -1;
  }

  /* 点铁盘上没包纸的成品：不再直接包，而是教玩家去拿纸 */
  function actWrap(i) {
    var it = S.tray[i];
    if (!it) {
      softHint('trayEmpty', '先夹好一只馍，再来包纸', G.traySlot(i).x, G.traySlot(i).y - 26,
        P.orangeDk);
      return;
    }
    if (it.wrapT >= 1) {
      softHint('trayWrapped', '这份已包好 · 点对应顾客出餐', G.traySlot(i).x,
        G.traySlot(i).y - 26, '#357A38');
      return;
    }
    var c = G.traySlot(i);
    G.Snd.nope();
    fx('从纸站拖一张纸过来', c.x, c.y - 30, P.orangeDk, 13);
  }

  /* 把手里那张纸盖上去，之后 0.3 秒自动裹好 */
  function applyPaper(i) {
    var it = S.tray[i];
    if (!it || it.wrapT >= 1) return false;
    it.wrapping = 1;
    var c = G.traySlot(i);
    G.Snd.paper(); fxOn('serve', c.x, c.y - 20, it.type);
    return true;
  }

  /* ---------- 动作：夹馍（旧入口，事件系统仍可能引用） ---------- */
  function actMake() { actSlot(); }

  /* 铁盘上的绿色目标环已经告诉玩家“这份该给谁”。允许玩家直接点
     这份成品完成递餐，减少从铁盘移到顾客的视线切换；只接受和现有
     顾客完全对口的成品，橙色“补口味”仍然不会被快捷键误送出去。 */
  function trayTarget(i) {
    var it = S.tray[i];
    if (!it || it.wrapT < 1) return -1;
    var hefty = (it.meat || 0) >= G.CFG.bigNeed;
    var giant = (it.meat || 0) >= (G.CFG.giantNeed || 170);
    for (var k = 0; k < G.SLOT.length; k++) {
      var c = S.cust[k];
      if (!c || c.state !== 'wait' || !c.items) continue;
      for (var q = 0; q < c.items.length; q++) {
        var need = c.items[q];
        if (!need || need.done || need.type !== it.type) continue;
        if (need.big && !hefty) continue;
        if (need.giant && !giant) continue;
        if (it.type === 'lp' || !G.qualityMatch || G.qualityMatch(need, it).ok)
          return k;
      }
    }
    return -1;
  }

  /* ---------- 动作：递给顾客（自动配对） ---------- */
  function finishOrder(k, c) {
    var left = 0, q;
    for (q = 0; q < c.items.length; q++) if (!c.items[q].done) left++;
    if (left > 0) {
      var doneCount = c.items.length - left;
      /* 套餐的一部分送对时也给一个短、明确的“进度格”：玩家同时烤馍、
         开冰峰、拌凉皮时，不必等最后一项完成才知道前面的操作没有白做。 */
      var breath = 0;
      if (!c.progressReliefUsed && G.progressReliefForDay) {
        var relief = Math.max(0, +G.progressReliefForDay(S.day) || 0);
        var cap = Math.max(0, (+c.pmax || 0) * 0.14);
        var beforePatience = Math.max(0, +c.patience || 0);
        breath = Math.min(relief, cap, Math.max(0, (+c.pmax || 0) - beforePatience));
        if (breath > 0.01) c.patience = beforePatience + breath;
        c.progressReliefUsed = 1;
      }
      var progressText = '套餐进度 ' + doneCount + '/' + c.items.length + ' · 继续';
      if (breath > 0.01) progressText += ' · 回一口气 +' + breath.toFixed(1) + 's';
      fx(progressText, G.SLOT[k].cx, 218, '#357A9B', 14);
      if (breath > 0.01) {
        cheer('bundleBreath' + (c.life || 0).toFixed(2),
          '做对一项！套餐回气 +' + breath.toFixed(1) + 's',
          G.SLOT[k].cx, 244, '#357A38', 14);
      }
      fxOn('serve', G.SLOT[k].cx, 200); G.Snd.take(); return;
    }
    var sum = 0, shapeTip = 0;
    var qNeed = 0, qHit = 0;
    for (q = 0; q < c.items.length; q++) {
      var oi2 = c.items[q];
      sum += G.ITEM[oi2.type].price +
        (oi2.giant ? (G.CFG.giantPay || 0) : oi2.big ? G.CFG.bigPay : 0);
      if (oi2.type === 'rjm' || oi2.type === 'rjmp')
        sum += (oi2.servedJuice || 0) * (G.CFG.saucePay || 0);
      if ((oi2.type === 'rjm' || oi2.type === 'rjmp') && (oi2.shape || 0) >= 0.82)
        shapeTip += Math.max(0, Math.round(G.CFG.shapePay || 0));
      if (c.items[q].fatNeed || c.items[q].juiceNeed || c.items[q].bunNeed) {
        qNeed++;
        qHit += c.items[q].qualityScore === undefined ? 0 : c.items[q].qualityScore;
      }
    }
    var ct = G.CTYPE[c.type] || G.CTYPE.normal;
    var tip = Math.round(G.CFG.tipPer * c.items.length *
      G.clamp(c.patience / c.pmax, 0, 1) * ct.tip) + ct.bonus;
    var qRate = qNeed ? G.clamp(qHit / qNeed, 0, 1) : 0;
    var qTip = qNeed ? Math.round((G.CFG.strictPay || 0) * qRate) : 0;
    tip += qTip + shapeTip;
    var recipe = G.recipeFor(c), recipePay = 0;
    if (recipe && !c.recipePaid) {
      recipePay = Math.max(0, Math.round(G.CFG[recipe.bonus] || 0));
      c.recipePaid = 1;
      S.recipeBonus = (S.recipeBonus || 0) + recipePay;
      S.recipeCount = (S.recipeCount || 0) + 1;
      if (recipe.id === 'soul') S.secretWins = (S.secretWins || 0) + 1;
      if (G.Story && G.Story.record) G.Story.record('recipe');
    }
    var brothTip = Math.round((S.dayBrothQuality || 0) * (G.CFG.brothBonus || 0) * c.items.length);
    tip += brothTip + (c.specialTip || 0);
    if (c.takeout) { tip += G.CFG.takeoutPay || 0; S.takeoutOrders = (S.takeoutOrders || 0) + 1; }
    if (c.special === 'picky' && qRate >= 0.999) tip += G.CFG.strictPay || 0;
    if (c.special === 'inspector' && !c.inspectBad) tip += G.CFG.strictPay || 0;
    S.qualityBonus = (S.qualityBonus || 0) + qTip;
    S.shapeBonus = (S.shapeBonus || 0) + shapeTip;
    S.dayRating = (S.dayRating || 0) + (qNeed ? Math.round(qRate * 100) : 75);
    var pay = sum + tip + recipePay;
    S.money += pay; S.dayMoney += pay; S.served++;
    var flow = G.flowForDay ? G.flowForDay(S.day) : null;
    if (flow && flow.duration > 0 && S.served >= 3 && S.served % 3 === 0) {
      S.flowT = flow.duration; S.flowMul = flow.mul;
      cheer('flow' + S.served, '三单成势！顺风 ' + flow.duration.toFixed(1) + 's',
        G.SLOT[k].cx, 118, '#357A38', 14);
    }
    /* 递出前这一格仍占位；如果门口已经满了，给 happy 动画留一个短
       缓冲，避免玩家明明刚救活一单，却在同一瞬间因为半秒离席动画再
       送走下一位。只触发一次/天，且窗口会随天数收紧。 */
    var packedQueue = G.SLOT.length > 0;
    for (var pk = 0; pk < G.SLOT.length; pk++) {
      if (!S.cust[pk] || S.cust[pk].state !== 'wait') { packedQueue = false; break; }
    }
    if (packedQueue && G.serveReliefForDay) {
      var relief = Math.max(0, +G.serveReliefForDay(S.day) || 0);
      if (relief > 0) {
        S.serveBufferT = Math.max(S.serveBufferT || 0, relief);
        S.serveBufferMax = Math.max(S.serveBufferMax || 0, relief);
        cheer('serveRelief', '出餐腾位！下一位有缓冲', G.SLOT[k].cx, 286,
          '#357A9B', 14);
      }
    }
    if (S.served === 1)
      cheer('firstServe', '开张成功！第一位顾客满意', G.SLOT[k].cx, 92, '#1D8A3C', 17);
    else if (S.served % 5 === 0) {
      fx('连出 ' + S.served + ' 单 · 节奏稳住', G.SLOT[k].cx, 92, '#1D8A3C', 14);
      if (G.Snd && G.Snd.tier) G.Snd.tier(2);
    }
    if (G.queueTicketForDay && G.queueTicketForDay(S.day, S.served) &&
        !(S.queueGrace > 0)) {
      S.queueGrace = 1;
      cheer('queueTicket' + S.served, '连出 ' + S.served + ' 单 · 取号券 +1',
        G.SLOT[k].cx, 112, '#357A9B', 14);
    }
    if (c.takeout && S.takeoutOrders === 1)
      cheer('firstTakeout', '外卖首单！打包节奏建立', G.SLOT[k].cx, 120, '#357A9B', 15);
    if (c.lastChance)
      cheer('lastChance', '救回一单！最后一口气也能翻盘', G.SLOT[k].cx, 144, '#357A38', 15);
    if (recipePay > 0)
      cheer('recipe' + (S.recipeCount || 1), '隐藏菜单解锁！' + (recipe.label || '复合套餐'),
        G.SLOT[k].cx, 120, '#B07800', 15);
    if (c.special) {
      S.specialWins = (S.specialWins || 0) + 1;
      if (G.Story && G.Story.record) G.Story.record('special');
      if (S.specialWins === 1)
        cheer('firstSpecial', '特殊客完成！名气涨起来了', G.SLOT[k].cx, 144, '#8B4B72', 15);
    }
    if (c.takeout && G.Story && G.Story.record) G.Story.record('takeout');
    if (G.Story && G.Story.record) G.Story.record('served');
    c.state = 'happy'; c.anim = 0;
    var bye = (G.Regulars && G.Regulars.bye) ? G.Regulars.bye(c) : null;
    saySome(c, bye || G.pick(SAY.done));
    G.Snd.cash();
    // 总价里已经含了 bigPay，但光看金额分不出是加肉单还是单纯买得多
    var bigN = 0;
    for (q = 0; q < c.items.length; q++) if (c.items[q].big) bigN++;
    fxOn(bigN ? 'cashbig' : 'cash', G.SLOT[k].cx, 168, pay);
    fx('+¥' + pay, G.SLOT[k].cx, 168, '#1D8A3C', 26);
    if (tip > 0) fx('小费 ¥' + tip, G.SLOT[k].cx, 206, P.orangeDk, 16);
    if (qTip > 0) fx(qRate >= 0.999 ? '口味全对 +¥' + qTip
      : '口味命中 ' + Math.round(qRate * 100) + '% +¥' + qTip,
      G.SLOT[k].cx, 238, '#1D8A3C', 14);
    if (shapeTip > 0) fx('馍胚规整 +¥' + shapeTip, G.SLOT[k].cx, 254, '#7A9C3D', 14);
    if (recipePay > 0) fx(recipe.label + ' +¥' + recipePay, G.SLOT[k].cx, 262, '#B07800', 16);
    if (c.takeout) fx('外卖打包费 +¥' + (G.CFG.takeoutPay || 0), G.SLOT[k].cx, 286, P.orangeDk, 14);
    if (c.special === 'blogger' && c.specialSuccess) {
      S.hype = Math.max(S.hype || 0, (G.CFG.hypeDays || 3) + 1);
      fxOn('hype', G.SLOT[k].cx, 170, 'blogger');
      fx('网红发帖！流量爆棚 ' + (G.CFG.hypeDays || 3) + ' 天', G.SLOT[k].cx, 274, '#D34C83', 17);
      if (G.Snd.luckyStreak) G.Snd.luckyStreak();
    }
    if (c.special === 'inspector' && !c.inspectBad)
      fx('卫生过关，城管点头', G.SLOT[k].cx, 274, '#357A38', 16);
    burst(G.SLOT[k].cx, 160, 8, [P.yellow, '#FFE08A', P.cream]);
  }

  function actServe(k, preferredTi) {
    var c = S.cust[k], oi, ti, q;
    if (!c || c.state !== 'wait') { G.Snd.nope(); return; }

    var preferred = preferredTi !== undefined && preferredTi !== null &&
      preferredTi >= 0 && preferredTi < S.tray.length &&
      S.tray[preferredTi] && S.tray[preferredTi].wrapT >= 1;

    if (c.special === 'inspector' && !c.inspectDone) {
      c.inspectDone = 1;
      var dirty = S.poop > 0 || (S.burntToday || 0) > 0;
      if (dirty) {
        var fineBase = G.Events && G.Events.econ ? G.Events.econ(S.day) : 100;
        var fine = G.Events && G.Events.hurt ? G.Events.hurt(fineBase * 0.06, true)
          : Math.round(fineBase * 0.06);
        if (!G.Events || !G.Events.hurt) {
          S.money = Math.max(0, S.money - fine); S.dayCost = (S.dayCost || 0) + fine;
        }
        c.inspectBad = 1;
        G.Snd.stampBad();
        fx('城管皱眉 · 卫生罚 ¥' + fine, G.SLOT[k].cx, 274, P.red, 16);
      } else {
        G.Snd.stampOk();
        fx('城管检查台面', G.SLOT[k].cx, 274, P.inkSoft, 14);
      }
    }

    if (!preferred) for (oi = 0; oi < c.items.length; oi++) { // 默认先递饮料
      if (c.items[oi].done || c.items[oi].type !== 'bf' || S.drinks <= 0) continue;
      S.drinks--; c.items[oi].done = true;
      var dz = G.ZONE.drink;
      S.flies.push({ type: 'bf', wrapT: 1,
        x0: dz.x + dz.w / 2, y0: dz.y + dz.h / 2,
        x1: G.SLOT[k].cx, y1: 200, t: 0, dur: 0.3 });
      G.Snd.glass();
      finishOrder(k, c);
      return;
    }

    var trayOrder = [];
    if (preferred) {
      /* 点/滑动一格成品时，手势本身已经表达了“就是这一份”。多份同类
         馍并存时不能静默改递另一格，否则玩家的触控反馈和实际扣库存会
         对不上；直接点顾客（没有 preferred）才继续走自动配对。 */
      trayOrder.push(preferredTi);
    } else {
      for (ti = 0; ti < S.tray.length; ti++) trayOrder.push(ti);
    }

    for (var pass = 0; pass < 3; pass++)
    for (var toi = 0; toi < trayOrder.length; toi++) {
      ti = trayOrder[toi];                         // 再递铁盘上包好的
      var it = S.tray[ti];
      if (it.wrapT < 1) continue;
      for (q = 0; q < c.items.length; q++) {
        if (c.items[q].done || c.items[q].type !== it.type) continue;
        var hefty = (it.meat || 0) >= G.CFG.bigNeed;
        var giant = (it.meat || 0) >= (G.CFG.giantNeed || 170);
        if (c.items[q].big && !hefty) continue;        // 要加肉的，普通份糊弄不过去
        if (c.items[q].giant && !giant) continue;      // 网红大胃王：超大份才算
        if (pass === 0 && !c.items[q].big && hefty) continue;  // 头一轮别把加肉的给了普通单
        var qm = G.qualityMatch(c.items[q], it);
        if (pass < 2 && !qm.ok) continue;               // 先找口味对的，最后一轮保底出餐
        // 递出去的是加肉那份：分量得听得出来，普通份沿用 finishOrder 的 take/cash
        if (c.items[q].big) G.Snd.orderBig();
        c.items[q].qualityScore = qm.score;
        c.items[q].servedJuice = it.juice || 0;
        if (c.special === 'blogger' && c.items[q].giant && giant) c.specialSuccess = 1;
        c.items[q].done = true;
        S.tray.splice(ti, 1);
        var tc = G.traySlot(ti);
        S.flies.push({ type: it.type, wrapT: 1,
          x0: tc.x, y0: tc.y, x1: G.SLOT[k].cx, y1: 200, t: 0, dur: 0.3 });
        finishOrder(k, c);
        return;
      }
    }

    /* 只有确实带着可交付物 / 半成品来尝试递餐，才算一次值得复盘的失误。
       空手点顾客仍只响一声，不会把每日容错浪费在无意误触上。 */
    var attemptedServe = S.tray.length > 0 || S.drinks > 0 || !!S.slot ||
      (S.noodle && S.noodle.state === 'done');
    G.Snd.nope();                                      // 递不出去，说清原因
    var why = '她不要这个';
    for (q = 0; q < c.items.length; q++) {
      var w = c.items[q]; if (w.done) continue;
      if (w.type === 'bf') { why = '冰峰还没开'; break; }
      var unwrapped = false;
      for (ti = 0; ti < S.tray.length; ti++)
        if (S.tray[ti].type === w.type && S.tray[ti].wrapT < 1) unwrapped = true;
      if (unwrapped) { why = '还没包纸'; break; }
      if (w.fatNeed || w.juiceNeed || w.bunNeed) {
        for (ti = 0; ti < S.tray.length; ti++)
          if (S.tray[ti].type === w.type && S.tray[ti].wrapT >= 1) {
            why = '口味还没对上'; break;
          }
        if (why === '口味还没对上') break;
      }
      if (w.big) {
        for (ti = 0; ti < S.tray.length; ti++)
          if (S.tray[ti].type === w.type) { why = '她要加肉的'; break; }
        if (why === '她要加肉的') break;
      }
    }
    fx(why, G.SLOT[k].cx, 230, P.red, 17);
    if (attemptedServe && G.triggerMistakeRecovery) G.triggerMistakeRecovery(k);
  }

  /* ---------- 顾客 ---------- */
  function spawn() {
    var free = [];
    var fromHold = S.queueHoldT > 0;
    var releaseAt = G.exitSlotReleaseForDay ? G.exitSlotReleaseForDay(S.day) : 0.36;
    for (var i = 0; i < G.SLOT.length; i++) {
      var old = S.cust[i];
      if (!old || ((old.state === 'happy' || old.state === 'leaving') &&
          Number(old.anim) >= releaseAt)) free.push(i);
    }
    if (!free.length) {          // 正式规则是满位就走；前期候场票先给有限回流缓冲
      if (S.queueHoldT > 0 || S.serveBufferT > 0) return false;
      if ((S.queueGrace || 0) > 0) {
        S.queueGrace--;
        S.queueHoldT = 3.2;
        S.queueHoldNotice = 1;
        cheer('queueGrace', '门口满了 · 这位客人先等一会', G.W / 2, 268,
          '#B07800', 17);
        if (S.queueGrace > 0)
          fx('候场票接住 · 还剩 ' + S.queueGrace + ' 张', G.W / 2, 294,
            '#357A9B', 13);
        return false;
      }
      S.walked++;
      G.Snd.walkOff();
      fxOn('walk', G.W / 2, 268);
      fx('没位置，走了', G.W / 2, 268, P.orangeDk, 18);
      if (G.triggerQueueRecovery) G.triggerQueueRecovery();
      return;
    }
    var k = G.pick(free);
    var special = pickSpecial(S.day), specialFirst = false;
    var type = pickType(S.day);
    var items = special ? specialOrder(S.day, special) : makeOrder(S.day, type);
    var pat = (S.d.patience + 5 * items.length + (S.hype > 0 ? 4 : 0)) * G.CTYPE[type].pat;
    // 七成是那四位常客，其余仍是随机路人，免得看腻
    var look = special ? randomLook()
      : Math.random() < 0.7 ? G.faceLook(G.pick(G.FACES)) : randomLook();
    var c = {
      seed: Math.random() * 10,
      type: type, items: items, pmax: pat, patience: pat,
      life: 0, state: 'wait', anim: 0, inT: 0, say: null, sayT: 0,
      special: special, specialTag: special ? G.SPECIAL[special].tag : null,
      scene: S.scene ? S.scene.id : 'institute',
      weather: S.weather ? S.weather.id : 'clear',
      progressReliefUsed: 0,
      takeout: false, patRate: 1
    };
    for (var lk in look) c[lk] = look[lk];
    // 常客脾气层（js/regulars.js，可选）：可以改单、改耐心、给专属口头禅
    if (G.Regulars && G.Regulars.decorate) G.Regulars.decorate(c, S.day, G.CFG);
    if (special) c.preferenceId = G.SPECIAL[special].pref;
    stampPreference(c);
    if (c.preference && !c.faceId && !special)
      cheer('firstPreference', G.preferenceHint(c.preference,
        G.preferenceDepthForDay ? G.preferenceDepthForDay(S.day) : 3), G.SLOT[k].cx, 112,
        c.preference.col || '#D2660A', 14);
    if (S.scene && S.scene.patMul !== 1) {
      c.pmax *= S.scene.patMul; c.patience *= S.scene.patMul;
    }
    if (special && G.SPECIAL[special].patMul) {
      c.pmax *= G.SPECIAL[special].patMul; c.patience *= G.SPECIAL[special].patMul;
    }
    if (special && G.SPECIAL[special].patRate) c.patRate = G.SPECIAL[special].patRate;
    if (special && G.SPECIAL[special].tipBonus) c.specialTip = G.SPECIAL[special].tipBonus;
    if (special && G.specialPatienceFloorForDay) {
      var floor = G.specialPatienceFloorForDay(S.day, special);
      if (floor > 0 && c.pmax < floor) {
        c.pmax = floor; c.patience = floor;
      }
    }
    if (!special && S.weather && S.weather.takeout > 0 &&
        Math.random() < Math.min(0.85, S.weather.takeout + (S.scene ? S.scene.takeout : 0)))
      c.takeout = true;
    maybeSecret(c, S.day);
    tagRecipe(c);
    if (special && G.SPECIAL[special].bit) {
      specialFirst = !(S.specialMask & G.SPECIAL[special].bit);
      S.specialMask |= G.SPECIAL[special].bit;
    }
    // 手账要记常客出勤。路人身上没有 faceId，arrive 自己会丢掉，这边不用判断
    if (G.Goals && G.Goals.arrive) G.Goals.arrive(c.faceId, S.day);
    S.cust[k] = c;
    if (special && specialFirst) {
      var introText = special === 'blogger' ? '网红来了 · 先看超大份' :
        special === 'driver' ? '赶车客来了 · 先救这一位' :
        special === 'picky' ? '挑剔老陕来了 · 先看酥与烂' :
        special === 'foodie' ? '美食家来了 · 先看肥瘦火候' :
        '卫生抽检来了 · 先看台面';
      cheer('specialIntro' + special, introText, G.SLOT[k].cx, 112,
        G.SPECIAL[special].col || '#8B4B72', 14);
    }
    if (!special && c.faceId && G.Regulars && G.Regulars.TRAIT &&
        G.Regulars.TRAIT[c.faceId] && G.regularHint) {
      var regularHint = G.regularHint(c.faceId);
      if (regularHint)
        cheer('regularIntro' + c.faceId, regularHint, G.SLOT[k].cx, 112,
          '#B07800', 14);
    }
    if (fromHold) {
      S.queueHoldT = 0; S.queueHoldNotice = 0;
      cheer('queueCatch', '回流客接住了！先做这位', G.SLOT[k].cx, 112,
        '#357A38', 16);
    }
    // 常客每次进门都说自己的口头禅（口头禅是辨识度的一半），但同一时刻
