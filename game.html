     但沿着同一条参数路径可以连续变形；数学梗因此落在馍胚的视觉变化上，
     而不是只飘在台词里。 */
  function comicBunForm(ctx, x, y, w, h, formula, anim) {
    ctx.fillStyle = '#EED9A9'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.globalAlpha = 0.30; ctx.strokeStyle = '#A87D4C'; ctx.lineWidth = 1;
    for (var gx = x + 12; gx < x + w; gx += 22) {
      ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke();
    }
    for (var gy = y + 12; gy < y + h; gy += 18) {
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
    }
    ctx.restore();
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '[馍] / ≈', x + w / 2, y + 25,
      { size: 11, col: '#F3E7C7', weight: 900 });
    var cy = y + h * 0.62, xs = [x + w * 0.24, x + w * 0.50, x + w * 0.76];
    var tones = [0.45, 0.72, 0.88], scales = [0.34, 0.34, 0.36];
    for (var i = 0; i < xs.length; i++) {
      var wob = i === 2 ? Math.sin((anim || 0) * 2) * 0.025 : 0;
      if (G.Art && G.Art.bun) G.Art.bun(ctx, xs[i], cy + wob, scales[i], tones[i], false);
      else G.circle(ctx, xs[i], cy + wob, 13, '#D8933A', 2, G.PAL.ink);
    }
    ctx.save(); ctx.strokeStyle = '#9A4D35'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xs[0] + 18, cy); ctx.lineTo(xs[1] - 18, cy);
    ctx.moveTo(xs[1] + 18, cy); ctx.lineTo(xs[2] - 18, cy); ctx.stroke();
    ctx.restore();
    G.text(ctx, 'e=0', xs[0], cy + 34, { size: 8, col: G.PAL.inkSoft, weight: 800 });
    G.text(ctx, 'e=.4', xs[1], cy + 34, { size: 8, col: G.PAL.inkSoft, weight: 800 });
    G.text(ctx, '虎背', xs[2], cy + 34, { size: 8, col: G.PAL.meatDark, weight: 800 });
    comicStudent(ctx, x + w * 0.84, y + h + 3, 0.43, -0.06);
  }

  /* 同胚番外专用：左右两只形状不同的馍，用一条不撕裂的连续路径连起。
     画面只保留“形状可以变、洞不能凭空消失”的直觉，让高阶概念成为
     一眼能读懂的漫画动作，而不是又一块只写公式的黑板。 */
  function comicIsomorph(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#DCE9D6'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.globalAlpha = 0.24; ctx.strokeStyle = '#6F9068'; ctx.lineWidth = 1;
    for (var gx = x + 12; gx < x + w; gx += 24) {
      ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke();
    }
    for (var gy = y + 12; gy < y + h; gy += 18) {
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
    }
    ctx.restore();
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '馍₁ ≅ 馍₂', x + w / 2, y + 25,
      { size: 11, col: '#F3E7C7', weight: 900 });

    var cy = y + h * 0.60, left = x + w * 0.24, right = x + w * 0.76;
    function bunShape(cx, stretch, tilt, tone) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
      ctx.beginPath(); ctx.ellipse(0, 0, 27 * stretch, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = tone; ctx.fill(); G.shape(ctx, null, 2.4, G.PAL.ink);
      ctx.beginPath(); ctx.ellipse(0, 0, 20 * stretch, 12, 0, 0, Math.PI * 2);
      G.shape(ctx, null, 1.5, '#A56B2C');
      for (var ri = 0; ri < 3; ri++) {
        ctx.beginPath();
        ctx.moveTo((-10 + ri * 8) * stretch, -4);
        ctx.quadraticCurveTo((-5 + ri * 8) * stretch, 4,
          (-1 + ri * 8) * stretch, 8);
        G.shape(ctx, null, 1.2, '#9B5A24');
      }
      ctx.restore();
    }
    bunShape(left, 0.82, -0.12, '#EFCB8C');
    bunShape(right, 1.16 + Math.sin(a * 1.4) * 0.025, 0.10, '#D8933A');

    ctx.save(); ctx.strokeStyle = '#9A4D35'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left + 35, cy - 3); ctx.quadraticCurveTo(x + w / 2, cy - 28,
      right - 35, cy - 3); ctx.stroke();
    ctx.restore();
    G.text(ctx, '连续变形', x + w / 2, cy - 30,
      { size: 8, col: G.PAL.meatDark, weight: 900 });
    G.text(ctx, '不撕裂 · 不丢洞', x + w / 2, cy + 34,
      { size: 8, col: G.PAL.inkSoft, weight: 800 });
    comicStudent(ctx, x + w * 0.86, y + h + 3, 0.42, -0.05);
  }

  /* 热方程番外专用：把炉内温度从边缘向中心扩散画成四个火候节点。
     面板很矮时仍保留“未熟 → 软糯 → 酥脆 → 焦黑”的顺序，让玩家把
     抽象的初值 / 边界条件直接联想到烤馍的取出时机。 */
  function comicHeat(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#F2D0A1'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '∂T/∂t = κΔT', x + w / 2, y + 25,
      { size: 11, col: '#F3E7C7', weight: 900 });

    var ovenY = y + h * 0.58, ox = x + 17, ow = w - 34;
    G.box(ctx, ox, ovenY, ow, 25, 5, '#63382A', 2, G.PAL.ink);
    ctx.save(); ctx.globalAlpha = 0.78;
    for (var fi = 0; fi < 9; fi++) {
      var fx = ox + 12 + fi * (ow - 24) / 8;
      var fh = 4 + (fi % 3) * 2 + Math.sin(a * 3 + fi) * 1.5;
      ctx.beginPath(); ctx.moveTo(fx, ovenY + 21);
      ctx.quadraticCurveTo(fx - 3, ovenY + 13 - fh, fx + 2, ovenY + 7);
      ctx.quadraticCurveTo(fx + 7, ovenY + 14 - fh, fx + 4, ovenY + 21);
      G.shape(ctx, fi % 2 ? '#F2A23A' : '#E05331', 1, '#F8D77B');
    }
    ctx.restore();

    var labels = ['未熟', '软糯', '酥脆', '焦黑'];
    var tones = [0.08, 0.38, 0.72, 1.0];
    for (var si = 0; si < labels.length; si++) {
      var sx = x + 27 + si * (w - 54) / 3;
      if (G.Art && G.Art.bun)
        G.Art.bun(ctx, sx, ovenY - 10, 0.23, tones[si], si === 3);
      else G.circle(ctx, sx, ovenY - 10, 9, si === 3 ? '#4A2B20' : '#D8933A', 1.5, G.PAL.ink);
      G.text(ctx, labels[si], sx, y + h - 7,
        { size: 7.5, col: si === 3 ? '#8B3D2B' : G.PAL.meatDark, weight: 900 });
      if (si < labels.length - 1) {
        ctx.beginPath(); ctx.moveTo(sx + 14, ovenY - 10);
        ctx.lineTo(sx + (w - 54) / 3 - 14, ovenY - 10);
        G.shape(ctx, null, 1.5, '#A85A32');
      }
    }
    G.text(ctx, '热从边界向中心扩散', x + w / 2, y + h * 0.43,
      { size: 8, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.88, y + h + 3, 0.40, -0.05);
  }

  /* 变分法番外专用：把馍面画成一张有曲率的曲面，网格沿着表面弯曲，
     中间的馍像一个“能量最低但仍保留层次”的极值。这样“最小曲率 /
     欧拉—拉格朗日”不是又一块黑板，而是能直接看见的馍胚动作。 */
  function comicSurface(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#E4DED5'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'δ∫κ²dA=0', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var cy = y + h * 0.61, left = x + 18, right = x + w - 18;
    ctx.beginPath();
    ctx.moveTo(left, cy + 7);
    ctx.quadraticCurveTo(x + w * 0.30, cy - 19, x + w * 0.50, cy - 4);
    ctx.quadraticCurveTo(x + w * 0.70, cy - 19, right, cy + 7);
    ctx.lineTo(right, cy + 18); ctx.lineTo(left, cy + 18); ctx.closePath();
    G.shape(ctx, '#D8933A', 2.2, G.PAL.ink);

    /* 沿曲面走的横向等高线：曲率大处线条更密，动态只给一点呼吸感。 */
    ctx.save(); ctx.globalAlpha = 0.68; ctx.strokeStyle = '#9B5A24'; ctx.lineWidth = 1.15;
    for (var row = 0; row < 4; row++) {
      var yy = cy + 3 + row * 4;
      ctx.beginPath();
      for (var col = 0; col <= 18; col++) {
        var t = col / 18, px = left + (right - left) * t;
        var bump = (1 - Math.abs(t - 0.5) * 1.65) * (10 - row * 1.4);
        var py = yy - Math.max(0, bump) + Math.sin(a * 1.2 + col * 0.45) * 0.35;
        if (!col) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.strokeStyle = 'rgba(255,248,236,.75)'; ctx.lineWidth = 1;
    for (var mesh = 0; mesh < 5; mesh++) {
      var mx = left + 18 + mesh * ((right - left - 36) / 4);
      ctx.beginPath(); ctx.moveTo(mx, cy + 12);
      ctx.quadraticCurveTo(mx + (x + w * 0.5 - mx) * 0.18, cy - 14, mx + 2, cy - 2);
      ctx.stroke();
    }
    ctx.restore();

    /* 顶点法线与“极值”标记，给读者一个最小曲率的视觉锚点。 */
    ctx.beginPath(); ctx.moveTo(x + w * 0.50, cy - 5);
    ctx.lineTo(x + w * 0.50, cy - 24);
    G.shape(ctx, null, 2, '#C94032');
    ctx.beginPath(); ctx.moveTo(x + w * 0.50, cy - 24);
    ctx.lineTo(x + w * 0.50 - 4, cy - 17); ctx.lineTo(x + w * 0.50 + 4, cy - 17);
    ctx.closePath(); G.shape(ctx, '#C94032', 1, '#9A4D35');
    G.text(ctx, 'κ', x + w * 0.50 + 10, cy - 23,
      { size: 10, col: '#9A4D35', weight: 900 });
    G.text(ctx, '极值面', x + w * 0.24, y + h - 8,
      { size: 8, col: '#8B5A2B', weight: 900 });
    G.text(ctx, '层次保留', x + w * 0.76, y + h - 8,
      { size: 8, col: G.PAL.meatDark, weight: 900 });
    comicStudent(ctx, x + w * 0.90, y + h + 3, 0.39, -0.05);
  }

  /* 曲率番外专用：把馍面的一点放大成“切空间 + 法向量”的漫画草图。
     这里不追求把微分几何画成教科书，而是让读者看见三个层次：馍面在
     局部可以用平面近似，法向量能提示卤汁往哪里走，整体起伏又不能被
     这张切平面抹掉。这样“微分几何切香菜”终于同时有笑点和动作。 */
  function comicCurvature(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#DDE9E7'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'TₚM + nₚ → 一口', x + w / 2, y + 25,
      { size: compact ? 9.2 : 10.5, col: '#F3E7C7', weight: 900 });

    var left = x + 17, right = x + w - 17;
    var cy = y + h * (compact ? 0.64 : 0.61);
    var arch = h * (compact ? 0.14 : 0.20);
    ctx.beginPath();
    ctx.moveTo(left, cy + 8);
    ctx.quadraticCurveTo(x + w * 0.28, cy - arch, x + w * 0.50, cy - arch * 0.32);
    ctx.quadraticCurveTo(x + w * 0.72, cy - arch, right, cy + 8);
    ctx.lineTo(right, cy + 18); ctx.lineTo(left, cy + 18); ctx.closePath();
    G.shape(ctx, '#D8933A', 2, G.PAL.ink);

    ctx.save(); ctx.globalAlpha = 0.74; ctx.strokeStyle = '#9B5A24'; ctx.lineWidth = 1;
    for (var row = 0; row < 3; row++) {
      ctx.beginPath();
      for (var col = 0; col <= 16; col++) {
        var t = col / 16, px = left + (right - left) * t;
        var hump = Math.max(0, 1 - Math.abs(t - 0.5) * 1.8) * (arch - row * 2.1);
        var py = cy + 5 + row * 4 - hump + Math.sin(a * 1.2 + col * 0.55) * 0.22;
        if (!col) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();

    var px = x + w * 0.53, py = cy - arch * 0.44;
    ctx.save(); ctx.setLineDash([3, 2]);
    ctx.beginPath(); ctx.moveTo(px - w * 0.18, py + 4); ctx.lineTo(px + w * 0.22, py + 4);
    ctx.moveTo(px - w * 0.13, py - 9); ctx.lineTo(px + w * 0.16, py - 9);
    G.shape(ctx, null, 1.5, '#4E8592'); ctx.setLineDash([]); ctx.restore();
    G.circle(ctx, px, py, 4.5, '#C94032', 1.5, G.PAL.ink);
    G.text(ctx, 'p', px + 8, py - 4, { size: 9, col: '#9A4D35', weight: 900 });
    G.text(ctx, compact ? '切空间' : 'TₚM · 切空间', px - w * 0.05, py - 14,
      { size: compact ? 7 : 8, col: '#357A76', weight: 900 });

    var pulse = 0.8 + 0.2 * Math.sin(a * 3);
    ctx.beginPath(); ctx.moveTo(px, py - 2); ctx.lineTo(px + w * 0.02, py - h * 0.20 * pulse);
    G.shape(ctx, null, 2, '#C94032');
    ctx.beginPath(); ctx.moveTo(px + w * 0.02, py - h * 0.20 * pulse);
    ctx.lineTo(px - 2, py - h * 0.20 * pulse + 6);
    ctx.lineTo(px + 5, py - h * 0.20 * pulse + 5);
    ctx.closePath(); G.shape(ctx, '#C94032', 1, '#9A4D35');
    G.text(ctx, 'nₚ', px + w * 0.04, py - h * 0.18,
      { size: compact ? 7 : 8, col: '#9A4D35', weight: 900 });
    G.text(ctx, '起伏保留 · 卤汁不逃', x + w * 0.50, y + h - 8,
      { size: compact ? 7 : 8, col: '#357A76', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, compact ? 0.35 : 0.39, -0.05);
  }

  /* 谱几何番外专用：左边是一只被轻敲的馍，右边把回声画成波形和特征峰。
     画面刻意保留“能辨形、不能代替试吃”的反差：频谱是可重复的观测，
     卤汁方向和顾客满意度仍然需要另一组数据。 */
  function comicSpectral(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E4EBF0'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'Δ馍 φ = λφ', x + w / 2, y + 25,
      { size: compact ? 9.4 : 10.5, col: '#F3E7C7', weight: 900 });

    var base = y + h - (compact ? 22 : 25);
    var bunX = x + w * 0.16, bunY = base - (compact ? 8 : 10);
    if (G.Art && G.Art.roujiamo)
      G.Art.roujiamo(ctx, bunX, bunY, compact ? 0.32 : 0.40, false);
    G.text(ctx, compact ? '敲' : '轻敲', bunX, base + 12,
      { size: compact ? 7 : 8, col: '#8B5A2B', weight: 900 });

    var left = x + w * 0.29, right = x + w - 16;
    var mid = y + h * (compact ? 0.63 : 0.60);
    ctx.save(); ctx.globalAlpha = 0.30; ctx.strokeStyle = '#78909C'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(left, mid); ctx.lineTo(right, mid); ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    for (var i = 0; i <= 22; i++) {
      var u = i / 22, wx = left + (right - left) * u;
      var wy = mid + Math.sin(u * Math.PI * 5.5 + a * 5) * (compact ? 3.2 : 4.8) *
        (0.45 + 0.55 * Math.sin(u * Math.PI));
      if (!i) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    G.shape(ctx, null, 2.2, '#397A91');

    var barLeft = x + w * 0.37, barW = Math.max(4, (w * 0.55) / 8 - 3);
    for (var b = 0; b < 8; b++) {
      var wave = 0.34 + 0.58 * Math.abs(Math.sin(b * 1.37 + 0.5));
      var bh = (compact ? 13 : 18) * wave;
      var bx = barLeft + b * (barW + 3);
      G.box(ctx, bx, base - bh, barW, bh, 2,
        b === 2 || b === 5 ? '#D2660A' : '#6D9EAE', 1, G.PAL.ink);
    }
    G.text(ctx, 'λ₁   λ₂   λ₃', x + w * 0.66, base + 12,
      { size: compact ? 7 : 8, col: '#55717A', weight: 900 });
    G.text(ctx, compact ? '形状可听 · 味道要尝' : '形状可听见 · 味道仍要尝',
      x + w * 0.58, y + h - 8,
      { size: compact ? 7 : 8, col: '#357A76', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, compact ? 0.35 : 0.39, -0.05);
  }

  /* 反馈控制番外专用：把“看温度 → 调火 → 再看一次”画成一条闭环。
     画面故意把传感器、控制器和炉子放在同一条边上，下面再回一条线，
     让读者看见控制不是神谕，而是每一锅都要重新观测的动作。 */
  function comicControl(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E9E4D7'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '观测 → 调节 → 复检', x + w / 2, y + 25,
      { size: compact ? 9.1 : 10.3, col: '#F3E7C7', weight: 900 });

    var lineY = y + h - (compact ? 13 : 17);
    var sensorX = x + w * 0.17, controlX = x + w * 0.48, ovenX = x + w * 0.80;
    var boxH = compact ? 12 : 15;
    var boxW = compact ? 35 : 43;
    var arrowCol = '#8C6A42';
    G.circle(ctx, sensorX, lineY, compact ? 7 : 9, '#7EA9A1', 1.5, G.PAL.ink);
    G.text(ctx, '测', sensorX, lineY + 3, { size: compact ? 7 : 8, col: '#F5F0DE', weight: 900 });
    G.text(ctx, '观测', sensorX, lineY + (compact ? 14 : 17),
      { size: compact ? 6.5 : 7.5, col: '#357A76', weight: 900 });

    G.box(ctx, controlX - boxW / 2, lineY - boxH / 2, boxW, boxH, 3,
      '#F2C66D', 1.5, G.PAL.ink);
    G.text(ctx, '调火', controlX, lineY + 3,
      { size: compact ? 7 : 8, col: '#6B431C', weight: 900 });

    G.box(ctx, ovenX - boxW / 2, lineY - boxH / 2, boxW, boxH, 3,
      '#B96235', 1.5, G.PAL.ink);
    if (G.Art && G.Art.bun)
      G.Art.bun(ctx, ovenX, lineY - (compact ? 7 : 9), compact ? 0.20 : 0.25,
        0.56 + 0.08 * Math.sin(a * 2), false);
    G.text(ctx, '炉内', ovenX, lineY + (compact ? 14 : 17),
      { size: compact ? 6.5 : 7.5, col: '#8B4B39', weight: 900 });

    ctx.save(); ctx.strokeStyle = arrowCol; ctx.lineWidth = compact ? 1.2 : 1.5;
    ctx.beginPath(); ctx.moveTo(sensorX + 10, lineY); ctx.lineTo(controlX - boxW / 2 - 5, lineY);
    ctx.moveTo(controlX + boxW / 2 + 5, lineY); ctx.lineTo(ovenX - boxW / 2 - 5, lineY);
    ctx.moveTo(ovenX, lineY + (compact ? 9 : 11));
    ctx.quadraticCurveTo(ovenX, y + h - 1, sensorX, y + h - 1);
    ctx.stroke(); ctx.restore();
    ctx.beginPath();
    ctx.moveTo(controlX - boxW / 2 - 5, lineY); ctx.lineTo(controlX - boxW / 2 - 10, lineY - 3);
    ctx.lineTo(controlX - boxW / 2 - 10, lineY + 3); ctx.closePath();
    G.shape(ctx, arrowCol, 1, arrowCol);
    ctx.beginPath();
    ctx.moveTo(ovenX - boxW / 2 - 5, lineY); ctx.lineTo(ovenX - boxW / 2 - 10, lineY - 3);
    ctx.lineTo(ovenX - boxW / 2 - 10, lineY + 3); ctx.closePath();
    G.shape(ctx, arrowCol, 1, arrowCol);

    var pulse = 0.5 + 0.5 * Math.sin(a * 3.2);
    G.circle(ctx, x + w * 0.50, y + (compact ? 43 : 46), compact ? 2.4 : 3.2,
      pulse > 0.5 ? '#3C8A55' : '#C94032', 1, G.PAL.ink);
    G.text(ctx, compact ? '有误差就回看' : '误差回来 · 再观测', x + w * 0.50,
      y + h - 2, { size: compact ? 6.3 : 7.2, col: '#7A5A35', weight: 900 });
    comicStudent(ctx, x + w * 0.93, y + h + 3, compact ? 0.34 : 0.39, -0.05);
  }

  /* 人在回路番外专用：AI 的方框只负责给出箭头，真正的回路由顾客的
     反馈和摊主的判断闭合。画面保留一个会被掰开的馍，提醒“责任”不是
     把模型换成更大的模型，而是有人愿意对这一口再看一遍。 */
  function comicHuman(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E4E8DD'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '建议 + 判断 + 负责', x + w / 2, y + 25,
      { size: compact ? 9.1 : 10.3, col: '#F3E7C7', weight: 900 });

    var lineY = y + h - (compact ? 13 : 17);
    var aiX = x + w * 0.19, bunX = x + w * 0.50, personX = x + w * 0.81;
    var bw = compact ? 35 : 43, bh = compact ? 13 : 16;
    G.box(ctx, aiX - bw / 2, lineY - bh / 2, bw, bh, 3, '#7897AC', 1.5, G.PAL.ink);
    G.text(ctx, 'AI', aiX, lineY + 3, { size: compact ? 7 : 8, col: '#F4F0DA', weight: 900 });
    G.text(ctx, '建议', aiX, lineY + (compact ? 14 : 17),
      { size: compact ? 6.5 : 7.5, col: '#496D80', weight: 900 });

    if (G.Art && G.Art.roujiamo)
      G.Art.roujiamo(ctx, bunX, lineY - (compact ? 7 : 9), compact ? 0.30 : 0.38, false);
    G.circle(ctx, bunX, lineY + (compact ? 7 : 9), compact ? 2.5 : 3.3,
      Math.sin(a * 2.8) > 0 ? '#D2660A' : '#3C8A55', 1, G.PAL.ink);
    G.text(ctx, '一口', bunX, lineY + (compact ? 14 : 17),
      { size: compact ? 6.5 : 7.5, col: '#8B5A2B', weight: 900 });

    /* 用一个简化的人形表示“最终判断”——不要把头像塞进小图，保留
       手绘圆头和举起的手，读者一眼能看出箭头最终落在谁身上。 */
    G.circle(ctx, personX, lineY - (compact ? 6 : 8), compact ? 5 : 6.5,
      '#E6B27A', 1.2, G.PAL.ink);
    ctx.beginPath(); ctx.moveTo(personX - (compact ? 6 : 8), lineY + (compact ? 9 : 12));
    ctx.quadraticCurveTo(personX, lineY + (compact ? 2 : 3),
      personX + (compact ? 6 : 8), lineY + (compact ? 9 : 12));
    G.shape(ctx, '#557A62', 1.5, G.PAL.ink);
    G.text(ctx, '人', personX, lineY + (compact ? 18 : 22),
      { size: compact ? 6.5 : 7.5, col: '#45634C', weight: 900 });

    ctx.save(); ctx.strokeStyle = '#8C6A42'; ctx.lineWidth = compact ? 1.2 : 1.5;
    ctx.beginPath();
    ctx.moveTo(aiX + bw / 2 + 4, lineY); ctx.lineTo(bunX - 18, lineY);
    ctx.moveTo(bunX + 18, lineY); ctx.lineTo(personX - 14, lineY);
    ctx.moveTo(personX, lineY + (compact ? 12 : 15));
    ctx.quadraticCurveTo(personX, y + h - 1, aiX, y + h - 1);
    ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(bunX - 18, lineY);
    ctx.lineTo(bunX - 23, lineY - 3); ctx.lineTo(bunX - 23, lineY + 3); ctx.closePath();
    G.shape(ctx, '#8C6A42', 1, '#8C6A42');
    ctx.beginPath(); ctx.moveTo(personX - 14, lineY);
    ctx.lineTo(personX - 19, lineY - 3); ctx.lineTo(personX - 19, lineY + 3); ctx.closePath();
    G.shape(ctx, '#8C6A42', 1, '#8C6A42');
    G.text(ctx, compact ? '反馈回来' : '顾客反馈回来', x + w * 0.50, y + h - 2,
      { size: compact ? 6.3 : 7.2, col: '#7A5A35', weight: 900 });
    comicStudent(ctx, x + w * 0.95, y + h + 3, compact ? 0.33 : 0.38, -0.05);
  }

  /* 分岔番外专用：一条主支在临界点分成“软 / 酥”两条稳定支路，
     把相变和馍形式的选择画成读者一眼能看懂的曲线。曲线仍留出一只
     小馍和“复检”字样，提醒这不是把顾客偏好简化成一张数学图。 */
  function comicBifurcation(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E8E2D4'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'xₙ₊₁=fμ(xₙ)', x + w / 2, y + 25,
      { size: compact ? 9.0 : 10.2, col: '#F3E7C7', weight: 900 });

    var left = x + 22, right = x + w - 18;
    var top = y + (compact ? 43 : 47);
    var base = y + h - (compact ? 22 : 27);
    var splitX = x + w * 0.47;
    var splitY = base - (compact ? 13 : 18);
    ctx.save(); ctx.globalAlpha = 0.46; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(left, base); ctx.lineTo(right, base);
    ctx.moveTo(left, base); ctx.lineTo(left, top); G.shape(ctx, null, 1.2, '#65716E');
    ctx.setLineDash([]); ctx.restore();
    G.text(ctx, '参数 μ', right - 4, base + (compact ? 10 : 13),
      { size: compact ? 6.5 : 7.5, col: '#55717A', weight: 900, align: 'right' });
    G.text(ctx, '口感', left - 2, top - 4,
      { size: compact ? 6.5 : 7.5, col: '#55717A', weight: 900, align: 'left' });

    /* 临界点左侧仍是一条支，右侧用两条平滑曲线分开；不画尖角，
       让“连续改变参数、突然出现选择”的相变关系更直观。 */
    ctx.beginPath(); ctx.moveTo(left, splitY);
    ctx.quadraticCurveTo(x + w * 0.31, splitY - 1, splitX, splitY);
    G.shape(ctx, null, compact ? 2.0 : 2.5, '#8A6A45');
    ctx.beginPath(); ctx.moveTo(splitX, splitY);
    ctx.bezierCurveTo(x + w * 0.60, splitY - 2, x + w * 0.68, top + 5, right, top + 8);
    G.shape(ctx, null, compact ? 2.0 : 2.5, '#C94032');
    ctx.beginPath(); ctx.moveTo(splitX, splitY);
    ctx.bezierCurveTo(x + w * 0.60, splitY + 2, x + w * 0.68, base - 4, right, base - 5);
    G.shape(ctx, null, compact ? 2.0 : 2.5, '#357A38');

    var pulse = 0.5 + 0.5 * Math.sin(a * 3.2);
    G.circle(ctx, splitX, splitY, compact ? 4 : 5, pulse > 0.5 ? '#F0B84F' : '#C94032',
      1.5, G.PAL.ink);
    G.text(ctx, 'μc', splitX + 6, splitY - (compact ? 7 : 9),
      { size: compact ? 7 : 8, col: '#9A4D35', weight: 900 });

    var travel = 0.28 + 0.12 * Math.sin(a * 1.5);
    var dx = splitX + (right - splitX) * travel;
    var upY = splitY - (compact ? 9 : 14) - travel * (splitY - top - 4);
    var lowY = splitY + (compact ? 9 : 14) + travel * (base - splitY - 5);
    G.circle(ctx, dx, upY, compact ? 3 : 4, '#D8933A', 1, G.PAL.ink);
    G.circle(ctx, dx, lowY, compact ? 3 : 4, '#6DA878', 1, G.PAL.ink);
    G.text(ctx, compact ? '酥' : '酥脆分支', right - 6, top + (compact ? 2 : 5),
      { size: compact ? 7 : 8, col: '#C94032', weight: 900, align: 'right' });
    G.text(ctx, compact ? '软' : '软糯分支', right - 6, base - (compact ? 3 : 5),
      { size: compact ? 7 : 8, col: '#357A38', weight: 900, align: 'right' });

    if (G.Art && G.Art.bun) {
      G.Art.bun(ctx, x + w * 0.18, y + h * 0.68,
        compact ? 0.18 : 0.23, 0.58 + 0.04 * Math.sin(a * 2), false);
      G.text(ctx, compact ? '馍' : '同一块馍', x + w * 0.18, y + h - 7,
        { size: compact ? 6.5 : 7.5, col: '#8B5A2B', weight: 900 });
    }
    G.text(ctx, compact ? '分支要复检' : '分支不同 · 都要复检', x + w * 0.57, y + h - 7,
      { size: compact ? 6.8 : 7.8, col: '#7A5A35', weight: 900 });
    comicStudent(ctx, x + w * 0.94, y + h + 3, compact ? 0.33 : 0.38, -0.05);
  }

  /* 纤维丛番外专用：把“同一张馍上长出不同口感”画成底空间 B 与
     纤维 F 的投影。彩色曲线不是装饰，它们分别对应肥瘦、卤汁、火候
     和酥脆；最后汇到纸面，提醒读者抽象结构仍要经过具体动作。 */
  function comicFiber(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E5E4D8'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'π:E→B', x + w / 2, y + 25,
      { size: compact ? 9.0 : 10.2, col: '#F3E7C7', weight: 900 });

    var baseX = x + w * 0.30, baseY = y + h * 0.77;
    var topY = y + (compact ? 48 : 52);
    var colors = ['#A34A24', '#D2660A', '#6F963E', '#C94032'];
    var labels = ['肥瘦', '卤汁', '火候', '酥脆'];
    /* 先画底空间：同一只馍的外形固定，口感的差异沿纤维向上展开。 */
    ctx.save(); ctx.translate(baseX, baseY); ctx.scale(1, 0.58);
    G.circle(ctx, 0, 0, compact ? 25 : 31, '#D8933A', 2.3, G.PAL.ink);
    G.circle(ctx, -3, -3, compact ? 17 : 22, '#B96A36', 1.2, '#9A4D35');
    ctx.restore();
    G.text(ctx, compact ? 'B' : '底空间 B', baseX, baseY + (compact ? 8 : 11),
      { size: compact ? 8 : 9, col: G.PAL.cream, weight: 900 });

    var fiberTop = [];
    for (var i = 0; i < 4; i++) {
      var startX = baseX - (compact ? 15 : 20) + i * (compact ? 10 : 13);
      var endX = x + w * 0.63 + (i - 1.5) * (compact ? 8 : 12);
      var endY = topY + (i % 2) * (compact ? 8 : 12) + Math.sin(a * 1.7 + i) * 2;
      ctx.beginPath(); ctx.moveTo(startX, baseY - (compact ? 11 : 15));
      ctx.bezierCurveTo(baseX + (i - 1.5) * 9, baseY - h * 0.30,
        endX - (i - 1.5) * 7, endY + h * 0.16, endX, endY);
      G.shape(ctx, null, compact ? 1.8 : 2.3, colors[i]);
      G.circle(ctx, endX, endY, compact ? 3 : 4, colors[i], 1.2, G.PAL.ink);
      fiberTop.push({ x: endX, y: endY });
      G.text(ctx, compact ? labels[i].slice(0, 1) : labels[i], endX + 5, endY - 3,
        { size: compact ? 6.2 : 7.2, col: colors[i], weight: 900 });
    }

    /* 投影箭头：纤维不是离开底空间的另一道答案，而是回到同一张纸的
       不同截面；小箭头在动画中轻微移动，给静态数学图一点日漫活气。 */
    var paperX = x + w * 0.77, paperY = y + h * 0.73;
    G.box(ctx, paperX - (compact ? 23 : 29), paperY - (compact ? 10 : 13),
      compact ? 46 : 58, compact ? 18 : 22, 4, '#F7EEDB', 1.5, '#B99B72');
    G.text(ctx, compact ? '复检' : '开馍复检', paperX, paperY + 4,
      { size: compact ? 7 : 8, col: '#8B5A2B', weight: 900 });
    for (var j = 0; j < fiberTop.length; j++) {
      var fx = fiberTop[j].x, fy = fiberTop[j].y;
      var tx = paperX - (compact ? 22 : 28), ty = paperY - 2 + (j - 1.5) * 3;
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty);
      G.shape(ctx, null, 1.1, '#7A6A58');
    }
    G.text(ctx, compact ? 'F' : '纤维 F', x + w * 0.55, y + h - 7,
      { size: compact ? 7 : 8, col: '#55717A', weight: 900 });
    comicStudent(ctx, x + w * 0.94, y + h + 3, compact ? 0.33 : 0.38, -0.05);
  }

  /* 单位分解番外专用：把一只馍分成四个互相重叠的局部区域，再把每块
     区域连到一张小小的交接卡。透明色块的重叠对应 Σφᵢ=1，右侧卡片
     对应“局部经验”，底部的馍则提醒读者：拼接的是流程，不是把口味
     粗暴平均。 */
  function comicPartition(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E8DED2'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'Σφᵢ(x)=1', x + w / 2, y + 25,
      { size: compact ? 8.8 : 10.2, col: '#F3E7C7', weight: 900 });

    var bx = x + w * 0.29, by = y + h * 0.69;
    var rx = compact ? 26 : 35, ry = compact ? 16 : 22;
    var cols = ['rgba(163,74,36,.64)', 'rgba(210,102,10,.58)',
      'rgba(91,139,67,.58)', 'rgba(74,116,157,.55)'];
    var labels = ['φ₁肥', 'φ₂汁', 'φ₃火', 'φ₄酥'];
    ctx.save(); ctx.translate(bx, by); ctx.scale(1, 0.62);
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    G.shape(ctx, '#D8933A', 2.2, G.PAL.ink);
    ctx.restore();
    /* 四个局部补丁有意互相压住一点：没有重叠就没有“单位分解”的
       直觉，重叠过大又会把小馍盖满，所以只取约四分之一半径。 */
    var tops = [];
    for (var i = 0; i < 4; i++) {
      var ang = -Math.PI * 0.72 + i * Math.PI * 0.49 + Math.sin(a * 1.3 + i) * 0.015;
      var px = bx + Math.cos(ang) * (compact ? 12 : 17);
      var py = by + Math.sin(ang) * (compact ? 7 : 10);
      ctx.save(); ctx.globalAlpha = 0.76;
      ctx.beginPath(); ctx.ellipse(px, py, compact ? 15 : 20, compact ? 10 : 13,
        ang * 0.18, 0, Math.PI * 2);
      G.shape(ctx, cols[i], 1.1, G.PAL.ink);
      ctx.restore();
      G.text(ctx, compact ? labels[i].slice(0, 2) : labels[i], px, py + 2,
        { size: compact ? 5.4 : 6.5, col: G.PAL.cream, weight: 900 });
      tops.push({ x: px, y: py });
    }
    G.text(ctx, compact ? '局部馍' : '同一只馍 · 局部覆盖', bx, y + h - 4,
      { size: compact ? 6.2 : 7.5, col: '#7A5A35', weight: 900 });

    var cardW = compact ? 26 : 37, cardH = compact ? 10 : 14;
    var cardX = x + w * 0.64, cardY = y + (compact ? 31 : 38);
    for (var ci = 0; ci < 4; ci++) {
      var col = ci % 2, row = Math.floor(ci / 2);
      var cx = cardX + col * (cardW + (compact ? 4 : 6));
      var cy = cardY + row * (cardH + (compact ? 3 : 5));
      G.box(ctx, cx, cy, cardW, cardH, 3, '#FFF5DF', 1.2, cols[ci].replace('rgba', 'rgb').replace(/,[^,]+\)$/, ')'));
      G.text(ctx, compact ? '卡' + (ci + 1) : '局部卡 ' + (ci + 1),
        cx + cardW / 2, cy + cardH / 2 + 2,
        { size: compact ? 5.6 : 6.5, col: '#7A5A35', weight: 900 });
      if (tops[ci]) {
        ctx.beginPath(); ctx.moveTo(tops[ci].x, tops[ci].y);
        ctx.lineTo(cx, cy + cardH / 2);
        G.shape(ctx, null, compact ? 0.8 : 1.0, '#8B766A');
      }
    }
    G.box(ctx, x + w * 0.47, y + h - (compact ? 16 : 20), compact ? 45 : 62,
      compact ? 11 : 15, 3, '#FFF7E4', 1.1, '#9A4D35');
    G.text(ctx, compact ? '重叠也覆盖' : '重叠处也有责任',
      x + w * 0.47 + (compact ? 22.5 : 31), y + h - (compact ? 8 : 9),
      { size: compact ? 5.5 : 6.6, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, compact ? 0.31 : 0.37, -0.05);
  }

  /* 上同调番外专用：把“局部方案能否拼成全局方案”的障碍画成馍边
     上的一圈红色漏汁。左侧是带洞的馍与闭合回路，右侧是三张局部卡
     沿重叠边界传递差值；最后一格虽然写着障碍=0，仍保留开馍复检，
     让抽象的 δ²=0 回到玩家看得见的动作。 */
  function comicHomology(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E7E4DD'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'δ²=0 · H¹(馍)', x + w / 2, y + 25,
      { size: compact ? 9.0 : 10.2, col: '#F3E7C7', weight: 900 });

    var bx = x + w * 0.28, by = y + h * 0.67;
    var rx = compact ? 28 : 37, ry = compact ? 17 : 23;
    ctx.save(); ctx.translate(bx, by); ctx.scale(1, 0.62);
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    G.shape(ctx, '#D8933A', 2.3, G.PAL.ink);
    ctx.restore();
    /* 洞的内圈特意使用纸张色，形成“结构性空缺”的视觉锚点。 */
    G.circle(ctx, bx, by - 2, compact ? 8 : 11, '#7D4630', 1.5, G.PAL.ink);
    G.circle(ctx, bx, by - 3, compact ? 4.5 : 6.5, '#F7EEDB', 1, '#B99B72');
    for (var lr = 0; lr < 3; lr++) {
      ctx.beginPath();
      ctx.moveTo(bx - rx * 0.62, by - 2 + lr * 5);
      ctx.quadraticCurveTo(bx, by - 9 + lr * 4 + Math.sin(a * 1.5 + lr) * 1.3,
        bx + rx * 0.60, by - 3 + lr * 5);
      G.shape(ctx, null, compact ? 1.1 : 1.5, '#A85C2D');
    }
    /* 闭合回路绕洞走一圈，末端的小箭头随着动画轻轻脉动。 */
    var loopR = compact ? 13 : 18, loopY = by - 2;
    ctx.save(); ctx.strokeStyle = '#C94032'; ctx.lineWidth = compact ? 1.8 : 2.4;
    ctx.beginPath();
    ctx.ellipse(bx, loopY, loopR, loopR * 0.66, 0, 0, Math.PI * 2);
    ctx.stroke(); ctx.restore();
    var ang = -0.45 + a * 0.65;
    var ax = bx + Math.cos(ang) * loopR, ay = loopY + Math.sin(ang) * loopR * 0.66;
    var tx = -Math.sin(ang), ty = Math.cos(ang) * 0.66;
    ctx.beginPath(); ctx.moveTo(ax, ay);
    ctx.lineTo(ax - tx * 7 - ty * 3, ay - ty * 7 + tx * 3);
    ctx.lineTo(ax - tx * 7 + ty * 3, ay - ty * 7 - tx * 3);
    ctx.closePath(); G.shape(ctx, '#C94032', 1, G.PAL.ink);
    G.text(ctx, compact ? '洞' : '洞 / 回路', bx, by + ry * 0.88,
      { size: compact ? 7 : 8, col: '#9A4D35', weight: 900 });
    G.text(ctx, compact ? '局部馍' : '局部方案', x + w * 0.28, y + h - 6,
      { size: compact ? 6.5 : 7.5, col: '#7A5A35', weight: 900 });
    /* 馍边漏出的三滴汁，让“障碍”不是只停留在符号上。 */
    for (var dr = 0; dr < 3; dr++) {
      var dx = bx + rx * (0.46 + dr * 0.13), dy = by + 7 + dr * 2;
      G.circle(ctx, dx, dy + Math.sin(a * 2 + dr) * 1.5, compact ? 2.2 : 3,
        '#C94032', 1, G.PAL.ink);
    }

    var cols = ['#C47A37', '#6A9560', '#5A86A0'];
    var labels = compact ? ['卡1', '卡2', '卡3'] : ['局部 1', '重叠', '局部 2'];
    var nx = x + w * 0.64, ny = y + h * 0.49;
    var nodes = [];
    for (var ni = 0; ni < 3; ni++) {
      var n = { x: nx + (ni === 1 ? 0 : (ni === 0 ? -22 : 22)),
        y: ny + (ni === 1 ? 25 : 0) };
      nodes.push(n);
    }
    for (var ei = 0; ei < 3; ei++) {
      var from = nodes[ei], to = nodes[(ei + 1) % 3];
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
      G.shape(ctx, null, compact ? 1.1 : 1.5, '#71818A');
      var mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
      var ddx = to.x - from.x, ddy = to.y - from.y;
      var len = Math.max(1, Math.sqrt(ddx * ddx + ddy * ddy));
      var ux = ddx / len, uy = ddy / len;
      ctx.beginPath(); ctx.moveTo(mx, my);
      ctx.lineTo(mx - ux * 5 - uy * 3, my - uy * 5 + ux * 3);
      ctx.lineTo(mx - ux * 5 + uy * 3, my - uy * 5 - ux * 3);
      ctx.closePath(); G.shape(ctx, '#71818A', 1, G.PAL.ink);
    }
    for (var ni2 = 0; ni2 < nodes.length; ni2++) {
      var pulse = ni2 === 1 ? 0.7 + 0.2 * Math.sin(a * 3) : 0.7;
      ctx.save(); ctx.globalAlpha = pulse;
      G.circle(ctx, nodes[ni2].x, nodes[ni2].y, compact ? 11 : 14,
        cols[ni2], 2, G.PAL.ink); ctx.restore();
      G.text(ctx, labels[ni2], nodes[ni2].x, nodes[ni2].y + 3,
        { size: compact ? 6 : 7, col: G.PAL.cream, weight: 900 });
    }
    G.text(ctx, compact ? 'δ · 交界差' : 'δ：重叠处的味道差', x + w * 0.68, y + h - 17,
      { size: compact ? 6.2 : 7.5, col: '#55717A', weight: 900 });
    G.text(ctx, compact ? '先查洞，再平均' : '障碍不是平均值能抹掉的', x + w * 0.68, y + h - 6,
      { size: compact ? 6.1 : 7.3, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.92, y + h + 3, compact ? 0.31 : 0.36, -0.05);
  }

  /* 张量番外专用：左侧是一只带三条口感轴的馍，右侧是由馍胚与肉法
     交叉出来的小型张量格。彩色格子代表不同组合，动态高亮提醒读者
     “压缩可以省算力，不能删掉顾客明确点的那一格”。 */
  function comicTensor(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 105;
    ctx.fillStyle = '#E4E8E2'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'u⊗v · T_{肥，汁，酥}', x + w / 2, y + 25,
      { size: compact ? 8.8 : 10.1, col: '#F3E7C7', weight: 900 });

    var bx = x + w * 0.25, by = y + h * 0.68;
    var rx = compact ? 27 : 35, ry = compact ? 16 : 21;
    ctx.save(); ctx.translate(bx, by); ctx.scale(1, 0.62);
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    G.shape(ctx, '#D8933A', 2.2, G.PAL.ink);
    ctx.restore();
    for (var li = 0; li < 3; li++) {
      ctx.beginPath();
      ctx.moveTo(bx - rx * 0.62, by - 5 + li * 5);
      ctx.quadraticCurveTo(bx, by - 11 + li * 4 + Math.sin(a * 1.3 + li) * 1.2,
        bx + rx * 0.62, by - 5 + li * 5);
      G.shape(ctx, null, compact ? 1.0 : 1.35,
        li === 0 ? '#A34A24' : li === 1 ? '#D2660A' : '#8B5A2B');
    }
    G.text(ctx, compact ? '馍胚' : '馍胚 u', bx, by + ry * 0.9,
      { size: compact ? 6.4 : 7.8, col: '#7A5A35', weight: 900 });

    /* 三维投影的两张面：横向是肉法，纵向是卤汁 / 火候，格子本身
       仍然是平面图，方便在小屏漫画页上识别。 */
    var gx = x + w * 0.55, gy = y + (compact ? 46 : 49);
    var cell = compact ? 13 : 17, rows = 3, cols = 3;
    var colors = ['#C47A37', '#D2660A', '#6A9560', '#5A86A0', '#C94032'];
    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var xx = gx + col * cell, yy = gy + row * cell;
        var active = (row === 1 && col === 2) || (row === 0 && col === 0);
        var ccol = colors[(row * cols + col) % colors.length];
        ctx.save(); ctx.globalAlpha = active ? 0.92 : 0.62;
        G.box(ctx, xx, yy, cell - 2, cell - 2, 2, ccol,
          active ? 2 : 1, active ? G.PAL.ink : '#7A6A58');
        ctx.restore();
      }
    }
    G.text(ctx, compact ? 'T' : 'T_{肥，汁，酥}', gx + cell * 1.5, gy + rows * cell + 10,
      { size: compact ? 7 : 8, col: '#55717A', weight: 900 });
    G.text(ctx, compact ? '组合' : '每格是一种组合', x + w * 0.71, y + h - 17,
      { size: compact ? 6.3 : 7.4, col: '#357A38', weight: 900 });
    G.text(ctx, compact ? '别只看总分' : '低秩省算力 · 不省点单', x + w * 0.69, y + h - 6,
      { size: compact ? 6.1 : 7.3, col: '#9A4D35', weight: 900 });
    /* 从馍到张量格的两条箭头，轻微脉动表示“组合正在生成”。 */
    for (var ai = 0; ai < 2; ai++) {
      var sy = by - 6 + ai * 11, ex = gx - 4, ey = gy + 12 + ai * 16;
      ctx.beginPath(); ctx.moveTo(bx + rx * 0.60, sy); ctx.lineTo(ex, ey);
      G.shape(ctx, null, compact ? 0.9 : 1.2, '#71818A');
      G.circle(ctx, bx + rx * 0.60 + (ex - bx - rx * 0.60) * (0.25 + 0.08 * Math.sin(a * 2 + ai)),
        sy + (ey - sy) * (0.25 + 0.08 * Math.sin(a * 2 + ai)), compact ? 1.7 : 2.4,
        '#F5C56D', 1, G.PAL.ink);
    }
    comicStudent(ctx, x + w * 0.93, y + h + 3, compact ? 0.30 : 0.35, -0.05);
  }

  /* 偏序番外专用：左边把一只馍的制作状态画成向上的可达箭头，右边
     把互相可比较 / 不可比较的口味画成小型 Hasse 图。它比“总分榜”更
     适合本篇的笑点：未包可以走到已包，多肥却不能顺手走到纯瘦。 */
  function comicPoset(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 72;
    ctx.fillStyle = '#E5E2ED'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 7, y + 5, w - 14, compact ? 18 : 24, 4, '#2D4050', 1.6, G.PAL.ink);
    G.text(ctx, formula || 'a≼b · 可达不等于更好', x + w / 2,
      y + (compact ? 17 : 22),
      { size: compact ? 7.4 : 9.6, col: '#F3E7C7', weight: 900 });

    var top = y + (compact ? 26 : 34), gap = compact ? 11 : 18;
    var sx = x + w * 0.20, nodeW = compact ? 31 : 40, nodeH = compact ? 9 : 13;
    var stateLabels = ['未包', '已包', '可递'];
    G.text(ctx, compact ? '状态' : '出餐状态', sx, top - 3,
      { size: compact ? 5.8 : 7.2, col: '#55717A', weight: 900 });
    for (var si = 0; si < stateLabels.length; si++) {
      var sy = top + si * gap;
      if (si > 0) {
        ctx.beginPath(); ctx.moveTo(sx, sy - gap + nodeH / 2 + 1);
        ctx.lineTo(sx, sy - nodeH / 2 - 2);
        G.shape(ctx, null, compact ? 1 : 1.4, '#8C6A42');
        ctx.beginPath(); ctx.moveTo(sx, sy - nodeH / 2 - 2);
        ctx.lineTo(sx - 3, sy - nodeH / 2 - 6);
        ctx.lineTo(sx + 3, sy - nodeH / 2 - 6); ctx.closePath();
        G.shape(ctx, '#8C6A42', 1, '#8C6A42');
      }
      var active = si === Math.floor((Math.abs(Math.sin(a * 1.8)) * 3)) % 3;
      G.box(ctx, sx - nodeW / 2, sy - nodeH / 2, nodeW, nodeH,
        compact ? 2 : 3, active ? '#6A9560' : '#F4E8C7',
        compact ? 1 : 1.4, G.PAL.ink);
      G.text(ctx, stateLabels[si], sx, sy + (compact ? 2.2 : 3.2),
        { size: compact ? 5.8 : 7, col: active ? G.PAL.cream : '#7A5A35', weight: 900 });
    }

    var cx = x + w * 0.68, cy = top + (compact ? 7 : 11),
      r = compact ? 5 : 7;
    G.text(ctx, compact ? '口味格' : '口味的偏序格', cx, top - 3,
      { size: compact ? 5.8 : 7.2, col: '#55717A', weight: 900 });
    var nodes = [
      { x: cx, y: cy, label: '均', col: '#C79558' },
      { x: cx - (compact ? 12 : 17), y: cy + (compact ? 12 : 18), label: '酥', col: '#6A9560' },
      { x: cx + (compact ? 12 : 17), y: cy + (compact ? 12 : 18), label: '汁', col: '#5A86A0' },
      { x: cx, y: cy + (compact ? 24 : 36), label: '选？', col: '#C94032' }
    ];
    var edges = [[0, 1], [0, 2], [1, 3], [2, 3]];
    for (var ei = 0; ei < edges.length; ei++) {
      var from = nodes[edges[ei][0]], to = nodes[edges[ei][1]];
      ctx.beginPath(); ctx.moveTo(from.x, from.y + r); ctx.lineTo(to.x, to.y - r);
      G.shape(ctx, null, compact ? 1 : 1.3, '#71818A');
    }
    for (var ni = 0; ni < nodes.length; ni++) {
      var pulse = ni === 3 ? 0.72 + 0.22 * Math.sin(a * 3) : 0.9;
      ctx.save(); ctx.globalAlpha = pulse;
      G.circle(ctx, nodes[ni].x, nodes[ni].y, r, nodes[ni].col, 1.3, G.PAL.ink);
      ctx.restore();
      G.text(ctx, nodes[ni].label, nodes[ni].x, nodes[ni].y + (compact ? 2 : 2.5),
        { size: compact ? 4.8 : 6, col: G.PAL.cream, weight: 900 });
    }
    G.text(ctx, compact ? '可达 ≠ 更好' : '可达 ≠ 排名', x + w * 0.69, y + h - 3,
      { size: compact ? 5.8 : 7.5, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.93, y + h + 3, compact ? 0.27 : 0.34, -0.05);
  }

  /* 度量番外专用：左侧把两只馍之间的差异画成“口感尺”，右侧把标准馍、
     试做馍和顾客手里的馍连成三角形。动态误差带让“近似”看起来像一个
     可检查的范围，而不是一句容易糊弄人的“差不多”。 */
  function comicMetric(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 72;
    ctx.fillStyle = '#E8E3D6'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 7, y + 5, w - 14, compact ? 18 : 25, 4, '#2D4050', 1.7, G.PAL.ink);
    G.text(ctx, formula || 'd(馍₁，馍₂) ≤ ε', x + w / 2,
      y + (compact ? 17 : 22),
      { size: compact ? 7.1 : 9.6, col: '#F3E7C7', weight: 900 });

    var cy = y + (compact ? 39 : 62), rr = compact ? 10 : 16;
    var buns = [
      { x: x + w * 0.18, col: '#D8933A', label: compact ? 'A' : '标准馍' },
      { x: x + w * 0.40, col: '#C77C39', label: compact ? 'B' : '实测馍' }
    ];
    for (var bi = 0; bi < buns.length; bi++) {
      var bun = buns[bi];
      ctx.save(); ctx.translate(bun.x, cy); ctx.scale(1, 0.62);
      ctx.beginPath(); ctx.ellipse(0, 0, rr, rr, 0, 0, Math.PI * 2);
      G.shape(ctx, bun.col, 1.5, G.PAL.ink); ctx.restore();
      for (var fl = 0; fl < 2; fl++) {
        ctx.beginPath();
        ctx.moveTo(bun.x - rr * 0.58, cy - 3 + fl * 5);
        ctx.quadraticCurveTo(bun.x, cy - 8 + fl * 4,
          bun.x + rr * 0.58, cy - 3 + fl * 5);
        G.shape(ctx, null, compact ? 0.8 : 1.1, fl ? '#8B5A2B' : '#A34A24');
      }
      G.text(ctx, bun.label, bun.x, cy + (compact ? 13 : 22),
        { size: compact ? 5.6 : 7.2, col: '#7A5A35', weight: 900 });
    }
    var rulerY = cy + (compact ? 18 : 29), r0 = buns[0].x, r1 = buns[1].x;
    ctx.beginPath(); ctx.moveTo(r0, rulerY); ctx.lineTo(r1, rulerY);
    G.shape(ctx, null, compact ? 1.1 : 1.6, '#9A4D35');
    for (var ti = 0; ti < 5; ti++) {
      var tx = r0 + (r1 - r0) * ti / 4;
      ctx.beginPath(); ctx.moveTo(tx, rulerY - 3); ctx.lineTo(tx, rulerY + 3);
      G.shape(ctx, null, 1, '#9A4D35');
    }
    G.text(ctx, compact ? '口感距离' : '肥瘦 · 火候 · 卤汁的差异',
      (r0 + r1) / 2, rulerY + (compact ? 10 : 13),
      { size: compact ? 5.4 : 7, col: '#9A4D35', weight: 800 });

    var ax = x + w * 0.60, ay = y + (compact ? 35 : 51);
    var p0 = { x: ax, y: ay }, p1 = { x: ax + w * 0.22, y: ay + (compact ? 13 : 23) },
      p2 = { x: ax + w * 0.06, y: ay + (compact ? 28 : 49) };
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p0.x, p0.y); G.shape(ctx, null, compact ? 1 : 1.4, '#71818A');
    var pts = [
      { p: p0, t: compact ? '标' : '标准' },
      { p: p1, t: compact ? '客' : '顾客口' },
      { p: p2, t: compact ? '试' : '试做' }
    ];
    for (var pi = 0; pi < pts.length; pi++) {
      var pulse = pi === 1 ? 0.74 + 0.2 * Math.sin(a * 3) : 0.92;
      ctx.save(); ctx.globalAlpha = pulse;
      G.circle(ctx, pts[pi].p.x, pts[pi].p.y, compact ? 4 : 6,
        pi === 1 ? '#C94032' : '#6A9560', 1.2, G.PAL.ink); ctx.restore();
      G.text(ctx, pts[pi].t, pts[pi].p.x, pts[pi].p.y + (compact ? 9 : 13),
        { size: compact ? 5 : 6.5, col: '#55717A', weight: 900 });
    }
    G.text(ctx, compact ? '每段都算' : '每一段误差都要复查', x + w * 0.76, y + h - (compact ? 5 : 8),
      { size: compact ? 5.7 : 7.2, col: '#357A38', weight: 900 });
    comicStudent(ctx, x + w * 0.94, y + h + 3, compact ? 0.25 : 0.33, -0.05);
  }

  /* 函子番外专用：把研究院门口的手作流程和分店的交接流程画成一张
     交换图。节点是馍胚 / 顾客，箭头是操作与复检；两条路线可以不同，
     但交换到同一项验收时，结构和责任不能被“优化”掉。 */
  function comicFunctor(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 72;
    ctx.fillStyle = '#E5E8E0'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 7, y + 5, w - 14, compact ? 18 : 25, 4, '#2D4050', 1.7, G.PAL.ink);
    G.text(ctx, formula || 'F：流程 → 结构', x + w / 2,
      y + (compact ? 17 : 22),
      { size: compact ? 6.8 : 9.1, col: '#F3E7C7', weight: 900 });

    var lx = x + w * 0.22, rx = x + w * 0.78;
    var ty = y + (compact ? 39 : 57), by = y + h - (compact ? 22 : 31);
    var nw = compact ? 34 : 46, nh = compact ? 12 : 17;
    var nodes = [
      { x: lx, y: ty, label: compact ? '馍胚' : '馍胚对象', col: '#D8933A' },
      { x: rx, y: ty, label: compact ? '出餐' : '出餐对象', col: '#6A9560' },
      { x: lx, y: by, label: compact ? '手作' : '研究院手作', col: '#C77C39' },
      { x: rx, y: by, label: compact ? '顾客' : '顾客第一口', col: '#C94032' }
    ];
    function arrow(x0, y0, x1, y1, col, width) {
      var dx = x1 - x0, dy = y1 - y0, len = Math.max(1, Math.hypot(dx, dy));
      var ux = dx / len, uy = dy / len;
      var pad = compact ? 18 : 25;
      var ax0 = x0 + ux * pad, ay0 = y0 + uy * pad;
      var ax1 = x1 - ux * pad, ay1 = y1 - uy * pad;
      ctx.beginPath(); ctx.moveTo(ax0, ay0); ctx.lineTo(ax1, ay1);
      G.shape(ctx, null, width || (compact ? 1 : 1.4), col);
      var ah = compact ? 4 : 6;
      ctx.beginPath();
      ctx.moveTo(ax1, ay1);
      ctx.lineTo(ax1 - ux * ah - uy * ah * 0.62, ay1 - uy * ah + ux * ah * 0.62);
      ctx.lineTo(ax1 - ux * ah + uy * ah * 0.62, ay1 - uy * ah - ux * ah * 0.62);
      ctx.closePath(); G.shape(ctx, col, 0);
    }
    /* 先画箭头，再盖节点，避免线头钻进圆角框；右下节点的脉冲是“责任
       落点”，让公式图仍然保留日漫里那一下醒目的视觉节奏。 */
    arrow(nodes[0].x, nodes[0].y, nodes[1].x, nodes[1].y, '#71818A');
    arrow(nodes[2].x, nodes[2].y, nodes[3].x, nodes[3].y, '#71818A');
    arrow(nodes[0].x, nodes[0].y, nodes[2].x, nodes[2].y, '#9A4D35', compact ? 0.9 : 1.2);
    arrow(nodes[1].x, nodes[1].y, nodes[3].x, nodes[3].y, '#357A38', compact ? 0.9 : 1.2);
    G.text(ctx, compact ? 'F' : '流程 F', (lx + rx) / 2, ty - (compact ? 7 : 11),
      { size: compact ? 5.8 : 7.2, col: '#55717A', weight: 900 });
    G.text(ctx, compact ? 'F′' : '另一条路 F′', (lx + rx) / 2, by + (compact ? 8 : 13),
      { size: compact ? 5.8 : 7.2, col: '#55717A', weight: 900 });
    G.text(ctx, compact ? '检' : '复检', lx - (compact ? 10 : 15), (ty + by) / 2,
      { size: compact ? 5.6 : 6.8, col: '#9A4D35', weight: 900 });
    G.text(ctx, compact ? '责' : '责任', rx + (compact ? 10 : 15), (ty + by) / 2,
      { size: compact ? 5.6 : 6.8, col: '#357A38', weight: 900 });
    for (var ni = 0; ni < nodes.length; ni++) {
      var nd = nodes[ni], pulse = ni === 3 ? 0.78 + 0.18 * Math.sin(a * 3) : 0.94;
      ctx.save(); ctx.globalAlpha = pulse;
      G.box(ctx, nd.x - nw / 2, nd.y - nh / 2, nw, nh,
        compact ? 3 : 5, nd.col, compact ? 1 : 1.5, G.PAL.ink);
      ctx.restore();
      G.text(ctx, nd.label, nd.x, nd.y + (compact ? 2.2 : 3.7),
        { size: compact ? 5.3 : 6.7, col: G.PAL.cream, weight: 900 });
    }
    G.text(ctx, compact ? '交换后仍要负责' : '交换图闭合，责任不消失', x + w * 0.52,
      y + h - (compact ? 3 : 5),
      { size: compact ? 5.5 : 7.1, col: '#8B5A2B', weight: 900 });
    comicStudent(ctx, x + w * 0.95, y + h + 3, compact ? 0.24 : 0.32, -0.04);
  }

  /* 极限番外专用：左侧是逐步逼近的馍序列，右侧是一只必须重新验收的
     实物馍。曲线会越来越靠近 ε 带，却不会把“未来会收敛”偷换成
     “这一锅已经合格”，把用户想要的心流式小步修正落成一个可读的梗。 */
  function comicLimit(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    var compact = h < 72;
    ctx.fillStyle = '#E6E0D2'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 7, y + 5, w - 14, compact ? 18 : 25, 4, '#2D4050', 1.7, G.PAL.ink);
    G.text(ctx, formula || 'lim 馍ₙ = 馍*', x + w / 2,
      y + (compact ? 17 : 22),
      { size: compact ? 6.2 : 8.8, col: '#F3E7C7', weight: 900 });

    var lx = x + 22, rx = x + w * 0.58;
    var top = y + (compact ? 29 : 43), bot = y + h - (compact ? 14 : 25);
    ctx.beginPath(); ctx.moveTo(lx, bot); ctx.lineTo(rx, bot);
    ctx.moveTo(lx, bot); ctx.lineTo(lx, top); G.shape(ctx, null, compact ? 1 : 1.3, '#596D73');
    ctx.beginPath(); ctx.moveTo(lx, top + 13); ctx.lineTo(rx, top + 13);
    G.shape(ctx, null, 1, '#8AA07D');
    G.text(ctx, compact ? '馍*' : '理想馍*', rx - 2, top + 9,
      { size: compact ? 5.2 : 6.8, align: 'right', col: '#357A38', weight: 900 });
    for (var si = 0; si < 7; si++) {
      var sx = lx + 13 + (rx - lx - 22) * si / 6;
      var sy = top + 39 - (30 * (1 - Math.exp(-0.34 * si))) +
        Math.sin(a * 1.5 + si) * (compact ? 1.2 : 2.1);
      ctx.beginPath();
      if (!si) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
      if (si === 6) G.shape(ctx, null, compact ? 1.8 : 2.4, '#C77C39');
      G.circle(ctx, sx, sy, compact ? 2.3 : 3.2,
        si === 6 ? '#C94032' : '#D8933A', 1, G.PAL.ink);
      if (si > 0) {
        /* 上一段曲线单独补线，避免“点”看起来像无关的散点图。 */
        var px = lx + 13 + (rx - lx - 22) * (si - 1) / 6;
        var py = top + 39 - (30 * (1 - Math.exp(-0.34 * (si - 1)))) +
          Math.sin(a * 1.5 + si - 1) * (compact ? 1.2 : 2.1);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy);
        G.shape(ctx, null, compact ? 1.2 : 1.7, '#C77C39');
      }
    }
    G.text(ctx, compact ? 'n→∞' : '练习次数 n → ∞', (lx + rx) / 2, bot + (compact ? 10 : 15),
      { size: compact ? 5.2 : 6.8, col: '#8B5A2B', weight: 800 });
    G.text(ctx, compact ? '误差↓' : '误差越来越小', lx + 25, top + 31,
      { size: compact ? 5.3 : 7, col: '#9A4D35', weight: 900 });

    var bx = x + w * 0.77, by = y + (compact ? 45 : 70);
    ctx.save(); ctx.translate(bx, by); ctx.scale(1, 0.67);
    ctx.beginPath(); ctx.ellipse(0, 0, compact ? 24 : 35, compact ? 17 : 24, 0, 0, Math.PI * 2);
    G.shape(ctx, '#D8933A', 2, G.PAL.ink); ctx.restore();
    for (var li = 0; li < 2; li++) {
      ctx.beginPath(); ctx.moveTo(bx - (compact ? 13 : 20), by - 4 + li * 7);
      ctx.quadraticCurveTo(bx, by - (compact ? 9 : 14) + li * 4,
        bx + (compact ? 13 : 20), by - 4 + li * 7);
      G.shape(ctx, null, compact ? 1 : 1.4, li ? '#8B5A2B' : '#A34A24');
    }
    G.text(ctx, compact ? '这一只' : '今天这一只', bx, by + (compact ? 21 : 31),
      { size: compact ? 5.8 : 7.2, col: '#9A4D35', weight: 900 });
    G.box(ctx, bx - (compact ? 26 : 38), by - (compact ? 35 : 50),
      compact ? 52 : 76, compact ? 11 : 16, 3, 'rgba(255,244,190,.92)', 1, '#B07800');
    G.text(ctx, compact ? 'ε内？先掰开' : 'ε 内？先掰开复检', bx, by - (compact ? 27 : 39),
      { size: compact ? 5.2 : 6.7, col: '#8B5A2B', weight: 900 });
    comicStudent(ctx, x + w * 0.95, y + h + 3, compact ? 0.23 : 0.31, -0.04);
  }

  /* 固定点番外专用：把“每天重新做一锅”画成不动点迭代。
     曲线与 y=x 的交点是目标手感，旁边几步折线让读者看见“修正 → 靠近”，
     但最后仍留一只会冒热气的馍，提醒玩家收敛不等于把锅气删掉。 */
  function comicFixedPoint(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#D9E8EA'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'F(x*)=x*', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var ax = x + 28, ay = y + h - 25, aw = w - 54, ah = h - 70;
    ctx.save(); ctx.globalAlpha = 0.42; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + aw, ay - ah); G.shape(ctx, null, 1.2, '#6B7F87');
    ctx.setLineDash([]); ctx.restore();
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + aw, ay); G.shape(ctx, null, 1.5, '#50666E');
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay - ah); G.shape(ctx, null, 1.5, '#50666E');

    var vals = [];
    for (var i = 0; i <= 20; i++) {
      var u = i / 20;
      var fy = 0.10 + 0.98 * u - 0.46 * u * u;
      vals.push({ x: ax + u * aw, y: ay - fy * ah });
    }
    ctx.beginPath();
    for (var vi = 0; vi < vals.length; vi++) {
      if (!vi) ctx.moveTo(vals[vi].x, vals[vi].y); else ctx.lineTo(vals[vi].x, vals[vi].y);
    }
    G.shape(ctx, null, 2.2, '#B45C38');

    var seq = [0.14, 0.35, 0.51, 0.59];
    var prev = null;
    for (var si = 0; si < seq.length; si++) {
      var u2 = seq[si], fy2 = 0.10 + 0.98 * u2 - 0.46 * u2 * u2;
      var px = ax + u2 * aw, py = ay - fy2 * ah;
      ctx.save(); ctx.globalAlpha = 0.75;
      G.circle(ctx, px, py, si === seq.length - 1 ? 5.5 : 4.2,
        si === seq.length - 1 ? '#3C8A55' : '#D8933A', 1.4, G.PAL.ink);
      ctx.restore();
      if (prev) {
        ctx.save(); ctx.globalAlpha = 0.65; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(px, py); G.shape(ctx, null, 1.5, '#3C8A55');
        ctx.setLineDash([]); ctx.restore();
      }
      prev = { x: px, y: py };
    }
    G.text(ctx, 'x₀', ax + seq[0] * aw - 2, ay - (0.10 + 0.98 * seq[0] - 0.46 * seq[0] * seq[0]) * ah + 15,
      { size: 8, col: G.PAL.meatDark, weight: 900 });
    G.text(ctx, 'x*', ax + seq[3] * aw + 7, ay - (0.10 + 0.98 * seq[3] - 0.46 * seq[3] * seq[3]) * ah - 5,
      { size: 9, col: '#357A38', weight: 900 });
    G.text(ctx, '每天修正一点', x + w * 0.22, y + h - 8,
      { size: 8, col: '#55717A', weight: 900 });
    if (G.Art && G.Art.bun)
      G.Art.bun(ctx, x + w * 0.78, y + h * 0.73 + Math.sin(a * 2) * 1.2, 0.28, 0.72, false);
    G.text(ctx, '锅气', x + w * 0.78, y + h - 8,
      { size: 8, col: G.PAL.meatDark, weight: 900 });
    comicStudent(ctx, x + w * 0.90, y + h + 3, 0.38, -0.05);
  }

  /* 生成函数番外专用：把每天的订单画成一排“系数柱”，再用 q 的幂把
     它们串成菜单。左边是可以数的真实出餐，右边是还没定义的下一项，
     让“从整张菜单提取一项”成为一眼能懂的漫画动作。 */
  function comicGenerating(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#E9DCC2'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.globalAlpha = 0.28; ctx.strokeStyle = '#A87D4C'; ctx.lineWidth = 1;
    for (var gx = x + 14; gx < x + w; gx += 22) {
      ctx.beginPath(); ctx.moveTo(gx, y + 42); ctx.lineTo(gx, y + h - 13); ctx.stroke();
    }
    ctx.restore();
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'M(q)=∑aₙqⁿ', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var vals = [0.42, 0.68, 0.54, 0.80, 0.58, 0.34];
    var names = ['白', '脆', '全', '椒', '三样', '？'];
    var cols = ['#D8933A', '#B96235', '#7D9B64', '#4F8A5B', '#C38A3E', '#8293A0'];
    var left = x + 18, bottom = y + h - 28, gap = 7;
    var bw = (w - 36 - gap * (vals.length - 1)) / vals.length;
    ctx.beginPath(); ctx.moveTo(left, bottom); ctx.lineTo(x + w - 18, bottom);
    G.shape(ctx, null, 1.5, '#6B5543');
    for (var i = 0; i < vals.length; i++) {
      var bh = 20 + vals[i] * 43 + Math.sin(a * 1.4 + i) * (i === 5 ? 1.8 : 0.6);
      var bx = left + i * (bw + gap), by = bottom - bh;
      G.box(ctx, bx, by, bw, bh, 4, cols[i], 1.8, G.PAL.ink);
      G.text(ctx, names[i], bx + bw / 2, bottom + 11,
        { size: i === 4 ? 6.5 : 8, col: G.PAL.meatDark, weight: 900 });
      G.text(ctx, i === 5 ? 'aₙ₊₁' : 'a' + i,
        bx + bw / 2, by - 5, { size: 7, col: i === 5 ? '#55717A' : '#8B5A2B', weight: 900 });
    }
    G.text(ctx, 'q⁰   q¹   q²   q³   q⁴   q⁵', x + w / 2, y + h - 6,
      { size: 7, col: '#55717A', weight: 800 });
    G.box(ctx, x + 13, y + 43, 59, 18, 4, '#FFF7E4', 1.5, '#9A4D35');
    G.text(ctx, '[qⁿ] → 一口', x + 42, y + 55,
      { size: 7.5, col: G.PAL.meatDark, weight: 900 });
    comicStudent(ctx, x + w * 0.88, y + h + 3, 0.40, -0.06);
  }

  /* 口感积分番外专用：左边是一只带着边界红线的馍，右边把“酥、香、汁”
     画成满意度向量。三条分量都在可行域里，才会落到绿色的“再来一口”；
     让抽象的积分变成玩家熟悉的火候、卤汁和层次，而不是又一张公式卡。 */
  function comicMouthfeel(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#F0E0C7'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'S=∫Ω(脆+香+汁)dA', x + w / 2, y + 25,
      { size: 10.2, col: '#F3E7C7', weight: 900 });

    var cx = x + w * 0.30, cy = y + h * 0.58;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.66);
    G.circle(ctx, 0, 0, 31 + Math.sin(a * 1.5) * 1.2, '#D8933A', 2.2, G.PAL.ink);
    G.circle(ctx, 0, 0, 22, '#E8B65A', 1.2, '#9A4D35');
    G.circle(ctx, -5, -4, 12, '#B96A36', 1, '#9A4D35');
    ctx.restore();
    /* 红线是边界条件，绿色线是仍可接受的口感区域。 */
    ctx.save(); ctx.strokeStyle = '#C94032'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.ellipse(cx, cy, 36, 24, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    G.text(ctx, '∂Ω', cx - 42, cy - 27, { size: 9, col: '#C94032', weight: 900 });
    G.text(ctx, '馍', cx, cy + 4, { size: 12, col: G.PAL.cream, weight: 900 });

    var ox = x + w * 0.58, oy = y + h * 0.73, scale = Math.min(w, h) * 0.24;
    ctx.save(); ctx.globalAlpha = 0.52; ctx.strokeStyle = '#778A8C'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + scale, oy); ctx.moveTo(ox, oy); ctx.lineTo(ox - scale * 0.42, oy - scale * 0.72); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - scale); ctx.stroke();
    ctx.restore();
    var p1 = { x: ox + scale * 0.72, y: oy - scale * 0.10 };
    var p2 = { x: ox - scale * 0.18, y: oy - scale * 0.64 };
    var p3 = { x: ox + scale * 0.05, y: oy - scale * 0.83 };
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.closePath();
    G.shape(ctx, 'rgba(76,139,94,.62)', 1.8, '#357A38');
    G.circle(ctx, p1.x, p1.y, 3.5, '#C47D39', 1, G.PAL.ink);
    G.circle(ctx, p2.x, p2.y, 3.5, '#6C9E67', 1, G.PAL.ink);
    G.circle(ctx, p3.x, p3.y, 3.5, '#C94032', 1, G.PAL.ink);
    G.text(ctx, '酥', p1.x + 12, p1.y + 3, { size: 8, col: '#9A4D35', weight: 900 });
    G.text(ctx, '香', p2.x - 3, p2.y - 8, { size: 8, col: '#357A38', weight: 900 });
    G.text(ctx, '汁', p3.x + 9, p3.y - 2, { size: 8, col: '#7A4FC0', weight: 900 });
    G.text(ctx, '口感向量', x + w * 0.67, y + h - 8,
      { size: 8, col: '#55717A', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, 0.40, -0.06);
  }

  /* 口碑后验番外专用：左侧是还没开口前的先验柱，右侧是听到顾客评价
     后收窄的后验柱，中间的“数据”箭头把一条“真香”变成下一锅备料。
     这让评价系统的数学含义也落在经营动作上：差评不是扣分牌，而是下一次
     调整肥瘦、火候和卤汁的证据。 */
  function comicPosterior(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#DCE8E2'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'P(配方|评价) ∝ P(评价|配方)P(配方)', x + w / 2, y + 25,
      { size: 9.1, col: '#F3E7C7', weight: 900 });

    var base = y + h * 0.80, top = y + h * 0.39;
    var left = x + 16, right = x + w - 16, mid = x + w * 0.50;
    ctx.beginPath(); ctx.moveTo(left, base); ctx.lineTo(right, base);
    G.shape(ctx, null, 1.5, '#526A62');
    G.text(ctx, '先验', x + w * 0.22, y + h - 7,
      { size: 8, col: '#58766A', weight: 900 });
    G.text(ctx, '后验', x + w * 0.78, y + h - 7,
      { size: 8, col: '#357A38', weight: 900 });
    var prior = [0.34, 0.52, 0.70, 0.43], post = [0.18, 0.61, 0.86, 0.27];
    var bw = Math.max(8, w * 0.075), gap = Math.max(4, w * 0.032);
    for (var i = 0; i < 4; i++) {
      var bh1 = 18 + prior[i] * Math.max(12, h * 0.27);
      var bx1 = left + 3 + i * (bw + gap);
      G.box(ctx, bx1, base - bh1, bw, bh1, 3, '#91AFA4', 1.2, '#52756A');
      var bh2 = 18 + post[i] * Math.max(12, h * 0.27);
      var bx2 = right - 4 * (bw + gap) + i * (bw + gap);
      G.box(ctx, bx2, base - bh2, bw, bh2, 3, '#6DA878', 1.2, '#285F2D');
    }
    ctx.save(); ctx.globalAlpha = 0.48; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(mid - 25, base - 8); ctx.lineTo(mid + 25, base - 8); G.shape(ctx, null, 1.8, '#C47D39');
    ctx.setLineDash([]); ctx.restore();
    G.text(ctx, '今日评价', mid, base - 19 + Math.sin(a * 2) * 1.2,
      { size: 8, col: '#9A4D35', weight: 900 });
    G.text(ctx, '真香！', mid, base + 10,
      { size: 8, col: '#C94032', weight: 900 });
    G.text(ctx, '数据让猜测变窄', x + w / 2, top - 4,
      { size: 8, col: '#55717A', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, 0.40, -0.06);
  }

  /* 反例番外专用：绿色多边形是当前可行域，散落的观测点是顾客反馈，
     红色叉号是“平均数看不见、但这一口确实不满意”的反例。它随着动画
     轻轻闪烁，像学生在黑板上把一个危险结论圈出来。 */
  function comicCounterexample(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#E6E0D8'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '∃x：S(x)＜阈值', x + w / 2, y + 25,
      { size: 10.2, col: '#F3E7C7', weight: 900 });
    var left = x + 24, right = x + w - 24, top = y + 44, bottom = y + h - 19;
    ctx.beginPath(); ctx.moveTo(left, bottom); ctx.lineTo(right, bottom); ctx.moveTo(left, bottom); ctx.lineTo(left, top);
    G.shape(ctx, null, 1.4, '#65716E');
    ctx.beginPath();
    ctx.moveTo(left + 18, bottom - 8);
    ctx.lineTo(left + w * 0.27, top + 25);
    ctx.lineTo(left + w * 0.54, top + 10);
    ctx.lineTo(right - 10, top + 36);
    ctx.lineTo(right - 18, bottom - 8); ctx.closePath();
    G.shape(ctx, 'rgba(88,153,101,.34)', 2, '#357A38');
    G.text(ctx, '可行域 Ω', left + w * 0.38, top + 25,
      { size: 8, col: '#357A38', weight: 900 });
    var pts = [
      { u: 0.18, v: 0.40, c: '#5D9C6B' },
      { u: 0.35, v: 0.63, c: '#5D9C6B' },
      { u: 0.57, v: 0.45, c: '#5D9C6B' },
      { u: 0.72, v: 0.70, c: '#5D9C6B' },
      { u: 0.82, v: 0.22, c: '#C94032' }
    ];
    for (var i = 0; i < pts.length; i++) {
      var px = left + (right - left) * pts[i].u;
      var py = bottom - (bottom - top) * pts[i].v;
      if (pts[i].c === '#C94032') {
        ctx.save(); ctx.globalAlpha = 0.62 + 0.22 * Math.sin(a * 5); ctx.strokeStyle = pts[i].c; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(px - 7, py - 7); ctx.lineTo(px + 7, py + 7); ctx.moveTo(px + 7, py - 7); ctx.lineTo(px - 7, py + 7); ctx.stroke(); ctx.restore();
        G.text(ctx, '反例', px, py - 13, { size: 8, col: '#C94032', weight: 900 });
      } else G.circle(ctx, px, py, 4.2, pts[i].c, 1.2, G.PAL.ink);
    }
    G.text(ctx, '评价 / 口感', x + w * 0.52, bottom + 12,
      { size: 7.5, col: '#55717A', weight: 900 });
    G.text(ctx, '不是失败，是数据', x + w * 0.25, y + h - 8,
      { size: 8, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, 0.40, -0.06);
  }

  /* 出餐图番外专用：把一张订单沿“顾客 → 工位 → 成品 → 顾客”的路径
     画出来。分叉的烤炉 / 砧板最后汇到纸站，橙色瓶颈会随动画闪一下，
     让“最大流最小割”对应到玩家最熟悉的那一刻：馍都做好了，只差包纸。 */
  function comicNetwork(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#DCE8EE'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.globalAlpha = 0.24; ctx.strokeStyle = '#6D8B9B'; ctx.lineWidth = 1;
    for (var gx = x + 14; gx < x + w; gx += 22) {
      ctx.beginPath(); ctx.moveTo(gx, y + 40); ctx.lineTo(gx, y + h - 12); ctx.stroke();
    }
    ctx.restore();
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 's → 炉 / 案 → 纸 → t', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var source = { x: x + w * 0.10, y: y + h * 0.59 };
    var oven = { x: x + w * 0.31, y: y + h * 0.43 };
    var board = { x: x + w * 0.31, y: y + h * 0.74 };
    var paper = { x: x + w * 0.59, y: y + h * 0.59 };
    var sink = { x: x + w * 0.87, y: y + h * 0.59 };
    var nodes = [source, oven, board, paper, sink];
    var edges = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4]];
    function link(from, to, ei) {
      var dx = to.x - from.x, dy = to.y - from.y, len = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      var ux = dx / len, uy = dy / len, sx = from.x + ux * 15, sy = from.y + uy * 15;
      var ex = to.x - ux * 15, ey = to.y - uy * 15;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
      G.shape(ctx, null, ei === 4 ? 3 : 2, ei === 4 ? '#D2660A' : '#648391');
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex - ux * 8 - uy * 4, ey - uy * 8 + ux * 4);
      ctx.lineTo(ex - ux * 8 + uy * 4, ey - uy * 8 - ux * 4);
      ctx.closePath(); G.shape(ctx, ei === 4 ? '#D2660A' : '#648391', 1, G.PAL.ink);
      var t = (a * 0.42 + ei * 0.17) % 1;
      G.circle(ctx, sx + (ex - sx) * t, sy + (ey - sy) * t, 3.2,
        ei === 4 ? '#F5C56D' : '#F1E1B4', 1, G.PAL.ink);
    }
    for (var ei = 0; ei < edges.length; ei++) link(nodes[edges[ei][0]], nodes[edges[ei][1]], ei);

    var labels = ['客流', '烤炉', '砧板', '纸站', '满意'];
    var cols = ['#6F8792', '#D8933A', '#9A5C3A', '#D2660A', '#357A38'];
    for (var ni = 0; ni < nodes.length; ni++) {
      var n = nodes[ni], rr = ni === 3 ? 15 : 12;
      if (ni === 3) {
        ctx.save(); ctx.globalAlpha = 0.28 + 0.18 * Math.sin(a * 4);
        G.circle(ctx, n.x, n.y, rr + 7, '#F5B94D', 2, '#D2660A');
        ctx.restore();
      }
      G.circle(ctx, n.x, n.y, rr, cols[ni], 2, G.PAL.ink);
      G.text(ctx, labels[ni], n.x, n.y + 3,
        { size: ni === 3 ? 7 : 8, col: G.PAL.cream, weight: 900 });
    }
    G.text(ctx, '橙色边 = 当前瓶颈', x + w * 0.50, y + h - 8,
      { size: 8, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, 0.39, -0.05);
  }

  /* 凸优化番外专用：绿色多边形是“酥、香、汁”共同允许的可行域，
     蓝色点沿两种馍胚之间的线段移动，红色点则停在焦黑的局部极值。
     读者能同时看到“折中仍可行”和“梯度为零不等于全局最好”两层笑点。 */
  function comicConvex(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#EEE3D2'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'λx+(1−λ)y ∈ Ω', x + w / 2, y + 25,
      { size: 10.2, col: '#F3E7C7', weight: 900 });
    var left = x + 24, right = x + w - 24, top = y + 43, bottom = y + h - 20;
    ctx.beginPath(); ctx.moveTo(left, bottom); ctx.lineTo(right, bottom);
    ctx.moveTo(left, bottom); ctx.lineTo(left, top); G.shape(ctx, null, 1.3, '#65716E');
    ctx.beginPath();
    ctx.moveTo(left + 8, bottom - 5);
    ctx.lineTo(left + 52, top + 27);
    ctx.lineTo(left + w * 0.48, top + 8);
    ctx.lineTo(right - 14, top + 31);
    ctx.lineTo(right - 4, bottom - 8);
    ctx.closePath(); G.shape(ctx, 'rgba(88,153,101,.30)', 2, '#357A38');
    G.text(ctx, '可行域 Ω', left + w * 0.34, top + 23,
      { size: 8, col: '#357A38', weight: 900 });

    var pA = { x: left + 45, y: bottom - 25 };
    var pB = { x: right - 27, y: top + 46 };
    var u = 0.45 + Math.sin(a * 1.5) * 0.07;
    var pM = { x: pA.x + (pB.x - pA.x) * u, y: pA.y + (pB.y - pA.y) * u };
    ctx.save(); ctx.setLineDash([4, 3]); ctx.beginPath();
    ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y);
    G.shape(ctx, null, 1.8, '#6B8390'); ctx.setLineDash([]); ctx.restore();
    G.circle(ctx, pA.x, pA.y, 5, '#D8933A', 1.5, G.PAL.ink);
    G.circle(ctx, pB.x, pB.y, 5, '#C94032', 1.5, G.PAL.ink);
    G.circle(ctx, pM.x, pM.y, 6, '#4D9A67', 2, G.PAL.ink);
    G.text(ctx, '白吉', pA.x, pA.y + 16, { size: 7.5, col: G.PAL.meatDark, weight: 900 });
    G.text(ctx, '焦黑·局部', pB.x, pB.y - 9, { size: 7, col: '#C94032', weight: 900 });
    G.text(ctx, '折中仍可行', pM.x, pM.y + 16, { size: 7.5, col: '#357A38', weight: 900 });
    G.text(ctx, '∇S=0 ≠ 全局最优', x + w * 0.50, y + h - 8,
      { size: 8, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, 0.39, -0.05);
  }

  /* 卷积番外专用：上方的“馍层”和下方的“卤汁核”各自有一条波形，
     中间的窗口沿着它们滑动，右侧则把叠加结果画成一口香气峰。这里不
     追求教科书的数值精确，而是让玩家一眼看出“逐格相遇、保留层次”。 */
  function comicConvolution(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#E8D9C9'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.globalAlpha = 0.28; ctx.strokeStyle = '#9B7456'; ctx.lineWidth = 1;
    for (var bg = x + 13; bg < x + w; bg += 22) {
      ctx.beginPath(); ctx.moveTo(bg, y + 39); ctx.lineTo(bg, y + h - 12); ctx.stroke();
    }
    ctx.restore();
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '馍 * 卤 = 香气', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var compact = h < 100;
    var gx = x + 17, gy = y + h * (compact ? 0.56 : 0.51), gw = w * 0.60;
    ctx.save(); ctx.strokeStyle = '#806044'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    for (var li = 0; li <= 22; li++) {
      var lx = gx + gw * li / 22;
      var ly = gy - (8 + (li % 4) * 3) * Math.sin(li * 0.72) - 7;
      if (!li) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
    }
    G.shape(ctx, null, 3, '#C47D39');
    G.text(ctx, '馍层 F', gx + 4, gy - (compact ? 14 : 37),
      { size: 8, col: '#9A4D35', weight: 900, align: 'left' });

    var wx = gx + ((Math.sin(a * 0.9) + 1) * 0.5) * Math.max(0, gw - 45);
    var winTop = gy - (compact ? 24 : 42), winH = compact ? 48 : 66;
    G.box(ctx, wx, winTop, 45, winH, 4, 'rgba(245,197,109,.26)', 2, '#C94032');
    G.text(ctx, 'K', wx + 22, winTop + (compact ? 14 : 13),
      { size: 11, col: '#9A4D35', weight: 900 });
    G.text(ctx, '滑动', wx + 22, winTop + winH - (compact ? 9 : 16),
      { size: 7, col: '#9A4D35', weight: 800 });

    var bx = gx + 9, by = gy + (compact ? 27 : 45);
    ctx.beginPath();
    for (var bi = 0; bi <= 18; bi++) {
      var bxx = bx + (gw - 18) * bi / 18;
      var byy = by - (4 + (bi % 3) * 2) * Math.cos(bi * 0.85) - 3;
      if (!bi) ctx.moveTo(bxx, byy); else ctx.lineTo(bxx, byy);
    }
    G.shape(ctx, null, 2.4, '#6B8B63');
    G.text(ctx, '卤汁 K', gx + 4, by + (compact ? 9 : 14),
      { size: 8, col: '#357A38', weight: 900, align: 'left' });

    var rx = x + w * 0.79, ry = y + h * 0.56;
    G.circle(ctx, rx, ry, 25, 'rgba(255,220,137,.68)', 2, '#A95A32');
    G.circle(ctx, rx, ry, 13 + Math.sin(a * 1.4) * 2, 'rgba(201,77,54,.72)', 1.4, '#7D3C2D');
    G.text(ctx, '香气', rx, ry + 3, { size: 10, col: G.PAL.cream, weight: 900 });
    G.text(ctx, '叠加结果', rx, y + h - 8, { size: 8, col: '#8B4B39', weight: 900 });
    ctx.beginPath(); ctx.moveTo(gx + gw + 8, gy + 3); ctx.lineTo(rx - 29, ry + 2);
    G.shape(ctx, null, 2, '#9A4D35');
    comicStudent(ctx, x + w * 0.92, y + h + 3, 0.40, -0.05);
  }

  /* 排队番外专用：把顾客流画成节点之间的箭头。左边的圆点是进入队列
     的客人，中间三站是烤 / 剁 / 包，红色的窄节点提示“瓶颈”；右边的
     热馍不是无条件流出，而要经过一条带口味约束的边。 */
  function comicQueue(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#D8E4E4'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'λ → 烤 → 剁 → 包 → μ', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var yy = y + h * 0.58;
    for (var qi = 0; qi < 4; qi++) {
      var qx = x + 20 + qi * 17 + ((a * 12) % 15);
      G.circle(ctx, qx, yy - 25 + (qi % 2) * 12, 6, '#F0C79F', 1.5, G.PAL.ink);
      G.circle(ctx, qx - 3, yy - 28 + (qi % 2) * 12, 5, '#3A2418', 1, G.PAL.ink);
    }
    G.text(ctx, 'λ 入队', x + 42, yy + 26, { size: 8, col: '#54737A', weight: 900 });

    var nodes = [
      { x: x + w * 0.32, label: '烤', col: '#C79558' },
      { x: x + w * 0.50, label: '剁', col: '#B95C31' },
      { x: x + w * 0.68, label: '包', col: '#C94032' }
    ];
    for (var ni = 0; ni < nodes.length - 1; ni++) {
      ctx.beginPath(); ctx.moveTo(nodes[ni].x + 25, yy); ctx.lineTo(nodes[ni + 1].x - 25, yy);
      G.shape(ctx, null, 2.4, '#58757B');
      ctx.beginPath(); ctx.moveTo(nodes[ni + 1].x - 25, yy);
      ctx.lineTo(nodes[ni + 1].x - 33, yy - 5); ctx.lineTo(nodes[ni + 1].x - 33, yy + 5);
      ctx.closePath(); G.shape(ctx, '#58757B', 1);
    }
    for (ni = 0; ni < nodes.length; ni++) {
      var nd = nodes[ni];
      G.box(ctx, nd.x - 25, yy - 25, 50, 50, 9,
        ni === 2 ? 'rgba(201,64,50,.78)' : nd.col, 2, G.PAL.ink);
      G.text(ctx, nd.label, nd.x, yy + 5,
        { size: 16, col: G.PAL.cream, weight: 900 });
    }
    G.text(ctx, '瓶颈', nodes[2].x, yy - 35, { size: 9, col: '#C94032', weight: 900 });
    G.box(ctx, x + w * 0.78, yy - 20, 55, 40, 8, '#F4E4BF', 2, G.PAL.ink);
    G.text(ctx, '热馍', x + w * 0.78 + 27, yy + 4,
      { size: 12, col: '#8B4B39', weight: 900 });
    ctx.beginPath(); ctx.moveTo(nodes[2].x + 25, yy); ctx.lineTo(x + w * 0.78, yy);
    G.shape(ctx, null, 2.4, '#9A4D35');
    G.text(ctx, 'μ 出队', x + w * 0.80, yy + 33,
      { size: 8, col: '#357A38', weight: 900 });
    G.text(ctx, '正确口味 = 可走的边', x + w * 0.50, y + h - 8,
      { size: 8, col: '#54737A', weight: 900 });
    comicStudent(ctx, x + w * 0.93, y + h + 3, 0.40, -0.05);
  }

  /* 蒙特卡洛番外专用：左侧散点是每次抓料的实测样本，浅绿色带是
     “正好”区间，右侧的大数字提醒玩家：样本能让估计更稳，却不能
     把真正递到顾客嘴里的那一把变成确定值。 */
  function comicMonte(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#E1D7E8'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'P(正好)≈命中/N', x + w / 2, y + 25,
      { size: 10.5, col: '#F3E7C7', weight: 900 });

    var ax = x + 19, ay = y + h * 0.80, aw = w * 0.56;
    ctx.save(); ctx.strokeStyle = '#6A5874'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(ax, y + 43); ctx.lineTo(ax, ay);
    ctx.lineTo(ax + aw, ay); ctx.stroke();
    ctx.restore();
    G.box(ctx, ax + 2, y + h * 0.51, aw - 4, h * 0.21, 4,
      'rgba(107,139,99,.23)', 1.5, '#6B8B63');
    for (var si = 0; si < 30; si++) {
      var sx = ax + 8 + (aw - 16) * si / 29;
      var off = Math.sin(si * 1.71 + a * 0.7) * h * 0.15;
      var sy = y + h * 0.62 + off + ((si * 17) % 7) - 3;
      var hit = sy > y + h * 0.50 && sy < y + h * 0.73;
      G.circle(ctx, sx, sy, 2.7, hit ? '#6B8B63' : '#C94032', 1, G.PAL.ink);
    }
    G.text(ctx, '80~98g', ax + aw / 2, y + h - 8,
      { size: 8, col: '#557457', weight: 900 });
    G.text(ctx, 'N=100', x + w * 0.79, y + h * 0.48,
      { size: 15, col: '#9A4D35', weight: 900 });
    G.text(ctx, '样本', x + w * 0.79, y + h * 0.62,
      { size: 9, col: '#6A5874', weight: 900 });
    G.text(ctx, '估计 ≠ 保证', x + w * 0.79, y + h * 0.78,
      { size: 8, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.93, y + h + 3, 0.40, -0.05);
  }

  /* 群作用番外专用：四个姿态沿一条轨道绕着同一只馍胚移动。
     旋转是轻微的，重点是让“轨道 / 稳定子 / 对称破缺”在画面上各有
     一个落点；最后一口咬下去后，轨道自然只剩下一个不对称的姿态。 */
  function comicSymmetry(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#DCE8D2'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'D₄ ↷ 馍胚', x + w / 2, y + 25,
      { size: 11, col: '#F3E7C7', weight: 900 });

    var cx = x + w * 0.34, cy = y + h * 0.67;
    var rr = Math.min(28, w * 0.17, h * 0.27);
    ctx.save(); ctx.globalAlpha = 0.50; ctx.strokeStyle = '#6C8E68'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(cx, cy, rr + 11, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - rr - 17, cy); ctx.lineTo(cx + rr + 17, cy);
    ctx.moveTo(cx, cy - rr - 17); ctx.lineTo(cx, cy + rr + 17); ctx.stroke();
    ctx.restore();
    for (var gi = 0; gi < 4; gi++) {
      var ang = gi * Math.PI / 2 + a * 0.18;
      var gx = cx + Math.cos(ang) * rr, gy = cy + Math.sin(ang) * rr;
      if (G.Art && G.Art.bun) G.Art.bun(ctx, gx, gy, 0.23,
        0.60 + gi * 0.08, false);
      else G.circle(ctx, gx, gy, 10, '#D8933A', 2, G.PAL.ink);
    }
    G.circle(ctx, cx, cy, 4, '#F5C56D', 1.2, G.PAL.ink);
    G.box(ctx, x + w * 0.61, y + 48, w * 0.28, 18, 4, '#F5E6C4', 2, G.PAL.ink);
    G.text(ctx, '轨道  D₄', x + w * 0.75, y + 57,
      { size: 9, col: G.PAL.meatDark, weight: 900 });
    G.text(ctx, '稳定子', x + w * 0.75, y + 78,
      { size: 8, col: G.PAL.inkSoft, weight: 800 });
    G.text(ctx, '咬一口 → 破缺', x + w * 0.75, y + 91,
      { size: 8, col: '#9A4D35', weight: 900 });
    comicStudent(ctx, x + w * 0.88, y + h + 3, 0.42, -0.05);
  }

  /* Turing 测试专用：左边是精确到微克的机械臂，右边是没有闭式解的
     手撕肉。中间的“VS”把第二章的冲突变成一眼能读懂的日漫对照，
     也给“物理世界”留下锅、手和热气三个具体落点。 */
  function comicTuring(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#C9DDE6'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || '误差 → 0，灵魂 = ?', x + w / 2, y + 25,
      { size: 11, col: '#F3E7C7', weight: 900 });

    var mid = x + w * 0.50, floor = y + h * 0.88;
    ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = '#7395A4'; ctx.lineWidth = 1;
    for (var gx = x + 14; gx < x + w - 10; gx += 22) {
      ctx.beginPath(); ctx.moveTo(gx, y + 42); ctx.lineTo(gx, floor); ctx.stroke();
    }
    for (var gy = y + 50; gy < floor; gy += 17) {
      ctx.beginPath(); ctx.moveTo(x + 10, gy); ctx.lineTo(x + w - 10, gy); ctx.stroke();
    }
    ctx.restore();

    /* 机械臂：关节、测量框和一块被切成像素的肉。 */
    var rx = x + w * 0.23, ry = y + h * 0.54;
    G.box(ctx, rx - 28, floor - 16, 56, 12, 3, '#516B77', 2, G.PAL.ink);
    G.box(ctx, rx - 14, floor - 39, 28, 24, 4, '#8AA7B2', 2, G.PAL.ink);
    ctx.save(); ctx.strokeStyle = '#334C58'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(rx, floor - 39); ctx.lineTo(rx - 10, ry - 31);
    ctx.lineTo(rx + 24, ry - 55); ctx.lineTo(rx + 39, ry - 27); ctx.stroke();
    ctx.restore();
    G.circle(ctx, rx, floor - 39, 6, '#D1E0E4', 2, G.PAL.ink);
    G.circle(ctx, rx - 10, ry - 31, 5, '#D1E0E4', 2, G.PAL.ink);
    G.circle(ctx, rx + 24, ry - 55, 5, '#D1E0E4', 2, G.PAL.ink);
    G.box(ctx, rx + 33, ry - 17, 25, 19, 3, '#9F4836', 2, G.PAL.ink);
    G.text(ctx, 'μg', rx + 45, ry - 4, { size: 9, col: G.PAL.cream, weight: 900 });
    G.text(ctx, '精准', rx, floor + 1, { size: 9, col: '#2D4050', weight: 900 });

    /* 手撕肉：肉丝有轻微动画，但不追求对称；旁边给一个冒热气的馍。 */
    var hx = x + w * 0.76, hy = y + h * 0.63;
    G.box(ctx, hx - 34, floor - 16, 68, 12, 3, '#8B5B3A', 2, G.PAL.ink);
    ctx.save(); ctx.strokeStyle = '#F0C79F'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx - 7, floor - 23); ctx.lineTo(hx - 20, hy - 29);
    ctx.moveTo(hx + 8, floor - 23); ctx.lineTo(hx + 19, hy - 25); ctx.stroke();
    ctx.restore();
    G.circle(ctx, hx - 21, hy - 32, 6, '#F0C79F', 1.5, G.PAL.ink);
    G.circle(ctx, hx + 20, hy - 28, 6, '#F0C79F', 1.5, G.PAL.ink);
    for (var mi = 0; mi < 5; mi++) {
      var mx = hx - 20 + mi * 10, my = hy - 10 - Math.sin(a * 2 + mi) * 3;
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + 6 + (mi % 2) * 3, my - 15 - (mi % 3) * 4);
      G.shape(ctx, null, 4, mi % 2 ? '#B95C31' : '#D77A3E');
    }
    if (G.Art && G.Art.bun) G.Art.bun(ctx, hx + 28, hy + 4, 0.42, 0.65, false);
    G.text(ctx, '手感', hx, floor + 1, { size: 9, col: '#8B4B39', weight: 900 });

    G.text(ctx, 'VS', mid, y + h * 0.62,
      { size: 19, col: '#9A4D35', stroke: '#F3E7C7', strokeW: 4, weight: 900 });
    G.text(ctx, '机器', x + w * 0.23, y + h - 8,
      { size: 8, col: '#2D4050', weight: 800 });
    G.text(ctx, '人类', x + w * 0.76, y + h - 8,
      { size: 8, col: '#8B4B39', weight: 800 });
    comicStudent(ctx, x + w * 0.91, y + h + 3, 0.40, -0.05);
  }

  /* 刀距番外专用：把剁肉连击画成离散波形，把秦腔拖长音画成低频底线。
     红色竖线是每次落刀，右下角的峰值则暗示傅里叶变换后的频谱，
     让“节奏奖励”在漫画里也有一个看得见的来源。 */
  function comicRhythm(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#E6D2A7'; ctx.fillRect(x, y, w, h);
    G.box(ctx, x + 9, y + 8, w - 18, 27, 5, '#2D4050', 2, G.PAL.ink);
    G.text(ctx, formula || 'xₙ / 频谱', x + w / 2, y + 25,
      { size: 11, col: '#F3E7C7', weight: 900 });
    var gx = x + 22, gy = y + h * 0.59, gw = w - 44, gh = h * 0.24;
    ctx.save(); ctx.strokeStyle = '#72553A'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + gw, gy);
    ctx.moveTo(gx, gy - gh); ctx.lineTo(gx, gy + gh); ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    for (var wi = 0; wi <= 30; wi++) {
      var wx = gx + gw * wi / 30;
      var wy = gy - Math.sin(wi * 1.45 + a * 1.2) * gh * 0.72;
      if (!wi) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    G.shape(ctx, null, 2.2, '#357A8A');
    for (var di = 0; di < 8; di++) {
      var dx = gx + 12 + di * (gw - 24) / 7;
      var dh = 8 + (di % 2 ? 15 : 23) + Math.sin(a * 1.5 + di) * 2;
      ctx.beginPath(); ctx.moveTo(dx, gy + gh + 8); ctx.lineTo(dx, gy - dh);
      G.shape(ctx, null, 2.6, '#C94032');
      G.circle(ctx, dx, gy - dh, 3.2, '#F3C56F', 1.2, G.PAL.ink);
    }
    var sx = x + w * 0.58, sy = y + h * 0.90;
    for (var si = 0; si < 4; si++) {
      var sh = 6 + (si + 1) * 4;
      G.box(ctx, sx + si * 18, sy - sh, 9, sh, 2, si === 2 ? '#C94032' : '#8D603A', 1, G.PAL.ink);
    }
    G.text(ctx, '低频 · 秦腔', x + 40, y + h - 8,
      { size: 8, col: G.PAL.meatDark, weight: 800 });
    G.text(ctx, '高频 · 刀声', x + w - 54, y + h - 8,
      { size: 8, col: '#9A4D35', weight: 800 });
    comicStudent(ctx, x + w * 0.87, y + h + 3, 0.42, -0.06);
  }

  /* 卤汁番外专用：把“相空间”画成锅里的轨道。锅是状态容器，
     香料是离散跳点，右侧的三轴则把香 / 咸 / 温变成玩家能读懂的
     小图；这样关店小游戏的四种配料也在剧情里留下了视觉记忆。 */
  function comicBroth(ctx, x, y, w, h, formula, anim) {
    var a = isFinite(+anim) ? +anim : 0;
    ctx.fillStyle = '#D9B777'; ctx.fillRect(x, y, w, h);
