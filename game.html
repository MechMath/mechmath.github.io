    /* 打开当天对应章节；若故事还没有走到那里，则退回最近已解锁的漫画。 */
    openComic: function (day) {
      day = Math.max(1, day | 0 || 1);
      this.sanitize();
      var wanted = comicWantedForDay(day);
      if (!comicUnlockedAt(wanted, day)) {
        this.setComic(latestComicIndex(day), day);
        this.comicToast = wanted > 0 ? '该章节尚未解锁 · 先完成前置营业目标' : '';
      } else {
        this.setComic(wanted, day); this.comicToast = '';
      }
      if (G.S) { G.S.mode = 'comic'; G.S.comicDay = day; }
      return this.comicPack;
    },

    tap: function (x, y) {
      x = isFinite(+x) ? +x : 0; y = isFinite(+y) ? +y : 0;
      if (comicHit(x, y, COMIC_BTN.back)) { G.toTitle(); return; }
      if (comicHit(x, y, COMIC_BTN.prev)) {
        var pi = this.comicIndex - 1;
        while (pi > 0 && !comicUnlockedAt(pi)) pi--;
        if (pi >= 0 && comicUnlockedAt(pi)) { this.setComic(pi); this.comicToast = ''; }
        return;
      }
      if (this.comicIndex === finaleComicIndex() && comicUnlockedAt(finaleComicIndex())) {
        if (comicHit(x, y, COMIC_BTN.endingA)) { this.chooseEnding('A'); return; }
        if (comicHit(x, y, COMIC_BTN.endingB)) { this.chooseEnding('B'); return; }
      }
      if (comicHit(x, y, COMIC_BTN.next)) {
        var ni = this.comicIndex + 1;
        while (ni < COMIC_ORDER.length && !comicUnlockedAt(ni)) ni++;
        if (ni < COMIC_ORDER.length) { this.setComic(ni); this.comicToast = ''; }
        else if (this.comicIndex < COMIC_ORDER.length - 1)
          this.comicToast = '完成当前章节的营业目标后，下一章漫画解锁';
        else { G.toTitle(); return; }
        if (G.Snd && G.Snd.take) G.Snd.take(); return;
      }
      /* 顶部目录可以直接回顾已经解锁的章节，锁住的章节只给反馈。 */
      var tabHit = -1, tabDist = 1e9;
      for (var i = 0; i < COMIC_ORDER.length; i++) {
        var tb = comicTab(i);
        if (!comicHit(x, y, tb)) continue;
        var dx = x - (tb.x + tb.w / 2), dy = y - (tb.y + tb.h / 2);
        var dist = dx * dx + dy * dy;
        if (dist < tabDist) { tabDist = dist; tabHit = i; }
      }
      if (tabHit >= 0) {
        if (comicUnlockedAt(tabHit)) { this.setComic(tabHit); this.comicToast = ''; }
        else this.comicToast = '完成前置剧情后解锁这一章';
        return;
      }
    },

  /* ---------- 文字：宁可缩号 / 截断，也不许溢出格子 ----------
     measureText 在无头桩里返回 0（量不了），那就什么都不做 ——
     「量不到」和「量到 0」必须走同一条安全路径，否则自检环境下会截出空串。 */
  function mw(ctx, s) {
    var w = 0;
    try { var m = ctx.measureText(s); w = m ? +m.width : 0; } catch (e) { w = 0; }
    return (isFinite(w) && w > 0) ? w : 0;
  }
  function txt(ctx, str, x, y, o) {
    o = o || {};
    str = (str === null || str === undefined) ? '' : String(str);
    var size = o.size || 14, weight = o.weight === undefined ? 800 : o.weight;
    if (o.max > 0) {
      ctx.font = weight + ' ' + size + 'px ' + G.FONT;
      var w = mw(ctx, str);
      if (w > o.max) {
        size = Math.max(9, Math.floor(size * o.max / w));
        ctx.font = weight + ' ' + size + 'px ' + G.FONT;
        var cut = str, g = 0;
        while (mw(ctx, cut + '…') > o.max && cut.length > 1 && g++ < 80)
          cut = cut.slice(0, cut.length - 1);
        if (cut !== str) str = cut + '…';
      }
    }
    G.text(ctx, str, x, y, {
      size: size, weight: weight, align: o.align, baseline: o.baseline,
      col: o.col, stroke: o.stroke, strokeW: o.strokeW
    });
  }
  function money(n) { return '¥' + Math.round(num(n)); }

  /* ---------- 时间线排布（render 和 tap 共用同一份，点不歪） ----------
     两头都有上限：一根柱子最窄 6px（再窄手指点不出区别，也看不出高矮），
     最宽 34px（一天占掉半屏那不叫时间线）。柱子占不满就整组居中 ——
     头几天左对齐会在右边留 700px 空白，看着像画崩了而不像「日子还长」。 */
  function chartLay(n) {
    if (!(n > 0)) return null;
    var slot = CH.w / n, from = 0, vis = n;
    if (slot < 6) { slot = 6; vis = Math.floor(CH.w / slot); from = n - vis; }
    else if (slot > 34) slot = 34;
    if (!(vis > 0)) return null;
    var span = slot * vis;
    return { slot: slot, vis: vis, from: from,
             x0: CH.x + (CH.w - span) / 2, span: span };
  }

  /* ---------- 里程碑 ----------
     十四条，全是「这一摊真的往前走了一步」才点得亮的。
     短名进格子，长句是摊主自己那句话，点一下才在页脚冒出来。 */
  var MILE = [
    { k: '头一回收摊',  say: '头一天撑到关门，摊子没塌',
      on: function (a) { return a.days >= 1; } },
    { k: '一百个馍',    say: '累计卖出一百份，手上算是有准了',
      on: function (a) { return a.served >= 100; } },
    { k: '五百个馍',    say: '五百份。这条街上多少有点名号了',
      on: function (a) { return a.served >= 500; } },
    { k: '四位数',      say: '有一天净赚过了一千',
      on: function (a) { return a.bestNet >= 1000; } },
    { k: '十个没抖',    say: '连着十个份量都正好，手是稳的',
      on: function (a) { return a.combo >= 10; } },
    { k: '一个没跑',    say: '有一天谁也没等黄，谁也没转身走',
      on: function (a) { return a.perfect >= 1; } },
    { k: '一天四十份',  say: '有一天卖了四十份，胳膊第二天抬不起来',
      on: function (a) { return a.bestServed >= 40; } },
    { k: '盆是空的',    say: '有一天收摊，盆里一点料没剩下',
      on: function (a) { return a.clean >= 1; } },
    { k: '摆到二十天',  say: '摆到第二十天了',
      on: function (a) { return a.maxDay >= 20; } },
    { k: '摆到四十天',  say: '摆到第四十天，老天爷赏这碗饭',
      on: function (a) { return a.maxDay >= 40; } },
    { k: '一万块',      say: '手里的钱到过一万',
      on: function (a) { return a.moneyPeak >= 10000; } },
    { k: '忍不住那下',  say: '角落那东西，终究还是丢出去过',
      on: function (a) { return a.thrown >= 1; } },
    { k: '秘制一单',    say: '神秘提示没有难住你，老陕这口吃服了',
      on: function (a) { return a.secrets >= 1; } },
    { k: '老饕图鉴',    say: '五位贵客都来过，门口这块招牌算立住了',
      on: function (a) { return (a.specialMask & 31) === 31; } }
  ];

  /* ---------- 四位常客 ----------
     出勤要靠 game.js 在顾客进门那一刻报信（见文件末尾 arrive 的注释）。
     没这个接缝之前，这一栏老老实实显示「还没开始记」，不猜、不假装。 */
  var REG = [
    { id: 'tee',   name: 'T恤哥' },
    { id: 'check', name: '格子衬衫' },
    { id: 'suit',  name: '西装大哥' },
    { id: 'elder', name: '粉领带前辈' }
  ];
  /* 五位特殊客各留一句当场评价。圆章是入口，短句才是收集的回报；
     评价写成角色口吻，不把「特殊客完成数」变成一串没有温度的数字。 */
  var SPECIAL_REVIEWS = [
    { bit: 1,  name: '网红大胃王', short: '网红', quote: '镜头一开，弹幕都在问这馍！' },
    { bit: 2,  name: '高铁赶车客', short: '赶车', quote: '三分钟到手，赶车也不耽误！' },
    { bit: 4,  name: '挑剔老陕', short: '老陕', quote: '馍酥肉烂，这才是老陕味。' },
    { bit: 8,  name: '挑剔美食家', short: '美食家', quote: '肥瘦和火候，都答对了。' },
    { bit: 16, name: '卫生检查员', short: '城管', quote: '台面干净，准你继续营业。' }
  ];
  function look(id) {
    var L = (G.FACES && G.FACES.length) ? G.FACES : null;
    if (L) for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i];
    return { skin: '#EFC79E', hair: '#2B1B10', shirt: P.wood, tie: null };
  }

  /* ============ G.Goals ============ */
  var Goals = G.Goals = {
    KEY: KEY,
    MAXDAYS: MAXDAYS,
    MILE: MILE,
    REG: REG,
    SPECIAL_REVIEWS: SPECIAL_REVIEWS,
    ok: true,             // localStorage 到底能不能用
    data: emptyData(),
    sel: null,            // 选中的天号
    specialSel: -1,       // 手账里当前展开的特殊客评价
    tip: null, tipT: 0,
    anim: 0,
    _nosave: false,       // 调试截图用：不许把假历史写进真存档

    /* ---------- 存取 ---------- */
    store: function () {
      // file:// / 隐私模式 / iframe 里 window.localStorage 本身就可能抛
      try { return window.localStorage || null; } catch (e) { return null; }
    },

    load: function () {
      this._loaded = true;
      if (!this.data) this.data = emptyData();
      if (this._nosave) return true;      // 调试截图造的假历史，不许被真存档冲掉
      var ls = this.store();
      if (!ls) { this.ok = false; return false; }   // 存不下就保住内存里这一份
      var raw = null;
      try { raw = ls.getItem(KEY); } catch (e) { this.ok = false; return false; }
      this.ok = true;
      if (raw === null || raw === undefined || raw === '') return true;
      var d = null;
      try { d = JSON.parse(String(raw)); } catch (e) { d = null; }
      // null / 数组 / 字符串 / 数字 一律当「没这本账」，而不是往里硬塞
      if (!d || typeof d !== 'object' || typeof d.length === 'number') return true;
      this.data = {
        v: 1,
        days: loadDays(d.days),
        agg: loadAgg(d.agg),
        regs: loadRegs(d.regs),
        regsSeen: !!d.regsSeen
      };
      this.reconcile();
      return true;
    },

    /* 存档里的两半可能对不上（手改过、写到一半断电）。
       以 days[] 为准把 agg 的下界补齐 —— 宁可少算历史，也不能让时间线上
       明明有的那一天在「最好的一天」里找不到。 */
    reconcile: function () {
      var a = this.data.agg, L = this.data.days, i, r;
      var recipes = 0, secrets = 0, takeouts = 0, specialMask = 0;
      for (i = 0; i < L.length; i++) {
        r = L[i];
        var net = netOf(r);
        if (net > a.bestNet) { a.bestNet = net; a.bestNetDay = r.d; }
        if (r.served > a.bestServed) { a.bestServed = r.served; a.bestServedDay = r.d; }
        if (r.cb > a.combo) a.combo = r.cb;
        if (r.d > a.maxDay) a.maxDay = r.d;
        recipes += r.recipes; secrets += r.secrets; takeouts += r.takeouts;
        specialMask |= r.specialMask;
      }
      if (recipes > a.recipes) a.recipes = recipes;
      if (secrets > a.secrets) a.secrets = secrets;
      if (takeouts > a.takeouts) a.takeouts = takeouts;
      a.specialMask = Math.min(31, (a.specialMask | 0) | specialMask);
      if (a.days < L.length) a.days = L.length;
    },

    save: function () {
      if (this._nosave) return false;
      var ls = this.store();
      if (!ls) { this.ok = false; return false; }
      try {
        ls.setItem(KEY, JSON.stringify(this.data));
        this.ok = true;
        return true;
      } catch (e) { this.ok = false; return false; }   // 配额满了也只是记不住，不炸
    },

    reset: function () {
      this.data = emptyData();
      this.sel = null; this.tip = null; this.tipT = 0;
      this.specialSel = -1;
      var ls = this.store();
      if (!ls) { this.ok = false; return false; }
      try { ls.removeItem(KEY); return true; } catch (e) { this.ok = false; return false; }
    },

    /* ---------- game.js 的接缝：每天收摊调一次 ---------- */
    dayEnd: function (stat) {
      /* 整个会话里从没翻开过手账 ⇒ load() 还没跑过 ⇒ this.data 是空的，
         直接 save() 会把磁盘上那本账连同终身聚合一起盖掉。
         load() 的唯一调用点在 open() 里，所以「重开浏览器、不点手账、直接开工」
         这条最常见的路径每次都会清空一次。收第一次摊之前补读一次。 */
      if (!this._loaded) { this._loaded = true; this.load(); }
      if (!this.data) this.data = emptyData();
      var r = mkDay(stat), a = this.data.agg, L = this.data.days;

      /* 天数倒退 = 这一天要么在重开（翻车重打，天号不变），要么整摊清档重来。
         两种都归成同一条规则：把 >= 这一天的记录全部丢掉再写。
         于是时间线永远是「当前这一摊」的连续账，不会两轮混在一起。
         但 agg 一个字都不回退 —— 他确实卖过那些馍，账本翻页不等于没发生。 */
      var cut = L.length;
      while (cut > 0 && L[cut - 1].d >= r.d) cut--;
      if (cut < L.length) L.length = cut;
      L.push(r);
      if (L.length > MAXDAYS) L.splice(0, L.length - MAXDAYS);

      var net = netOf(r);
      a.days++;
      a.served += r.served; a.rev += r.rev; a.cost += r.cost; a.waste += r.waste;
      a.lost += r.lost; a.walked += r.walked; a.thrown += r.thrown;
      a.unw += r.unw; a.und += r.und;
      a.recipes += r.recipes; a.secrets += r.secrets; a.takeouts += r.takeouts;
      a.specialMask = (a.specialMask | 0) | (r.specialMask | 0);
      if (r.cb > a.combo) a.combo = r.cb;
      if (net > a.bestNet) { a.bestNet = net; a.bestNetDay = r.d; }
      if (r.served > a.bestServed) { a.bestServed = r.served; a.bestServedDay = r.d; }
      if (r.d > a.maxDay) a.maxDay = r.d;
      var mn = ni(stat && stat.money);
      if (mn > a.moneyPeak) a.moneyPeak = mn;
      if (r.served > 0 && r.lost === 0 && r.walked === 0) a.perfect++;
      if (r.served > 0 && r.waste === 0) a.clean++;

      this.sel = r.d;
      this.save();
      return r;
    },

    /* ---------- 等 game.js 补的接缝：顾客进门时报一声 ----------
       game.js 的 spawn() 里已经有 `G.Regulars.decorate(c, S.day, G.CFG)` 这一行，
       它下面加一行就够：
           if (G.Goals && G.Goals.arrive) G.Goals.arrive(c.faceId, S.day);
       c.faceId 是四位常客的 id（'tee'/'check'/'suit'/'elder'），路人身上没有这个
       字段，传 undefined 进来会被这儿直接丢掉，所以不用在 game.js 那边判断。
       在接缝落地之前这个函数永远不会被调用，出勤栏就一直是「还没开始记」。 */
    arrive: function (faceId, day) {
      if (!this.data) this.data = emptyData();
      var id = (typeof faceId === 'string') ? faceId : null;
      if (!id || this.data.regs[id] === undefined) return false;
      this.data.regs[id] = ni(this.data.regs[id]) + 1;
      this.data.regsSeen = true;
      return true;
    },

    /* ---------- 进这一屏 ---------- */
    open: function () {
      this.load();
      this.tip = null; this.tipT = 0;
      this.specialSel = -1;
      var L = this.data.days;
      // 默认选最近那天：翻开手账，最想看的是昨天怎么样
      this.sel = L.length ? L[L.length - 1].d : null;
    },

    update: function (dt) {
      dt = num(dt);
      this.anim += dt;
      if (this.tipT > 0) {
        this.tipT -= dt;
        if (this.tipT <= 0) { this.tipT = 0; this.tip = null; }
      }
    },

    /* ---------- 点击 ---------- */
    tap: function (x, y) {
      x = num(x); y = num(y);
      if (G.inRect(x, y, BACK)) { G.toTitle(); return; }

      var L = this.data.days, lay = chartLay(L.length);
      // 柱子只有几像素宽，按「离哪根最近」判，整条时间线上没有点不中的缝
      if (lay && x >= lay.x0 - 4 && x <= lay.x0 + lay.span + 4 &&
          y >= CH.y - 6 && y <= CH.y + CH.h + 12) {
        var i = Math.floor((x - lay.x0) / lay.slot);
        if (i < 0) i = 0;
        if (i > lay.vis - 1) i = lay.vis - 1;
        var r = L[lay.from + i];
        if (r) {
          this.sel = r.d;
          if (G.Snd && G.Snd.take) G.Snd.take();
        }
        return;
      }

      /* 特殊客圆章的命中区比图形本身大一些，五个圆章共享一条 39px
         节距，手指点在两枚章之间时仍按最近的一枚处理。 */
      if (x >= COLB.x - 4 && x <= COLB.x + COLB.w + 4 &&
          y >= COLB.y + 146 && y <= COLB.y + 178) {
        var si = Math.round((x - (COLB.x + 10)) / 39);
        if (si >= 0 && si < SPECIAL_REVIEWS.length) {
          var sx = COLB.x + 10 + si * 39;
          if (Math.abs(x - sx) <= 21) {
            var sr = SPECIAL_REVIEWS[si], gotSpecial = !!(this.data.agg.specialMask & sr.bit);
            if (gotSpecial) {
              this.specialSel = si;
              this.tip = sr.name + '：“' + sr.quote + '”';
              this.tipT = 6;
              if (G.Snd && G.Snd.put) G.Snd.put();
            } else {
              this.tip = '还没解锁 —— 完成「' + sr.name + '」订单';
              this.tipT = 6;
              if (G.Snd && G.Snd.nope) G.Snd.nope();
            }
            return;
          }
        }
      }

      for (var m = 0; m < MILE.length; m++) {
        if (G.inRect(x, y, mileRect(m))) {
          var got = !!MILE[m].on(this.data.agg);
          this.tip = (got ? '' : '还没做到 —— ') + MILE[m].say;
          this.tipT = 6;
          if (G.Snd && G.Snd.put) G.Snd.put();
          return;
        }
      }
      // 别处点空了就是点空了，不做任何事（不关屏、不清选中）
    },

    /* ---------- 渲染 ---------- */
    render: function (ctx) {
      var d = this.data, L = d.days, a = d.agg;

      // 底：还是那个摊子，只是俯下身看柜台底下的本子
      if (G.Art && G.Art.scene) { G.Art.scene(ctx); G.Art.counter(ctx); }
      else { ctx.fillStyle = P.wall; ctx.fillRect(0, 0, G.W, G.H); }
      ctx.fillStyle = 'rgba(40,24,14,.55)';
      ctx.fillRect(0, 0, G.W, G.H);

      paper(ctx, this.anim);
      header(ctx, a, L);
      timeline(ctx, L, this.sel, a);
      detail(ctx, L, this.sel);
      colNumbers(ctx, a);
      colRegulars(ctx, d);
      colMiles(ctx, a);
      footer(ctx, this);
    }
  };

  /* ---------- 纸 ---------- */
  var STAIN = [   // 油渍位置写死，每次翻开是同一本，不是随机生成的新本子
    [148, 128, 46], [806, 96, 34], [352, 452, 40],
    [676, 366, 52], [92, 330, 28], [520, 168, 24]
  ];
  function paper(ctx, t) {
    // 本子的厚度：底下压着两三张旧纸
    for (var s = 3; s >= 1; s--) {
      G.box(ctx, PAPER.x + s * 3, PAPER.y + s * 2.5, PAPER.w - s * 2, PAPER.h - s,
        7, G.shade(P.bunRaw, 0.12 - s * 0.05), 0);
    }
    ctx.fillStyle = 'rgba(58,36,24,.34)';
    G.rrect(ctx, PAPER.x + 5, PAPER.y + 9, PAPER.w, PAPER.h, 8); ctx.fill();
    G.box(ctx, PAPER.x, PAPER.y, PAPER.w, PAPER.h, 8, G.shade(P.bunRaw, 0.35), 3, P.woodDark);

    // 油渍：柜台底下的本子不可能干净
    ctx.save();
    G.rrect(ctx, PAPER.x, PAPER.y, PAPER.w, PAPER.h, 8); ctx.clip();
    for (var i = 0; i < STAIN.length; i++) {
      var st = STAIN[i];
      var g = ctx.createRadialGradient(st[0], st[1], 1, st[0], st[1], st[2]);
      g.addColorStop(0, 'rgba(139,90,43,.16)');
      g.addColorStop(0.65, 'rgba(139,90,43,.07)');
      g.addColorStop(1, 'rgba(139,90,43,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(st[0], st[1], st[2], 0, Math.PI * 2); ctx.fill();
    }
    // 横格线：账本纸的底子
    ctx.strokeStyle = 'rgba(107,74,50,.13)'; ctx.lineWidth = 1;
    for (var ly = PAPER.y + 34; ly < PAPER.y + PAPER.h - 8; ly += 26) {
      ctx.beginPath(); ctx.moveTo(56, ly); ctx.lineTo(PAPER.x + PAPER.w - 12, ly); ctx.stroke();
    }
    ctx.restore();

    // 左边的布脊 + 三个订孔
    G.box(ctx, PAPER.x, PAPER.y, 30, PAPER.h, 8, P.woodDark, 3);
    ctx.fillStyle = 'rgba(255,248,236,.16)';
    ctx.fillRect(PAPER.x + 4, PAPER.y + 6, 3, PAPER.h - 12);
    for (var h = 0; h < 3; h++)
      G.circle(ctx, PAPER.x + 15, PAPER.y + 96 + h * 160, 5,
        G.shade(P.woodDark, -0.45), 2, G.shade(P.woodDark, -0.6));
    // 红竖线：手写账本的留边
    ctx.strokeStyle = 'rgba(192,57,43,.42)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, PAPER.y + 8); ctx.lineTo(60, PAPER.y + PAPER.h - 8); ctx.stroke();
  }

  function header(ctx, a, L) {
    txt(ctx, '摊 主 手 账', CX0, 42, { size: 27, align: 'left', col: P.meatDark, max: 300 });
    txt(ctx, '柜 台 底 下 那 本', CX0 + 216, 46,
      { size: 12, align: 'left', col: P.inkSoft, weight: 600, max: 160 });
    var right = a.days > 0
      ? ('收过 ' + a.days + ' 次摊 · 最远第 ' + a.maxDay + ' 天' +
         (L.length ? ' · 这一摊记着 ' + L.length + ' 天' : ''))
      : '还没收过摊';
    txt(ctx, right, CX1, 44, { size: 13, align: 'right', col: P.inkSoft, weight: 700, max: 430 });
    ctx.strokeStyle = 'rgba(58,36,24,.30)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CX0, 64); ctx.lineTo(CX1, 64); ctx.stroke();
  }

  /* 时间线：一天一根，高度按净赚，颜色分好日子 / 白干 / 翻车 */
  function timeline(ctx, L, sel, a) {
    txt(ctx, '每 天 的 账', CX0, 84, { size: 14, align: 'left', col: P.meatDark, max: 200 });

    var lay = chartLay(L.length);
    if (!lay) {
      txt(ctx, '还 没 记 上 一 天', G.W / 2, ZERO - 22,
        { size: 20, col: 'rgba(107,74,50,.62)', max: 400 });

      ctx.strokeStyle = 'rgba(58,36,24,.22)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(CH.x, ZERO + 34); ctx.lineTo(CH.x + CH.w, ZERO + 34); ctx.stroke();

    // 缩放：正的按最赚那天顶到 74px，亏的按最亏那天到 30px，各自成一档
    var i, r, net, maxP = 1, maxN = 1;
    for (i = 0; i < lay.vis; i++) {
      r = L[lay.from + i]; if (!r) continue;
      net = netOf(r);
      if (net > maxP) maxP = net;
      if (-net > maxN) maxN = -net;
    }
    var HP = 74, HN = 30;

    ctx.strokeStyle = 'rgba(58,36,24,.14)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(CH.x, ZERO - HP); ctx.lineTo(CH.x + CH.w, ZERO - HP); ctx.stroke();
    txt(ctx, money(maxP), CX1, ZERO - HP - 9,
      { size: 11, align: 'right', col: P.inkSoft, weight: 700, max: 120 });

    var bw = Math.max(3, Math.min(lay.slot - 2, 26));

    // 选中那一天先铺一条竖条：柱子只有几像素宽时，光靠描边根本看不出选了谁
    if (selI >= 0) {
      selX = lay.x0 + lay.slot * (selI + 0.5);
      ctx.fillStyle = 'rgba(142,43,34,.13)';
      ctx.fillRect(selX - lay.slot / 2, CH.y, lay.slot, CH.h);
    }
    for (i = 0; i < lay.vis; i++) {
      r = L[lay.from + i]; if (!r) continue;
      net = netOf(r);
      var cx = lay.x0 + lay.slot * (i + 0.5);
      var col = !r.ok ? P.red : (net > 0 ? P.green : P.orange);
      var on = (i === selI);
      var lw = on ? 2.6 : (bw >= 7 ? 2 : 0);
      var lc = on ? P.meatDark : P.ink;
      var h;
      if (net >= 0) {
        h = maxP > 0 ? net / maxP * HP : 0;
        if (net > 0 && h < 3) h = 3;
        if (h < 2) h = 2;                       // 白干一天也得留一条看得见的痕
        G.box(ctx, cx - bw / 2, ZERO - h, bw, h, Math.min(3, bw / 2), col, lw, lc);
      } else {
        h = maxN > 0 ? -net / maxN * HN : 0;
        if (h < 3) h = 3;
        G.box(ctx, cx - bw / 2, ZERO, bw, h, Math.min(3, bw / 2), col, lw, lc);
        h = 0;                                  // 亏的那天，小旗不该跑到线下面去
      }

    // 画满整幅而不是只画到最后一根：它是账本上的横格，不是柱子的底座。

      var last = (i === lay.vis - 1);

  /* ---------- 调试截图入口：index.html?shot=goals&days=40 ----------
     手账没有别的路能进（得先玩几十天），所以在这儿把 debugScene 包一层。
     和 events.js 那段同一个套路：摘掉本文件，这段也一起消失。
     造的是假历史，所以全程 _nosave —— 截个图不该把玩家的真账本冲掉。 */
  if (G.debugScene) {
    var _scene = G.debugScene;
    G.debugScene = function (q) {
      _scene(q);
      if (!q || q.shot !== 'goals') return;
      var n = parseInt(q.days, 10);
      if (!(n >= 0)) n = 12;
      if (n > MAXDAYS) n = MAXDAYS;
      Goals._nosave = true;
      Goals.data = emptyData();
      Goals.ok = !q.nols;
      var seed = 20240610;
      function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
      for (var d = 1; d <= n; d++) {
        // 隔一阵子来一个真亏钱的日子，否则零线下面那半张图永远看不到

        var scale = 60 + d * 26;
        var rev = Math.round(scale * (bad ? 0.16 + rnd() * 0.1 : 0.7 + rnd() * 0.7));
        var cost = Math.round(rev * (bad ? 1.6 + rnd() : 0.32 + rnd() * 0.2));
        Goals.dayEnd({
          day: d, reason: bad ? 'bad' : 'ok',
          money: 40 + d * 180, revenue: rev, cost: cost,
          waste: Math.round(cost * rnd() * 0.3),
          served: Math.round(rev / 9), lost: Math.round(rnd() * (bad ? 7 : 3)),
          walked: Math.round(rnd() * 3), thrown: d === 11 ? 1 : 0,
          comboBest: Math.min(16, 2 + Math.round(rnd() * d * 0.5)),
          why: { unwrapped: Math.round(rnd() * 3), undone: Math.round(rnd() * 6) }
        });
      }
      if (q.regs) {
        for (var k = 0; k < REG.length; k++)
          for (var j = 0; j < 3 + k * 7 + (n >> 2); j++) Goals.arrive(REG[k].id, n);
      }
      /* 台面上的烟和粒子会浮在账本上当油点。光快进没用 —— fx.js 的 grillWatch
         每帧都盯着炉子，只要 debugScene 摆的那个糊馍还在，烟就一直在生。
         先把台面清空，再快进让已有的粒子自己死掉。 */
      var SS = G.S, f, gi;
      if (SS.grill) for (gi = 0; gi < SS.grill.length; gi++)
        SS.grill[gi] = { state: 'empty', press: 0, pressing: 0, t: 0, flag: 0 };
      if (SS.cust) for (gi = 0; gi < SS.cust.length; gi++) SS.cust[gi] = null;
      SS.tray = []; SS.floats = []; SS.parts = []; SS.flies = [];
      SS.hand = { kind: null, amt: 0, x: 0, y: 0 };
      SS.combo = 0;
      if (G.FX && G.FX.update) for (f = 0; f < 160; f++) G.FX.update(0.05);
      G.S.mode = 'goals';
      Goals.open();
      Goals.sel = n > 4 ? Math.max(1, n - 6) : (n || null);
      if (q.tip) { Goals.tip = MILE[3].say; Goals.tipT = 5; }
    };

   * 效果全部写成「等级的绝对函数」，所以 apply() 天然幂等。

   * 五六千（正好是招牌 / 盖布 / 馍模的顶级），第 30 天左右才收尾。
   *

  var UP = [
    /* ---- 第一排：开局四天就该买得起的 ---- */

    { id: 'knife', name: '快 刀', tip: '按住剁得更快', icon: 'knife',

  var CARD = { w: 180, h: 100 }, GAP = 8, VGAP = 6;

      var x0 = Math.round((G.W - total) / 2), y0 = TOP + r * (CARD.h + VGAP);

        UP[i].rect = { x: x0 + c * (CARD.w + GAP), y: y0, w: CARD.w, h: CARD.h };
    }
    // 表比格子长了就说明有人加了卡片却没加排 —— 与其画到屏幕外，不如当场炸

  /* ============ G.Shop ============ */
  var Shop = G.Shop = {
    list: UP,
    BTN: BTN,
    base: {},
    lv: {},
    anim: 0,
    resetArm: 0,
    floats: [],
    /* 买完升级后保留一小段「卡片被点亮 + 说明条」：数值已经变了，
       但玩家不应该还要自己在 14 张卡里找半天才能确认是哪一张生效。 */
    buyPulse: null,
    notice: null,

    byId: function (id) {
      for (var i = 0; i < UP.length; i++) if (UP[i].id === id) return UP[i];
      return null;
    },

    /* 升级反馈只属于当前商店访问。离开去营业或小游戏时清掉，
       避免玩家隔了一整天回来还看到上一笔“刚升级”。 */
    clearTransient: function () {
      this.buyPulse = null;
      this.notice = null;
      this.floats = [];
    },

    maxLv: function (u) { return u.cost.length; },

    /* 把 lv 里的脏数据清干净：未知 id 丢掉，等级取整并夹到合法区间 */
    sanitize: function () {
      var clean = {};
      for (var id in this.lv) {
        var u = this.byId(id); if (!u) continue;
        var L = parseInt(this.lv[id], 10);
        if (!(L > 0)) continue;
        clean[id] = G.clamp(L, 0, this.maxLv(u));
      }
      this.lv = clean;
    },

    /* 从 base + lv 重算 G.CFG。幂等：先全量还原再叠加。 */
    apply: function () {
      var C = G.CFG, B = this.base, i, f;
      for (i = 0; i < WRITE.length; i++) {
        f = WRITE[i];
        C[f] = B[f];
      }
      for (i = 0; i < UP.length; i++) {
        var u = UP[i], L = G.clamp(this.lv[u.id] | 0, 0, this.maxLv(u));
        if (!L) continue;
        for (f in u.vals) C[f] = u.vals[f][L];
      }
    },

    /* 累计已投入 */
    spent: function () {
      var t = 0;
      for (var i = 0; i < UP.length; i++) {
        var u = UP[i], L = G.clamp(this.lv[u.id] | 0, 0, this.maxLv(u));
        for (var j = 0; j < L; j++) t += u.cost[j];
      }
      return t;
    },

    fx: function (txt, x, y, col) {
      this.floats.push({ txt: txt, x: x, y: y, col: col || P.ink, life: 0, ttl: 0.9 });
    },

    buy: function (id) {
      var u = this.byId(id); if (!u) return false;
      var L = G.clamp(this.lv[id] | 0, 0, this.maxLv(u));
      var cx = u.rect.x + u.rect.w / 2, cy = u.rect.y + 60;
      if (L >= this.maxLv(u)) { G.Snd.nope(); this.fx('已经满级了', cx, cy, P.inkSoft); return false; }
      var price = u.cost[L];
      if ((G.S.money | 0) < price) { G.Snd.nope(); this.fx('钱不够', cx, cy, P.red); return false; }
      G.S.money -= price;
      this.lv[id] = L + 1;
      this.apply();
      if (G.Save) G.Save.save();
      G.Snd.cash();
      if (G.FX && G.FX.on) G.FX.on('buy', cx, cy, id);

        id: id,
        text: '升级成功 · ' + u.name.replace(/\s/g, '') + '：' + u.show(L + 1),
        life: 2.2
      };

      this.fx('-¥' + price, cx, cy + 14, P.orangeDk);

    },

    update: function (dt) {
      this.anim += dt;
      if (this.resetArm > 0) this.resetArm = Math.max(0, this.resetArm - dt);
      if (this.buyPulse) {
        this.buyPulse.life -= dt;
        if (this.buyPulse.life <= 0) this.buyPulse = null;
      }
      if (this.notice) {
        this.notice.life -= dt;
        if (this.notice.life <= 0) this.notice = null;
      }
      for (var i = this.floats.length - 1; i >= 0; i--) {
        var f = this.floats[i]; f.life += dt; f.y -= 40 * dt;
        if (f.life > f.ttl) this.floats.splice(i, 1);
      }
    },

    tap: function (x, y) {

      }
      if (G.inRect(x, y, BTN.reset)) {
        if (this.resetArm > 0) {
          this.resetArm = 0;
          if (G.Save) G.Save.reset();
          G.Snd.burn();
          this.fx('存档已清空', G.W / 2, BTN.reset.y - 14, P.red);
        } else {
          this.resetArm = 3;
          G.Snd.nope();
        }
        return;
      }
      if (G.inRect(x, y, BTN.broth)) {
        this.clearTransient();
        if (G.Night && G.Night.open) G.Night.open(G.S.nextDay || 1);
        else { G.Snd.nope(); this.fx('卤汤小游戏尚未加载', G.W / 2, BTN.broth.y - 14, P.inkSoft); }
        return;
      }
      if (G.inRect(x, y, BTN.bun)) {
        this.clearTransient();
        if (G.BunMini && G.BunMini.open) G.BunMini.open(G.S.nextDay || 1);
        else { G.Snd.nope(); this.fx('捏坯小游戏尚未加载', G.W / 2, BTN.bun.y - 14, P.inkSoft); }
        return;
      }
      this.resetArm = 0;
      for (var i = 0; i < UP.length; i++)
        if (G.inRect(x, y, UP[i].rect)) { this.buy(UP[i].id); return; }
    },

    /* ---------- 渲染 ---------- */
    /* 卡片 180×100：标题条 0..21（等级点靠右塞在里面）/ 图标居左 / 两行小字居右
       / 价格条 68..96。图标按 0.8 缩放画 —— 图标本身是照 ±24 的框画的，
       直接塞进 100 高的卡片会顶到标题条和价格条上。 */
    card: function (ctx, u) {
      var r = u.rect, cx = r.x + r.w / 2, tx = r.x + 52;
      var L = G.clamp(this.lv[u.id] | 0, 0, this.maxLv(u));
      var maxed = L >= this.maxLv(u);
      var price = maxed ? 0 : u.cost[L];
      var afford = !maxed && (G.S.money | 0) >= price;

      ctx.fillStyle = P.shadow;
      G.rrect(ctx, r.x + 3, r.y + 5, r.w, r.h, 14); ctx.fill();
      G.box(ctx, r.x, r.y, r.w, r.h, 14, maxed ? '#EDF7E6' : '#FFF1D6', 4);
      G.box(ctx, r.x, r.y, r.w, 21, 14, maxed ? P.greenDark : P.woodDark, 4);
      G.text(ctx, u.name, cx - 16, r.y + 10, { size: 13, col: P.cream });

      // 等级点：挪进标题条右端，省下卡片里一整行
      var n = this.maxLv(u);
      for (var i = 0; i < n; i++)
        G.circle(ctx, r.x + r.w - 10 - (n - 1 - i) * 9, r.y + 10, 3.2,
          i < L ? P.yellow : 'rgba(255,248,236,.28)', 1.6, 'rgba(58,36,24,.5)');

      ctx.save();
      ctx.translate(r.x + 28, r.y + 44); ctx.scale(0.8, 0.8);
      ICON[u.icon](ctx, 0, 0);
      ctx.restore();

      G.text(ctx, u.show(L), tx, r.y + 36,
        { size: 11, align: 'left', col: P.inkSoft, weight: 700 });
      G.text(ctx, maxed ? '已 满 级' : '→ ' + u.show(L + 1), tx, r.y + 53,
        { size: 11, align: 'left', col: maxed ? P.greenDark : P.orangeDk });

      // 价格条
      var py = r.y + 68, pw = r.w - 20;
      if (maxed) {
        G.box(ctx, r.x + 10, py, pw, 28, 14, P.green, 4, P.greenDark);
        G.text(ctx, '满 级', cx, py + 14, { size: 15, col: P.cream });
      } else {
        ctx.save();
        if (afford) { ctx.shadowColor = P.yellow; ctx.shadowBlur = 8 + Math.sin(this.anim * 8) * 4; }
        G.box(ctx, r.x + 10, py, pw, 28, 14,
          afford ? P.orange : '#EFE2CB', 4, afford ? P.orangeDk : '#C9B79A');
        ctx.restore();
        Art.coin(ctx, r.x + 30, py + 14, 10);
        G.text(ctx, '' + price, r.x + 46, py + 15,
          { size: 17, align: 'left', col: afford ? P.cream : P.inkSoft });
        if (!afford)
          G.text(ctx, '钱不够', r.x + r.w - 18, py + 15,
            { size: 11, align: 'right', col: P.inkSoft, weight: 700 });
      }

      /* 成功购买的卡片短暂呼吸，和下方效果说明条形成「点哪张、变了啥」
         的闭环；透明填充不会遮住卡片里刚更新的数值。 */
      if (this.buyPulse && this.buyPulse.id === u.id) {
        var pulse = 0.58 + Math.sin(this.anim * 10) * 0.18;
        ctx.save(); ctx.globalAlpha = pulse;
        G.box(ctx, r.x - 2, r.y - 2, r.w + 4, r.h + 4, 16,
          'rgba(255,255,255,0)', 5, P.greenDark);
        ctx.restore();
      }
    },

    render: function (ctx) {
      var day = G.S.nextDay || 1, i;

      // 底：墙 + 一层米色纱
      ctx.fillStyle = P.wall; ctx.fillRect(0, 0, G.W, G.H);
      ctx.fillStyle = P.wallDark;
      for (i = 0; i < 15; i++) ctx.fillRect(i * 66 + 22, 0, 16, G.H);
      ctx.fillStyle = 'rgba(255,248,236,.66)'; ctx.fillRect(0, 0, G.W, G.H);

      // 顶栏：钱 / 标题 / 下一天
      G.box(ctx, 8, 4, G.W - 16, 44, 13, 'rgba(255,248,236,.96)', 4);
      Art.coin(ctx, 34, 25, 13);
      G.text(ctx, '' + (G.S.money | 0), 52, 26, { size: 22, align: 'left', col: P.ink });
      G.text(ctx, '升 级 商 店', G.W / 2, 26, { size: 20, col: P.meatDark });
      var forecast = G.weatherFor ? G.weatherFor(day) : null;
      var nextScene = G.sceneFor ? G.sceneFor(day) : null;
      G.text(ctx, '下一天 · 第 ' + day + ' 天', G.W - 22, 17,
        { size: 13, align: 'right', col: P.inkSoft });
      G.text(ctx, (nextScene ? nextScene.short + ' · ' : '') +
        (forecast ? '天气预报：' + forecast.name : ''), G.W - 22, 34,
        { size: 11, align: 'right', col: forecast && forecast.col ? forecast.col : P.inkSoft, weight: 700 });

      for (i = 0; i < UP.length; i++) this.card(ctx, UP[i]);

      // 明天解锁什么 / 已投入多少
      var nx = null;
      if (G.UNLOCK) for (var key in G.UNLOCK) if (G.UNLOCK[key] === day) nx = key;
      if (this.notice && this.notice.life > 0) {
        G.box(ctx, 150, 363, G.W - 300, 26, 13, '#E4F2D9', 3, P.greenDark);
        G.text(ctx, this.notice.text, G.W / 2, 376,
          { size: 14, col: P.greenDark, stroke: P.cream, strokeW: 5 });
      } else {
        G.text(ctx,

      }

      // 开始营业
      var b = BTN.start, s = 1 + Math.sin(this.anim * 4) * 0.015;
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(s, s);
      ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
      ctx.fillStyle = P.shadow;
      G.rrect(ctx, b.x + 4, b.y + 7, b.w, b.h, 20); ctx.fill();
      G.box(ctx, b.x, b.y, b.w, b.h, 20, P.green, 5, P.ink);
      G.text(ctx, '开始第 ' + day + ' 天', b.x + b.w / 2, b.y + b.h / 2 + 1,
        { size: 25, col: P.cream });
      ctx.restore();

      // 清空存档（两次点击确认）
      var rb = BTN.reset, arm = this.resetArm > 0;

        arm ? P.red : 'rgba(255,248,236,.7)', 3, arm ? P.ink : '#C9B79A');
      G.text(ctx, arm ? '再点一次确认' : '清空存档',
        rb.x + rb.w / 2, rb.y + rb.h / 2 + 1,
        { size: 14, col: arm ? P.cream : P.inkSoft });

      var nb = BTN.broth;
      G.box(ctx, nb.x, nb.y, nb.w, nb.h, 16, '#E8D9BF', 3, P.woodDark);
      G.text(ctx, '续 命 卤 汤', nb.x + nb.w / 2, nb.y + nb.h / 2 + 1,
        { size: 14, col: P.meatDark, weight: 800 });
      var bb = BTN.bun;
      G.box(ctx, bb.x, bb.y, bb.w, bb.h, 16, '#E8D9BF', 3, P.woodDark);
      G.text(ctx, '打 馍 捏 坯', bb.x + bb.w / 2, bb.y + bb.h / 2 + 1,
        { size: 14, col: P.meatDark, weight: 800 });

      G.text(ctx, G.Save && G.Save.ok ? '进度自动存在这台浏览器里'

        G.W / 2, 504, { size: 12, col: P.inkSoft });

      for (i = 0; i < this.floats.length; i++) {
        var f = this.floats[i];
        ctx.globalAlpha = 1 - Math.pow(f.life / f.ttl, 3);
        G.text(ctx, f.txt, f.x, f.y,
          { size: 20, col: f.col, stroke: P.cream, strokeW: 6 });
      }
      ctx.globalAlpha = 1;
    }
  };

  /* base 快照：shop.js 加载时的原始 CFG */
  for (var k in G.CFG) Shop.base[k] = G.CFG[k];
  if (Shop.base.patienceBonus === undefined) Shop.base.patienceBonus = 0;
  /* keepRate 是「收摊盖布」引进来的新字段，game.js 里还没有默认值。
     在这儿补 0 = 「没买盖布就跟以前一模一样」，所以 game.js 那边就算暂时
     还没读它，商店这边也不会算歪。 */
  if (Shop.base.keepRate === undefined) Shop.base.keepRate = 0;

  /* ============ G.Save ============ */
  /* 「收摊盖布」留到明天的散料。存档里也得带上 —— 不然玩家关掉浏览器
     再回来，昨天特意剁满的一盆肉就凭空蒸发了，比不给这个升级还糟。
     数值一律洗成有限的非负数：坏存档不该把 NaN 克肉馅塞进台面。 */
  function keepOf(k) {
    if (!k || typeof k !== 'object') return null;
    var m = Math.max(0, +k.mince || 0), p = Math.max(0, +k.pep || 0);
    if (!isFinite(m) || !isFinite(p) || (m <= 0 && p <= 0)) return null;
    var f = +k.fat;
    if (!isFinite(f) || f < 0) f = null;
    return { mince: m, pep: p, fat: f === null ? null : Math.min(m, f) };
  }

  G.Save = {
    key: 'rjm.save.v1',
    ok: true,          // localStorage 是否真的可用
    best: 0,

    storyState: function () {
      var s = G.S || {}, p = {}, seen = [], rawSeen = s.comicNoticeSeen;
      if (G.Story && G.Story.CHAPTERS) {
        for (var i = 0; i < G.Story.CHAPTERS.length; i++) {
          var c = G.Story.CHAPTERS[i];
          var n = s.storyProgress && typeof s.storyProgress === 'object'
            ? +s.storyProgress[c.id] : 0;
          if (!isFinite(n) || n < 0) n = 0;
          p[c.id] = Math.min(c.target, Math.round(n));
        }
      }
      if (Array.isArray(rawSeen)) for (var si = 0; si < rawSeen.length && seen.length < 64; si++)
        if (typeof rawSeen[si] === 'string' && rawSeen[si] && seen.indexOf(rawSeen[si]) < 0)
          seen.push(rawSeen[si].slice(0, 40));
      return { flags: Math.max(0, (s.storyFlags | 0)) & 15, progress: p,
        ending: s.ending === 'A' || s.ending === 'B' ? s.ending : '',
        beat: typeof s.storyBeat === 'string' ? s.storyBeat.slice(0, 180) : '',
        beatDay: Math.min(999, Math.max(0, s.storyBeatDay | 0)),
        comicNoticeFlags: Math.max(0, Math.min(4294967295, Math.round(+s.comicNoticeFlags || 0))),
        comicNoticeSeen: seen,
        styleChop: Math.max(0, Math.min(G.CUT_STYLES.length - 1, s.chopStyle | 0)),
        styleBun: Math.max(0, Math.min(G.BUN_STYLES.length - 1, s.bunStyle | 0)) };
    },

    store: function () {
      // file:// 或 iframe 里可能直接抛，所以每次都探一下
      try {
        var ls = window.localStorage;
        if (!ls) return null;
        return ls;
      } catch (e) { return null; }
    },

    load: function () {
      var ls = this.store();
      if (!ls) { this.ok = false; G.Shop.sanitize(); G.Shop.apply(); return false; }
      var raw = null;
      try { raw = ls.getItem(this.key); } catch (e) { this.ok = false; }
      G.S.nextDay = 1;
      G.S.keep = null;
      G.S.hype = 0;
      G.S.shapeQuality = 0;
      G.S.storyFlags = 0;
      G.S.storyProgress = {};
      G.S.ending = '';
      G.S.storyBeat = '';
      G.S.storyBeatDay = 0;
      G.S.comicNoticeFlags = 0;
      G.S.comicNoticeSeen = [];
      G.S.eventIntroFlags = 0;
      G.S.chopStyle = 0;
      G.S.bunStyle = 0;
      if (this.ok && raw) {
        try {
          var d = JSON.parse(raw);
          if (d && typeof d === 'object') {
            G.S.money = Math.max(0, d.money | 0);
            this.best  = Math.max(0, d.best | 0);
            G.Shop.lv  = (d.lv && typeof d.lv === 'object') ? d.lv : {};
            G.S.nextDay = Math.min(999, Math.max(1, d.day | 0)) || 1;
            G.S.keep = keepOf(d.keep);   // 盖布留下的散料也得跨会话活下来
            G.S.hype = Math.min(9, Math.max(0, d.hype | 0));
            G.S.brothQuality = Math.min(1, Math.max(0, +d.brothQuality || 0));
            G.S.shapeQuality = Math.min(1, Math.max(0, +d.shapeQuality || 0));
            G.S.storyFlags = Math.max(0, d.storyFlags | 0) & 15;
            G.S.storyProgress = (d.storyProgress && typeof d.storyProgress === 'object' &&
              !Array.isArray(d.storyProgress)) ? d.storyProgress : {};
            G.S.ending = d.ending === 'A' || d.ending === 'B' ? d.ending : '';
            G.S.storyBeat = typeof d.storyBeat === 'string' ? d.storyBeat.slice(0, 180) : '';
            G.S.storyBeatDay = Math.min(999, Math.max(0, d.storyBeatDay | 0));
            G.S.comicNoticeFlags = Math.max(0, Math.min(4294967295,
              Math.round(+d.comicNoticeFlags || 0)));
            G.S.comicNoticeSeen = Array.isArray(d.comicNoticeSeen) ? d.comicNoticeSeen.slice(0, 64) : [];
            G.S.eventIntroFlags = Math.max(0, Math.min(2047, d.eventIntroFlags | 0));
            G.S.chopStyle = Math.max(0, Math.min(G.CUT_STYLES.length - 1, d.styleChop | 0));
            G.S.bunStyle = Math.max(0, Math.min(G.BUN_STYLES.length - 1, d.styleBun | 0));
          }
        } catch (e) { /* 存档坏了就当没有 */ }
      }
      if (G.Story && G.Story.sanitize) G.Story.sanitize();
      else {
        G.S.storyFlags = Math.max(0, G.S.storyFlags | 0) & 15;
        if (!G.S.storyProgress || typeof G.S.storyProgress !== 'object') G.S.storyProgress = {};
      }
      G.Shop.sanitize();
      G.Shop.apply();
      return true;
    },

    save: function () {
      var money = Math.max(0, G.S.money | 0);
      this.best = Math.max(this.best | 0, money);
      var ls = this.store();
      if (!ls) { this.ok = false; return false; }
      try {
        var story = this.storyState();
        ls.setItem(this.key, JSON.stringify({
          money: money, best: this.best, lv: G.Shop.lv,
          day: Math.min(999, Math.max(1, G.S.nextDay | 0)) || 1,
          keep: keepOf(G.S.keep),
          hype: Math.min(9, Math.max(0, G.S.hype | 0)),
          brothQuality: Math.min(1, Math.max(0, +G.S.brothQuality || 0)),
          shapeQuality: Math.min(1, Math.max(0, +G.S.shapeQuality || 0)),
          storyFlags: story.flags, storyProgress: story.progress, ending: story.ending,
          storyBeat: story.beat, storyBeatDay: story.beatDay,
          comicNoticeFlags: story.comicNoticeFlags,
          comicNoticeSeen: story.comicNoticeSeen,
          eventIntroFlags: Math.max(0, Math.min(2047, G.S.eventIntroFlags | 0)),
          styleChop: story.styleChop, styleBun: story.styleBun
        }));
        this.ok = true;
        return true;
      } catch (e) { this.ok = false; return false; }
    },

    reset: function () {
      G.S.money = 0;
      G.S.nextDay = 1;
      G.S.keep = null;
      G.S.hype = 0;
      G.S.brothQuality = 0;
      G.S.shapeQuality = 0;
      G.S.storyFlags = 0;
      G.S.storyProgress = {};
      G.S.ending = '';
      G.S.storyBeat = '';
      G.S.storyBeatDay = 0;
      G.S.comicNoticeFlags = 0;
      G.S.comicNoticeSeen = [];
      G.S.eventIntroFlags = 0;
      G.S.chopStyle = 0;
      G.S.bunStyle = 0;
      this.best = 0;
      G.Shop.lv = {};
      G.Shop.apply();
      G.Shop.clearTransient();
      var ls = this.store();
      if (!ls) { this.ok = false; return false; }
      try { ls.removeItem(this.key); return true; }
      catch (e) { this.ok = false; return false; }
    }
  };
})(window.G);

/* ===== js/night.js ===== */
/* 肉夹馍传奇 —— 关店小游戏：老卤汤续命
 *
 * 这是一个可跳过的轻量关卡：玩家按照今晚的配方点八角、桂皮、草果和老汤，
 * 总次数固定，比例越接近目标，下一天的卤香加成越高。它不改主循环的时间，
 * 只在商店页和下一天之间提供一个有选择的经营仪式。
 */
(function (G) {
  var P = G.PAL, W = G.W, H = G.H;
  var SPICE = [
    { id: 'star',  name: '八角',  col: '#B97832', note: '香气' },
    { id: 'bark',  name: '桂皮',  col: '#8E4B2E', note: '回甘' },
    { id: 'fruit', name: '草果',  col: '#5A7540', note: '厚味' },
    { id: 'broth', name: '老汤',  col: '#9B3D28', note: '底味' }
  ];
  var BTN = {
    skip: { x: 104, y: 454, w: 214, h: 42 },
    again: { x: 642, y: 454, w: 214, h: 42 }
  };

  function inBtn(x, y, r) { return G.inRect(x, y, r); }
  function total(a) {
    var n = 0;
    for (var i = 0; i < a.length; i++) n += a[i] | 0;
    return n;
  }
  function recipe(day) {
    /* 随天数略微变化，避免每晚都背同一张表；目标总量保持 12 次。 */
    var d = Math.max(1, day | 0);
    var variants = [
      [3, 2, 1, 6], [2, 4, 2, 4], [4, 1, 3, 4], [2, 3, 4, 3]
    ];
    return variants[(d + (G.S && G.S.day | 0)) % variants.length].slice();
  }
  function score(target, used) {
    var t = total(target), err = 0;
    for (var i = 0; i < target.length; i++) err += Math.abs((target[i] | 0) - (used[i] | 0));
    return G.clamp(1 - err / Math.max(1, t * 2), 0, 1);
  }
  function msg(q) {
    if (q >= 0.96) return '香气正好，老汤醒了';
    if (q >= 0.78) return '火候稳，明天有底气';
    if (q >= 0.55) return '能用，但还差一口老味';
    return '比例跑偏，明天得靠手艺救';
  }

  var N = G.Night = {
    BTN: BTN,
    SPICE: SPICE,
    target: [3, 2, 1, 6],
    used: [0, 0, 0, 0],
    total: 0,
    quality: null,
    resultT: 0,
    anim: 0,
    day: 1,

    open: function (day) {
      if (!G.S || G.S.mode !== 'shop') return false;
      this.day = Math.max(1, day | 0);
      this.target = recipe(this.day);
      this.used = [0, 0, 0, 0];
      this.total = 0;
      this.quality = null;
      this.resultT = 0;
      this.anim = 0;
      G.S.mode = 'night';
      G.Snd.put();
      return true;
    },

    finish: function (skip) {
      if (this.quality !== null) return false;
      this.quality = skip ? 0 : score(this.target, this.used);
      G.S.brothQuality = this.quality;
      this.resultT = 4;
      if (G.Snd[this.quality >= 0.78 ? 'done' : 'nope']) G.Snd[this.quality >= 0.78 ? 'done' : 'nope']();
      if (G.Shop && G.Shop.fx)
        G.Shop.fx((skip ? '跳过卤汤，明天靠现做' : msg(this.quality)),
          W / 2, 430, this.quality >= 0.78 ? P.greenDark : P.orangeDk);
      if (G.FX && G.FX.on)
        G.FX.on(this.quality >= 0.78 ? 'cash' : 'nope', W / 2, 220, this.quality);
      if (G.Save) G.Save.save();
      return true;
    },

    close: function () {
      G.S.mode = 'shop';
      this.resultT = 0;
      if (G.Snd.take) G.Snd.take();
    },

    update: function (dt) {
      dt = Math.max(0, +dt || 0);
      this.anim += dt;
      if (this.resultT > 0) this.resultT = Math.max(0, this.resultT - dt);
    },

    tap: function (x, y) {
      if (this.quality !== null) {
        if (inBtn(x, y, BTN.again) || this.resultT <= 0) this.close();
        return true;
      }
      if (inBtn(x, y, BTN.skip)) { this.finish(true); return true; }
      var left = total(this.target) - this.total;
      if (left <= 0) { this.finish(false); return true; }
      for (var i = 0; i < SPICE.length; i++) {

/* 肉夹馍传奇 —— 关店小游戏：打馍捏坯
 *
 * 三段小关卡：擀圆、打圈、压饼。命中中央不断变化的手感点即可把面团
 * 打得更规整；成绩只保留到下一天，不会把主循环变成必须反复刷的门槛。

(function (G) {
  if (!G) return;
  var P = G.PAL, W = G.W, H = G.H;
  var PHASE = [
    { id: 'roll',  name: '擀 圆', hint: '把面团擀开，边缘要圆', need: 5, r: 72, col: '#D39A52' },
    { id: 'twirl', name: '打 圈', hint: '顺着手感点连打几圈', need: 8, r: 62, col: '#D2660A' },
    { id: 'press', name: '压 饼', hint: '最后几下压出平整饼面', need: 4, r: 54, col: '#6F963E' }
  ];
  var BTN = {
    skip: { x: 104, y: 454, w: 214, h: 42 },

  };

  var Mini = G.BunMini = {
    BTN: BTN,
    PHASE: PHASE,
    stage: 0,
    hits: 0,
    misses: 0,
    elapsed: 0,
    timeLeft: LIMIT,
    quality: null,
    resultT: 0,
    hitT: 0,
    missT: 0,
    anim: 0,
    day: 1,

    target: function () {
      var p = this.stage, a;
      if (p === 0) return { x: CX, y: CY };
      if (p === 1) {
        a = this.anim * 3.6;
        return { x: CX + Math.cos(a) * 54, y: CY + Math.sin(a) * 28 };
      }
      a = this.anim * 4.4;
      return { x: CX + Math.sin(a) * 42, y: CY + Math.cos(a * 0.83) * 22 };
    },

    open: function (day) {
      if (!G.S || G.S.mode !== 'shop') return false;
      this.day = Math.max(1, day | 0);
      this.stage = 0; this.hits = 0; this.misses = 0;
      this.elapsed = 0; this.timeLeft = LIMIT; this.quality = null;
      this.resultT = 0; this.hitT = 0; this.missT = 0; this.anim = 0;
      G.S.mode = 'bunmini';
      if (G.Snd && G.Snd.put) G.Snd.put();
      return true;
    },

    score: function () {
      var total = needTotal();
      var hitRatio = G.clamp(this.hits / Math.max(1, total), 0, 1);
      var accuracy = G.clamp(this.hits / Math.max(1, this.hits + this.misses), 0, 1);
      var speed = G.clamp(1 - this.elapsed / LIMIT, 0, 1);
      return G.clamp(0.30 + hitRatio * 0.55 + accuracy * 0.10 + speed * 0.05, 0, 1);
    },

    finish: function (skip) {
      if (this.quality !== null) return false;
      this.quality = skip ? 0 : this.score();
      this.resultT = 4;
      if (G.S) G.S.shapeQuality = this.quality;
      if (G.Snd) {
        if (this.quality >= 0.78 && G.Snd.done) G.Snd.done();
        else if (G.Snd.nope) G.Snd.nope();
      }
      if (G.Shop && G.Shop.fx)
        G.Shop.fx(skip ? '跳过捏坯，明天按普通手法做' :
          '饼坯规整度 ' + Math.round(this.quality * 100) + '%',
          W / 2, 430, this.quality >= 0.78 ? P.greenDark : P.orangeDk);
      if (G.FX && G.FX.on)
        G.FX.on(this.quality >= 0.78 ? 'cash' : 'nope', W / 2, 220, this.quality);

    close: function () {
      if (G.S) G.S.mode = 'shop';

    update: function (dt) {

      if (this.resultT > 0) this.resultT = Math.max(0, this.resultT - dt);
      if (this.quality !== null) return;
      this.elapsed += dt;
      this.timeLeft = Math.max(0, LIMIT - this.elapsed);
      if (this.hitT > 0) this.hitT = Math.max(0, this.hitT - dt);
      if (this.missT > 0) this.missT = Math.max(0, this.missT - dt);

    },

    tap: function (x, y) {

            if (G.Snd && G.Snd.tutStep) G.Snd.tutStep();
          }
        }
      } else {
        this.misses++;
        this.missT = 0.16;
        if (G.Snd && G.Snd.nope && this.missT <= 0.16) G.Snd.nope();
      }
      return true;
    },

    render: function (ctx) {
      if (G.Art && G.Art.scene) G.Art.scene(ctx);
      if (G.Art && G.Art.counter) G.Art.counter(ctx);
      ctx.fillStyle = 'rgba(26,16,10,.72)'; ctx.fillRect(0, 0, W, H);
      G.box(ctx, 72, 28, 816, 486, 18, '#FFF1D6', 5, P.ink);
      G.text(ctx, '关 店 后 · 打 馍 捏 坯', W / 2, 68,
        { size: 27, col: P.meatDark });
      G.text(ctx, '第 ' + this.day + ' 天的面 · 三段手感，越稳越规整',

      var p = phase(), t = this.target(), done = 0;
      for (var i = 0; i < this.stage && i < PHASE.length; i++) done += PHASE[i].need;
      var local = Math.max(0, this.hits - done);
      var progress = this.quality === null ? this.hits / Math.max(1, needTotal()) :
        (this.quality > 0 ? 1 : 0);
      G.text(ctx, this.quality === null ? p.name + ' · ' + local + '/' + p.need :
        '饼坯已经收好', W / 2, 126, { size: 20, col: p.col, weight: 800 });
      G.text(ctx, this.quality === null ? p.hint :
        '规整度决定明天每个高质量馍的额外小费',
        W / 2, 150, { size: 13, col: P.inkSoft });

      /* 中央面团和手感点 */
      if (G.Art && G.Art.dough) G.Art.dough(ctx, CX, CY, this.quality === null ?
        G.clamp(this.hits / Math.max(1, needTotal()), 0, 1) : 1, 94);
      else G.circle(ctx, CX, CY, 78, '#F2DDB5', 4, P.woodDark);
      if (this.quality === null) {
        ctx.save(); ctx.globalAlpha = 0.30 + Math.sin(this.anim * 8) * 0.10;
        G.circle(ctx, t.x, t.y, p.r + 18, null, 4, p.col); ctx.restore();
        G.circle(ctx, t.x, t.y, p.r, 'rgba(255,248,236,.12)', 3, p.col);
        G.text(ctx, '点这里', t.x, t.y + 5, { size: 14, col: p.col, weight: 800 });
      } else if (G.Art && G.Art.bun) {
        G.circle(ctx, CX, CY - 2, 92, 'rgba(122,156,61,.12)', 4, P.green);
        G.text(ctx, Math.round(this.quality * 100) + '%', CX, CY + 8,
          { size: 28, col: P.greenDark, weight: 900 });
      }
      if (this.hitT > 0) {
        ctx.globalAlpha = this.hitT / 0.18;
        G.circle(ctx, t.x, t.y, p.r + (1 - this.hitT / 0.18) * 18,
          null, 4, P.green); ctx.globalAlpha = 1;
      }
      if (this.missT > 0) {
        ctx.globalAlpha = this.missT / 0.16;
        G.text(ctx, '偏了！', CX, CY + 122, { size: 16, col: P.red, weight: 800 });
        ctx.globalAlpha = 1;
      }

      G.bar(ctx, 326, 338, 308, 12, progress,
        this.quality === null ? p.col : this.quality >= 0.78 ? P.green : P.orange);
      G.text(ctx, '剩余时间 ' + Math.ceil(this.timeLeft) + 's · 失手 ' + this.misses,
        W / 2, 365, { size: 12, col: P.inkSoft });
      for (i = 0; i < PHASE.length; i++) {
        var px = W / 2 - 104 + i * 104;
        var got = i < this.stage || this.quality !== null && i < PHASE.length;
        G.circle(ctx, px, 397, 8, got ? P.green : '#E6D8C0', 2, got ? P.greenDark : P.woodDark);
        G.text(ctx, PHASE[i].name, px, 420,
          { size: 11, col: got ? P.greenDark : P.inkSoft, weight: 700 });
      }

      G.box(ctx, BTN.skip.x, BTN.skip.y, BTN.skip.w, BTN.skip.h, 15, '#E8D9BF', 3, P.woodDark);
      G.text(ctx, this.quality === null ? '跳过（普通手法）' : '返回升级商店',
        BTN.skip.x + BTN.skip.w / 2, BTN.skip.y + 22, { size: 14, col: P.meatDark });
      G.box(ctx, BTN.again.x, BTN.again.y, BTN.again.w, BTN.again.h, 15,
        this.quality === null ? '#DDEBD3' : P.green, 3, P.ink);
      G.text(ctx, this.quality === null ? '做完自动收好' : '收好面团 · 继续',
        BTN.again.x + BTN.again.w / 2, BTN.again.y + 22,
        { size: 14, col: this.quality === null ? P.greenDark : P.cream, weight: 800 });
      if (this.quality !== null)
        G.text(ctx, '明天每个规整馍最高 +¥' + (G.CFG.shapePay || 0),
          W / 2, 486, { size: 13, col: P.inkSoft });
    }
  };
})(window.G);

/* ===== js/fx.js ===== */
/* 肉夹馍传奇 —— P4 特效层：粒子 / 屏幕震动 / 转场 / 数字滚动
   纯表现层：不含任何玩法逻辑，整份文件删掉游戏照样能玩。
   对外只暴露 G.FX，全部调用点在 game.js / main.js 里都有 if (G.FX) 守卫。

   ---- 为什么有一张分级表（见下面的 LV）----
   特效层最容易烂的方式不是「少」，是「什么都闪一下」：剁一刀震、放个馍震、
   顾客走两步也震，结果真正会亏钱的事（跑单、烤糊、收摊白扔的料）和背景噪音
   一样响，玩家反而什么都没注意到。所以震动 / 闪白 / 暗角这三样「全屏级」的
   手段不再由各个 case 自己随手写数，一律走 hit(kind) 查表，档位规则是：

     A 必须看见 —— 不可逆的亏损。允许暗角，震动最高 4.2（只有跑单到顶）
     B 看见更好 —— 玩家自己挣来的节点。震动 ≤ 2.0，闪白 ≤ 0.34，不许暗角
     C 纯装饰   —— 按住剁 / 拖着搅这类每秒好几次的动作。震动 ≤ 1.0，
                   不许闪白、不许暗角（高频 × 全屏 = 持续抖屏）

   表是数据不是注释，harness_fx.js 直接读 G.FX.grade 断言这三条上界，
   以后再加东西不会悄悄越来越吵。 */
(function (G) {

  var purseR = 0;     // 钱袋「往外掏钱」的红脉冲 0..1
  var mixT  = 0;      // 搅拌粒子节流

  var fl = 0, flCol = P.cream;    // 全屏闪白/闪红

    cashbig: { t: B, sh: 1.6, fl: 0.24, vg: 0 },   // 加肉单：靠颜色和肉屑区分，不靠更大的震
    combo:   { t: B, sh: 1.6, fl: 0.16, vg: 0 },   // 上界；实际按连击段位缩放，5 连以下不震

    dayend:  { t: B, sh: 0,   fl: 0.34, vg: 0 },   // 下一帧结算面板就盖住整屏了，震给谁看
    gust:    { t: B, sh: 0,   fl: 0,    vg: 0 },
