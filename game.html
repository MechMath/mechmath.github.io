    miss:    { t: C, sh: 0,   fl: 0, vg: 0 }
  };
  /* vc 只存名字，真正的颜色在这儿取 —— 表里放 P.xxx 会被 P1 追加的配色坑到 */
  function vcol(n) {
    return n === 'burn' ? '#2A1C12' : n === 'dull' ? '#6B5B45' :
           n === 'orange' ? P.orange : n === 'ev' ? evCol : P.red;
  }
  var evCol = P.red;                     // evwarn 的暗角跟着事件自己的色走

  /* 全屏三件套的唯一出口。k 是 0..1 的缩放，让同一个 kind 能按轻重收放，
     但永远超不过表里给它定的上界。 */
  function hit(kind, k) {
    var g = LV[kind]; if (!g) return;
    k = num(k, 1); if (k <= 0) return; if (k > 1) k = 1;
    if (g.sh > 0) shake(g.sh * k);
    if (g.fl > 0) flash(g.t === A ? P.red : '#FFE9B8', g.fl * k);
    if (g.vg > 0) vignette(vcol(g.vc), g.vg * k);
  }

  /* 事件层那十一种意外各自的颜色和轻重。heavy 的才配拿到暗角 + 震动。 */
  var EV = {
    wind:    { col: '#5E7A8C', heavy: 0 },   // 冷灰蓝：整个摊子都是暖色，奶白的环画上去看不见
    bigask:  { col: '#8E2B22', heavy: 0 },
    friend:  { col: '#F58220', heavy: 0 },
    rat:     { col: '#6E5B48', heavy: 1 },
    inspect: { col: '#8B9AA5', heavy: 1 },
    rival:   { col: '#7A4FC0', heavy: 1 },
    fly:     { col: '#4A4036', heavy: 0 },
    cat:     { col: '#8A6A48', heavy: 0 },
    nag:     { col: '#D2660A', heavy: 0 },
    outage:  { col: '#8B9AA5', heavy: 1 }
  };

  /* 菜品配色，用于「做出成品 / 递出」的碎屑 */
  var ICOL = {
    rjm:  [P.bunGood, P.meat,     P.meatLite],
    rjmp: [P.bunGood, P.meat,     P.pepper  ],
    lp:   [P.noodle,  P.chiliOil, P.pepperLt],
    bf:   [P.soda,    P.ice,      P.cream   ]
  };
  function icol(id) { return ICOL[id] || [P.yellow, P.orange, P.cream]; }

  function spawn(k, x, y, o) {
    if (ps.length >= CAP) ps.shift();
    ps.push({
      k: k, x: x, y: y, ox: x, oy: y,
      vx: o.vx || 0, vy: o.vy || 0, g: o.g || 0,
      s: o.s || 6, s2: o.s2 || 0,
      rot: o.rot || 0, spin: o.spin || 0,
      col: o.col || P.cream,
      life: 0, ttl: o.ttl || 0.5,
      tx: o.tx || 0, ty: o.ty || 0,
      txt: o.txt || null, out: o.out || 0
    });
  }

  /* 碎屑：带旋转的小方块，肉末 / 青椒粒 / 星星屑都用它 */
  function bits(x, y, n, cols, up, size) {
    for (var i = 0; i < n; i++)
      spawn('bit', x + G.rand(-6, 6), y + G.rand(-5, 5), {
        vx: G.rand(-150, 150), vy: G.rand(-up, -up * 0.35),
        g: 940, s: size || G.rand(4, 9), col: G.pick(cols),
        rot: G.rand(0, 6.28), spin: G.rand(-14, 14), ttl: G.rand(0.35, 0.72)
      });
  }
  /* 往下掉的碎屑：收摊扫台面、烤糊掉渣都用它 —— 方向本身就是「没了」的语气 */
  function fall(x, y, n, cols, spread, big) {
    for (var i = 0; i < n; i++)
      spawn('bit', x + G.rand(-spread, spread), y + G.rand(-6, 6), {
        vx: G.rand(-46, 46), vy: G.rand(30, 110),
        g: 980, s: big ? G.rand(7, 13) : G.rand(4, 8), col: G.pick(cols),
        rot: G.rand(0, 6.28), spin: G.rand(-8, 8), ttl: G.rand(0.42, 0.9)
      });
  }
  function sparks(x, y, n, cols, sp) {
    for (var i = 0; i < n; i++) {
      var a = G.rand(0, 6.283), v = G.rand(sp * 0.35, sp);
      spawn('spark', x, y, {
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3,
        g: 520, s: G.rand(2.5, 5.5), col: G.pick(cols), ttl: G.rand(0.3, 0.6)
      });
    }
  }
  function puffs(x, y, n, col, rise) {
    for (var i = 0; i < n; i++)
      spawn('puff', x + G.rand(-12, 12), y + G.rand(-6, 6), {
        vx: G.rand(-24, 24), vy: -rise * G.rand(0.6, 1.2),
        s: G.rand(5, 11), s2: G.rand(16, 26), col: col, ttl: G.rand(0.5, 1.0)
      });
  }
  /* 灶上那团糊了的烟。不用 puffs 是因为它得更高、更久、更浅 ——
     灶膛本来就是深色的，深灰烟在上面等于没画。 */
  function smoke(x, y) {
    spawn('puff', x, y, {
      vx: G.rand(-16, 16), vy: -G.rand(62, 92),
      s: 6, s2: G.rand(24, 34), col: 'rgba(104,96,90,.70)', ttl: G.rand(1.0, 1.4)
    });
  }
  function ring(x, y, col, r0, r1, ttl) {
    spawn('ring', x, y, { s: r0, s2: r1, col: col, ttl: ttl || 0.42 });
  }
  function stars(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = G.rand(0, 6.283), v = G.rand(70, 210);
      spawn('star', x, y, {
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 240,
        s: G.rand(6, 12), col: G.pick([P.yellow, '#FFE08A', P.cream]),
        rot: G.rand(0, 6.28), spin: G.rand(-9, 9), ttl: G.rand(0.5, 0.85)
      });
    }
  }
  function coins(x, y, n) {
    for (var i = 0; i < n; i++)
      spawn('coin', x + G.rand(-18, 18), y + G.rand(-10, 10), {
        s: G.rand(7, 10), s2: G.rand(-70, 70), col: P.yellow,
        tx: COIN_X, ty: COIN_Y, ttl: G.rand(0.5, 0.78)
      });
  }
  /* 反着飞的硬币：从钱袋掏出去。玩家把「我刚抓多了」和「我亏钱了」连起来，
     靠的就是这段轨迹 —— 一行红字飘过是连不起来的。 */
  function coinsOut(x, y, n) {
    for (var i = 0; i < n; i++)
      spawn('coin', COIN_X, COIN_Y, {
        s: G.rand(6, 9), s2: G.rand(-60, 60), col: P.yellow, out: 1,
        tx: x + G.rand(-14, 14), ty: y + G.rand(-8, 8), ttl: G.rand(0.42, 0.62)
      });
  }
  /* 会弹一下的大字。连击段位、加肉标记这类「要有排面」的东西靠它，
     比再多撒一把星星便宜得多（一次 fillText，不建渐变）。 */
  function numeral(x, y, txt, col, size, ttl) {
    /* 夹得比看上去需要的更靠里：字还要往上飘一小段，而且弹到 1.18 倍时
       半个字高又要多占十几像素 —— 飘出画布的字等于没写。 */
    spawn('num', G.clamp(x, 58, G.W - 58), G.clamp(y, 62, G.H - 36), {
      s: size, col: col, txt: String(txt), ttl: ttl || 0.82, vy: -24
    });
  }
  /* 横掠的细条：穿堂风。一条 line，比撒纸屑省得多，方向感反而更强 */
  function streaks(x, y, n, dir) {
    for (var i = 0; i < n; i++)
      spawn('streak', G.clamp(x + G.rand(-150, 150), 24, G.W - 24),
                      G.clamp(y + G.rand(-46, 46), 24, G.H - 24), {
        vx: dir * G.rand(620, 980), s: G.rand(34, 78),
        /* 偏深的线条：这一带（工位面板、台面）本来就是米色和浅木色，
           奶白的风线画上去等于没画 */
        col: i % 3 ? 'rgba(107,74,50,.40)' : 'rgba(255,248,236,.75)',
        ttl: G.rand(0.24, 0.44)
      });
  }

  /* 网红成功后的短弹幕雨：文字从各处飘过，持续不到两秒，
     只占粒子池的一小段预算。内容既是奖励反馈，也把序章的数学梗带回玩法。 */
  var DAN = ['退学不退饭', '这馍有定理', '一口入魂', '老陕认证', '香迷糊了', '博士转行成功'];
  function danmaku() {
    for (var i = 0; i < 14; i++) {
      spawn('danmu', G.rand(110, G.W - 110), G.rand(76, 378), {
        vx: G.rand(-22, 22), vy: G.rand(-14, -5), g: 0,
        s: G.rand(12, 17), col: G.pick([P.cream, '#FFE08A', '#FFD1E4', '#C7E8F2']),
        txt: DAN[i % DAN.length], ttl: G.rand(1.15, 1.85)
      });
    }
  }

  function shake(a) { a = num(a, 0); if (a > shk) shk = a; }
  /* 颜色只跟着「赢了的那一层」走：更弱的一次调用不该把正在播的闪白改色 */
  function flash(c, v) { v = num(v, 0); if (v > fl) { fl = v; flCol = c; } }
  function vignette(c, v) { v = num(v, 0); if (v > vig) { vig = v; vigCol = c; } }

  /* 刚推进铁盘的那一份 —— 「加肉 / 正好 / 手抖」全靠它区分。
     game.js 的 make 事件只带 type，不带克数；与其让 game.js 多传一个参数，
     不如在这儿看一眼刚 push 进去的东西，摘掉本文件这段代码一起消失。 */
  function lastMade() {
    var S = G.S;
    if (!S || !S.tray || !S.tray.length) return null;
    var it = S.tray[S.tray.length - 1];
    return (it && typeof it === 'object') ? it : null;
  }
  /* 0=不是肉夹馍 1=普通正好 2=加肉正好 3=落偏了 */
  function portion(it) {
    var C = G.CFG;
    if (!it || !C || (it.type !== 'rjm' && it.type !== 'rjmp')) return 0;
    var m = num(it.meat, -1); if (m < 0) return 0;
    var jr = num(C.justRight, 1.22), bn = num(C.bunNeed, 80), bg = num(C.bigNeed, 130);
    if (m >= bg && m <= bg * jr) return 2;
    if (m <= bn * jr) return 1;
    return 3;
  }

  /* ---------- 事件入口 ---------- */
  function on(name, x, y, extra) {
    // 缺参数就落在屏幕中间，不能崩；再夹回画布内，免得环和大字画到看不见的地方
    x = G.clamp(num(x, G.W / 2), 2, G.W - 2);
    y = G.clamp(num(y, G.H / 2), 2, G.H - 2);

    switch (name) {
      case 'chop':
        bits(x, y - 8, 5, [P.meat, P.meatLite, P.meatDark], 260);
        puffs(x, y, 1, 'rgba(190,150,110,.5)', 30);
        hit('chop'); break;

      case 'cut':
        bits(x, y - 8, 5, [P.pepper, P.pepperLt, P.pepperDk], 250);
        hit('cut'); break;

      case 'mince':
        bits(x, y - 10, 11, [P.meat, P.meatLite, P.meatDark], 330);
        ring(x, y, P.meat, 8, 40);
        hit('mince'); break;

      case 'pep':
        bits(x, y - 10, 11, [P.pepper, P.pepperLt, P.pepperDk], 320);
        ring(x, y, P.pepperDk, 8, 40);
        hit('pep'); break;

      case 'bunput':
        puffs(x, y, 2, 'rgba(210,180,140,.55)', 34);
        sparks(x, y, 3, [P.bunRaw, P.cream], 90); break;

      case 'bun':
        ring(x, y, P.green, 10, 44);
        sparks(x, y, 5, [P.bunGood, P.cream, P.yellow], 130);
        hit('bun'); break;

      /* 把炉子上那块糊的铲掉：是收拾残局，不是坏事发生的那一刻。
         真正该把人吓一跳的是 charred，所以这里从「暗角 + 6.2 震」降到只剩烟。 */
      case 'burn':
        puffs(x, y - 10, 6, 'rgba(90,86,82,.62)', 74);
        bits(x, y, 4, [P.bunBurn, '#2A1C12'], 200);
        hit('burn'); break;

      /* 馍在炉上烤糊那一刻。玩家多半正低头剁肉，没有全屏提示就真的发现不了，
         而这一份是连面团带那 9 秒炉位一起白费的 —— A 档。
         之后 grillWatch 会持续冒烟，扭头时也认得出是哪个灶眼。 */
      case 'charred':
        puffs(x, y - 12, 7, 'rgba(58,50,44,.72)', 92);
        bits(x, y, 6, [P.bunBurn, '#2A1C12', '#7A3B18'], 250);
        ring(x, y, '#FF7A2B', 10, 52, 0.55);      // 余烬橙；深棕环在深色灶膛上看不见
        numeral(x, y - 46, '糊了', '#E4433A', 22, 0.9);
        hit('charred'); break;

      case 'pop':
        sparks(x, y - 14, 12, [P.ice, P.iceDk, P.cream], 250);
        puffs(x, y - 20, 4, 'rgba(207,235,247,.75)', 90);
        ring(x, y - 12, P.ice, 6, 48);
        hit('pop'); break;

      case 'mix':
        if (tt - mixT < 0.06) break;        // 拖动时会高频触发，必须节流
        mixT = tt;
        sparks(x + G.rand(-14, 14), y + G.rand(-10, 6), 2,
          [P.chiliOil, P.chili, P.noodle], 95);
        break;

      case 'mixdone':
        bits(x, y - 8, 10, [P.chiliOil, P.chili, P.noodle, P.pepperLt], 280);
        ring(x, y, P.chiliOil, 10, 50);
        hit('mixdone'); break;

      /* 做好一份。份量落在哪个窗口，这一下就得看得出来 ——
         加肉份多一圈肉红的环和一把肉屑，落偏的往下掉两团灰。 */
      case 'make':
        var mk = portion(lastMade());
        bits(x, y - 6, mk === 2 ? 11 : 8, icol(extra), 280);
        /* 环的颜色就是这一份的判词：金 = 正好、肉红 = 加肉正好、灰 = 手抖了。
           同一个位置、同一个形状、只换颜色，扫一眼就分得开，也不多占一分预算。 */
        ring(x, y, mk === 2 ? P.meatDark : mk === 3 ? '#A08A6E' : P.yellow,
             10, mk === 2 ? 54 : 46);
        if (mk === 2) {
          ring(x, y, P.meatLite, 6, 34, 0.34);
          numeral(x, y - 40, '加肉', '#8E2B22', 18, 0.7);
        } else if (mk === 3) {
          on('miss', x, y);
        }
        hit('make'); break;

      /* 份量落偏：没扣钱也没奖励，所以只给一点「散了」的语气，不给声势 */
      case 'miss':
        puffs(x + 8, y + 4, 2, 'rgba(120,104,86,.42)', -18);
        fall(x, y + 6, 3, ['#9A8467', '#B39A78'], 8);
        break;

      case 'serve':
        sparks(x, y, 6, icol(extra), 140); break;

      case 'cash':
        var amt = num(extra, 10);
        coins(x, y, G.clamp(Math.round(amt / 5) + 2, 3, 8));
        stars(x, y - 10, 5);
        hit('cash'); break;

      /* 加肉单结账：和普通单同色同量就等于没区分。多的是肉红的环、
         一把肉屑和一块「加肉」牌子 —— 靠形状认，不靠更大的震。 */
      case 'cashbig':
        var amtB = num(extra, 15);
        coins(x, y, G.clamp(Math.round(amtB / 5) + 3, 4, 9));
        stars(x, y - 10, 6);
        ring(x, y, P.meatDark, 12, 62, 0.5);
        ring(x, y, P.yellow, 8, 40, 0.34);
        bits(x, y - 4, 7, [P.meat, P.meatLite, P.bunGood], 300);
        numeral(x, y - 52, '加肉', '#8E2B22', 19, 0.9);
        hit('cashbig'); break;

      case 'hype':
        danmaku();
        stars(x, y - 12, 8);
        break;

      /* 拿新料要花钱。红字飘一行玩家是连不上因果的，所以让硬币从 HUD 的
         钱袋里飞出来落到手上 —— 钱是从那儿走的，看一眼就懂。 */
      case 'cost':
        var amtC = Math.abs(num(extra, 4));
        coinsOut(x, y, G.clamp(Math.round(amtC / 4), 1, 4));
        purseR = 1;
        puffs(x, y - 6, 1, 'rgba(228,67,58,.30)', 26);
        hit('cost'); break;

      /* 手稳连击 —— 游戏里唯一的「技术回报」。1~2 连只是点头，
         5 连开始上震动和闪，8 连给整套。不这么拉开，玩家不会去追。 */
      case 'combo':
        comboBurst(x, y, Math.round(num(extra, 1)), portion(lastMade()) === 2);
        cPrev = num(G.S && G.S.combo, cPrev);   // game.js 显式调过了，watcher 别再补一次
        break;

      case 'combobrk':
        var nb = Math.round(num(extra, 0));
        ring(x, y, '#8B7B63', 46, 8, 0.36);          // 反向收缩：连击在往回缩
        fall(x, y, 4, ['#8B7B63', '#6B5B45'], 14);
        if (nb >= 3) { numeral(x, y - 30, '×' + nb + ' 断', '#6B4A32', 17, 0.7); hit('combobrk'); }
        break;

      case 'angry':
        bits(x, y, 8, [P.red, '#B4302A', P.cream], 220);
        puffs(x, y - 12, 2, 'rgba(228,67,58,.4)', 40);
        hit('angry'); break;

      case 'walk':
        puffs(x, y, 5, 'rgba(140,128,112,.5)', 46);
        hit('walk'); break;

      case 'rush':
        rush = 1; hit('rush'); break;

      case 'daystart':
        tr = 1; trV = -1 / 0.6;            // 卷帘拉开
        flash(P.cream, LV.daystart.fl); break;

      /* 收摊：台面上剩的料是真按钱扣在结算页上的（「其中·收摊剩料」），
         可原来那一刻画面上什么都没发生。现在让每个还有货的工位往台面下
         掉一把 —— 结算面板是半透明压在上面的，正好当那行字的注脚。 */
      case 'dayend':
        hit('dayend');
        on('waste', G.W / 2, G.H / 2, (G.S && G.S.dayWaste) || 0);
        break;

      case 'waste':
        wasteSweep(num(extra, 0));
        break;

      case 'nope':
        hit('nope'); break;

      case 'buy':
        stars(x, y, 9);
        sparks(x, y, 6, [P.yellow, '#FFE08A', P.orange], 150);
        hit('buy'); break;

      /* 意外上门。轻的（风、加肉、带朋友）只给一圈本色的环，
         重的（老鼠、卫生检查、对面支摊）才配拿暗角和震动。 */
      case 'evwarn':
        var ew = EV[extra];
        if (!ew) ew = { col: P.orangeDk, heavy: 0 };
        ring(x, y, ew.col, 14, ew.heavy ? 76 : 54, ew.heavy ? 0.58 : 0.44);
        sparks(x, y, ew.heavy ? 7 : 4, [ew.col, P.cream], ew.heavy ? 160 : 110);
        if (ew.heavy) {
          ring(x, y, ew.col, 8, 44, 0.34);
          evCol = ew.col;
          hit('evwarn');
        }
        break;

      /* 化解掉了：环往回收 + 一圈绿，和「上门」那一下方向正好相反 */
      case 'evclear':
        var ec = EV[extra];
        ring(x, y, '#3FBF63', 58, 10, 0.4);
        sparks(x, y, 6, ['#3FBF63', P.cream, ec ? ec.col : P.green], 130);
        if (ec && ec.heavy) { stars(x, y - 6, 4); hit('evclear'); }
        break;

      case 'gust':
        streaks(x, y, 6, num(extra, 1) < 0 ? -1 : 1);
        hit('gust'); break;

      default: break;                       // 未知事件静默忽略
    }
  }

  /* 连击的四个段位。分档而不是线性放大 —— 线性的话玩家分不出 4 连和 5 连，
     台阶感才是「我又上了一级」。 */
  function comboBurst(x, y, n, big) {
    if (!(n > 0)) n = 1;
    if (n > 99) n = 99;
    var k = G.clamp((n - 1) / 7, 0, 1);          // 1 连 0 → 8 连 1
    var gold = n >= 5 ? P.orange : n >= 3 ? P.yellow : '#3FBF63';
    /* 排面靠「环越叠越多、越叠越暖」，不靠字越写越大：
       连击数在 HUD 上已经有一块常驻牌子（art.js），game.js 自己还飘一行
       「手稳 ×N +¥B」—— 这儿再写第三遍就是纯噪音。 */
    ring(x, y, gold, 10, 40 + k * 26, 0.4 + k * 0.16);
    sparks(x, y, 3 + Math.round(k * 5), [gold, P.cream, '#FFE08A'], 120 + k * 90);
    if (n >= 3) stars(x, y - 8, 3 + Math.round(k * 5));
    if (n >= 5) ring(x, y, P.yellow, 26, 76, 0.56);          // 第二圈错开，像一声「叮」的余韵
    if (n >= 8) {
      ring(x, y, '#FF7A2B', 44, 104, 0.66);
      bits(x, y - 6, 6, [P.orange, P.yellow, '#FFE08A'], 300);
    }
    /* 只在上台阶的那一下盖个戳：3 / 5 / 8，之后每 4 连一次。
       每连都盖的话它就变成背景，台阶感恰恰来自「不是每次都有」。 */
    if (n === 3 || n === 5 || n === 8 || (n > 8 && (n - 8) % 4 === 0))
      numeral(x, y - 96, n + ' 连', n >= 8 ? '#D2660A' : '#C8880A', 20 + k * 8, 0.8);
    if (big) numeral(x + 54, y - 14, '加肉', '#8E2B22', 15, 0.6);
    hit('combo', n < 5 ? 0 : (n - 4) / 4);        // 5 连以下不震不闪
  }

  /* 收摊那一刻，台面上每个还有货的工位往下掉一把。
     总量封在 26 个粒子以内 —— 这是转场帧，不该为它挤掉别的。 */
  function wasteSweep(amt) {
    var S = G.S;
    if (!S) return;
    /* 这一下要在结算面板的半透明黑布底下还看得出来（drawResult 先画 drawPlay
       再蒙一层 0.68 的黑），所以粒子给大、给多，宁可糙一点。 */
    var budget = 30;
    function drop(pt, n, cols, sp) {
      if (!pt || n <= 0 || budget <= 0) return;
      n = Math.min(n, budget); budget -= n;
      var px = G.clamp(num(pt.x, G.W / 2), 6, G.W - 6);
      var py = G.clamp(num(pt.y, G.H / 2), 6, G.H - 6);
      fall(px, py, n, cols, sp, 1);
      puffs(px, py + 6, 1, 'rgba(150,132,110,.46)', 10);
    }
    var mince = num(S.mince, 0), pep = num(S.pep, 0), bun = num(S.bun, 0) | 0;
    if (mince > 1) drop(G.PILE, G.clamp(Math.round(mince / 90), 2, 8),
      [P.meat, P.meatDark, P.meatLite], 20);
    if (pep > 1) drop(G.PPILE, G.clamp(Math.round(pep / 36), 2, 5),
      [P.pepper, P.pepperDk, P.pepperLt], 16);
    if (S.slot) drop(G.BSLOT, 3, [P.bunGood, P.meat], 12);

    if (Art && G.ZONE && G.ZONE.grill && S.grill) {
      var c = Art.content(G.ZONE.grill), live = 0, i;
      for (i = 0; i < S.grill.length; i++) if (S.grill[i] && S.grill[i].state !== 'empty') live++;
      live += Math.min(bun, 4);
      if (live > 0)
        drop({ x: num(c.x, 0) + num(c.w, 0) / 2, y: num(c.y, 0) + num(c.h, 0) / 2 },
          Math.min(live * 2, 8), [P.bunGood, P.bunRaw, P.bunBurn], 52);
    }
    if (amt > 0) hit('waste', G.clamp(amt / 60, 0.35, 1));
  }

  /* ---------- 每帧 ---------- */
  function update(dt) {
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    tt += dt;
    drew = false;

    shk *= Math.exp(-dt * 11); if (shk < 0.06) shk = 0;
    fl  = Math.max(0, fl  - dt * 1.9);
    vig = Math.max(0, vig - dt * 1.3);
    rush = Math.max(0, rush - dt * 1.5);
    coinP = Math.max(0, coinP - dt * 3.2);
    purseR = Math.max(0, purseR - dt * 1.7);

    if (trV !== 0) {
      tr += trV * dt;
      if (tr <= 0) { tr = 0; trV = 0; }
      if (tr >= 1) { tr = 1; trV = 0; }
    }

    // HUD 钱数滚动：大跳（读存档、清档）直接对齐，避免长时间乱滚
    var tgt = (G.S && typeof G.S.money === 'number') ? G.S.money : 0;
    var d = tgt - mDisp;
    if (Math.abs(d) > 3000 || Math.abs(d) < 0.55) mDisp = tgt;
    else mDisp += d * Math.min(1, dt * 8) + (d > 0 ? 0.4 : -0.4);

    grillWatch(dt);
    comboWatch();
    evWatch(dt);

    for (var i = ps.length - 1; i >= 0; i--) {
      var p = ps[i];
      p.life += dt;
      if (p.life >= p.ttl) {
        if (p.k === 'coin' && !p.out) coinP = 1;   // 掏出去的那批不该让钱袋亮一下
        ps[i] = ps[ps.length - 1]; ps.pop();
        continue;
      }
      if (p.k === 'coin') {
        var u = p.life / p.ttl, iu = 1 - u;
        var mx = (p.ox + p.tx) / 2 + p.s2;
        var my = Math.max(8, (p.oy + p.ty) / 2 - 110);
        p.x = iu * iu * p.ox + 2 * iu * u * mx + u * u * p.tx;
        p.y = iu * iu * p.oy + 2 * iu * u * my + u * u * p.ty;
      } else if (p.k === 'num' || p.k === 'danmu') {
        p.y += p.vy * dt;
      } else if (p.k !== 'ring') {
        p.vy += p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.spin * dt;
        /* 掉出画面的碎屑直接回收：看不见的东西还在每帧描一次边，是纯浪费；
           顺带把「特效不画到画布外」变成一条有界的、可断言的性质。 */
        if (p.y > G.H + 100 || p.y < -160 || p.x < -160 || p.x > G.W + 160) {
          ps[i] = ps[ps.length - 1]; ps.pop();
        }
      }
    }
  }

  /* 烤炉刚变绿时补一圈「叮」的扩散环；变糊时是 A 档的 charred。
     game.js 这两个时刻都没有事件（tap 时才有 burn），所以观察 flag 跳变。 */
  var gflag = [], smokeT = [];
  function grillWatch(dt) {
    var S = G.S;
    if (!S || S.mode !== 'play' || !S.grill || !G.ZONE || !Art) { gflag.length = 0; return; }
    var n = S.grill.length, c = Art.content(G.ZONE.grill);
    if (!(n > 0)) return;
    for (var i = 0; i < n; i++) {
      var f = S.grill[i] ? (S.grill[i].flag | 0) : 0;
      var cx = num(c.x, 0) + num(c.w, 0) * ((i + 0.5) / n);
      var cy = num(c.y, 0) + (num(c.h, 0) - 16) / 2;
      if (gflag[i] === 0 && f === 1) {
        ring(cx, cy, P.green, 12, 46, 0.5);
        sparks(cx, cy, 4, [P.green, P.cream], 90);
      } else if (gflag[i] === 1 && f === 2) {
        on('charred', cx, cy);
      }
      /* 糊了的那份在被铲掉之前一直冒烟：光靠颜色变深，扭过头来根本认不出
         是哪个灶眼废了。0.42 秒一团，三个灶眼同时糊也就 ~10 个粒子在场。 */
      if (f === 2) {
        smokeT[i] = num(smokeT[i], 0) - dt;
        if (smokeT[i] <= 0) {
          smokeT[i] = 0.42;
          smoke(cx + G.rand(-6, 6), cy - 14);
        }
      } else smokeT[i] = 0;
      gflag[i] = f;
    }
    gflag.length = n; smokeT.length = n;
  }

  /* 手稳连击：S.combo 变了就发。放在这儿而不是等 game.js 调，是因为
     game.js 里 fxOn('make') 发生在 S.combo++ 之前，那时候拿到的段位是旧的。 */
  var cPrev = 0;
  function comboWatch() {
    var S = G.S;
    if (!S || S.mode !== 'play') { cPrev = 0; return; }
    var n = num(S.combo, 0) | 0;
    if (n > cPrev) {
      var b = G.BSLOT;
      on('combo', b ? b.x : G.W / 2, (b ? b.y : G.H / 2) - 18, n);
    } else if (n === 0 && cPrev >= 1) {
      var b2 = G.BSLOT;
      on('combobrk', b2 ? b2.x : G.W / 2, (b2 ? b2.y : G.H / 2) - 18, cPrev);
    }
    cPrev = n;
  }

  /* 事件层的意外：上门 / 化解都值得有反馈，但 events.js 自己只画卡片和横幅。
     与其在 events.js 里散落十几处 G.FX.on，不如在这儿对 haz 数组做差分 ——
     摘掉本文件，这套观察一起消失，events.js 一行都不用改。 */
  var seen = [];
  function evWatch() {
    var E = G.Events, S = G.S;
    if (!E || !E.haz || !S || S.mode !== 'play') { seen.length = 0; return; }
    var haz = E.haz, i, j, k, found;
    if (!haz.length && !seen.length) return;

    for (i = 0; i < haz.length; i++) {                 // 新上门的
      var h = haz[i];
      if (!h || !EV[h.kind]) continue;
      found = -1;
      for (j = 0; j < seen.length; j++) if (seen[j].o === h) { found = j; break; }
      var pt = evPos(h);
      if (found < 0) {
        on('evwarn', pt.x, pt.y, h.kind);
        // 风是横着卷过来的，方向本身就是信息，光一圈环表达不出来
        if (h.kind === 'wind') on('gust', pt.x, pt.y, num(h.dir, 1));
        seen.push({ o: h, k: h.kind, x: pt.x, y: pt.y });
      } else { seen[found].x = pt.x; seen[found].y = pt.y; }
    }

    for (j = seen.length - 1; j >= 0; j--) {           // 走掉的
      found = 0;
      for (i = 0; i < haz.length; i++) if (haz[i] === seen[j].o) { found = 1; break; }
      if (found) continue;
      var s = seen[j], o = s.o;
      seen.splice(j, 1);
      /* 「化解」和「超时」都是从数组里消失，只能看它是怎么没的：
         t 还没走完 = 玩家动手处理掉了；t 归零 = 熬到底，那种结局
         events.js 自己已经有 cash / nope / angry 的调用，别再叠一层。
         nag（骂骂咧咧走人）和 inspect（结果好坏 fx 判断不了）不走这条路。 */
      if (s.k === 'nag' || s.k === 'inspect') continue;
      var okT = num(o && o.t, 0) > 0.02;
      if (s.k === 'rival') okT = num(o && o.shout, 0) >= num(o && o.need, 99);
      if (!okT) continue;
      if (s.x < -20 || s.x > G.W + 20) continue;       // 猫和风是自己跑出画面的，不算化解
      on('evclear', s.x, s.y, s.k);
    }
  }
  function evPos(h) {
    var x = num(h.x, NaN), y = num(h.y, NaN);
    if (x !== x && G.SLOT && typeof h.slot === 'number' && G.SLOT[h.slot])
      { x = G.SLOT[h.slot].cx; y = 216; }
    if (x !== x && h.key && G.ZONE && G.ZONE[h.key])
      { x = G.ZONE[h.key].x + G.ZONE[h.key].w / 2; y = G.ZONE[h.key].y + 40; }
    return { x: num(x, G.W / 2), y: num(y, 250) };
  }

  /* ---------- 绘制 ---------- */
  function starPath(ctx, r) {
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, rr = (i % 2) ? r * 0.42 : r;
      var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawWorld(ctx) {
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i], u = p.life / p.ttl;
      if (p.k === 'coin') continue;          // 硬币在 HUD 之上单独画
      if (p.k === 'puff') {
        ctx.globalAlpha = (1 - u) * 0.75;
        G.circle(ctx, p.x, p.y, G.lerp(p.s, p.s2, u), p.col, 0);
      } else if (p.k === 'ring') {
        ctx.globalAlpha = (1 - u) * 0.9;
        G.circle(ctx, p.x, p.y, G.lerp(p.s, p.s2, u), null,
          G.lerp(5, 1.2, u), p.col);
      } else if (p.k === 'spark') {
        ctx.globalAlpha = 1 - u * u;
        G.circle(ctx, p.x, p.y, p.s * (1 - u * 0.4), p.col, 0);
      } else if (p.k === 'streak') {
        ctx.globalAlpha = (1 - u) * 0.9;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - (p.vx > 0 ? p.s : -p.s), p.y);
        G.shape(ctx, null, 3, p.col);
      } else if (p.k === 'num') {
        /* 先撑到 1.18 再落回 1.0：这一下「弹」就是段位感本身 */
        var sc = u < 0.16 ? G.lerp(0.4, 1.18, u / 0.16)
               : u < 0.3  ? G.lerp(1.18, 1.0, (u - 0.16) / 0.14) : 1;
        ctx.globalAlpha = u > 0.7 ? (1 - u) / 0.3 : 1;
        G.text(ctx, p.txt, p.x, p.y, {
          size: Math.max(6, p.s * sc), col: p.col,
          stroke: P.cream, strokeW: 5 + p.s * 0.14
        });
      } else if (p.k === 'danmu') {
        ctx.globalAlpha = Math.min(1, p.life / 0.16) *
          (p.life > p.ttl - 0.30 ? (p.ttl - p.life) / 0.30 : 1);
        G.text(ctx, p.txt, p.x, p.y, {
          size: p.s, col: p.col, stroke: P.meatDark, strokeW: 4
        });
      } else if (p.k === 'star') {
        ctx.globalAlpha = 1 - u * u;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        starPath(ctx, p.s * (1 - u * 0.3));
        G.shape(ctx, p.col, 0);
        ctx.restore();
      } else {                                // bit
        ctx.globalAlpha = 1 - u * u * u;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        G.box(ctx, -p.s / 2, -p.s / 2, p.s, p.s, p.s * 0.28, p.col, 0);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* 连击到 3 连以上时夹馍位一直挂着一圈光：连击是有状态的，
     只在成功那一帧闪一下，玩家不会意识到「我现在正连着」。 */
  function comboAura(ctx) {
    var S = G.S, b = G.BSLOT;
    if (!S || S.mode !== 'play' || !b) return;
    var n = num(S.combo, 0) | 0;
    if (n < 3) return;
    var k = G.clamp((n - 2) / 6, 0, 1);
    var pu = 0.5 + 0.5 * Math.sin(tt * (5 + k * 4));
    var r = 34 + k * 9 + pu * 3;
    var col = k > 0.6 ? P.orange : k > 0.25 ? P.yellow : '#3FBF63';
    ctx.save();
    ctx.globalAlpha = 0.26 + k * 0.30;
    G.circle(ctx, b.x, b.y, r, null, 2.2 + k * 2.4, col);
    if (n >= 5) {
      ctx.globalAlpha = (0.12 + k * 0.16) * pu;
      G.circle(ctx, b.x, b.y, r + 9, null, 2, col);
    }
    ctx.restore();
    /* 这里刻意不写连击数：HUD 顶上那块「手稳 ×N」已经是权威读数，
       光环只负责把「你正连着」这件事放到手边，眼睛不用离开台面。 */
  }

  function render(ctx) { drew = true; comboAura(ctx); drawWorld(ctx); }

  function pre(ctx) {
    ctx.save();
    if (shk > 0)
      ctx.translate(Math.sin(tt * 61) * shk, Math.cos(tt * 47) * shk * 0.7);
  }

  function post(ctx) {
    ctx.restore();
    if (!drew) drawWorld(ctx);               // render 没被调到时（如商店页）兜底

    // 硬币画在 HUD 之上，才看得见「飞进钱袋 / 从钱袋飞出去」
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i]; if (p.k !== 'coin') continue;
      var u = p.life / p.ttl;
      ctx.globalAlpha = p.out ? (u < 0.15 ? u / 0.15 : 1)
                              : (u > 0.85 ? (1 - u) / 0.15 : 1);
      Art.coinSmall(ctx, p.x, p.y, p.s * (1 - u * 0.25));
    }
    ctx.globalAlpha = 1;

    if (purseR > 0) {                        // 钱袋往外掏钱：红圈一收
      ctx.save();
      ctx.globalAlpha = Math.min(1, purseR) * 0.8;
      G.circle(ctx, COIN_X, COIN_Y, 15 + (1 - Math.min(1, purseR)) * 7, null, 3, P.red);
      ctx.restore();
    }

    if (rush > 0) {                          // 高峰光带横扫
      var sw = (1 - rush) * (G.W + 220) - 110;
      ctx.save();
      ctx.globalAlpha = rush * 0.5;
      ctx.fillStyle = P.yellow;
      ctx.beginPath();
      ctx.moveTo(sw, 0); ctx.lineTo(sw + 70, 0);
      ctx.lineTo(sw + 130, G.H); ctx.lineTo(sw + 60, G.H);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /* 边缘暗角。原来是 strokeRect(-23,-23,W+46,H+46) + lineWidth 46 ——
       描边以路径为中心各展 23，算下来正好整条落在画布外沿的那一像素之外，
       等于一直在画一个看不见的框（A 档「必须看见」就无从谈起了）。
       改成三圈由外向内递减的内描边，凑出一条软边；用渐变要现建四条色带，
       为一个偶尔才亮一下的东西不值。 */
    if (vig > 0) {
      var a0 = vig * 0.55, bd = VIG_BANDS, b;
      ctx.save();
      ctx.strokeStyle = vigCol;
      for (b = 0; b < bd.length; b++) {
        ctx.globalAlpha = a0 * bd[b][1];
        ctx.lineWidth = bd[b][2];
        ctx.strokeRect(bd[b][0], bd[b][0], G.W - bd[b][0] * 2, G.H - bd[b][0] * 2);
      }
      ctx.restore();
    }

    if (fl > 0) {                            // 全屏闪
      ctx.save();
      ctx.globalAlpha = fl * 0.55;
      ctx.fillStyle = flCol;
      ctx.fillRect(0, 0, G.W, G.H);
      ctx.restore();
    }

    if (tr > 0) {                            // 开工卷帘
      var h = tr * G.H / 2;
      ctx.save();
      ctx.fillStyle = '#4A2E1B';
      ctx.fillRect(0, 0, G.W, h);
      ctx.fillRect(0, G.H - h, G.W, h);
      ctx.strokeStyle = P.woodDark; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(G.W, h);
      ctx.moveTo(0, G.H - h); ctx.lineTo(G.W, G.H - h); ctx.stroke();
      ctx.restore();
    }
  }

  /* 活粒子的包围盒，给 harness 验「不画到画布外」用。
     粒子本来就会飞出台面（碎屑就该掉下去），所以断言留的是余量而不是 0。 */
  function bounds() {
    var b = { x0: 0, y0: 0, x1: 0, y1: 0, n: ps.length };
    if (!ps.length) return b;
    b.x0 = b.x1 = ps[0].x; b.y0 = b.y1 = ps[0].y;
    for (var i = 1; i < ps.length; i++) {
      var p = ps[i];
      if (p.x < b.x0) b.x0 = p.x; if (p.x > b.x1) b.x1 = p.x;
      if (p.y < b.y0) b.y0 = p.y; if (p.y > b.y1) b.y1 = p.y;
    }
    return b;
  }

  G.FX = {
    on: on, update: update, render: render, pre: pre, post: post, shake: shake,
    money:     function () { return Math.round(mDisp); },
    coinPulse: function () { return coinP; },
    count:     function () { return ps.length; },
    bounds:    bounds,
    /* 当前的全屏强度，harness 用它验「没有谁悄悄越界」 */
    level:     function () { return { shake: shk, flash: fl, vig: vig, rush: rush, tr: tr }; },
    grade:     LV,
    ev:        EV,
    clear:     function () {
      ps.length = 0; shk = fl = vig = rush = tr = 0; trV = 0;
      coinP = purseR = 0; mixT = 0;
      gflag.length = 0; smokeT.length = 0; seen.length = 0; cPrev = 0;
    },
    cap: CAP
  };

  /* ---------- 调试截图入口：index.html?shot=play&day=12&fx=combo:8 ----------
     debugScene 会把特效时间快进 3 秒（否则开工卷帘盖住整屏），所以想截住一次
     爆发，只能在那之后补发再手动推进几帧。照 events.js 的做法在外面包一层，
     摘掉本文件这段代码一起消失，正常玩法走不到。
     fxt= 指定推进多少秒（默认 0.18，正好是环撑开、大字弹到最大的相位）。 */
  if (G.debugScene) {
    var _scene = G.debugScene;
    G.debugScene = function (q) {
      _scene(q);
      if (!q || (q.fx === undefined && q.fxcombo === undefined)) return;
      // fxcombo= 只为截连击光环：光环是「当前正连着」的状态，不是一次爆发。
      // 设完不动手，让 comboWatch 自己在 BSLOT 上发 —— 位置才和实战一致。
      if (q.fxcombo !== undefined && G.S) G.S.combo = parseInt(q.fxcombo, 10) || 0;
