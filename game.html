    // 中心被烙久了的那片油膜：暖色、低透明，只提亮不冲白
    ctx.beginPath();
    ctx.ellipse(px + pw * 0.5, py + ph * 0.54, pw * 0.42, ph * 0.34, 0, 0, TAU);
    G.shape(ctx, 'rgba(214,178,120,.13)', 0);
    // 一道拉长的镜面反射 —— 铸铁的"亮"是长条不是一片
    ctx.beginPath();
    ctx.ellipse(px + pw * 0.40, py + ph * 0.34, pw * 0.30, ph * 0.075, -0.10, 0, TAU);
    G.shape(ctx, 'rgba(255,244,220,.22)', 0);
    ctx.beginPath();
    ctx.ellipse(px + pw * 0.66, py + ph * 0.70, pw * 0.16, ph * 0.045, -0.10, 0, TAU);
    G.shape(ctx, 'rgba(255,244,220,.14)', 0);

    // 细密磨痕：绕板心的同心弧，深底上要拉高对比才看得见
    for (i = 0; i < SCRATCH.length; i++) {
      var sc = SCRATCH[i];
      ctx.beginPath();
      ctx.ellipse(px + pw * 0.5, py + ph * 0.5, pw * 0.5 * sc[1], ph * 0.5 * sc[1],
        0, sc[0], sc[0] + sc[2]);
      G.shape(ctx, null, 1.3, sc[3] ? 'rgba(226,236,244,.26)' : 'rgba(6,9,12,.45)');
    }

    // 边缘积碳
    for (i = 0; i < CARBON.length; i++) {
      var cb = CARBON[i];
      ctx.beginPath();
      ctx.ellipse(px + pw * cb[0], py + ph * cb[1], pw * cb[2], ph * cb[3], 0.4, 0, TAU);
      G.shape(ctx, 'rgba(6,7,9,.52)', 0);
    }
    ctx.restore();

    /* --- 灶眼尺寸：按数量自适应，并保证圈与圈不相撞 --- */
    var pitch = pw / n;
    var r = Math.min(23, pitch * 0.42);
    var rr = r + Math.max(2, Math.min(4.5, pitch * 0.5 - r - 1.5));
    var bs = r / 33;
    var cy = py + ph / 2;

    /* --- 有馍在烤：板缝里透出的火苗 --- */
    var hot = false;
    for (i = 0; i < n; i++) if (slots[i].state === 'toasting') hot = true;
    if (hot) {
      ctx.save();
      G.rrect(ctx, px, py, pw, ph, 11); ctx.clip();
      for (k = 0; k < 6; k++) {
        var fx = px + pw * ((k + 0.5) / 6);
        var fl = 5 + Math.abs(Math.sin(now * 9 + k * 1.7)) * 9;
        ctx.globalAlpha = 0.32 + Math.sin(now * 13 + k) * 0.14;
        ctx.beginPath();                       // 舔上来的火舌
        ctx.moveTo(fx - 6, py + ph);
        ctx.quadraticCurveTo(fx - 2, py + ph - fl * 0.7, fx, py + ph - fl);
        ctx.quadraticCurveTo(fx + 2, py + ph - fl * 0.7, fx + 6, py + ph);
        ctx.closePath();
        G.shape(ctx, P.orange, 0);
        ctx.beginPath();
        ctx.moveTo(fx - 3, py + ph);
        ctx.quadraticCurveTo(fx, py + ph - fl * 0.55, fx + 3, py + ph);
        ctx.closePath();
        G.shape(ctx, P.yellow, 0);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* --- 每个灶眼 --- */
    for (i = 0; i < n; i++) {
      var s = slots[i];
      var cx = px + pitch * (i + 0.5);
      well(ctx, cx, cy, r);

      if (s.state === 'empty') {
        G.text(ctx, '+', cx, cy, { size: r * 1.15, col: 'rgba(206,220,230,.72)' });
        continue;
      }

      if (s.state === 'dough') {
        G.drop(ctx, cx, cy + r * 0.5, r * 0.7, r * 0.2, 0.34);
        Art.dough(ctx, cx, cy, s.press, r);
        var shapeQ = G.clamp(+s.shapeQuality || 0, 0, 1);
        ctx.beginPath();
        ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + TAU * G.clamp(s.press, 0, 1));
        G.shape(ctx, null, 4.5, shapeQ >= 0.82 ? P.green : '#D9A05A');
        if (shapeQ > 0) {
          G.circle(ctx, cx + rr * 0.66, cy - rr * 0.66, 4,
            shapeQ >= 0.82 ? P.green : P.orange, 1.5, P.cream);
        }
        continue;
      }

      var ready = s.t >= (G.bunTiming ? G.bunTiming(s, 'good') : G.CFG.toastGood);
      var burnt = s.t >= (G.bunTiming ? G.bunTiming(s, 'burn') : G.CFG.toastBurn);
      var crispy = s.t >= (G.bunTiming ? G.bunTiming(s, 'crispy') :
        (G.CFG.toastCrispy || G.CFG.toastGood));

      // 热浪：只在烤着的灶眼上方，用两道随 now 上飘的淡弧暗示
      if (!burnt) {
        ctx.save();
        G.rrect(ctx, px, py, pw, ph, 11); ctx.clip();
        for (k = 0; k < 2; k++) {
          var hz = (now * 0.55 + k * 0.5) % 1;
          ctx.globalAlpha = (1 - hz) * 0.22;
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.7, cy - r - 2 - hz * 16);
          ctx.quadraticCurveTo(cx, cy - r - 8 - hz * 16,
            cx + r * 0.7, cy - r - 2 - hz * 16);
          G.shape(ctx, null, 2.2, '#FFE7C0');
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      if (ready && !burnt) {
        ctx.save(); ctx.shadowColor = P.green; ctx.shadowBlur = 12;
        G.circle(ctx, cx, cy, rr, null, 3 + Math.sin(now * 12) * 1.6, P.green);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(cx, cy, rr, -Math.PI / 2,
        -Math.PI / 2 + TAU * G.clamp(s.t / (G.bunTiming ? G.bunTiming(s, 'burn') : G.CFG.toastBurn), 0, 1));
      G.shape(ctx, null, 5, burnt ? P.red : ready ? (crispy ? P.orangeDk : P.green) : '#9FB0BC');

      G.drop(ctx, cx, cy + r * 0.42, r * 0.78, r * 0.22, 0.38);
      var tone = s.style === 'crust' ? 1.14 : s.style === 'whole' ? 0.48 : 0.95;
      Art.bun(ctx, cx, cy - 1, bs,
        G.clamp(s.t / (G.bunTiming ? G.bunTiming(s, 'good') : G.CFG.toastGood), 0, 1) * tone, burnt);

      if (burnt) {
        // 铁板顶边就是内容区顶边，烟没有上升空间 —— 压短，飘在锅面之内
        for (k = 0; k < 3; k++) {
          var pz = (now * 0.9 + k / 3) % 1;
          ctx.globalAlpha = (1 - pz) * 0.5;
          G.circle(ctx, cx + Math.sin(pz * 7 + k) * 7, cy - r * 0.75 - pz * 15,
            3 + pz * 4, '#8E8E8E', 0);
        }
        ctx.globalAlpha = 1;
      } else if (crispy) {
        G.text(ctx, '酥脆', cx, cy - rr - 7,
          { size: 9, col: P.orangeDk, weight: 800 });
      }
    }

    Art.hint(ctx, z, '放面团 → 拍平 → 变绿取', P.inkSoft);
  };

  /* ================================================================
     凉 皮 碗（覆盖 art-bun.js 的 Art.bowl —— 本文件在它之后加载）

     秦镇凉皮的四个「一眼认出」的特征，缺一个就读成别的东西：
       1) 宽。是刀切出来的宽片，不是面条。所以每条都是「上下两条曲线
          围成 + 两端平切口」的扁带，宽度 6~7.5（碗口半宽才 29）。
       2) 米白偏灰。米浆蒸的，色相偏冷。上一版用暖奶油黄，读作黄油面。
          只有挂上红油之后才允许变暖。
       3) 半透。填充带 alpha，叠在一起的地方自然压深；再沿下缘补一道
          更亮更透的窄带 —— 皮子薄的地方光是漏得过去的。
       4) 红油浮在**表面**。油是最后浇上去的，必须画在所有皮子之上，
          而且带镜面反光；画在底下就成了「碗底一摊红水」。

     还有一条结构上的：料要把整个碗口填满。上一版全挤在碗口上半圈，
     碗前半截露出一大块内壁，读起来像「碗沿上摆了一撮」而不是一碗。

     约束：横向 ±30*s，纵向 -22*s ~ +24*s（与 art-bun.js 那版一致，
     game.js 和订单气泡的排版都是按这个留的位）。
     ================================================================ */

  var LP = {
    cera:   '#FDFBF5',      // 碗瓷：暖白，不是冷蓝玻璃
    inner:  '#C8BCA0',      // 内壁（空碗时看得到）
    innerL: '#EADFC6',
    rim:    '#FFFEFA',
    ring:   '#3E6E9C',      // 碗外壁那道青花圈
    edge:   '#B3A28A',
    /* 米白偏**灰**：色相要比碗瓷（暖白 #FDFBF5）冷一档，
       不然一堆白皮子贴在白碗上，边界整个化掉。 */
    nLit:   'rgba(241,239,228,.95)',   // 受光的那几条
    nMid:   'rgba(220,217,201,.94)',
    nDim:   'rgba(196,192,174,.95)',   // 压在下面、沾了汁的
    oil:    'rgba(198,32,8,',          // 红油，后接 alpha
    oilHi:  'rgba(255,183,92,',        // 油面反光
    flake:  '#9C2408',                 // 辣椒面颗粒
    flakeL: '#D2451B'
  };

  /* 碗身轮廓 */
  function bowlBody(ctx) {
    ctx.beginPath();
    ctx.moveTo(-29.4, -4);
    ctx.lineTo(29.4, -4);
    ctx.quadraticCurveTo(25.6, 23.4, 0, 23.4);
    ctx.quadraticCurveTo(-25.6, 23.4, -29.4, -4);
    ctx.closePath();
  }

  /* 碗里那坨料的轮廓：上面隆起冒出碗口，前沿沿着碗口下弧往回收，
     故意比碗口内缩 2px —— 留出一线内壁，料才是「装在碗里」而不是「糊在碗上」。 */
  function heapPath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-27.4, -4.6);
    /* 顶上四个起伏 —— 一坨宽面堆出来的轮廓是坑坑洼洼的，
       画成光滑半球就读作一勺冰淇淋。 */
    ctx.quadraticCurveTo(-26.6, -12.6, -18.0, -14.4);
    ctx.quadraticCurveTo(-11.0, -15.8, -7.0, -13.0);
    ctx.quadraticCurveTo(-1.0, -18.6, 6.5, -15.0);
    ctx.quadraticCurveTo(13.0, -12.2, 18.6, -14.8);
    ctx.quadraticCurveTo(25.6, -13.0, 27.4, -4.6);
    ctx.ellipse(0, -4.6, 27.4, 6.4, 0, 0, Math.PI);
    ctx.closePath();
  }

  /* 宽凉皮：[x1,y1, cx,cy, x2,y2, 宽, 明暗档, 最低尺度档]
     按 y 从小到大排 = 从后往前画，叠压关系才对。
     「最低尺度档」而不是「取前 n 条」：取前 n 条会把碗前半截整个砍掉，
     小尺寸下碗就空了半个；按档位挑能保证每一档都铺满整个碗口。 */
  /* 六条而不是九条：碗口纵向只有 16 个单位，九条挤进去每条只露 1.8 个
     单位的脸，而分隔缝本身就要占掉 2 个 —— 叠出来是一堆灰皮筋。
     六条正好每条露 3.2，缝细、面宽，「宽」才读得出来。 */
  var RIB = [
    [-31, -13.0,  -8, -17.2,  30, -14.0, 7.2, 0, 0],
    [-30,  -9.4,   6, -14.8,  31, -10.6, 7.4, 1, 0],
    [-25,  -6.0, -10, -11.4,  17,  -7.2, 6.8, 0, 1],
    [-31,  -2.8,  -2,  -8.4,  30,  -4.0, 7.8, 1, 0],
    [-20,   0.4,   8,  -4.6,  31,  -0.8, 7.0, 2, 0],
    [-30,   3.2,  -4,  -0.6,  27,   2.4, 7.4, 0, 2]
  ];
  var NTONE = [LP.nLit, LP.nMid, LP.nDim];

  /* 配菜（固定位置）。y 铺到 0 附近，跟着新的堆形走 */
  var CUKE = [[-15, -9.5, 12, 0.26], [8, -12.0, 10, -0.20],
              [-4, -3.2, 9, 0.12], [16, -5.4, 8, 0.34]];
  var GLUT = [[-11, -11.0, 4.4], [11, -6.6, 3.8], [0, -13.6, 3.2]];
  var SESA = [[-16, -11.5], [-3, -8.0], [10, -13.0], [16, -8.6], [-9, -5.0],
              [4, -14.6], [-20, -6.5], [19, -4.2], [-6, -1.6], [7, -2.6]];
  /* 拌开后挂在皮子上的辣椒面：[x, y, r]。要散到整个碗口，不能扎堆 */
  var FLAKE = [[-17, -10.0, 1.5], [-6, -13.6, 1.2], [5, -11.2, 1.4], [14, -12.6, 1.1],
               [-11, -6.0, 1.3], [2, -6.8, 1.2], [-21, -5.2, 1.0], [19, -7.4, 1.1],
               [-14, -1.6, 1.3], [-2, -2.2, 1.1], [9, -3.0, 1.2], [17, -1.0, 1.0],
               [-7,  1.2, 1.1], [6,  0.8, 1.0]];

  /* 一条扁带的路径 */
  function ribPath(ctx, r, pad) {
    var h = r[6] * 0.5 + (pad || 0);
    ctx.beginPath();
    ctx.moveTo(r[0], r[1] - h);
    ctx.quadraticCurveTo(r[2], r[3] - h, r[4], r[5] - h);
    ctx.lineTo(r[4], r[5] + h);
    ctx.quadraticCurveTo(r[2], r[3] + h, r[0], r[1] + h);
    ctx.closePath();
  }
  /* 沿扁带中线偏移 k 倍带宽走一条线（高光 / 厚度边 / 挂汁都用它） */
  function ribLine(ctx, r, k, lw, col) {
    var o = r[6] * k;
    ctx.beginPath();
    ctx.moveTo(r[0] + 1.0, r[1] + o);
    ctx.quadraticCurveTo(r[2], r[3] + o, r[4] - 1.0, r[5] + o);
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.strokeStyle = col;
    ctx.stroke();
  }

  Art.bowl = function (ctx, x, y, s, stage) {
    s = s || 1;
    stage = stage || 0;
    /* 0.92 是工位里的尺寸，那是这只碗的主场，必须吃满档 */
    var tier = s < 0.58 ? 0 : (s < 0.85 ? 1 : 2);
    var lw = G.clamp(4.0 * s, 2.6, 4.4) / s;
    var i, r;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);

    /* ---------- 碗身 ---------- */
    bowlBody(ctx);
    ctx.fillStyle = G.vg(ctx, -4, 23.4, LP.cera, G.shade(LP.cera, -0.16));
    ctx.fill();

    ctx.save();
    bowlBody(ctx); ctx.clip();
    // 下缘沿内轮廓压一道弧带（不要用大椭圆，会糊掉碗底的转折）
    ctx.beginPath();
    ctx.moveTo(-26.8, 2);
    ctx.quadraticCurveTo(-22, 20.5, 0, 21.2);
    ctx.quadraticCurveTo(22, 20.5, 26.8, 2);
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = 'rgba(150,128,96,.30)';
    ctx.stroke();
    // 右侧的转折面
    ctx.beginPath();
    ctx.moveTo(23.5, -1);
    ctx.quadraticCurveTo(21.5, 13, 10, 20);
    ctx.lineWidth = 4.2;
    ctx.strokeStyle = 'rgba(150,128,96,.22)';
    ctx.stroke();
    // 左侧一道竖高光 —— 瓷的关键
    ctx.beginPath();
    ctx.ellipse(-18, 6, 4.4, 11, -0.16, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.fill();
    if (tier >= 1) {                       // 青花圈：与碗口同心的一段弧
      ctx.beginPath();
      ctx.ellipse(0, -4.4, 26.4, 12.2, 0, 0.13 * Math.PI, 0.87 * Math.PI);
      ctx.lineWidth = 1.7;
      ctx.strokeStyle = LP.ring;
      ctx.globalAlpha = 0.44;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    bowlBody(ctx);
    ctx.lineWidth = lw;
    ctx.strokeStyle = P.ink;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* ---------- 碗口：内壁上暗下亮 = 凹进去 ---------- */
    ctx.beginPath();
    ctx.ellipse(0, -4, 29.4, 7.8, 0, 0, TAU);
    ctx.fillStyle = G.vg(ctx, -11.8, 3.8, LP.inner, LP.innerL);
    ctx.fill();
    ctx.lineWidth = lw * 0.9;
    ctx.strokeStyle = LP.edge;
    ctx.stroke();
    ctx.beginPath();                        // 碗口白亮沿
    ctx.ellipse(0, -4.9, 28.0, 6.8, 0, Math.PI * 1.02, Math.PI * 1.98);
    ctx.lineWidth = 2.0;
    ctx.strokeStyle = LP.rim;
    ctx.stroke();

    /* ---------- 1) 凉皮 ---------- */
    if (stage >= 1) {
      ctx.save();
      heapPath(ctx); ctx.clip();
      ctx.lineJoin = 'round';

      /* 底子先铺一层暗的：条与条之间漏下去的缝就是这个色。
         没有它的话半透明的皮子叠上去只会越叠越白，堆看着是平的。 */
      heapPath(ctx);
      ctx.fillStyle = G.vg(ctx, -18.4, 2.0, '#8A8370', '#B1AA95');
      ctx.fill();

      for (i = 0; i < RIB.length; i++) {
        r = RIB[i];
        if (tier < r[8]) continue;
        ribPath(ctx, r, 0);
        ctx.fillStyle = NTONE[r[7]];
        ctx.fill();
        /* 分隔的暗缝画在**自己的上缘**（后面那条投下来的影），不是下缘。
           画在下缘的话，紧接着画的前一条会把它整根盖掉 —— 上一版就是这样，
           九条皮子叠出来是一整片白，一条缝都看不见。 */
        ribLine(ctx, r, -0.44, 1.3, 'rgba(88,82,62,.46)');
        if (tier >= 1)                       // 紧挨暗缝的一道亮边 = 湿、软、有弹性
          ribLine(ctx, r, -0.26, r[6] * 0.15, 'rgba(255,255,255,.72)');
        // 最前那条的下缘是真正的切口，厚度看得见
        ribLine(ctx, r, 0.48, 1.4, 'rgba(112,104,82,.44)');
        if (tier >= 2)                       // 贴下缘的透光带：薄处光漏得过去
          ribLine(ctx, r, 0.30, r[6] * 0.16, 'rgba(255,252,238,.44)');
      }
      /* 堆的内边缘压一圈暗 —— 米白的皮子贴着白瓷，没有这道就糊成一坨 */
      heapPath(ctx);
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = 'rgba(96,88,68,.28)';
      ctx.stroke();
      ctx.restore();
    }

    /* ---------- 2) 浇了油泼辣子和配菜 ---------- */
    if (stage >= 2) {
      ctx.save();
      heapPath(ctx); ctx.clip();

      /* 红油：一摊浮在皮子**上面**的油。半透明 → 底下的条纹透得出来，
         这才是「浮」；不透明的话就成了一块红塑料片。 */
      ctx.beginPath();
      ctx.moveTo(-15, -8.0);
      ctx.bezierCurveTo(-11, -14.2, 3, -15.0, 11, -11.2);
      ctx.bezierCurveTo(17, -8.2, 15, -3.2, 6, -2.2);
      ctx.bezierCurveTo(-3, -1.2, -13, -3.4, -15, -8.0);
      ctx.closePath();
      ctx.fillStyle = LP.oil + '.72)';
      ctx.fill();
      // 油摊中心更深一档 —— 一汪油中间厚、边上薄
      ctx.beginPath();
      ctx.ellipse(-1.5, -8.4, 8.4, 4.2, -0.12, 0, TAU);
      ctx.fillStyle = 'rgba(160,20,4,.34)';
      ctx.fill();
      if (tier >= 1) {                        // 油摊边缘更深一圈 = 有厚度的一汪
        ctx.lineWidth = 2.0;
        ctx.strokeStyle = 'rgba(140,28,8,.34)';
        ctx.stroke();
      }
      // 油面的镜面反光 —— 「油」和「番茄酱」的分界就在这两笔
      ctx.beginPath();
      ctx.ellipse(-5.0, -10.4, 5.0, 1.7, -0.22, 0, TAU);
      ctx.fillStyle = LP.oilHi + '.62)';
      ctx.fill();
      if (tier >= 1) {
        ctx.beginPath();
        ctx.ellipse(6.6, -5.6, 2.6, 0.9, 0.18, 0, TAU);
        ctx.fillStyle = LP.oilHi + '.42)';
        ctx.fill();
      }
      // 沉在油里的辣椒面颗粒
      if (tier >= 1) {
        ctx.fillStyle = LP.flake;
        for (i = 0; i < 6; i++) {
          var fk = FLAKE[i];
          ctx.beginPath();
          ctx.ellipse(fk[0] * 0.62 - 1, fk[1] * 0.72 - 3, fk[2], fk[2] * 0.76, 0.4, 0, TAU);
          ctx.fill();
        }
      }

      // 黄瓜丝
      for (i = 0; i < CUKE.length; i++) {
        if (tier === 0 && i > 1) break;
        var q = CUKE[i];
        ctx.save();
        ctx.translate(q[0], q[1]); ctx.rotate(q[3]);
        ctx.beginPath();
        ctx.moveTo(-q[2] / 2, 0); ctx.lineTo(q[2] / 2, 0);
        ctx.lineWidth = 2.6; ctx.lineCap = 'round';
        ctx.strokeStyle = '#5FA83C';
        ctx.stroke();
        ctx.lineWidth = 1.0;
        ctx.strokeStyle = 'rgba(214,240,190,.75)';
        ctx.stroke();
        ctx.restore();
      }

      // 面筋块：多孔的浅褐方块（一个大暗点会读成蘑菇，所以打三个小孔）
      if (tier >= 1) {
        for (i = 0; i < GLUT.length; i++) {
          var gl = GLUT[i];
          G.rrect(ctx, gl[0] - gl[2], gl[1] - gl[2] * 0.80,
            gl[2] * 2, gl[2] * 1.6, gl[2] * 0.32);
          ctx.fillStyle = '#E3C88F';
          ctx.fill();
          ctx.lineWidth = 1.1;
          ctx.strokeStyle = '#B8945A';
          ctx.stroke();
          ctx.fillStyle = 'rgba(158,120,66,.42)';
          for (var hg = 0; hg < 3; hg++) {
            var ha = hg * 2.1 + 0.6;
            ctx.beginPath();
            ctx.ellipse(gl[0] + Math.cos(ha) * gl[2] * 0.38,
              gl[1] + Math.sin(ha) * gl[2] * 0.32,
              gl[2] * 0.15, gl[2] * 0.12, 0, 0, TAU);
            ctx.fill();
          }
        }
      }

      // 芝麻
      if (tier >= 1) {
        ctx.fillStyle = '#FFF6E2';
        for (i = 0; i < SESA.length; i++) {
          ctx.beginPath();
          ctx.ellipse(SESA[i][0], SESA[i][1], 1.35, 0.95, 0.3, 0, TAU);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    /* ---------- 3) 拌开了 ----------
       和「加了调料」的区别必须一眼看出来：油从一摊变成**每条都挂**，
       辣椒面从堆在油里变成散满全碗。所以这里三件事一起上：
       整堆罩一层红 + 每条描一道红 + 颗粒铺开。 */
    if (stage >= 3) {
      ctx.save();
      heapPath(ctx); ctx.clip();

      /* 整堆罩一层薄红把色调统一（「匀」），但要压得住 —— 罩太厚
         条纹就全没了，读作一碗辣酱。条纹靠下面这一轮逐条上色撑住。 */
      heapPath(ctx);
      ctx.fillStyle = LP.oil + '.16)';
      ctx.fill();

      for (i = 0; i < RIB.length; i++) {
        r = RIB[i];
        if (tier < r[8]) continue;
        ribPath(ctx, r, -0.4);
        ctx.fillStyle = LP.oil + '.40)';
        ctx.fill();
        // 红盖上去之后条与条之间的缝会被填平，得把暗边重新描一遍
        ribLine(ctx, r, 0.46, 1.6, 'rgba(108,22,6,.55)');
        if (tier >= 1)                       // 挂在条上的那道油光
          ribLine(ctx, r, -0.24, r[6] * 0.19, LP.oilHi + '.55)');
      }

      /* 拌完了配菜是翻上来的，不是没了。挑几样重新画在红油之上，
         颜色压暗一点 —— 它们身上也裹了油。 */
      if (tier >= 1) {
        for (i = 0; i < 3; i++) {
          var cq = CUKE[i];
          ctx.save();
          ctx.translate(cq[0], cq[1] + 1.2); ctx.rotate(cq[3] + 0.18);
          ctx.beginPath();
          ctx.moveTo(-cq[2] / 2, 0); ctx.lineTo(cq[2] / 2, 0);
          ctx.lineWidth = 2.4; ctx.lineCap = 'round';
          ctx.strokeStyle = '#4E8F33';
          ctx.stroke();
          ctx.lineWidth = 0.9;
          ctx.strokeStyle = 'rgba(206,236,180,.62)';
          ctx.stroke();
          ctx.restore();
        }
        for (i = 0; i < 2; i++) {
          var g2 = GLUT[i];
          G.rrect(ctx, g2[0] - g2[2], g2[1] - g2[2] * 0.78 + 1,
            g2[2] * 2, g2[2] * 1.56, g2[2] * 0.32);
          ctx.fillStyle = '#D9AE6C';
          ctx.fill();
          ctx.lineWidth = 1.0;
          ctx.strokeStyle = '#9E6A34';
          ctx.stroke();
        }
      }

      // 辣椒面散满全碗
      var fn = tier === 0 ? 6 : (tier === 1 ? 10 : FLAKE.length);
      for (i = 0; i < fn; i++) {
        var fl = FLAKE[i];
        ctx.beginPath();
        ctx.ellipse(fl[0], fl[1], fl[2], fl[2] * 0.78, 0.4, 0, TAU);
        ctx.fillStyle = (i % 3) ? LP.flake : LP.flakeL;
        ctx.fill();
      }
      ctx.restore();
    }

    /* ---------- 碗沿的油渍 ----------
       拌过的碗，碗口一圈一定是脏的。画在裁剪之外，故意压到碗沿上。 */
    if (stage >= 2) {
      var oa = stage >= 3 ? 0.34 : 0.16;
      ctx.beginPath();
      ctx.ellipse(0, -5.4, 26.6, 8.4, 0, Math.PI * 0.08, Math.PI * 0.94);
      ctx.lineWidth = 2.6;
      ctx.strokeStyle = 'rgba(178,50,20,' + oa + ')';
      ctx.stroke();
      if (stage >= 3 && tier >= 1) {
        // 顺着外壁流下来的两道 —— 有它才像刚拌完端上来的
        ctx.beginPath();
        ctx.moveTo(-14.5, 2.0);
        ctx.quadraticCurveTo(-13.0, 7.5, -14.8, 11.0);
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = 'rgba(150,38,14,.30)';
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(12.0, 3.0);
        ctx.quadraticCurveTo(13.6, 6.6, 12.2, 9.0);
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }
    }

    ctx.restore();
  };


  /* ================================================================
     冰 峰 玻 璃 瓶（覆盖 art-drink.js 的 Art.bingfeng）

     「像玻璃」不是一种颜色，是四件事同时成立：
       1) 高光是一条**窄而亮**的竖带。一团模糊的白只会读作塑料或陶瓷。
          做法是「宽的低透明晕 + 窄的高透明芯」两层叠，芯要接近纯白。
       2) 瓶壁有厚度 —— 边缘一定比中间暗（折射把光折走了），
          紧挨着暗边内侧再补一道细亮线，那是玻璃转折面的反光。
       3) 汽水里看得见气泡：上升的 + 贴壁不动的两种。只有上升的会被读作
          灰尘，贴壁那几串才是碳酸的标志。
       4) 冷 —— 没开的瓶子是刚从冰桶里捞出来的，玻璃上挂着冷凝水珠。

     开盖前后的区别做足三处：盖子 / 瓶口（开了能看进去，一圈暗）/
     液面（开了起沫、口上冒泡）。

     坐标约束：横向 ±10（描边另计），纵向 -30（盖顶）~ +21.5（瓶底）。
     ================================================================ */

  var BF = {
    glassHi:  '#F7FCFA',                  // 空瓶玻璃亮部
    glassLo:  '#C6DBD7',
    sodaHi:   '#FFC552',                  // 汽水受光
    sodaLo:   '#D3730B',
    sodaEdge: 'rgba(140,68,4,',           // 液体贴壁的折射暗边
    wallDk:   'rgba(30,56,72,',           // 玻璃厚度的暗边（偏冷；偏绿的话压在橙色上会发橄榄）
    capHi:    '#E6EDF1', capLo: '#78878F',
    label:    '#FFF7E7', labelBlue: '#1B5FA8'
  };

  /* 液内上升气泡：[x, 起始y, r, 相位] */
  var BUB = [[-4.6, 13.0, 1.60, 0.00], [3.6, 17.5, 1.25, 0.35],
             [-1.2,  9.0, 1.45, 0.62], [5.2, 20.0, 1.05, 0.18],
             [-5.6, 19.0, 1.15, 0.81], [1.8, 15.0, 0.95, 0.47],
             [ 6.0, 11.0, 0.85, 0.26]];
  /* 贴在瓶壁上不动的小气泡 —— 没开的汽水壁上总挂着几串 */
  var WBUB = [[-7.0, 7.5, 0.80], [-6.6, 11.4, 0.58], [6.9, 4.2, 0.66],
              [7.2, 12.5, 0.82], [-7.1, 17.0, 0.62], [6.4, 17.6, 0.56]];
  /* 瓶口喷出的气泡：[x, y, r] */
  var MBUB = [[-2.4, -25.0, 1.7], [2.0, -26.8, 1.25], [-0.5, -28.4, 0.95]];
  /* 冷凝水珠：[x, y, r]。避开 x∈[-8,-5] 那条主高光，不然会把高光咬断 */
  var FROST = [[-3.6, 2.4, 1.15], [6.0, 9.6, 1.05], [5.6, -6.4, 1.00],
               [-4.8, 13.6, 0.90], [-6.8, 6.6, 0.85], [7.0, 1.6, 0.80],
               [2.0, 16.6, 0.78], [-6.4, -2.2, 0.72], [3.2, -13.6, 0.70],
               [6.2, -9.6, 0.70], [-1.4, 8.2, 0.68], [-3.2, 19.0, 0.66],
               [-2.8, -16.4, 0.65], [4.2, 5.2, 0.62], [0.6, -3.4, 0.60]];

  function bfBody(ctx) {
    ctx.beginPath();
    ctx.moveTo(-10, 16);
    ctx.quadraticCurveTo(-10, 21.5, -5.5, 21.5);
    ctx.lineTo(5.5, 21.5);
    ctx.quadraticCurveTo(10, 21.5, 10, 16);
    ctx.lineTo(10, -4.5);
    ctx.bezierCurveTo(10, -11.8, 5.0, -12.6, 4.4, -18.2);   // 肩→颈，S 形过渡
    ctx.lineTo(4.4, -23);
    ctx.lineTo(-4.4, -23);
    ctx.lineTo(-4.4, -18.2);
    ctx.bezierCurveTo(-5.0, -12.6, -10, -11.8, -10, -4.5);
    ctx.closePath();
  }
  /* 一颗水珠：主体 + 左上一点亮芯。两笔就够，多了小尺寸下糊成一片 */
  function bead(ctx, x, y, r, a) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = 'rgba(238,250,255,' + a + ')';
    ctx.fill();
    ctx.beginPath(); ctx.arc(x - r * 0.30, y - r * 0.34, r * 0.40, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,' + (a + 0.22) + ')';
    ctx.fill();
  }

  Art.bingfeng = function (ctx, x, y, s, capped, fizz) {
    if (!(s > 0)) return;
    /* 0.72 是工位里那只主瓶，必须吃满档；0.66 的货架瓶退一档；
       0.43 的订单气泡只留剪影和橙色。 */
    var T = s < 0.55 ? 0 : (s < 0.70 ? 1 : 2);
    /* 线宽先定绝对目标（2.4~4.2px）再除以 s。只写 max(2.6/s,3.2) 的话
       大尺寸描边会被 s 放大成十几像素，玻璃直接被黑框压死。 */
    var lw = G.clamp(3.2 * s, 2.4, 4.2) / s;
    var ph = (G.S && G.S.anim) || 0;      // 同一帧内是常数 ⇒ 形状恒定
    var i, b, u;
    /* 液面。灌高一点：橙色占比是「一眼认出这是汽水」的第一因素，
       上一版灌到 -8，白商标又占掉 11.5，货架上那排瓶子远看是一排牛奶瓶。
       开了盖的跑掉一点气，液面略低 —— 这是开盖前后的第三处区别。 */
    var LT = (T === 0 ? -13 : T === 1 ? -12 : -11) + (fizz ? 1.8 : 0);
    var LR = T === 0 ? 6.2 : T === 1 ? 6.8 : 7.4;   // 液面椭圆半宽，跟着瓶肩收

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);

    /* 1) 空瓶底色：冷调玻璃，上亮下暗 */
    bfBody(ctx);
    ctx.fillStyle = G.vg(ctx, -23, 21.5, BF.glassHi, BF.glassLo);
    ctx.fill();

    ctx.save();
    bfBody(ctx); ctx.clip();

    /* 2) 汽水 */
    ctx.fillStyle = G.vg(ctx, LT, 21.5, BF.sodaHi, BF.sodaLo);
    ctx.fillRect(-11, LT, 22, 21.5 - LT);
    // 液体贴壁的折射暗边：右侧（背光侧）更宽更深
    ctx.fillStyle = BF.sodaEdge + '.34)';
    ctx.fillRect(-10, LT, 1.8, 21.5 - LT);
    ctx.fillStyle = BF.sodaEdge + '.46)';
    ctx.fillRect(7.6, LT, 2.4, 21.5 - LT);

    /* 2a) 气泡。上升的那几颗随 anim 走，贴壁的不动 */
    if (T >= 1) {
      for (b = 0; b < BUB.length; b++) {
        u = BUB[b];
        if (T === 1 && b > 3) break;
        var rise = (ph * 0.55 + u[3]) % 1;
        var by = u[1] - rise * (u[1] - LT - 1.5);
        var br = u[2] * (1 - rise * 0.30);
        ctx.beginPath(); ctx.arc(u[0], by, br, 0, TAU);
        ctx.fillStyle = 'rgba(255,254,246,' + (0.92 - rise * 0.30).toFixed(3) + ')';
        ctx.fill();
        if (T === 2) {                     // 底下压一道暗弧 = 球，不是白点
          ctx.beginPath();
          ctx.arc(u[0], by, br * 0.94, 0.22, Math.PI - 0.22);
          ctx.lineWidth = br * 0.42;
          ctx.strokeStyle = 'rgba(140,72,6,.46)';
          ctx.stroke();
        }
      }
      for (b = 0; b < WBUB.length; b++) {
        u = WBUB[b];
        if (u[1] < LT) continue;
        ctx.beginPath(); ctx.arc(u[0], u[1], u[2], 0, TAU);
        ctx.fillStyle = 'rgba(255,253,242,.88)';
        ctx.fill();
        if (T === 2) {
          ctx.beginPath();
          ctx.arc(u[0], u[1], u[2] * 0.95, 0.22, Math.PI - 0.22);
          ctx.lineWidth = u[2] * 0.40;
          ctx.strokeStyle = 'rgba(140,72,6,.40)';
          ctx.stroke();
        }
      }
    }

    /* 2b) 液面：一条明确的水平椭圆，是「看得到液面」的关键 */
    ctx.beginPath();
    ctx.ellipse(0, LT, LR, T === 0 ? 1.2 : 1.7, 0, 0, TAU);
    ctx.fillStyle = '#FFE0A0';
    ctx.fill();
    if (T >= 1) {
      ctx.beginPath();
      ctx.ellipse(0, LT + 0.7, LR, 1.3, 0, 0, Math.PI);
      ctx.fillStyle = 'rgba(160,80,0,.34)';
      ctx.fill();
    }
    if (fizz && T >= 1) {                  // 开了盖才起的一圈沫
      ctx.beginPath();
      ctx.ellipse(0, LT - 0.6, LR * 0.97, 1.9, 0, 0, TAU);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255,252,236,.80)';
      ctx.stroke();
      for (i = 0; i < 4; i++) {
        var fx2 = -6.4 + i * 4.2;
        ctx.beginPath();
        ctx.arc(fx2, LT - 1.2 - (i % 2) * 0.8, 0.85 + (i % 3) * 0.22, 0, TAU);
        ctx.fillStyle = 'rgba(255,255,248,.85)';
        ctx.fill();
      }
    }

    /* 3) 瓶壁厚度：两侧暗边压住，内侧再补一道细亮线 */
    ctx.fillStyle = BF.wallDk + '.34)';
    ctx.fillRect(-10, -14, 1.7, 35.5);
    ctx.fillStyle = BF.wallDk + '.44)';
    ctx.fillRect(8.3, -14, 1.7, 35.5);
    if (T >= 1) {
      ctx.fillStyle = 'rgba(255,255,255,.34)';   // 暗边内侧的转折反光
      ctx.fillRect(7.5, -12, 0.8, 31);
      // 瓶底厚玻璃：一圈暗环压着一道亮反射
      ctx.beginPath();
      ctx.ellipse(0, 18.6, 9.0, 2.6, 0, 0, TAU);
      ctx.fillStyle = BF.wallDk + '.22)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0, 17.3, 7.2, 1.6, 0, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.32)';
      ctx.fill();
    }
    ctx.restore();                         // 解除瓶身裁剪

    /* 4) 纸商标 */
    /* 小尺寸下白商标会把仅剩的橙色再砍掉一大截，收窄一点 */
    var ly0 = T === 0 ? 3.5 : 1.5, lh = T === 0 ? 8.0 : 11.5;
    G.rrect(ctx, -10, ly0, 20, lh, 1.6);
    ctx.fillStyle = G.vg(ctx, ly0, ly0 + lh, BF.label, G.shade(BF.label, -0.14));
    ctx.fill();
    if (T >= 1) {
      ctx.fillStyle = BF.labelBlue;
      ctx.fillRect(-10, ly0 + 0.9, 20, 1.5);
      ctx.fillRect(-10, ly0 + lh - 2.2, 20, 1.4);
    }
    if (T === 2 && s < 1.8) {              // 山形标（冰峰 = 冰的山峰）
      ctx.beginPath();
      ctx.moveTo(-6.0, ly0 + 8.6);
      ctx.lineTo(-1.8, ly0 + 3.2);
      ctx.lineTo(2.4, ly0 + 8.6);
      ctx.closePath();
      ctx.fillStyle = BF.labelBlue; ctx.fill();
      ctx.beginPath();
      ctx.arc(4.8, ly0 + 4.4, 1.7, 0, TAU);
      ctx.fillStyle = P.orange; ctx.fill();
    }
    if (s >= 1.8) {                        // 字太小反而更脏，够大才画
      ctx.save();
      ctx.scale(1 / s, 1 / s);
      G.text(ctx, '冰峰', 0, (ly0 + lh * 0.60) * s,
        { size: 6.0 * s, col: BF.labelBlue, weight: 800 });
      ctx.restore();
    }

    /* 5) 瓶颈加强环 */
    if (T >= 1) {
      ctx.beginPath();
      ctx.moveTo(-4.4, -19.6); ctx.lineTo(4.4, -19.6);
      G.shape(ctx, null, lw * 0.55, 'rgba(40,60,58,.42)');
    }
    if (T === 2) {
      ctx.beginPath();
      ctx.moveTo(-4.4, -16.4); ctx.lineTo(4.4, -16.4);
      G.shape(ctx, null, lw * 0.45, 'rgba(40,60,58,.30)');
    }

    /* 6) 瓶口凸唇（王冠盖压边的地方） */
    G.rrect(ctx, -5.5, -25.5, 11, 2.9, 1.0);
    ctx.fillStyle = G.vg(ctx, -25.5, -22.6, BF.glassHi, BF.glassLo);
    ctx.fill();
    G.shape(ctx, null, lw * 0.6);
    if (!capped) {                         // 开了盖：瓶口能看进去，一圈暗
      ctx.beginPath();
      ctx.ellipse(0, -25.3, 3.4, 1.15, 0, 0, TAU);
      ctx.fillStyle = 'rgba(26,48,46,.52)';
      ctx.fill();
      if (T >= 1) {
        ctx.beginPath();
        ctx.ellipse(0, -25.6, 3.4, 1.15, 0, Math.PI * 1.05, Math.PI * 1.95);
        ctx.lineWidth = 0.9;
        ctx.strokeStyle = 'rgba(255,255,255,.62)';
        ctx.stroke();
      }
    }

    /* 7) 冷凝水珠：没开的瓶子刚从冰桶里捞出来。裁进瓶身，绝不会漏到轮廓外 */
    if (capped && T >= 1) {
      ctx.save();
      bfBody(ctx); ctx.clip();
      /* 只在瓶肩以上罩一层极淡的霜。整瓶罩的话橙色被冲成奶白，
         远看成了牛奶瓶 —— 这是上一版最大的问题。 */
      ctx.fillStyle = 'rgba(226,244,250,.16)';
      ctx.fillRect(-11, -23, 22, 18);
      /* 按**绝对**尺寸限量：水珠半径小于 0.55px 就只剩一层灰点，
         把橙色搅浑还不像水。FROST 已按半径从大到小排好，取前几颗即可。 */
      var fn = 0;
      while (fn < FROST.length && FROST[fn][2] * s >= 0.55) fn++;
      if (fn > 6 && s < 0.95) fn = 6;
      for (i = 0; i < fn; i++) bead(ctx, FROST[i][0], FROST[i][1], FROST[i][2], 0.70);
      if (T === 2) {                       // 两道流下来的水痕
        ctx.beginPath();
        ctx.moveTo(-3.6, 3.4);
        ctx.quadraticCurveTo(-3.0, 9.0, -3.8, 14.0);
        ctx.lineWidth = 1.1;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(240,252,255,.42)';
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(6.0, 10.6);
        ctx.quadraticCurveTo(6.6, 15.0, 5.8, 19.0);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* 8) 主高光：宽晕 + 窄芯两层。窄芯必须接近纯白，这是「玻璃」的那一笔 */
    /* 用两头收尖的长椭圆而不是圆角矩形：镜面反射是中间最亮、两端渐弱的
       一道streak，等宽的白棍会读成贴上去的一条胶带。
       离左侧暗边留 0.8 个单位的空 —— 贴着描边画会被读成「描边内侧的高光」。 */
    ctx.beginPath();
    ctx.ellipse(-6.6, 1.0, 2.2, 15.0, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,.16)';     // 宽晕
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-6.7, 1.0, 0.95, 14.0, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,.96)';     // 窄芯：接近纯白，这是「玻璃」的那一笔
    ctx.fill();
    // 肩部那一小段：跟着瓶形往里收，高光才像贴在曲面上
    ctx.beginPath();
    ctx.ellipse(-4.3, -17.6, 0.62, 4.4, 0.10, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.fill();
    if (T >= 1) {                          // 右侧一道细反光
      ctx.beginPath();
      ctx.ellipse(6.9, 2.0, 0.55, 10.5, 0, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.46)';
      ctx.fill();
    }

    /* 9) 瓶身轮廓 */
    bfBody(ctx);
    G.shape(ctx, null, lw);

    /* 10) 王冠盖 */
    if (capped) {
      var cy0 = -30, ch = 6.5;
      G.rrect(ctx, -6.4, cy0, 12.8, ch, 1.4);
      ctx.fillStyle = G.vg(ctx, cy0, cy0 + ch, BF.capHi, BF.capLo);
      ctx.fill();
      G.shape(ctx, null, lw * 0.68);
      if (T >= 1) {                        // 齿边：实心小三角比描边更像压花
        ctx.beginPath();
        for (var t2 = 0; t2 < 6; t2++) {
          var tx = -6.0 + t2 * 2.2;
          ctx.moveTo(tx, cy0 + ch);
          ctx.lineTo(tx + 1.1, cy0 + ch - 2.2);
          ctx.lineTo(tx + 2.2, cy0 + ch);
          ctx.closePath();
        }
        ctx.fillStyle = 'rgba(72,88,98,.85)'; ctx.fill();
      }
      ctx.beginPath();                     // 盖顶冲压金属的一道横高光
      ctx.ellipse(-1.4, cy0 + 1.9, 4.0, 1.2, 0, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.70)'; ctx.fill();
      if (T === 2) {
        ctx.beginPath();
        ctx.moveTo(-5.6, cy0 + 4.2); ctx.lineTo(5.6, cy0 + 4.2);
        G.shape(ctx, null, lw * 0.4, 'rgba(255,255,255,.30)');
      }
    }

    /* 11) 开盖后瓶口冒的气泡：全部收在 y ≥ -29.5，不越顶 */
    if (fizz) {
      for (i = 0; i < MBUB.length; i++) {
        var m = MBUB[i];
        var r2 = (ph * 0.8 + i * 0.33) % 1;
        var yy = Math.max(-29.5, m[1] - r2 * 3.2);
        ctx.beginPath();
        ctx.arc(m[0] + Math.sin(ph * 2 + i) * 0.5, yy, m[2] * (1 - r2 * 0.3), 0, TAU);
        ctx.fillStyle = 'rgba(230,246,254,' + (0.88 - r2 * 0.5).toFixed(3) + ')';
        ctx.fill();
        G.shape(ctx, null, lw * 0.3, 'rgba(120,170,190,.5)');
      }
    }

    ctx.restore();
  };

  /* ================= 凉 皮 台 ================= */

  /* 盆里泡着的宽凉皮：[x比, y比, 宽比, 高比, 不透明度]
     色相跟碗里那份保持一致（米白偏灰）—— 泡在冷灰的钢盆里，
     上一版的暖奶油黄读作几张油纸。 */
  var SHEET = [
    [0.06, 0.22, 0.60, 0.22, 0.52],
    [0.30, 0.36, 0.62, 0.21, 0.44],
    [0.02, 0.51, 0.74, 0.20, 0.56],
    [0.26, 0.64, 0.64, 0.19, 0.48]
  ];
  /* 台面上溅的红油点 [x比, y比, rx, ry] —— 凉皮台不可能只有清水渍 */
  var OILSPOT = [[0.30, 0.86, 4.2, 1.7], [0.66, 0.92, 3.0, 1.3], [0.47, 0.79, 2.2, 1.0]];

  /* 不锈钢浅盆，里面泡着一叠宽凉皮 */
  function noodleBasin(ctx, x, y, w, h) {
    G.box(ctx, x, y, w, h, 7, '#DCE6EC', 3.4);          // 盆沿（凸）
    ctx.save();
    G.rrect(ctx, x + 3, y + 3, w - 6, h - 6, 5); ctx.clip();
    ctx.fillStyle = G.vg(ctx, y + 3, y + h - 3, '#7E94A3', '#AFC2CE');  // 盆内（凹）
    ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
    ctx.fillStyle = 'rgba(206,228,238,.55)';            // 泡着的水
    ctx.fillRect(x + 3, y + h * 0.42, w - 6, h * 0.58);

    for (var i = 0; i < SHEET.length; i++) {
      var sh = SHEET[i];
      var sx = x + w * sh[0], sy = y + h * sh[1];
      var sw = w * sh[2], sht = h * sh[3];
      ctx.beginPath();
      ctx.moveTo(sx, sy + sht * 0.5);
      ctx.quadraticCurveTo(sx + sw * 0.25, sy - sht * 0.22, sx + sw * 0.5, sy + sht * 0.28);
      ctx.quadraticCurveTo(sx + sw * 0.78, sy + sht * 0.92, sx + sw, sy + sht * 0.34);
      ctx.lineTo(sx + sw, sy + sht);
      ctx.quadraticCurveTo(sx + sw * 0.5, sy + sht * 1.55, sx, sy + sht);
      ctx.closePath();
      ctx.fillStyle = 'rgba(238,236,226,' + sh[4] + ')';
      ctx.fill();
      G.shape(ctx, null, 1.2, 'rgba(96,94,78,.55)');
      // 下缘一道厚度线 —— 皮子是有厚度的，不是一张纸
      ctx.beginPath();
      ctx.moveTo(sx + 1, sy + sht * 0.96);
      ctx.quadraticCurveTo(sx + sw * 0.5, sy + sht * 1.44, sx + sw - 1, sy + sht * 0.96);
      G.shape(ctx, null, 1.4, 'rgba(150,146,126,.55)');
      // 面上一道湿光，压在上缘
      ctx.beginPath();
      ctx.moveTo(sx + sw * 0.16, sy + sht * 0.30);
      ctx.quadraticCurveTo(sx + sw * 0.5, sy + sht * 0.06, sx + sw * 0.82, sy + sht * 0.36);
      G.shape(ctx, null, 1.2, 'rgba(255,255,255,.50)');
    }
    ctx.fillStyle = 'rgba(150,196,214,.20)';            // 泡在水里那半截泛青
    ctx.fillRect(x + 3, y + h * 0.52, w - 6, h * 0.48);
    ctx.beginPath();                                    // 水面反光
    ctx.ellipse(x + w * 0.66, y + h * 0.30, w * 0.22, h * 0.065, -0.2, 0, TAU);
    G.shape(ctx, 'rgba(255,255,255,.58)', 0);
    ctx.beginPath();
    ctx.ellipse(x + w * 0.28, y + h * 0.44, w * 0.13, h * 0.04, -0.15, 0, TAU);
    G.shape(ctx, 'rgba(255,255,255,.34)', 0);
    ctx.restore();
  }

  /* 一只调料罐。kind: 0 红油 / 1 醋 / 2 蒜水 / 3 芝麻 */
  function condiment(ctx, x, y, w, h, kind) {
    var body = ['#C7351F', '#6B4326', '#EFEAE0', '#E8DCC0'][kind];
    var liquid = ['#D8481C', '#8A5A32', '#F7F4EE', '#D9C79A'][kind];
    G.box(ctx, x, y + h * 0.22, w, h * 0.78, 3, body, 2.6);
    ctx.save();
    G.rrect(ctx, x + 1.4, y + h * 0.22 + 1.4, w - 2.8, h * 0.78 - 2.8, 2); ctx.clip();
    ctx.fillStyle = liquid;
    ctx.fillRect(x, y + h * 0.42, w, h);
    if (kind === 0) {
      /* 红油罐底下沉着一层辣椒面。油泼辣子是「油 + 渣」两相的，
         画成一罐纯红只会读作番茄酱。 */
      ctx.fillStyle = '#8E2109';
      ctx.fillRect(x, y + h * 0.74, w, h * 0.26);
      ctx.fillStyle = 'rgba(60,12,4,.55)';
      for (var k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.ellipse(x + w * (0.22 + k * 0.19), y + h * (0.76 + (k % 2) * 0.07),
          1.3, 0.9, 0.3, 0, TAU);
        ctx.fill();
      }
      ctx.beginPath();                                  // 油面一道反光
      ctx.ellipse(x + w * 0.52, y + h * 0.44, w * 0.30, 1.1, 0, 0, TAU);
      G.shape(ctx, 'rgba(255,190,120,.60)', 0);
    }
    if (kind === 3) {                                   // 芝麻：撒点白点
      for (var i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(x + w * (0.22 + (i % 3) * 0.28), y + h * (0.58 + (i > 2 ? 0.16 : 0)),
          1.1, 0, TAU);
        G.shape(ctx, '#FFFBF0', 0);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,.42)';            // 玻璃竖高光
    ctx.fillRect(x + w * 0.16, y + h * 0.30, w * 0.16, h * 0.55);
    ctx.restore();
    G.box(ctx, x + w * 0.24, y, w * 0.52, h * 0.26, 2, '#4A4744', 2.2);
  }

  Art.noodleBar = function (ctx, z, st, now) {
    Art.panel(ctx, z, '凉 皮 台');
    var c = Art.content(z), i;
    var bx = c.x + 70, by = c.y + 56;        // ★ 必须等于 G.BOWL
    var stage = st.state === 'empty' ? 0 : st.state === 'noodle' ? 1
              : st.state === 'seasoned' ? 2 : 3;

    /* --- 湿漉漉的台面：几摊固定的水渍 --- */
    for (i = 0; i < WET.length; i++) {
      var wt = WET[i];
      ctx.beginPath();
      ctx.ellipse(c.x + c.w * wt[0], c.y + c.h * wt[1], wt[2], wt[3], 0, 0, TAU);
      G.shape(ctx, 'rgba(170,205,220,.28)', 0);
      ctx.beginPath();
      ctx.ellipse(c.x + c.w * wt[0], c.y + c.h * wt[1], wt[2], wt[3], 0, Math.PI, TAU);
      G.shape(ctx, null, 1.2, 'rgba(255,255,255,.40)');
    }
    /* --- 溅出来的红油点：只在拌过之后才有，越拌越脏 --- */
    if (stage >= 2) {
      for (i = 0; i < OILSPOT.length; i++) {
        var os = OILSPOT[i];
        ctx.beginPath();
        ctx.ellipse(c.x + c.w * os[0], c.y + c.h * os[1], os[2], os[3], 0.2, 0, TAU);
        G.shape(ctx, 'rgba(190,58,24,' + (stage >= 3 ? 0.34 : 0.20) + ')', 0);
      }
    }

    /* --- 左上：泡着凉皮的不锈钢盆 --- */
    noodleBasin(ctx, c.x, c.y + 2, 52, 32);

    /* --- 右上：一排调料罐 --- */
    for (i = 0; i < 4; i++) condiment(ctx, c.x + 60 + i * 19, c.y + 3, 14, 28, i);

    /* --- 搅拌进度环 / 完成光圈 --- */
    if (st.state === 'seasoned') {
      var pr = G.clamp(st.mix / G.CFG.mixNeed, 0, 1);
      ctx.beginPath();
      ctx.arc(bx, by, 34, -Math.PI / 2, -Math.PI / 2 + TAU * pr);
      G.shape(ctx, null, 5, P.chiliOil);
      ctx.save(); ctx.globalAlpha = 0.75;
      var a = now * 3.4;
      G.circle(ctx, bx + Math.cos(a) * 34, by + Math.sin(a) * 34, 5, P.yellow, 3);
      ctx.restore();
    } else if (st.state === 'done') {
      ctx.save(); ctx.shadowColor = P.green; ctx.shadowBlur = 10;
      G.circle(ctx, bx, by, 34, null, 4, P.green); ctx.restore();
    }

    /* --- 碗（走 Art.bowl 接缝） --- */
    G.drop(ctx, bx, by + 22, 27, 6, 0.34);
    Art.bowl(ctx, bx, by, 0.92, stage);

    /* --- 搅起来的红油跟着转 --- */
    if (st.state === 'seasoned' && st.mix > 0.2) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(bx, by - 8, 22, 9, 0, 0, TAU); ctx.clip();
      ctx.translate(bx, by - 8); ctx.rotate(st.mix * 1.1); ctx.translate(-bx, -(by - 8));
      G.box(ctx, bx - 15, by - 13, 12, 4, 2, P.chiliOil, 0);
      G.box(ctx, bx + 2,  by - 7,  13, 4, 2, P.chiliOil, 0);
      G.box(ctx, bx - 7,  by - 1,  11, 4, 2, P.pepperLt, 0);
      ctx.restore();
    }

    var hints = {
      empty:    ['点击抓凉皮', P.inkSoft],
      noodle:   ['点击加调料', P.orangeDk],
      seasoned: ['画圈搅拌', P.chili],
      done:     ['上桌中', '#1D8A3C']
    };
    Art.hint(ctx, z, hints[st.state][0], hints[st.state][1]);
    return { x: bx, y: by, r: 44 };
  };

  /* ================= 冰 峰 冰 柜 ================= */

  /* 斜插在冰里的瓶子：桶口只放它露出瓶颈和肩。
     玻璃的三件套一件不少 —— 两侧折射暗边、一条窄亮竖带、几颗冷凝水珠。
     上一版是两个圆角矩形，实际尺寸下读作巧克力棒。 */
  function tubBottle(ctx) {
    // 瓶肩瓶颈（玻璃底色，上亮下暗）
    ctx.beginPath();
    ctx.moveTo(-4.6, 3.0);
    ctx.quadraticCurveTo(-4.6, -5.0, -2.6, -8.0);
    ctx.lineTo(-2.6, -12.4);
    ctx.lineTo(2.6, -12.4);
    ctx.lineTo(2.6, -8.0);
    ctx.quadraticCurveTo(4.6, -5.0, 4.6, 3.0);
    ctx.closePath();
    ctx.fillStyle = G.vg(ctx, -12.4, 3.0, '#EFF8F5', '#B9D0CC');
    ctx.fill();

    ctx.save(); ctx.clip();
    ctx.fillStyle = G.vg(ctx, -3.0, 3.0, '#FFBE45', '#D9760D');  // 露出来的那截汽水
    ctx.fillRect(-5, -3.0, 10, 8);
    ctx.beginPath();                                   // 液面
    ctx.ellipse(0, -3.0, 4.2, 0.9, 0, 0, TAU);
    G.shape(ctx, '#FFE0A0', 0);
    ctx.fillStyle = 'rgba(28,52,50,.34)';              // 两侧折射暗边
    ctx.fillRect(-4.6, -9, 1.1, 13);
    ctx.fillStyle = 'rgba(28,52,50,.42)';
    ctx.fillRect(3.5, -9, 1.1, 13);
    ctx.restore();

    ctx.beginPath();                                   // 一次描边，形状干净
    ctx.moveTo(-4.6, 3.0);
    ctx.quadraticCurveTo(-4.6, -5.0, -2.6, -8.0);
    ctx.lineTo(-2.6, -12.4);
    ctx.lineTo(2.6, -12.4);
    ctx.lineTo(2.6, -8.0);
    ctx.quadraticCurveTo(4.6, -5.0, 4.6, 3.0);
    G.shape(ctx, null, 2.0);

    G.box(ctx, -3.5, -15.4, 7, 3.6, 1.2, '#96A6B1', 1.8);   // 王冠盖
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.fillRect(-2.6, -14.8, 4.0, 1.1);

    G.rrect(ctx, -3.1, -10.5, 1.2, 12, 0.6);            // 窄亮竖带
    ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fill();
    // 冷凝水珠：冰桶里的瓶子必须挂霜
    var TB = [[2.2, -6.0, 0.75], [-1.4, -1.5, 0.65], [2.6, 0.6, 0.6], [-2.0, -9.4, 0.55]];
    for (var i = 0; i < TB.length; i++) {
      ctx.beginPath(); ctx.arc(TB[i][0], TB[i][1], TB[i][2], 0, TAU);
      G.shape(ctx, 'rgba(240,252,255,.80)', 0);
    }
  }

  Art.fridge = function (ctx, z, state, now) {
    Art.panel(ctx, z, '冰 峰');
    var c = Art.content(z), i;
    /* 桶：上宽下窄 + 一个明显的椭圆开口。
       椭圆开口是让它读作"容器"而不是"蓝盒子"的关键 —— 第一版画成矩形，
       实际尺寸下被读成了自动售货机。 */
    var mx = c.x + c.w / 2;
    var topY = c.y + 13, botY = c.y + 45;
    var topR = c.w / 2 - 4, botR = topR * 0.80, lipR = 8;

    /* --- 桶身 --- */
    G.drop(ctx, mx, botY + 2, topR * 0.9, 5, 0.34);
    ctx.beginPath();
    ctx.moveTo(mx - topR, topY);
    ctx.lineTo(mx - botR, botY - 5);
    ctx.quadraticCurveTo(mx - botR, botY, mx - botR + 5, botY);
    ctx.lineTo(mx + botR - 5, botY);
    ctx.quadraticCurveTo(mx + botR, botY, mx + botR, botY - 5);
    ctx.lineTo(mx + topR, topY);
    ctx.closePath();
    G.shape(ctx, P.fridge, 4, null, [topY, botY]);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(mx - topR, topY); ctx.lineTo(mx - botR, botY);
    ctx.lineTo(mx + botR, botY); ctx.lineTo(mx + topR, topY);
    ctx.closePath(); ctx.clip();

    // 掉漆：露出底下的白搪瓷
    for (i = 0; i < CHIP.length; i++) {
      var cp = CHIP[i];
      var px2 = mx - topR + topR * 2 * cp[0], py2 = topY + (botY - topY) * cp[1];
      ctx.beginPath();
      ctx.ellipse(px2, py2, cp[2], cp[3], 0.3, 0, TAU);
      G.shape(ctx, 'rgba(232,240,244,.62)', 0);
      ctx.beginPath();
      ctx.ellipse(px2, py2, cp[2], cp[3], 0.3, 0, TAU);
      G.shape(ctx, null, 1.1, 'rgba(20,60,90,.34)');
    }
    // 两道桶箍
    [0.36, 0.76].forEach(function (fy) {
      var by2 = topY + (botY - topY) * fy;
      ctx.fillStyle = 'rgba(255,255,255,.44)';
      ctx.fillRect(mx - topR, by2, topR * 2, 3.2);
      ctx.fillStyle = 'rgba(10,40,64,.42)';
      ctx.fillRect(mx - topR, by2 + 3.2, topR * 2, 2);
    });
    // 桶壁凝的水珠
    for (i = 0; i < DROPS.length; i++) {
      var dp = DROPS[i];
      var dx = mx - topR + topR * 2 * dp[0], dy = topY + (botY - topY) * dp[1];
      ctx.beginPath(); ctx.arc(dx, dy, dp[2], 0, TAU);
      G.shape(ctx, 'rgba(232,248,254,.72)', 0);
      ctx.beginPath(); ctx.arc(dx - dp[2] * 0.32, dy - dp[2] * 0.32, dp[2] * 0.38, 0, TAU);
      G.shape(ctx, 'rgba(255,255,255,.9)', 0);
    }
    // 左侧受光
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(mx - topR, topY, topR * 0.42, botY - topY);
    ctx.restore();

    /* --- 桶口：椭圆开口，里面是冰水和斜插的瓶子 --- */
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(mx, topY, topR, lipR, 0, 0, TAU);
    ctx.clip();
    // 内壁：上暗下亮 = 凹进去
    ctx.fillStyle = G.vg(ctx, topY - lipR, topY + lipR, '#123A56', '#2F6E96');
    ctx.fillRect(mx - topR, topY - lipR, topR * 2, lipR * 2);
    // 冰水
    ctx.fillStyle = 'rgba(150,208,234,.62)';
    ctx.fillRect(mx - topR, topY - lipR * 0.1, topR * 2, lipR * 1.2);
    // 碎冰
    for (i = 0; i < ICE.length; i++) {
      var ic = ICE[i];
      ctx.save();
      ctx.translate(mx - topR + topR * 2 * ic[0], topY - lipR + lipR * 2 * ic[1]);
      ctx.rotate(ic[4]);
      G.box(ctx, -ic[2] / 2 * 0.6, -ic[3] / 2 * 0.6, ic[2] * 0.6, ic[3] * 0.6, 1.6,
        'rgba(240,252,255,.9)', 1.2, 'rgba(120,170,196,.7)');
      ctx.restore();
    }
    ctx.restore();

    // 斜插在冰里的三只瓶子：桶口把下半截挡住，只露瓶颈和肩
    for (i = 0; i < 3; i++) {
      var bx2 = mx + (i - 1) * (topR * 0.58);
      var tilt = (i - 1) * 0.20;
      ctx.save();
      // 瓶子倾斜后瓶盖的角是整个工位最高的点，压 1px 才不顶出内容区
      ctx.translate(bx2, topY - 1); ctx.rotate(tilt);
      tubBottle(ctx);
      ctx.restore();
    }

    // 桶口的沿（画在瓶子之后，瓶子才像"插进去"）
    ctx.beginPath();
    ctx.ellipse(mx, topY, topR, lipR, 0, 0, TAU);
    G.shape(ctx, null, 3.4, '#123A56');
    ctx.beginPath();
    ctx.ellipse(mx, topY, topR, lipR, 0, Math.PI * 1.05, Math.PI * 1.95);

      ctx.lineTo(x + hw * 0.44, y - hh * 0.62);
      ctx.bezierCurveTo(x + hw * 0.32, y - hh * 0.96, x - hw * 0.04, y - hh * 1.12,
                        x - hw * 0.30, y - hh * 1.30);
      ctx.closePath();
      G.shape(ctx, 'rgba(255,255,255,.12)', 0);
      ctx.beginPath();                         // 顶上一道高光
      ctx.moveTo(x - hw * 0.10, y - hh * 1.27);
      ctx.quadraticCurveTo(x + hw * 0.34, y - hh * 1.20, x + hw * 0.66, y - hh * 1.02);
      G.shape(ctx, null, 3.4, 'rgba(255,255,255,.28)');
      ctx.beginPath();                         // 刘海末梢几绺，别是一块死板的饼
      for (var q = 0; q < 4; q++) {
        var qx = x - hw * (0.50 - q * 0.34);
        ctx.moveTo(qx, y - hh * (1.00 - q * 0.03));
        ctx.quadraticCurveTo(qx + hw * 0.14, y - hh * (0.82 - q * 0.05),
                             qx + hw * 0.28, y - hh * (0.66 - q * 0.04));
      }
      G.shape(ctx, null, 1.8, 'rgba(20,14,10,.28)');
      ctx.restore();

    } else if (ht === 'crew') {
      /* 西装大哥：贴头皮的寸头，发际线低而平，只在两个额角浅浅退一点；
         关键是两鬓推白 —— 顶上乌黑、边上银白，这个对比就是他的记号，
         所以鬓角这一块必须留出足够面积，太窄的话银色根本看不见。 */
      var top = s.hairTop || G.shade(hair, -0.40);
      var CREW = [
        [-1.03, -0.04],
        [-1.12, -0.70], [-0.60, -1.14], [0.00, -1.15],
        [0.60, -1.14], [1.12, -0.70], [1.03, -0.04],   // 右鬓角推到耳前收住
        [0.99, -0.24], [0.95, -0.44], [0.84, -0.58],
        [0.74, -0.70], [0.60, -0.58], [0.42, -0.58],
        [0.20, -0.58], [-0.20, -0.58], [-0.42, -0.58],
        [-0.60, -0.58], [-0.74, -0.70], [-0.84, -0.58],
        [-0.95, -0.44], [-0.99, -0.24], [-1.03, -0.04]
      ];
      hairPath(ctx, x, y, s, CREW);
      hairFill(ctx, top, y - hh * 1.15, y - hh * 0.04, lw);
      ctx.save();
      hairPath(ctx, x, y, s, CREW); ctx.clip();
      [-1, 1].forEach(function (sg) {          // 两鬓花白：一大片银，往里渐隐
        var gr = ctx.createLinearGradient(x + sg * hw * 0.44, 0, x + sg * hw * 1.08, 0);
        gr.addColorStop(0, 'rgba(206,204,199,0)');
        gr.addColorStop(0.46, 'rgba(212,210,205,.40)');
        gr.addColorStop(1, 'rgba(234,233,229,.84)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.ellipse(x + sg * hw * 1.00, y - hh * 0.44, hw * 0.52, hh * 0.54, 0, 0, TAU);
        ctx.fill();
        for (var fz = 0; fz < FUZZ.length; fz++) {   // 推子推出来的碎发点
          ctx.beginPath();
          ctx.arc(x + sg * hw * (0.62 + FUZZ[fz][0] * 0.44),
                  y + hh * (-0.58 + FUZZ[fz][1] * 0.74),
                  0.6 + FUZZ[fz][0] * 0.5, 0, TAU);
          ctx.fillStyle = 'rgba(48,44,40,.34)'; ctx.fill();
        }
      });
      for (var b = 0; b < BRISTLE.length; b++) {   // 顶上竖着的短发茬
        var bx = x + BRISTLE[b][0] * hw * 0.86;
        var byy = y - hh * (1.06 + BRISTLE[b][1] * 0.05);
        ctx.beginPath();
        ctx.moveTo(bx, byy); ctx.lineTo(bx + 1.2, byy - 3.5 - BRISTLE[b][1] * 3);
        G.shape(ctx, null, 1.8, G.shade(top, 0.40));
      }
      ctx.beginPath();                         // 发际线不是刀切的，虚一道
      ctx.moveTo(x - hw * 0.82, y - hh * 0.60);
      ctx.bezierCurveTo(x - hw * 0.34, y - hh * 0.54, x + hw * 0.34, y - hh * 0.54,
                        x + hw * 0.82, y - hh * 0.60);
      G.shape(ctx, null, 3.2, 'rgba(96,90,84,.30)');
      ctx.restore();

    } else if (ht === 'combover') {
      /* 粉领带前辈：头顶只剩薄薄一层往后梳，额头一整片亮出来；
         耳朵上方还有点量，但绝不能垂到眼睛边上 —— 那就成修士的兜帽了。
         发丝之间要看得见头皮。 */
      var COMB = [
        [-0.99, -0.30],
        [-1.14, -0.58], [-0.64, -1.06], [0.00, -1.07],
        [0.64, -1.06], [1.14, -0.58], [0.99, -0.30],   // 稀发不该垂到耳边
        [0.95, -0.40], [0.90, -0.50], [0.76, -0.58],
        [0.48, -0.68], [0.22, -0.74], [0.00, -0.75],
        [-0.22, -0.74], [-0.48, -0.68], [-0.76, -0.58],
        [-0.90, -0.50], [-0.95, -0.40], [-0.99, -0.30]
      ];
      hairPath(ctx, x, y, s, COMB);
      hairFill(ctx, hair, y - hh * 1.07, y - hh * 0.30, lw);
      ctx.save();
      hairPath(ctx, x, y, s, COMB); ctx.clip();
      for (var w = -2; w <= 2; w++) {          // 背梳的几缕，缝里透头皮
        ctx.beginPath();
        ctx.moveTo(x - hw * 0.90, y - hh * (0.42 + w * 0.10));
        ctx.quadraticCurveTo(x, y - hh * (1.00 + w * 0.02),
                             x + hw * 0.92, y - hh * (0.38 + w * 0.10));
        G.shape(ctx, null, 1.6, w % 2 ? 'rgba(255,255,255,.34)' : 'rgba(120,112,106,.30)');
      }
      ctx.beginPath();                         // 头顶稀，透出一点头皮色
      ctx.ellipse(x, y - hh * 0.94, hw * 0.54, hh * 0.13, 0, 0, TAU);
      G.shape(ctx, 'rgba(230,196,164,.40)', 0);
      ctx.restore();

    } else {                                   // 路人：短发 / 中长 / 丸子
      var st = c.hairStyle || 0;
      if (st === 1) {
        ctx.beginPath();
        ctx.moveTo(x - hw - 7, y + hh * 0.98);
        ctx.bezierCurveTo(x - hw - 11, y - hh * 0.36, x - hw * 0.58, y - hh * 1.12,
                          x, y - hh * 1.05);
        ctx.bezierCurveTo(x + hw * 0.58, y - hh * 1.12, x + hw + 11, y - hh * 0.36,
                          x + hw + 7, y + hh * 0.98);
        ctx.lineTo(x + hw * 0.74, y + hh * 0.98);
        ctx.bezierCurveTo(x + hw, y - hh * 0.22, x + hw * 0.58, y - hh * 0.52,
                          x, y - hh * 0.48);
        ctx.bezierCurveTo(x - hw * 0.58, y - hh * 0.52, x - hw, y - hh * 0.22,
                          x - hw * 0.74, y + hh * 0.98);
        ctx.closePath();
        hairFill(ctx, hair, y - hh * 1.12, y + hh * 0.98, lw);
      } else if (st === 2) {
        G.circle(ctx, x + 2, y - hh * 0.85, 11, hair, lw);
        ctx.beginPath();
        ctx.moveTo(x - hw - 1, y - hh * 0.14);
        ctx.bezierCurveTo(x - hw - 2, y - hh * 0.86, x - hw * 0.38, y - hh * 1.02,
                          x, y - hh * 0.98);
        ctx.bezierCurveTo(x + hw * 0.44, y - hh * 1.02, x + hw + 2, y - hh * 0.82,
                          x + hw + 1, y - hh * 0.04);
        ctx.bezierCurveTo(x + hw * 0.58, y - hh * 0.56, x - hw * 0.58, y - hh * 0.56,
                          x - hw - 1, y - hh * 0.14);
        ctx.closePath();
        hairFill(ctx, hair, y - hh * 1.02, y - hh * 0.04, lw);
      } else {
        ctx.beginPath();
        ctx.moveTo(x - hw - 1, y - hh * 0.02);
        ctx.bezierCurveTo(x - hw - 2, y - hh * 0.90, x - hw * 0.42, y - hh * 1.08,
                          x, y - hh * 1.03);
        ctx.bezierCurveTo(x + hw * 0.50, y - hh * 1.08, x + hw + 2, y - hh * 0.84,
                          x + hw + 1, y + hh * 0.02);
        ctx.bezierCurveTo(x + hw * 0.64, y - hh * 0.56, x + hw * 0.30, y - hh * 0.48,
                          x, y - hh * 0.52);
        ctx.bezierCurveTo(x - hw * 0.34, y - hh * 0.48, x - hw * 0.70, y - hh * 0.54,
                          x - hw - 1, y - hh * 0.02);
        ctx.closePath();
        hairFill(ctx, hair, y - hh * 1.06, y + hh * 0.02, lw);
      }
    }
    ctx.restore();

    if (c.hat) {                               // 帽檐
      ctx.beginPath();
      ctx.ellipse(x, y - hh * 0.40, hw + 8, 8.5, 0, Math.PI, TAU);
      ctx.closePath();
      G.shape(ctx, G.shade(c.hatCol || P.red, -0.12), lw,
        null, [y - hh * 0.40 - 8.5, y - hh * 0.40]);
    }
  }

  /* ================= 眼睛 ================= */
  function drawEyes(ctx, x, y, s, c, mood, blink, look) {
    var ey = y + s.hh * s.eyeY;
    [-1, 1].forEach(function (sg) {
      var ex = x + sg * s.eyeGap;
      var ew = s.eyeW, eh = s.eyeH;

      if (blink) {                              // 眨眼
        ctx.beginPath();
        ctx.moveTo(ex - ew, ey - 1);
        ctx.quadraticCurveTo(ex, ey + 3.5, ex + ew, ey - 1 + sg * s.tilt * 0.6);
        G.shape(ctx, null, 3.2, P.ink);
        return;
      }
      if (mood === 'grin') {                    // 笑成月牙
        ctx.beginPath();
        ctx.moveTo(ex - ew - 1, ey + 2.5);
        ctx.quadraticCurveTo(ex, ey - eh * 1.7, ex + ew + 1, ey + 2.5);
        G.shape(ctx, null, 3.6, P.ink);
        ctx.beginPath();                        // 下眼睑的卧蚕：笑起来颊肉顶上来
        ctx.moveTo(ex - ew * 0.8, ey + 6);
        ctx.quadraticCurveTo(ex, ey + 8.5, ex + ew * 0.8, ey + 6);
        G.shape(ctx, null, 1.8, 'rgba(58,36,24,.34)');
        ctx.beginPath();                        // 眼尾的笑纹
        ctx.moveTo(ex + sg * (ew + 1.5), ey + 0.5);
        ctx.lineTo(ex + sg * (ew + 5.5), ey - 2);
        ctx.moveTo(ex + sg * (ew + 1.5), ey + 2.5);
        ctx.lineTo(ex + sg * (ew + 5), ey + 2);
        G.shape(ctx, null, 1.4, 'rgba(58,36,24,.30)');
        return;
      }

      var wide = mood === 'scared' ? 1.9 : mood === 'furious' ? 1.35 : 1;
      var hgt = eh * wide;
      var oy = sg * s.tilt;                     // 外眼角下垂

      ctx.beginPath();                          // 眼白
      ctx.ellipse(ex, ey + oy * 0.3, ew, hgt, sg * s.tilt * 0.02, 0, TAU);
      G.shape(ctx, '#FFFDF8', 0);

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(ex, ey + oy * 0.3, ew, hgt, sg * s.tilt * 0.02, 0, TAU);
      ctx.clip();
      var px = ex + sg * 0.6, py = ey + look + oy * 0.3;
      if (mood === 'furious') py -= hgt * 0.18;
      var pr = mood === 'scared' ? 4.4 : 6.3;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU);
      var pg = ctx.createRadialGradient(px - 2, py - 2.2, 0.6, px, py, pr * 1.2);
      pg.addColorStop(0, '#5A4130'); pg.addColorStop(0.55, '#2A1B10');
      pg.addColorStop(1, '#150D06');
      ctx.fillStyle = pg; ctx.fill();
      G.circle(ctx, px - pr * 0.36, py - pr * 0.4, pr * 0.34, '#FFFFFF', 0);
      if (mood !== 'scared')
        G.circle(ctx, px + pr * 0.34, py + pr * 0.42, pr * 0.17,
          'rgba(255,255,255,.6)', 0);
      ctx.restore();

      ctx.beginPath();                          // 上眼线
      ctx.moveTo(ex - ew - 0.4, ey - hgt * 0.28 + oy * 0.2);
      ctx.quadraticCurveTo(ex, ey - hgt * 1.42, ex + ew + 0.4, ey - hgt * 0.28 + oy);
      G.shape(ctx, null, mood === 'furious' ? 4 : 3.3, P.ink);

      if (s.lidCrease) {                        // 双眼皮／上睑褶
        ctx.beginPath();
        ctx.moveTo(ex - ew * 0.85, ey - hgt * 0.9 + oy * 0.2);
        ctx.quadraticCurveTo(ex, ey - hgt * 1.9, ex + ew * 0.85, ey - hgt * 0.8 + oy);
        G.shape(ctx, null, 1.5, 'rgba(58,36,24,.30)');
      }
      if (s.bagY) {                             // 眼袋
        ctx.beginPath();
        ctx.moveTo(ex - ew * 0.9, ey + hgt * 0.9);
        ctx.quadraticCurveTo(ex, ey + hgt * 2.0, ex + ew * 0.9, ey + hgt * 0.95);
        G.shape(ctx, null, 1.5, 'rgba(58,36,24,.18)');
      }
    });
  }

  /* ================= 眉毛 ================= */
  function drawBrows(ctx, x, y, s, c, mood) {
    var ey = y + s.hh * s.eyeY;
    var by = ey - s.browGap;
    var hair = c.hair || '#241B14';
    var col = G.shade(c.faceId === 'suit' ? (s.hairTop || hair) : hair, 0.04);
    ctx.lineCap = 'round';
    [-1, 1].forEach(function (sg) {
      var i0 = x + sg * 5.5, o0 = x + sg * (5.5 + s.browLen);
      ctx.beginPath();
      if (mood === 'furious') {                 // 压到眼睛上，内低外高反向
        ctx.moveTo(i0, by + 8.5);
        ctx.quadraticCurveTo(x + sg * 13, by + 3.5, o0, by - 0.5);
      } else if (mood === 'scared') {           // 外八字上扬
        ctx.moveTo(i0, by - 3.5);
        ctx.quadraticCurveTo(x + sg * 13, by - 6, o0, by + 3);
      } else if (mood === 'angry') {
        ctx.moveTo(i0, by + 5);
        ctx.quadraticCurveTo(x + sg * 14, by + 1, o0, by - 2);
      } else {
        ctx.moveTo(i0, by + s.browArch * 4);
        ctx.quadraticCurveTo(x + sg * (s.browLen * 0.62 + 5),
                             by - s.browArch * 16, o0, by + s.browArch * 5);
      }
      G.shape(ctx, null, s.browTh, col);
      /* 眉尾比眉头淡：一根实心笔画看着像贴上去的黑胶带 */
      if (mood !== 'furious' && mood !== 'angry' && s.browTh > 3.6) {
        ctx.beginPath();
        ctx.moveTo(x + sg * (5.5 + s.browLen * 0.62), by + s.browArch * 1.5);
        ctx.quadraticCurveTo(x + sg * (5.5 + s.browLen * 0.84), by + s.browArch * 3,
                             o0, by + s.browArch * 5);
        G.shape(ctx, null, s.browTh * 0.46, 'rgba(255,255,255,.10)');
      }
    });
  }

  /* ================= 鼻子 ================= */
  function drawNose(ctx, x, y, s, c) {
    var ny = y + s.hh * s.noseY;
    var top = ny - s.noseLen * 0.52;            // 只画鼻梁下半段，别从眉心拉一条线下来
    var nw = s.noseW * s.noseTip;
    ctx.beginPath();
    ctx.moveTo(x - 1.4, top);
    ctx.quadraticCurveTo(x - s.noseW * 0.62, ny - 2.5, x - 1.0, ny);
    G.shape(ctx, null, 1.9, 'rgba(58,36,24,.20)');
    ctx.beginPath();                            // 鼻头：一条兜住的弧，肉头鼻兜得圆
    ctx.moveTo(x - nw * 0.42, ny - 1.2);
    ctx.quadraticCurveTo(x, ny + 2.6 * s.noseTip, x + nw * 0.42, ny - 1.2);
    G.shape(ctx, null, 1.8, 'rgba(58,36,24,.24)');
    [-1, 1].forEach(function (sg) {             // 鼻翼：一小段弧，不用实心块
      ctx.beginPath();
      ctx.arc(x + sg * nw * 0.52, ny + 0.2, nw * 0.42,
        sg > 0 ? -0.5 : Math.PI + 0.5, sg > 0 ? 2.0 : Math.PI - 2.0, sg < 0);
      G.shape(ctx, null, 1.7, 'rgba(58,36,24,.30)');
      G.circle(ctx, x + sg * nw * 0.60, ny + 1.6, 1.0, 'rgba(58,36,24,.42)', 0);
    });
    ctx.beginPath();                            // 鼻头一点高光
    ctx.ellipse(x - 0.5, ny - 1.8, nw * 0.26, nw * 0.17, 0, 0, TAU);
    G.shape(ctx, 'rgba(255,255,255,.24)', 0);
  }

  /* ================= 嘴 ================= */
  function drawMouth(ctx, x, y, s, c, mood) {
    var my = y + s.hh * s.mouthY;
    var mw = s.mouthW;

    if (mood === 'furious') {                   // 吼
      ctx.beginPath();
      ctx.moveTo(x - mw, my - 3);
      ctx.quadraticCurveTo(x, my + 17, x + mw, my - 3);
      ctx.quadraticCurveTo(x, my + 3, x - mw, my - 3);
      ctx.closePath();
      G.shape(ctx, '#7E241C', 3.6);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x - mw, my - 3);
      ctx.quadraticCurveTo(x, my + 17, x + mw, my - 3);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle = '#FFF8F2'; ctx.fillRect(x - mw - 2, my - 3.5, mw * 2 + 4, 4.4);
      ctx.fillStyle = '#D8615A';
      ctx.beginPath(); ctx.ellipse(x, my + 13, mw * 0.5, 4.5, 0, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    if (mood === 'scared') {                    // 小 O 形
      ctx.beginPath();
      ctx.ellipse(x, my + 3, mw * 0.42, mw * 0.55, 0, 0, TAU);
      G.shape(ctx, '#8E3B32', 3.2);
      return;
    }
    if (mood === 'angry') {                     // 不耐烦地喊
      ctx.beginPath();
      ctx.ellipse(x, my + 3, mw * 0.66, mw * 0.62, 0, 0, TAU);
      G.shape(ctx, '#8E2B22', 3.4);
      ctx.beginPath();
      ctx.ellipse(x, my - 2, mw * 0.5, 2.6, 0, 0, TAU);
      G.shape(ctx, '#FFF8F2', 0);
      return;
    }
    if (mood === 'grin') {                      // 咧嘴笑：嘴角要拉进腮里，光张嘴不像笑
      ctx.beginPath();
      ctx.moveTo(x - mw, my - 3);
      ctx.quadraticCurveTo(x, my + 14, x + mw, my - 3);
      ctx.quadraticCurveTo(x, my + 1, x - mw, my - 3);
      ctx.closePath();
      G.shape(ctx, '#A0362D', 3.6);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x - mw, my - 3);
      ctx.quadraticCurveTo(x, my + 14, x + mw, my - 3);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle = '#FFF8F2'; ctx.fillRect(x - mw - 1, my - 3.5, mw * 2 + 2, 4.6);
      ctx.fillStyle = '#D8615A';
      ctx.beginPath(); ctx.ellipse(x, my + 11.5, mw * 0.55, 4.6, 0, 0, TAU); ctx.fill();
      ctx.restore();
      [-1, 1].forEach(function (sg) {           // 嘴角的括号纹：笑肌堆起来的那两道
        ctx.beginPath();
        ctx.moveTo(x + sg * (mw + 2.5), my - 8);
        ctx.quadraticCurveTo(x + sg * (mw + 6.5), my - 1, x + sg * (mw + 2), my + 6);
        G.shape(ctx, null, 2.0, 'rgba(58,36,24,.30)');
      });
      return;
    }
    if (mood === 'slight') {                    // 抿着笑
      ctx.beginPath();
      ctx.moveTo(x - mw, my - 1);
      ctx.quadraticCurveTo(x, my + 8, x + mw, my - 1);
      G.shape(ctx, null, 3.4 * s.lipTh + 0.6, '#A05A4E');
      ctx.beginPath();                          // 嘴角
      ctx.moveTo(x - mw - 1.5, my - 2.5); ctx.lineTo(x - mw + 1, my - 0.5);
      ctx.moveTo(x + mw + 1.5, my - 2.5); ctx.lineTo(x + mw - 1, my - 0.5);
      G.shape(ctx, null, 1.6, 'rgba(58,36,24,.36)');
      return;
    }
    if (s.mouthStyle === 'firm') {              // 沉稳：一条平而短的线，唇薄
      ctx.beginPath();
      ctx.moveTo(x - mw, my - 0.5);
      ctx.quadraticCurveTo(x, my + 2.6, x + mw, my - 0.5);
      G.shape(ctx, null, 3.2 * s.lipTh + 0.8, '#8C4A3E');
      ctx.beginPath();                          // 下唇一点亮
      ctx.ellipse(x, my + 4, mw * 0.44, 1.5, 0, 0, TAU);
      G.shape(ctx, 'rgba(255,255,255,.20)', 0);
      return;
    }
    if (s.mouthStyle === 'thin') {              // 上了年纪：唇薄、偏粉、人中长
      ctx.beginPath();
      ctx.moveTo(x - mw, my);
      ctx.quadraticCurveTo(x, my + 4, x + mw, my);
      G.shape(ctx, null, 2.6, '#A75C58');
      ctx.beginPath();
      ctx.ellipse(x, my + 3, mw * 0.7, 2.2, 0, 0, TAU);
      G.shape(ctx, 'rgba(206,132,124,.5)', 0);
      return;
    }
    /* full / plain：闭嘴、平，唇厚一点 */
    ctx.beginPath();
    ctx.moveTo(x - mw, my);
    ctx.quadraticCurveTo(x, my + 5, x + mw, my);
    G.shape(ctx, null, 3.6 * s.lipTh + 0.8, '#8C4A3E');
    if (s.mouthStyle === 'full') {              // 嘴唇饱满：上唇画个 M
      ctx.beginPath();
      ctx.moveTo(x - mw * 0.9, my - 0.6);
      ctx.quadraticCurveTo(x - mw * 0.4, my - 3.4, x, my - 1.2);
      ctx.quadraticCurveTo(x + mw * 0.4, my - 3.4, x + mw * 0.9, my - 0.6);
      G.shape(ctx, null, 1.6, 'rgba(120,60,48,.50)');
    }
    ctx.beginPath();                            // 下唇的一点亮
    ctx.ellipse(x, my + 5.5, mw * 0.42, 1.6, 0, 0, TAU);
    G.shape(ctx, 'rgba(255,255,255,.22)', 0);
  }

  /* ================= 眼镜 ================= */
  /* 三副镜子的差别刻意做大：小银丝（架鼻尖）／宽方黑铰链／大金丝圆角方，
     远看只看得清镜片的长宽比和颜色，所以这两项必须拉开。 */
  function drawGlasses(ctx, x, y, s, c) {
    var gt = c.glassesType || (c.glasses ? 'rect' : null);
    if (!gt) return;
    var ey = y + s.hh * s.eyeY;
    var gy, col, glw, lw2, lh2, rr;
    /* 镜片上沿一律压在眉毛以下：三个人的眉形是重要辨识点，被镜框吃掉就白画了 */
    if (gt === 'round') {                       // 格子衬衫：小、细、银，架得低
      gy = ey + 2.0; col = '#9AA3A8'; glw = 1.8; lw2 = 10.2; lh2 = 7.0; rr = 5;
    } else if (gt === 'thin') {                 // 前辈：大、金、圆角方，罩到颧骨
      gy = ey + 0.5; col = '#B4924A'; glw = 2.2; lw2 = 12.6; lh2 = 8.4; rr = 6.5;
    } else {                                    // 西装大哥：宽、扁、枪灰
      gy = ey + 1.0; col = '#6E6258'; glw = 2.2; lw2 = 14.6; lh2 = 7.4; rr = 2.5;
    }

    [-1, 1].forEach(function (sg) {
      var gx = x + sg * s.eyeGap;
      G.box(ctx, gx - lw2, gy - lh2, lw2 * 2, lh2 * 2, rr,
        'rgba(214,238,252,.16)', glw, col);
      if (gt === 'rect') {                      // 外侧那块黑铰链：这副镜子的记号
        ctx.beginPath();
        ctx.moveTo(gx + sg * (lw2 - 0.5), gy - lh2 * 0.62);
        ctx.lineTo(gx + sg * (lw2 + 2.0), gy - lh2 * 0.78);
        G.shape(ctx, null, 3.8, '#2B2723');
      }
      ctx.beginPath();                          // 镜片反光
      ctx.moveTo(gx - lw2 * 0.62, gy + lh2 * 0.28);
      ctx.lineTo(gx - lw2 * 0.12, gy - lh2 * 0.62);
      G.shape(ctx, null, 2.2, 'rgba(255,255,255,.38)');
      ctx.beginPath();                          // 镜腿
      ctx.moveTo(x + sg * (s.eyeGap + lw2), gy - lh2 * 0.5);
      ctx.lineTo(x + sg * (s.hw + 1), gy - lh2 * 0.5 - 3);
      G.shape(ctx, null, glw * 0.9, col);
    });
    ctx.beginPath();                            // 鼻梁架
    var inner = s.eyeGap - lw2;
    ctx.moveTo(x - inner, gy - lh2 * 0.35);
    ctx.quadraticCurveTo(x, gy - lh2 * (gt === 'round' ? 0.55 : 0.8),
                         x + inner, gy - lh2 * 0.35);
    G.shape(ctx, null, glw, col);
  }

  /* ================= 穿着 ================= */
  function drawWear(ctx, x, sy, s, c, lw, torso) {
    if (c.wear === 'check') {
      ctx.save(); torso(ctx); ctx.clip();
      ctx.strokeStyle = 'rgba(58,36,24,.20)'; ctx.lineWidth = 2;
      var i;
      for (i = -4; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 15, sy - 6); ctx.lineTo(x + i * 15, sy + 116); ctx.stroke();
      }
      for (i = 0; i < 9; i++) {
        ctx.beginPath();
        ctx.moveTo(x - 58, sy + i * 15); ctx.lineTo(x + 58, sy + i * 15); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
      for (i = -4; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 15 + 5, sy - 6); ctx.lineTo(x + i * 15 + 5, sy + 116); ctx.stroke();
      }
      ctx.restore();
      ctx.beginPath();                          // 衬衫领：敞着第一颗扣
      ctx.moveTo(x - 21, sy - 4); ctx.lineTo(x - 7, sy + 26); ctx.lineTo(x, sy + 11);
      ctx.lineTo(x + 7, sy + 26); ctx.lineTo(x + 21, sy - 4);
      G.shape(ctx, G.shade(c.shirt, 0.28), lw, null, [sy - 4, sy + 26]);
      G.circle(ctx, x, sy + 46, 3, G.shade(c.shirt, -0.34), 0);
      G.circle(ctx, x, sy + 74, 3, G.shade(c.shirt, -0.34), 0);
      G.box(ctx, x + 17, sy + 36, 17, 14, 2, G.shade(c.shirt, -0.10), 2);  // 胸袋

    } else if (c.wear === 'suit') {
      ctx.beginPath();                          // 白衬衫
      ctx.moveTo(x - 22, sy - 4); ctx.lineTo(x, sy + 42); ctx.lineTo(x + 22, sy - 4);
      G.shape(ctx, '#FDFAF4', lw, null, [sy - 4, sy + 42]);
      ctx.beginPath();                          // 领结
      ctx.moveTo(x - 8, sy + 4); ctx.lineTo(x + 8, sy + 4);
      ctx.lineTo(x + 10, sy + 18); ctx.lineTo(x, sy + 25); ctx.lineTo(x - 10, sy + 18);
      ctx.closePath();
      G.shape(ctx, c.tie || '#7A2E4A', 2.8, null, [sy + 4, sy + 25]);
      ctx.beginPath();                          // 领带身
      ctx.moveTo(x - 8, sy + 23); ctx.lineTo(x + 8, sy + 23);
      ctx.lineTo(x + 6, sy + 68); ctx.lineTo(x, sy + 78); ctx.lineTo(x - 6, sy + 68);
      ctx.closePath();
      G.shape(ctx, c.tie || '#7A2E4A', 2.8, null, [sy + 23, sy + 78]);
      ctx.save();                               // 领带上的纹路
      ctx.beginPath();
      ctx.moveTo(x - 8, sy + 23); ctx.lineTo(x + 8, sy + 23);
      ctx.lineTo(x + 6, sy + 68); ctx.lineTo(x, sy + 78); ctx.lineTo(x - 6, sy + 68);
      ctx.closePath(); ctx.clip();
      if (c.faceId === 'elder') {               // 粉领带：斜银条，亮，远看就认得
        ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = 2.4;
        for (var e = -2; e <= 6; e++) {
          ctx.beginPath();
          ctx.moveTo(x - 10, sy + 30 + e * 11); ctx.lineTo(x + 10, sy + 20 + e * 11);
          ctx.stroke();
        }
      } else {                                  // 紫红领带：暗纹，压着不抢戏
        ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.4;
        for (var d = -2; d <= 5; d++) {
          ctx.beginPath();
          ctx.moveTo(x - 10, sy + 26 + d * 8); ctx.lineTo(x + 10, sy + 18 + d * 8);
          ctx.stroke();
        }
      }
      ctx.restore();
      [-1, 1].forEach(function (sg) {           // 翻领
        ctx.beginPath();
        ctx.moveTo(x + sg * 20, sy - 5);
        ctx.lineTo(x + sg * 6, sy + 40);
        ctx.lineTo(x + sg * 34, sy + 28);
        ctx.closePath();
        G.shape(ctx, G.shade(c.shirt, 0.40), lw, null, [sy - 5, sy + 40]);
      });

    } else if (c.wear === 'tee') {
      ctx.beginPath();                          // 圆领的罗纹领圈
      ctx.arc(x, sy - 7, 21, 0.14 * Math.PI, 0.86 * Math.PI);
      G.shape(ctx, null, 7.5, G.shade(c.shirt, -0.34));
      ctx.beginPath();
      ctx.arc(x, sy - 7, 21, 0.16 * Math.PI, 0.84 * Math.PI);
      G.shape(ctx, null, 2, G.shade(c.shirt, -0.12));

    } else {
      ctx.beginPath();
      ctx.moveTo(x - 17, sy - 1); ctx.lineTo(x, sy + 24); ctx.lineTo(x + 17, sy - 1);
      G.shape(ctx, G.shade(c.shirt, 0.22), lw, null, [sy - 1, sy + 24]);
    }
  }

  /* ================= 胡茬 ================= */
  /* 上一版是一团散点，远看像脏；改成先铺一层有形状的青灰面（嘴周 + 下颌 +
     耳前连到鬓角），再撒细点，这样才读得出「刚冒出来的胡子」。 */
  function drawStubble(ctx, x, y, s, skin) {
    var hh = s.hh, hw = s.hw;
    var my = y + hh * s.mouthY;
    ctx.save(); headOutline(ctx, x, y, s); ctx.clip();
    ctx.fillStyle = 'rgba(88,102,118,.10)';
    ctx.beginPath();                            // 下颌一整片
    ctx.moveTo(x - hw * 0.84, y + hh * 0.20);
    ctx.bezierCurveTo(x - hw * 0.86, y + hh * 0.72, x - hw * 0.52, y + hh * 1.04,
                      x, y + hh * 1.04);
    ctx.bezierCurveTo(x + hw * 0.52, y + hh * 1.04, x + hw * 0.86, y + hh * 0.72,
                      x + hw * 0.84, y + hh * 0.20);
    ctx.bezierCurveTo(x + hw * 0.70, y + hh * 0.52, x + hw * 0.34, y + hh * 0.62,
                      x, y + hh * 0.62);
    ctx.bezierCurveTo(x - hw * 0.34, y + hh * 0.62, x - hw * 0.70, y + hh * 0.52,
                      x - hw * 0.84, y + hh * 0.20);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();                            // 人中上面一撇
    ctx.ellipse(x, my - 5.5, s.mouthW * 1.05, 3.4, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();                            // 下唇到下巴，顺着下颌摊开
    ctx.ellipse(x, my + 9, s.mouthW * 1.30, 6.0, 0, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(56,64,74,.26)';       // 细颗粒，别画成痘
    var cxs = x, cys = y + hh * 0.72, rx = hw * 0.62, ry = hh * 0.26;
    for (var st = 0; st < STUB.length; st++) {
      var sp = STUB[st];
      ctx.beginPath();
      ctx.arc(cxs + sp[0] * rx, cys + sp[1] * ry, 0.30 + sp[2] * 0.24, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  /* 网红大胃王不是换一行标签就算登场：胸前这台会呼吸的直播机，
     让玩家在四个顾客同时排队时一眼找出「做成超大份能带来流量」的那位。 */
  function drawLiveCamera(ctx, x, sy, c) {
    var pulse = 1 + Math.sin((c.life || 0) * 9 + (c.seed || 0)) * 1.5;
    var cx = x + 35, cy = sy + 40;
    ctx.save();
    ctx.globalAlpha = 0.92;
    G.circle(ctx, cx, cy, 12 + pulse, null, 2.4, '#D34C83');
    G.box(ctx, cx - 10, cy - 7, 20, 14, 4, '#2A1C24', 2.2, '#D34C83');
    G.circle(ctx, cx + 1, cy, 4.8, '#F7D66A', 1.8, '#FFF4D6');
    G.circle(ctx, cx + 1, cy, 2.1, '#51304A', 0);
    G.circle(ctx, cx - 7, cy - 4, 2.2, '#E33E4C', 0);
    G.text(ctx, '直播', cx, cy + 17, { size: 7, col: '#FFF4D6', weight: 900 });
    ctx.restore();
  }

  /* ================= 主绘制 ================= */
  Art.customer = function (ctx, x, c, t) {
    var s = specOf(c);
    var hw = s.hw, hh = s.hh;

    /* ---- 表情优先级：被扔中 > 不耐烦 > 本人的常态 ---- */
    var hit = c.expr === 'scared' || c.expr === 'furious';
    var angry = !hit && t < 0.35;
    var mood = hit ? c.expr : (angry ? 'angry' : (c.expr || 'calm'));

    /* ---- 待机动画 ---- */
    var bob = Math.sin(c.seed * 7 + c.life * 3) * 3;
    var y = 152 + bob;
    if (c.type === 'hurry' && !hit) {
      x += Math.sin(c.life * 24) * 2.6;
      y -= Math.abs(Math.sin(c.life * 12)) * 1.8;
    }
    if (mood === 'furious') x += Math.sin(c.life * 40) * 1.8;   // 气得发抖
    var br = Math.sin(c.life * 2.1 + c.seed * 5) * 1.6;         // 呼吸
    var ph = 0;                                                  // 低头看手机
    if (!angry && !hit && c.type !== 'hurry') {
      var pc = (c.life * 0.42 + c.seed * 2.3) % 7.4;
      if (pc < 1.7) ph = Math.sin(pc / 1.7 * Math.PI);
    }
    y += ph * 4;

    var sy = y + s.torsoY - br;
    var torsoH = 154 - s.torsoY;               // 躯干底恒在 y+154，不撞下边界
    var lw = 3.8;
    var skin = G.shade(c.skin || '#F1C79B', s.skinTint);
    if (mood === 'scared')  skin = G.shade(skin, 0.26);          // 脸白
    if (mood === 'furious') skin = G.shade('#E0866A', 0.06);     // 涨红
    var skinD = G.shade(skin, -0.18);
    var shirtD = G.shade(c.shirt, -0.15);
    var blink = !angry && !hit && ((c.life * 0.85 + c.seed * 3.1) % 3.6) < 0.13;
    var look = ph > 0.2 ? 2.4 : 0;

    /* ---- 上臂 ---- */
    [-1, 1].forEach(function (sg) {
      ctx.beginPath();
      ctx.moveTo(x + sg * (s.shoW - 12), sy + 20);
      ctx.quadraticCurveTo(x + sg * (s.shoW + 9), sy + 30,
                           x + sg * (s.shoW + 7), sy + 74);
      ctx.lineTo(x + sg * (s.shoW - 14), sy + 78);
      ctx.closePath();
      G.shape(ctx, shirtD, lw, null, [sy + 18, sy + 76]);
    });

    /* ---- 脖子 ---- */
    ctx.beginPath();
    ctx.moveTo(x - s.neckW, y + hh * 0.68);
    ctx.lineTo(x - s.neckW - 3, sy + 12);
    ctx.lineTo(x + s.neckW + 3, sy + 12);
    ctx.lineTo(x + s.neckW, y + hh * 0.68);
    ctx.closePath();
    G.shape(ctx, skinD, lw, null, [y + hh * 0.68, sy + 12]);

    /* ---- 躯干 ---- */
    function torso(ct) {
      ct.beginPath();
      ct.moveTo(x - 16, sy - 4);
      ct.quadraticCurveTo(x - (s.shoW - 8), sy + 3, x - (s.shoW - 3), sy + 32);
      ct.lineTo(x - s.shoW, sy + torsoH);
      ct.lineTo(x + s.shoW, sy + torsoH);
      ct.lineTo(x + (s.shoW - 3), sy + 32);
      ct.quadraticCurveTo(x + (s.shoW - 8), sy + 3, x + 16, sy - 4);
      ct.closePath();
    }
    torso(ctx);
    G.shape(ctx, c.shirt, lw, null, [sy - 4, sy + torsoH - 2]);
    ctx.save(); torso(ctx); ctx.clip();
    ctx.fillStyle = G.vg(ctx, sy - 4, sy + 22, 'rgba(58,36,24,.26)', 'rgba(58,36,24,0)');
    ctx.fillRect(x - 70, sy - 4, 140, 26);
    ctx.restore();

    drawWear(ctx, x, sy, s, c, lw, torso);

    /* ---- 双下巴：先垫在脸底下，脸盖上来正好只剩一道肉褶 ---- */
    if (s.dblChin) {
      ctx.beginPath();
      ctx.ellipse(x, y + hh * 1.04, hw * 0.52, hh * 0.22, 0, 0, TAU);
      G.shape(ctx, skinD, lw, null, [y + hh * 0.82, y + hh * 1.26]);
      ctx.beginPath();                          // 下巴和这一坨之间的肉褶
      ctx.moveTo(x - hw * 0.40, y + hh * 0.99);
      ctx.quadraticCurveTo(x, y + hh * 1.12, x + hw * 0.40, y + hh * 0.99);
      G.shape(ctx, null, 2.2, 'rgba(58,36,24,.28)');
    }

    /* ---- 耳朵（先画，内缘被脸压住、上缘等下被头发压住） ----
       上一版耳朵是两个描着粗棕边的大圆饼，比五官还抢眼。往里收，描边也放细。 */
    [-1, 1].forEach(function (sg) {
      var eox = x + sg * (hw - 0.5);
      var eoy = y + hh * s.earY;
      var erx = 5.4 * s.earS, ery = 8.6 * s.earS;
      ctx.beginPath();
      ctx.ellipse(eox, eoy, erx, ery, sg * 0.06, 0, TAU);
      G.shape(ctx, skin, 3.0, null, [eoy - ery, eoy + ery]);
      if (s.earLobe) {                          // 上了年纪的耳垂：稍稍往下坠
        ctx.beginPath();
        ctx.ellipse(eox + sg * 0.4, eoy + ery * 0.82, erx * 0.66, ery * 0.42, 0, 0, TAU);
        G.shape(ctx, skin, 3.0, null, [eoy + ery * 0.40, eoy + ery * 1.24]);
      }
      ctx.beginPath();                          // 耳廓
      ctx.arc(eox + sg * 0.8, eoy, erx * 0.60,
        sg > 0 ? -1.2 : Math.PI + 1.2, sg > 0 ? 1.6 : Math.PI - 1.6, sg < 0);
      G.shape(ctx, null, 1.6, G.shade(skin, -0.30));
    });

    /* ---- 脸 ---- */
    headOutline(ctx, x, y, s);
    var fg = ctx.createRadialGradient(x - hw * 0.36, y - hh * 0.42, hh * 0.14,
                                      x, y, hh * 1.30);
    fg.addColorStop(0, G.shade(skin, 0.18));
    fg.addColorStop(0.58, skin);
    fg.addColorStop(1, G.shade(skin, -0.14));
    ctx.fillStyle = fg; ctx.fill();
    G.shape(ctx, null, 4);

    /* ---- 脸上的体积：颧骨高光 / 颊凹 / 腮帮子 / 额头亮面 ---- */
    ctx.save(); headOutline(ctx, x, y, s); ctx.clip();
    if (s.cheekHi > 0.05) {
      [-1, 1].forEach(function (sg) {
        ctx.beginPath();
        ctx.ellipse(x + sg * hw * 0.54, y + hh * 0.14,
                    hw * 0.30, hh * 0.22, sg * 0.3, 0, TAU);
        G.shape(ctx, 'rgba(255,255,255,' + (s.cheekHi * 0.24).toFixed(2) + ')', 0);
      });
    }
    if (s.sunken) {                             // 颊凹：颧骨下面压一道，脸就瘦下去了
      [-1, 1].forEach(function (sg) {
        ctx.beginPath();
        ctx.moveTo(x + sg * hw * 0.72, y - hh * 0.06);
        ctx.quadraticCurveTo(x + sg * hw * 0.50, y + hh * 0.26,
                             x + sg * hw * 0.56, y + hh * 0.52);
        G.shape(ctx, null, 2.0, 'rgba(58,36,24,.07)');
      });
    }
    if (s.jowl) {                               // 腮帮子：下颌角外鼓一坨，再兜一道褶
      [-1, 1].forEach(function (sg) {
        ctx.beginPath();
        ctx.ellipse(x + sg * hw * 0.68, y + hh * 0.52,
                    hw * 0.26, hh * 0.26, sg * -0.2, 0, TAU);
        G.shape(ctx, 'rgba(255,255,255,.10)', 0);
        ctx.beginPath();
        ctx.moveTo(x + sg * hw * 0.86, y + hh * 0.32);
        ctx.quadraticCurveTo(x + sg * hw * 0.82, y + hh * 0.72,
                             x + sg * hw * 0.44, y + hh * 0.88);
        G.shape(ctx, null, 1.8, 'rgba(58,36,24,.18)');
      });
    }
    if (s.foreShine) {                          // 谢顶的人额头是一整块反光
      ctx.beginPath();
      ctx.ellipse(x - hw * 0.10, y - hh * 0.52, hw * 0.62, hh * 0.26, -0.08, 0, TAU);
      G.shape(ctx, 'rgba(255,252,246,.26)', 0);
      ctx.beginPath();
      ctx.ellipse(x + hw * 0.34, y - hh * 0.60, hw * 0.20, hh * 0.09, -0.3, 0, TAU);
      G.shape(ctx, 'rgba(255,255,255,.32)', 0);
    }
    ctx.restore();

    drawHair(ctx, x, y, s, c, lw);
    drawBrows(ctx, x, y, s, c, mood);
    drawEyes(ctx, x, y, s, c, mood, blink, look);
    drawNose(ctx, x, y, s, c);

    /* ---- 法令纹 ---- */
    if (c.age) {
      ctx.save(); headOutline(ctx, x, y, s); ctx.clip();
      var nf = c.age > 1 ? 0.18 : 0.11;
      [-1, 1].forEach(function (sg) {
        ctx.beginPath();
        ctx.moveTo(x + sg * (s.noseW + 3.5), y + hh * (s.noseY + 0.06));
        ctx.quadraticCurveTo(x + sg * (s.mouthW + 6), y + hh * (s.mouthY - 0.04),
                             x + sg * (s.mouthW + 2), y + hh * (s.mouthY + 0.12));
        G.shape(ctx, null, c.age > 1 ? 1.9 : 1.5, 'rgba(58,36,24,' + nf + ')');
      });
      // 抬头纹不画了：窄脸上再加横线就成木乃伊，年龄靠法令纹和眼袋表现就够
      ctx.restore();
    }

    if (c.beard === 'stubble') drawStubble(ctx, x, y, s, skin);

    /* ---- 腮红：上一版两坨大红圈，四个人全成了醉汉，这里压到几乎看不见 ---- */
    ctx.save(); headOutline(ctx, x, y, s); ctx.clip();

 * 所以四个东西的职责：

 *   poopInHand = 一眼看出「我捏着一坨正拖着走」

 * 滑稽而不写实。

 *    外面套 ctx.scale(k,k) 改大小。这样 G.vg 的缓存键恒定，
 *    不会因为尺寸连续变化而把渐变缓存冲爆。

    hi:   '#8B5E34',

    seam: 'rgba(46,27,12,.34)',   // 盘绕的接缝

    [ 0.0,  -7.0, 15.4, 7.5],
    [ 1.7, -16.0, 10.8, 6.4],
