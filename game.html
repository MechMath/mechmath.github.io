<meta charset="utf-8">
<title>肉夹馍传奇</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>
  html,body{margin:0;padding:0;height:100%;background:#2B1A10;color:#FFF8EC;
    overflow:hidden;overscroll-behavior:none;overscroll-behavior-y:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    /* iOS Safari：长按会弹「拷贝/查询」气泡和放大镜，长按图片还会弹分享单。
       touch-callout 必须显式关掉，光有 user-select 挡不住 */
    -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  /* 安全区内收，刘海/圆角不会盖住 HUD */
  #wrap{position:fixed;
    top:env(safe-area-inset-top); right:env(safe-area-inset-right);
    bottom:env(safe-area-inset-bottom); left:env(safe-area-inset-left);
    overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    background:radial-gradient(120% 80% at 50% 0%,#4A2E1B 0%,#2B1A10 60%,#1C110A 100%);}
  canvas{position:absolute;left:50%;top:50%;display:block;touch-action:none;
    transform-origin:50% 50%;
    /* 长按剁肉是核心操作，这三条一条都不能少：
       没有 user-select 会选中整页、没有 touch-callout 会弹系统菜单、
       没有 user-drag 会被当成拖图片 */
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-user-drag:none;user-drag:none;
    box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 3px #8B5A2B;border-radius:8px;}
  /* 竖持时画面会自动转 90° 铺满，这条提示几秒后自己淡出。
     方向不能写反：canvas 是 rotate(90deg)，游戏的「上」落在屏幕右边，
     所以要把手机逆时针转（顶朝左）才看得正 —— 箭头必须是 ↺。
     这也正好是两个平台的 landscape-primary（iOS home 键朝右 / 安卓 ROTATION_90）。
     阈值 1100 而不是 1000：iPad Pro 竖持 1024 宽同样会转，也得给提示。 */
  #rot{display:none;pointer-events:none;}
  @media (orientation:portrait) and (max-width:1100px){
    #rot{display:block;position:fixed;left:50%;z-index:9;
      bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
      padding:9px 18px;border-radius:22px;background:rgba(43,26,16,.88);
      color:#FFF8EC;font:600 14px/1 "PingFang SC",sans-serif;white-space:nowrap;
      animation:rotfade 6s forwards;}
  }
  /* 箭头字形本身偏小，单独放大一号才看得出转向 */
  #rot i{font-style:normal;font-size:19px;line-height:1;vertical-align:-2px;
    margin-right:3px;}
  @keyframes rotfade{0%,68%{opacity:1}100%{opacity:0;visibility:hidden}}
</style>
<div id="rot"><i>↺</i>把手机向左转过来玩</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
/* ===== js/lib.js ===== */
/* 肉夹馍传奇 —— 基础库：调色板 / 数学 / 绘制助手 / 音效 */
window.G = window.G || {};

G.W = 960;
G.H = 540;

G.FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

G.PAL = {
  ink:      '#3A2418',  // 统一描边色
  inkSoft:  '#6B4A32',
  wall:     '#FFD79A',
  wallDark: '#F2BE79',
  floor:    '#F7E3C0',
  woodDark: '#8B5A2B',
  wood:     '#B87A45',
  woodLite: '#D2955A',
  meat:     '#C0392B',
  meatDark: '#8E2B22',
  meatLite: '#D9584A',
  bunRaw:   '#F4DCB0',
  bunGood:  '#E3A857',
  bunBurn:  '#4A3423',
  green:    '#4CAF50',
  greenDark:'#357A38',
  orange:   '#F58220',
  orangeDk: '#D2660A',
  cream:    '#FFF8EC',
  red:      '#E4433A',
  yellow:   '#FFC63D',
  steel:    '#C9D2D8',
  steelDark:'#8B9AA5',
  shadow:   'rgba(58,36,24,.18)'
};

G.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
G.lerp  = function (a, b, t) { return a + (b - a) * t; };
G.rand  = function (a, b) { return a + Math.random() * (b - a); };
G.randi = function (a, b) { return Math.floor(G.rand(a, b + 1)); };
G.pick  = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };

/* 点是否在矩形内 */
G.inRect = function (x, y, r) {
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
};

/* 圆角矩形路径 */
G.rrect = function (ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
};

/* ---------- 立体化：颜色明暗 + 渐变缓存 ---------- */
/* 全局光从左上来，所以所有高光在上、内阴影在下。 */

G._sc = {};
G.shade = function (hex, amt) {
  var k = hex + '|' + amt, v = G._sc[k];
  if (v) return v;
  var h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var out = '#';
  for (var i = 0; i < 3; i++) {
    var c = parseInt(h.substr(i * 2, 2), 16);
    c = Math.round(G.clamp(amt > 0 ? c + (255 - c) * amt : c * (1 + amt), 0, 255));
    out += ('0' + c.toString(16)).slice(-2);
  }
  G._sc[k] = out;
  return out;
};

/* 竖直渐变，按 (y0,y1,色) 缓存；y 量化到 2px。
 *
 * 分代而不是「满了就整体丢掉」：实测整场的活跃集大约 421 条，正好压在
 * 旧的 420 上限上，2880 帧里被清空 5 次 —— 每次清空后的那一帧要重建近
 * 400 个渐变（正常帧是 0 个），就是一次看得见的顿挫。
 * 现在满了只是把当前代降成旧代，旧代命中会被提回来，所以永远不存在
 * 「整帧全冷」的时刻；内存上界是 2×CAP，仍然有界。 */
var GC_CAP = 400;
G._gc = {}; G._gcOld = {}; G._gcn = 0;
G.vg = function (ctx, y0, y1, c0, c1) {
  y0 = Math.round(y0 / 2) * 2;
  y1 = Math.round(y1 / 2) * 2;
  if (y1 - y0 < 1) y1 = y0 + 1;
  var k = y0 + '_' + y1 + '_' + c0 + '_' + c1, g = G._gc[k];
  if (g) return g;
  g = G._gcOld[k];
  if (g) { G._gc[k] = g; G._gcn++; return g; }   // 旧代命中：提回当前代
  if (G._gcn >= GC_CAP) { G._gcOld = G._gc; G._gc = {}; G._gcn = 0; }
  g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  G._gc[k] = g; G._gcn++;
  return g;
};

/* 接触阴影：让东西看起来是「放在」台面上，而不是浮着 */
G.drop = function (ctx, x, y, rx, ry, a) {
  var g = ctx.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, 'rgba(58,36,24,' + (a === undefined ? 0.32 : a) + ')');
  g.addColorStop(0.62, 'rgba(58,36,24,' + (a === undefined ? 0.16 : a * 0.5) + ')');
  g.addColorStop(1, 'rgba(58,36,24,0)');
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, ry / rx); ctx.translate(-x, -y);
  ctx.beginPath(); ctx.arc(x, y, rx, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
};

/* 带厚度的台面：上表面 + 前立面 + 前缘高光 */
G.slab = function (ctx, x, y, w, topH, frontH, col) {
  ctx.beginPath(); ctx.rect(x, y, w, topH);
  G.shape(ctx, G.shade(col, 0.20), 0, null, [y, y + topH]);
  ctx.beginPath(); ctx.rect(x, y + topH, w, frontH);
  G.shape(ctx, G.shade(col, -0.12), 0, null, [y + topH, y + topH + frontH]);
  ctx.beginPath();
  ctx.moveTo(x, y + topH + 1.5); ctx.lineTo(x + w, y + topH + 1.5);
  G.shape(ctx, null, 3, 'rgba(255,255,255,.42)');
  ctx.beginPath(); ctx.rect(x, y, w, topH + frontH);
  G.shape(ctx, null, 4);
};

/* 填充 + 粗描边。传了 bb=[y0,y1] 且填充是纯色时，自动做
   「主体竖直渐变 + 顶部高光 + 底部内阴影」三层，凭空得到体积。 */
G.shape = function (ctx, fill, lw, col, bb) {
  if (fill) {
    var solid = typeof fill === 'string' && fill.charAt(0) === '#';
    if (bb && solid && bb[1] - bb[0] > 6) {
      var y0 = bb[0], y1 = bb[1], h = y1 - y0;
      ctx.fillStyle = G.vg(ctx, y0, y1, G.shade(fill, 0.20), G.shade(fill, -0.17));
      ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = G.vg(ctx, y0, y0 + h * 0.46,
        'rgba(255,255,255,.30)', 'rgba(255,255,255,0)');
      ctx.fillRect(-4000, y0, 8000, h * 0.46);
      ctx.fillStyle = G.vg(ctx, y0 + h * 0.58, y1,
        'rgba(58,36,24,0)', 'rgba(58,36,24,.24)');
      ctx.fillRect(-4000, y0 + h * 0.58, 8000, h * 0.42);
      ctx.restore();
    } else {
      ctx.fillStyle = fill; ctx.fill();
    }
  }
  if (lw !== 0) {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = lw || 4;
    ctx.strokeStyle = col || G.PAL.ink;
    ctx.stroke();
  }
};

G.box = function (ctx, x, y, w, h, r, fill, lw, col) {
  G.rrect(ctx, x, y, w, h, r);
  G.shape(ctx, fill, lw, col, [y, y + h]);
};

/* 圆形自动球面化（半径够大时），头、馍、灶眼、肉粒全部受益 */
G.circle = function (ctx, x, y, r, fill, lw, col) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill && typeof fill === 'string' && fill.charAt(0) === '#' && r >= 7) {
    var g = ctx.createRadialGradient(x - r * 0.34, y - r * 0.38, r * 0.06, x, y, r * 1.08);
    g.addColorStop(0, G.shade(fill, 0.36));
    g.addColorStop(0.52, fill);
    g.addColorStop(1, G.shade(fill, -0.22));
    ctx.fillStyle = g; ctx.fill();
    G.shape(ctx, null, lw, col);
  } else {
    G.shape(ctx, fill, lw, col);
  }
};

G.text = function (ctx, str, x, y, o) {
  o = o || {};
  ctx.font = (o.weight || 800) + ' ' + (o.size || 24) + 'px ' + G.FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  if (o.stroke) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = o.strokeW || 6;
    ctx.strokeStyle = o.stroke;
    ctx.strokeText(str, x, y);
  }
  ctx.fillStyle = o.col || G.PAL.ink;
  ctx.fillText(str, x, y);
};

/* 进度条 */
G.bar = function (ctx, x, y, w, h, t, fill) {
  G.box(ctx, x, y, w, h, h / 2, '#fff', 3);
  if (t > 0) {
    ctx.save();
    G.rrect(ctx, x, y, w, h, h / 2); ctx.clip();
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w * G.clamp(t, 0, 1), h);
    ctx.restore();
    G.rrect(ctx, x, y, w, h, h / 2); G.shape(ctx, null, 3);
  }
};

/* ---------- 音效：WebAudio 现场合成，无素材 ----------
   对外签名冻结：init / tone / chop / done / put / take / burn / nope / cash / angry / bell / on
   内部用「振荡器 + 噪声 + 包络」分层，让每个音有材质而不只是一声 beep。 */
G.Snd = {
  ac: null,
  master: null,
  on: true,
  _nb: null,

  init: function () {
    if (this.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC(); } catch (e) { this.ac = null; return; }
    try {
      var g = this.ac.createGain();
      g.gain.value = 0.85;
      g.connect(this.ac.destination);
      this.master = g;
    } catch (e) { this.master = null; }
  },

  /* snd.js 缺席时的轻量兼容接口：首个用户手势也能唤醒 suspended 上下文。 */
  resume: function () {
    if (!this.on) return false;
    this.init();
    var ac = this.ac; if (!ac) return false;
    if (ac.state === 'suspended' && ac.resume) { try { ac.resume(); } catch (e) {} }
    return true;
  },

  /* 拿到可用的 AudioContext，顺手解挂起；静音或不支持时返回 null */
  _ac: function () {
    if (!this.on) return null;
    this.init();
    var ac = this.ac; if (!ac) return null;
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  },

  _out: function () { return this.master || (this.ac ? this.ac.destination : null); },

  /* 半秒白噪声，复用一份 */
  _noiseBuf: function (ac) {
    if (this._nb) return this._nb;
    try {
      var n = Math.floor(ac.sampleRate * 0.5);
      var b = ac.createBuffer(1, n, ac.sampleRate);
      var d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this._nb = b;
    } catch (e) { this._nb = null; }
    return this._nb;
  },

  /* 单个振荡器 + 指数包络。detune 单位 cent，用来做轻微失谐 */
  _osc: function (f0, f1, dur, type, vol, delay, detune) {
    var ac = this._ac(); if (!ac) return;
    var out = this._out(); if (!out) return;
    try {
      var t = ac.currentTime + (delay || 0);
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      if (detune) o.detune.setValueAtTime(detune, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.10), t + 0.010);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  },

  /* 噪声层：freq 是带通中心频率，用来做「刀切肉」「油滋啦」这类材质音 */
  _noise: function (dur, vol, freq, delay, q) {
    var ac = this._ac(); if (!ac) return;
    var out = this._out(); if (!out) return;
    var buf = this._noiseBuf(ac); if (!buf) return;
    try {
      var t = ac.currentTime + (delay || 0);
      var src = ac.createBufferSource(); src.buffer = buf;
      src.playbackRate.value = 1;
      var bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(freq || 1200, t);
      bp.Q.value = q || 1.1;
      var g = ac.createGain();
      g.gain.setValueAtTime(Math.max(0.0002, vol || 0.08), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp); bp.connect(g); g.connect(out);
      src.start(t); src.stop(t + dur + 0.02);
    } catch (e) {}
  },

  /* 兼容旧签名：单层振荡器 */
  tone: function (f0, f1, dur, type, vol, delay) {
    this._osc(f0, f1, dur, type, vol, delay, 0);
  },

  /* 剁肉：刀刃噪声 + 案板低频闷响，每刀音高随机避免机械感 */
  chop: function () {
    var f = G.rand(150, 195);
    this._noise(0.055, 0.075, G.rand(1500, 2400), 0, 1.6);
    this._osc(f, f * 0.42, 0.085, 'square', 0.085, 0, 0);
    this._osc(f * 0.5, f * 0.3, 0.11, 'sine', 0.075, 0.004, 0);
  },

  /* 一份做好：三度上行小和弦 */
  done: function () {
    this._osc(660,  660,  0.09, 'triangle', 0.085, 0,     0);
    this._osc(880,  880,  0.10, 'triangle', 0.075, 0.055, -6);
    this._osc(1320, 1320, 0.14, 'sine',     0.055, 0.105, 0);
  },

  /* 放东西：木头闷敲 */
  put: function () {
    this._noise(0.04, 0.05, 700, 0, 0.9);
    this._osc(300, 200, 0.075, 'sine', 0.085, 0, 0);
  },

  /* 拿起来：明亮的拨弦感 */
  take: function () {
    this._osc(560, 780, 0.075, 'triangle', 0.085, 0, 0);
    this._osc(1120, 1180, 0.05, 'sine', 0.04, 0.01, 8);
  },

  /* 烤糊：下坠锯齿 + 焦味噪声 */
  burn: function () {
    this._osc(190, 55, 0.36, 'sawtooth', 0.085, 0, 0);
    this._osc(140, 45, 0.42, 'triangle', 0.05, 0.02, 12);
    this._noise(0.34, 0.05, 620, 0, 0.7);
  },

  /* 无效操作：两声短闷响，不刺耳 */
  nope: function () {
    this._osc(150, 118, 0.065, 'square', 0.055, 0,     0);
    this._osc(126, 100, 0.075, 'square', 0.045, 0.075, 0);
  },

  /* 结账：大三和弦琶音 + 硬币碎光 */
  cash: function () {
    this._osc(784,  784,  0.075, 'triangle', 0.085, 0,     0);
    this._osc(988,  988,  0.075, 'triangle', 0.080, 0.058, 0);
    this._osc(1175, 1175, 0.115, 'triangle', 0.075, 0.116, -5);
    this._osc(2350, 2350, 0.12,  'sine',     0.035, 0.13,  0);
    this._noise(0.09, 0.028, 4200, 0.12, 2.4);
  },

  /* 跑单：带颤的下坠，听着就烦 */
  angry: function () {
    this._osc(330, 110, 0.30, 'sawtooth', 0.085, 0,    0);
    this._osc(336, 112, 0.30, 'sawtooth', 0.055, 0.01, 22);
  },

  /* 耐心进入红区：短促但不刺耳的两声提示 */
  warn: function () {
    this._osc(880, 620, 0.10, 'square', 0.045, 0, 0);
  },

  /* 提示铃：两个泛音 + 长衰减 */
  bell: function () {
    this._osc(1046, 1046, 0.16, 'sine', 0.085, 0,     0);
    this._osc(2093, 2093, 0.11, 'sine', 0.035, 0.005, 6);
    this._osc(1568, 1568, 0.26, 'sine', 0.055, 0.085, 0);
  }
};

/* ---------- P1 追加：配色 + 角度工具 ---------- */
G.PAL.pepper   = '#4CAF50';
G.PAL.pepperDk = '#2E7D32';
G.PAL.pepperLt = '#8FD98F';
G.PAL.ice      = '#CFEBF7';
G.PAL.iceDk    = '#84C4E4';
G.PAL.fridge   = '#3E8FC4';
G.PAL.fridgeDk = '#25628C';
G.PAL.soda     = '#F79A2B';
G.PAL.sodaDk   = '#D2660A';
G.PAL.noodle   = '#F4EBCB';
G.PAL.noodleDk = '#D9CB9C';
G.PAL.chili    = '#DC3B27';
G.PAL.chiliOil = '#E8632A';
G.PAL.bowl     = '#F2F8FC';
G.PAL.bowlRim  = '#A9C9DA';
G.PAL.lock     = 'rgba(118,102,84,.84)';

/* 最短角差，用于「画圈搅拌」 */
G.angDiff = function (a, b) {
  var d = a - b;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
};

/* ---------- 新工序的兜底音效（js/snd.js 会覆盖成写实版） ---------- */

     这样无论多少量，读起来都是「一摊」，而不是「N 个单位」。
     m = 0..1 连续；轮廓扰动取自固定表，形状永远一致。 */
  var HEAP_WB = [1.00, 0.91, 1.06, 0.94, 1.03, 0.88, 1.08, 0.96,
                 1.02, 0.90, 1.05, 0.93, 1.07, 0.89, 1.01, 0.97,
                 1.04, 0.92, 1.06, 0.95, 0.99, 1.03];

    for (var i = 0; i < 16; i++) {

    var top = 6 + e * 17;                    // 上方隆起
    var bot = 5 + e * 8;                     // 下方贴着案板
    var N = HEAP_WB.length;

    G.drop(ctx, cx, cy + bot * 0.8, rx * 1.06, bot * 0.55, 0.30);

    ctx.beginPath();                         // 整摊的轮廓：一条闭合曲线
    for (var i = 0; i <= N; i++) {
      var a = (i % N) / N * Math.PI * 2;
      var w = HEAP_WB[i % N];

      var py = cy + sa * (sa < 0 ? top : bot) * w;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);

      G.shade(cols[1], 0.16), G.shade(cols[0], -0.18));

    for (j = 0; j < HEAP_TEX.length; j++) {  // 碎肉的斑块，不描边
      t = HEAP_TEX[j];

    var blink = !angry && ((c.life * 0.85 + c.seed * 3.1) % 3.6) < 0.13;
    [-1, 1].forEach(function (sg) {
      var ex = x + sg * 14.5;
      if (blink) {
        ctx.beginPath();
        ctx.moveTo(ex - 10, ey - 1);
        ctx.quadraticCurveTo(ex, ey + 3.5, ex + 10, ey - 1);
        G.shape(ctx, null, 3.4, P.ink);
        return;
      }
      var eh = angry ? 7.5 : 9.5;
      ctx.beginPath();
      ctx.ellipse(ex, ey, 10.5, eh, 0, 0, Math.PI * 2);
      G.shape(ctx, '#FFFDF8', 0);
      ctx.save();
      ctx.beginPath(); ctx.ellipse(ex, ey, 10.5, eh, 0, 0, Math.PI * 2); ctx.clip();
      var px = ex + sg * 0.8, py = ey + look + 0.5;
      ctx.beginPath(); ctx.arc(px, py, 6.6, 0, Math.PI * 2);
      var pg = ctx.createRadialGradient(px - 2.2, py - 2.4, 0.6, px, py, 7.4);
      pg.addColorStop(0, '#5A4130'); pg.addColorStop(0.55, '#2A1B10'); pg.addColorStop(1, '#150D06');
      ctx.fillStyle = pg; ctx.fill();
      G.circle(ctx, px - 2.4, py - 2.6, 2.4, '#FFFFFF', 0);
      G.circle(ctx, px + 2.2, py + 2.8, 1.1, 'rgba(255,255,255,.65)', 0);
      ctx.restore();
      // 上眼线压在眼白上沿
      ctx.beginPath();
      ctx.moveTo(ex - 10.6, ey - eh * 0.34);
      ctx.quadraticCurveTo(ex, ey - eh * 1.42, ex + 10.6, ey - eh * 0.34);
      G.shape(ctx, null, 3.4, P.ink);
    });

    /* ---------- 鼻子：一小笔 ---------- */
    ctx.beginPath();
    ctx.moveTo(x - 4, y + 13);
    ctx.quadraticCurveTo(x, y + 17, x + 4, y + 13);
    G.shape(ctx, null, 2.8, G.shade(c.skin, -0.36));

    /* ---------- 腮红 ---------- */
    ctx.save();
    headPath(ctx, x, y, hw, hh, jaw); ctx.clip();
    [-1, 1].forEach(function (sg) {
      ctx.beginPath();
      ctx.ellipse(x + sg * 24, y + 12, 9, 5.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = angry ? 'rgba(214,64,48,.32)' : 'rgba(226,124,104,.26)';
      ctx.fill();
    });
    ctx.restore();

    /* ---------- 胡茬 / 年龄纹 ---------- */
    if (c.beard === 'stubble') {
      ctx.save();
      headPath(ctx, x, y, hw, hh, jaw); ctx.clip();
      ctx.fillStyle = 'rgba(58,50,46,.16)';
      ctx.beginPath();
      ctx.ellipse(x, y + hh * 0.62, hw * 0.74, hh * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x, y + 14, 13, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (c.age) {
      ctx.save();
      headPath(ctx, x, y, hw, hh, jaw); ctx.clip();
      [-1, 1].forEach(function (sg) {                // 法令纹
        ctx.beginPath();
        ctx.moveTo(x + sg * 11, y + 12);
        ctx.quadraticCurveTo(x + sg * 19, y + 20, x + sg * 15, y + 31);
        G.shape(ctx, null, 1.8, 'rgba(58,36,24,.24)');
      });
      if (c.age > 1) for (var al = 0; al < 2; al++) {  // 抬头纹
        ctx.beginPath();
        ctx.moveTo(x - 18, y - 26 + al * 8);
        ctx.quadraticCurveTo(x, y - 31 + al * 8, x + 18, y - 26 + al * 8);
        G.shape(ctx, null, 1.6, 'rgba(58,36,24,.20)');
      }
      ctx.restore();
    }

    /* ---------- 嘴 ---------- */
    var my = y + 22;
    if (angry) {
      ctx.beginPath();
      ctx.ellipse(x, my + 4, 10, 9, 0, 0, Math.PI * 2);
      G.shape(ctx, '#8E2B22', 3.6);
      ctx.beginPath();
      ctx.ellipse(x, my - 1.5, 7.5, 2.8, 0, 0, Math.PI * 2);
      G.shape(ctx, '#FFF8F2', 0);
      ctx.beginPath();
      ctx.ellipse(x, my + 9, 6, 3.4, 0, 0, Math.PI * 2);
      G.shape(ctx, '#D8615A', 0);
    } else if (c.expr === 'scared') {               // 受惊：张成小 O
      ctx.beginPath();
      ctx.ellipse(x, my + 3, 7, 9, 0, 0, Math.PI * 2);
      G.shape(ctx, '#7E3229', 3.4);
    } else if (c.expr === 'furious') {              // 暴怒：张嘴吼
      ctx.beginPath();
      ctx.moveTo(x - 16, my + 8);
      ctx.quadraticCurveTo(x, my - 8, x + 16, my + 8);
      ctx.quadraticCurveTo(x, my + 16, x - 16, my + 8);
      ctx.closePath();
      G.shape(ctx, '#8E2B22', 3.6);
      ctx.beginPath();
      ctx.moveTo(x - 13, my + 4); ctx.lineTo(x + 13, my + 4);
      G.shape(ctx, null, 3, '#FFF8F2');
    } else if (c.expr === 'calm') {                 // 沉稳：闭嘴，嘴角略平
      ctx.beginPath();
      ctx.moveTo(x - 15, my + 1);
      ctx.quadraticCurveTo(x, my + 7, x + 15, my + 1);
      G.shape(ctx, null, 4.2, '#7E3229');
    } else if (c.expr === 'slight') {               // 浅笑：闭嘴上扬
      ctx.beginPath();
      ctx.moveTo(x - 13, my - 1);
      ctx.quadraticCurveTo(x, my + 9, x + 13, my - 1);
      G.shape(ctx, null, 3.6, '#8E4038');
    } else {                                        // 咧嘴笑
      ctx.beginPath();
      ctx.moveTo(x - 15, my - 2);
      ctx.quadraticCurveTo(x, my + 15, x + 15, my - 2);
      ctx.closePath();
      G.shape(ctx, '#A0362D', 3.6);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x - 15, my - 2);
      ctx.quadraticCurveTo(x, my + 15, x + 15, my - 2);
      ctx.closePath(); ctx.clip();
      ctx.fillStyle = '#FFF8F2';
      ctx.fillRect(x - 16, my - 2.5, 32, 4.6);
      ctx.fillStyle = '#D8615A';
      ctx.beginPath(); ctx.ellipse(x, my + 12, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    if (angry || c.expr === 'scared')               // 汗珠
      G.circle(ctx, x + 31, y - 16 + (c.life * 40 % 12), 5, '#7FD4F5', 2.8);

    if (c.expr === 'furious') {                     // 头顶冒火
      ctx.beginPath();
      ctx.moveTo(x - 12, y - hh * 1.16);
      ctx.quadraticCurveTo(x - 4, y - hh * 1.46, x + 2, y - hh * 1.14);
      ctx.quadraticCurveTo(x + 10, y - hh * 1.40, x + 14, y - hh * 1.12);
      G.shape(ctx, null, 3.4, P.red);
    }

    if (c.dirty) {                                  // 挂着脏东西（位置固定）
      ctx.save();
      headPath(ctx, x, y, hw, hh, jaw); ctx.clip();
      ctx.fillStyle = 'rgba(96,64,34,.78)';
      [[-14, 6, 9, 6], [10, -4, 7, 5], [2, 20, 11, 5]].forEach(function (d2) {
        ctx.beginPath();
        ctx.ellipse(x + d2[0], y + d2[1], d2[2], d2[3], 0.3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
      ctx.fillStyle = 'rgba(96,64,34,.72)';
      ctx.beginPath();
      ctx.ellipse(x - 6, sy + 26, 13, 8, -0.2, 0, Math.PI * 2); ctx.fill();
    }

    if (ph > 0.2) {                                 // 胸前那部手机
      G.box(ctx, x + 14, sy + 34, 21, 31, 4, '#2E2E33', 3);
      G.box(ctx, x + 17, sy + 37, 15, 23, 2, 'rgba(190,225,245,.94)', 0);
    }

    var gt = c.glassesType || (c.glasses ? 'rect' : null);
    if (gt) {
      var gcol = gt === 'thin' ? '#8E8367' : P.ink;
      var glw = gt === 'thin' ? 2 : gt === 'round' ? 2.6 : 3.4;
      [-1, 1].forEach(function (sg) {
        var gx2 = x + sg * 14.5;
        if (gt === 'round')
          G.circle(ctx, gx2, ey - 1, 13, 'rgba(214,238,252,.20)', glw, gcol);
        else
          G.box(ctx, gx2 - 15, ey - 10, 30, gt === 'thin' ? 17 : 20,
            gt === 'thin' ? 4 : 7, 'rgba(214,238,252,.20)', glw, gcol);
        ctx.beginPath();                             // 镜腿
        ctx.moveTo(x + sg * 29, ey - 6); ctx.lineTo(x + sg * (hw + 1), ey - 9);
        G.shape(ctx, null, glw * 0.85, gcol);
      });
      ctx.beginPath();
      ctx.moveTo(x - 2, ey - 4); ctx.lineTo(x + 2, ey - 4);
      G.shape(ctx, null, glw, gcol);
    }
  };

  /* 订单气泡：一排菜品图标 + 底部内嵌耐心条 */
  /* 「加肉」小角标，贴在订单图标右上角 */
  Art.bigTag = function (ctx, x, y, giant) {
    var w = giant ? 30 : 28;
    G.box(ctx, x - w / 2, y - 8, w, 16, 5, giant ? '#D34C83' : P.red, 2, P.ink);
    G.text(ctx, giant ? '超大' : '加肉', x, y,
      { size: 10, col: P.cream, weight: 800 });
  };

  Art.bubble = function (ctx, x, items, t, hot, tag, tagCol, pref, urgent, recipeTag, takeout, secretHint, lastChanceT) {
    var pitch = 36, n = items.length;
    var tw = tag ? tag.length * 14 + 16 : 0;
    var hint = secretHint ? String(secretHint)
      .replace(/^神秘提示[：:]\s*/, '线索：').replace(/\s+/g, '') : null;
    var rescueSeconds = isFinite(+lastChanceT) && +lastChanceT > 0
      ? Math.max(0, +lastChanceT) : 0;
    // 有「加肉」时把气泡加高，角标摞在图标正上方 —— 不然会压到右边的类型标
    var anyBig = false;
    for (var bi = 0; bi < n; bi++) if (items[bi].big) anyBig = true;
    /* 把口味要求压缩成贴在对应菜品下方的彩色小签：肥瘦用肉色、卤汁
       用橙色、火候用焦糖色。短标签只占 13px，不会把四样套餐挤成
       一张表，但玩家能在第一眼把“肥 / 汁 / 酥”与动作工位对应起来。 */
    var reqsByItem = [], reqItemCount = 0;
    for (var ri = 0; ri < n; ri++) {
      var reqItem = items[ri] || {}, reqs = [];
      var fatReq = reqItem.fatNeed || reqItem.fat;
      var juiceReq = reqItem.juiceNeed || reqItem.juice;
      var bunReq = reqItem.bunNeed || reqItem.bun;
      if (fatReq) reqs.push({ text: fatReq === 'fatty' ? '肥' : fatReq === 'lean' ? '瘦' : '均', col: '#A34A24' });
      if (juiceReq) reqs.push({ text: juiceReq === 'juicy' ? '汁' : '干', col: '#D2660A' });
      if (bunReq) reqs.push({ text: bunReq === 'crispy' ? '酥' : '软', col: '#8B5A2B' });
      reqsByItem.push(reqs);
      if (reqs.length) reqItemCount++;
    }
    var requestRow = reqItemCount ? 12 : 0;
    var bw = Math.max(secretHint ? 180 : 104, n * pitch + 22 + tw), bh = (anyBig ? 70 : 52) +
      (urgent ? 8 : 0) + (recipeTag || takeout || secretHint ? 8 : 0) +
      (rescueSeconds ? 14 : 0) + requestRow, by = 48;
    var bx = G.clamp(x - bw / 2, 4, G.W - bw - 4);   // 靠边的顾客气泡内收，尾巴仍指向本人

    ctx.fillStyle = 'rgba(58,36,24,.20)';
    G.rrect(ctx, bx + 3, by + 5, bw, bh, 15); ctx.fill();
    ctx.save();
    if (hot) { ctx.shadowColor = P.yellow; ctx.shadowBlur = 16; }
    G.rrect(ctx, bx, by, bw, bh, 15);
    G.shape(ctx, P.cream, hot ? 5 : urgent ? 5 : 4,
      hot ? P.orangeDk : urgent ? P.red : P.ink);
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(x - 11, by + bh - 3); ctx.lineTo(x, by + bh + 13); ctx.lineTo(x + 11, by + bh - 3);
    G.shape(ctx, P.cream, 0);
    ctx.beginPath();
    ctx.moveTo(x - 11, by + bh - 1); ctx.lineTo(x, by + bh + 13); ctx.lineTo(x + 11, by + bh - 1);
    G.shape(ctx, null, 4, hot ? P.orangeDk : P.ink);

    for (var i = 0; i < n; i++) {
      var ix = bx + 11 + pitch * (i + 0.5), iy = by + (anyBig ? 39 : pref ? 27 : 21);
      if (items[i].done) {
        ctx.globalAlpha = 0.28;
        Art.item(ctx, items[i].type, ix, iy, 0.5);
        ctx.globalAlpha = 1;
        ctx.lineWidth = 4; ctx.strokeStyle = '#1D8A3C'; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ix - 9, iy + 1); ctx.lineTo(ix - 2, iy + 8); ctx.lineTo(ix + 10, iy - 8);
        ctx.stroke();
      } else {
        Art.item(ctx, items[i].type, ix, iy, 0.5);
      }
      if (items[i].big) Art.bigTag(ctx, ix, by + 14, items[i].giant);
      var req = reqsByItem[i];
      if (req && req.length) {
        var rw = req.length * 13 + (req.length - 1) * 2, rx = ix - rw / 2, ry = iy + 9;
        for (var rqi = 0; rqi < req.length; rqi++) {
          var rq = req[rqi], rxx = rx + rqi * 15;
          G.box(ctx, rxx, ry, 13, 11, 4, rq.col, 1, P.ink);
          G.text(ctx, rq.text, rxx + 6.5, ry + 7.5,
            { size: 7.5, col: P.cream, weight: 900 });
        }
      }
    }

    // 内嵌耐心条
    var pw = bw - 22;
    G.box(ctx, bx + 11, by + bh - 14, pw, 8, 4, '#E6D8C0', 0);
    if (t > 0) {
      ctx.save();
      G.rrect(ctx, bx + 11, by + bh - 14, pw, 8, 4); ctx.clip();
      ctx.fillStyle = t > 0.5 ? P.green : t > 0.25 ? P.yellow : P.red;
      ctx.fillRect(bx + 11, by + bh - 14, pw * G.clamp(t, 0, 1), 8);
      ctx.restore();
    }
    if (rescueSeconds) {
      /* 耐心条已经见底时，红框里再明确写出剩余的“最后一口气”。
         这段信息与 game.js 的短暂缓冲同步，不改变奖励，只让玩家知道
         现在仍值得把手里的成品递出去。 */
      G.box(ctx, bx + 11, by + bh - 32, pw, 15, 7, '#FFF0B4', 2, P.red);
      G.text(ctx, '救援窗口 ' + rescueSeconds.toFixed(1) + 's', bx + bw / 2,
        by + bh - 24, { size: 9, col: P.red, weight: 900 });
    }
    if (urgent) {
      /* 低耐心不只换成一条红色进度条：在条尾挂一个会呼吸的感叹号，
         玩家在午市的三张气泡里能立刻找出「先救谁」，也不会遮住菜图。 */
      var up = 0.72 + Math.sin(((G.S && G.S.anim) || 0) * 12) * 0.22;
      ctx.save(); ctx.globalAlpha = G.clamp(up, 0.42, 1);
      G.circle(ctx, bx + bw - 10, by + bh - 10, 8, P.red, 2.5, P.cream);
      G.text(ctx, '!', bx + bw - 10, by + bh - 10,
        { size: 14, col: P.cream, weight: 900 });
      ctx.restore();
    }

    if (tag) {
      G.box(ctx, bx + bw - tw - 8, by + 10, tw, 24, 12, tagCol || P.red, 3);
      G.text(ctx, tag, bx + bw - tw / 2 - 8, by + 22, { size: 14, col: P.cream });
    }
    if (pref) {
      var pc = pref.col || P.orangeDk;
      G.box(ctx, bx + 8, by + 7, 46, 18, 8, pc, 2, P.ink);
      G.text(ctx, pref.short || pref.label || '讲究', bx + 31, by + 20,
        { size: 11, col: P.cream, weight: 800 });
    }
    if (secretHint) {
      /* 隐藏菜不该靠玩家记住一串未显示的字段：复用秘制底栏做成
         小纸条。线索先去掉空格，横向留出余量，不会压住耐心条。 */
      G.box(ctx, bx + 9, by + bh - 31, bw - 18, 14, 7, '#FFF1C8', 2, '#C18823');
      G.text(ctx, hint, bx + bw / 2, by + bh - 24,
        { size: 8, col: '#8A5A00', weight: 800 });
    } else if (recipeTag || takeout) {
      var rt = recipeTag || '外卖';
      var rc = recipeTag === '秘制' ? '#B07800' : takeout && !recipeTag ? '#3976A8' : P.orangeDk;
      G.text(ctx, (takeout && recipeTag ? '外卖 · ' : '') + rt,
        bx + bw / 2, by + bh - 22, { size: 10, col: rc, weight: 800 });
    }
  };

  /* ============ 菜品 ============ */

  Art.bun = function (ctx, x, y, s, tone, burn) {
    var w = 34 * s, h = 27 * s, lw = 4 * Math.max(0.62, s);
    var col = burn ? P.bunBurn
      : '#' + [
          Math.round(G.lerp(0xF4, 0xE3, tone)),
          Math.round(G.lerp(0xDC, 0xA8, tone)),
          Math.round(G.lerp(0xB0, 0x57, tone))
        ].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
    var bg = ctx.createRadialGradient(-w * 0.30, -h * 0.48, h * 0.10, 0, 0, w * 1.06);
    bg.addColorStop(0, G.shade(col, 0.34));
    bg.addColorStop(0.52, col);
    bg.addColorStop(1, G.shade(col, -0.26));
    ctx.fillStyle = bg; ctx.fill();
    G.shape(ctx, null, lw);
    // 左上高光弧
    ctx.beginPath();
    ctx.ellipse(-w * 0.22, -h * 0.34, w * 0.42, h * 0.30, -0.35, 0, Math.PI * 2);
    G.shape(ctx, burn ? null : 'rgba(255,255,255,.30)', 0);
    ctx.beginPath(); ctx.ellipse(0, 2 * s, w * 0.62, h * 0.55, 0, 0, Math.PI * 2);
    G.shape(ctx, null, lw * 0.75, burn ? '#2A1C12' : 'rgba(58,36,24,.35)');
    if (tone > 0.5 && !burn) {
      G.circle(ctx, -w * 0.4, -h * 0.35, 2.6 * s, '#B9762C', 0);
      G.circle(ctx, w * 0.35, h * 0.3, 2.2 * s, '#B9762C', 0);
    }
    ctx.restore();
  };

  /* ==========================================================
     以下六个是「新工序」的默认实现，会被这些覆盖文件替换：
       js/art-stage.js → mincePileC / pepPileC / dough / handful
       js/art-wrap.js  → ironTray / wrapped
       js/art-drink.js → bingfeng / drinkRack
     默认版只求可玩、可读，不求好看。
     ========================================================== */

  /* 连续的肉馅堆。m = 0..1。约束：cx±70 / cy-30~+26 */

  /* 连续的青椒丁堆 */

  /* 面团 → 摊开的饼坯。press = 0..1，r = 灶眼半径 */
  Art.dough = function (ctx, cx, cy, press, r) {
    var rad = r * (0.42 + press * 0.36);
    var flat = 1 - press * 0.42;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rad, rad * flat, 0, 0, Math.PI * 2);
    G.shape(ctx, '#F6EEDC', 3.4);
    ctx.beginPath();
    ctx.ellipse(cx - rad * 0.25, cy - rad * flat * 0.3, rad * 0.42, rad * flat * 0.28,
      -0.3, 0, Math.PI * 2);
    G.shape(ctx, 'rgba(255,255,255,.55)', 0);
    if (press > 0.5) {                            // 摊开之后中间会薄一圈
      ctx.beginPath();
      ctx.ellipse(cx, cy, rad * 0.6, rad * flat * 0.55, 0, 0, Math.PI * 2);
      G.shape(ctx, null, 2, 'rgba(58,36,24,.20)');
    }
  };

  /* 手里抓着的一把。amount = 0..1，kind = 'meat' | 'pep' */
  Art.handful = function (ctx, x, y, amount, kind) {
    var r = 8 + amount * 13;
    var cols = kind === 'pep' ? [P.pepperDk, P.pepper, P.pepperLt]
                              : [P.meatDark, P.meat, P.meatLite];
    G.drop(ctx, x, y + r * 0.8, r * 1.2, r * 0.4, 0.28);
    for (var i = 0; i < 6; i++) {
      var a = i * 1.047 + 0.4, rr = r * (0.35 + (i % 3) * 0.22);
      G.box(ctx, x + Math.cos(a) * rr - 4, y + Math.sin(a) * rr * 0.7 - 4,
        8, 7, 2.5, cols[i % 3], 2);
    }
    G.circle(ctx, x, y, r, 'rgba(255,255,255,.14)', 0);
  };

  /* 纸包着的肉夹馍。wrapT = 0 裸的，1 包好 */
  Art.wrapped = function (ctx, x, y, s, wrapT, pep) {
    Art.roujiamo(ctx, x, y, s, pep);
    if (wrapT <= 0.01) return;
    var w = 36 * s, h = 28 * s;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
    ctx.clip();
    var top = y + h - (h * 1.7) * G.clamp(wrapT, 0, 1);
    ctx.beginPath();
    ctx.moveTo(x - w, y + h); ctx.lineTo(x - w, top + 3);
    ctx.lineTo(x, top); ctx.lineTo(x + w, top + 3); ctx.lineTo(x + w, y + h);
    ctx.closePath();
    G.shape(ctx, '#F7EEDB', Math.max(2, 3 * s), '#C9B79A');
    if (s > 0.6) {
      ctx.beginPath();
      ctx.moveTo(x - w * 0.3, top + 4); ctx.lineTo(x - w * 0.2, y + h);
      G.shape(ctx, null, 1.6, 'rgba(58,36,24,.22)');
      ctx.beginPath();
      ctx.ellipse(x + w * 0.3, y + h * 0.4, w * 0.22, h * 0.2, 0, 0, Math.PI * 2);
      G.shape(ctx, 'rgba(196,140,60,.22)', 0);
    }
    ctx.restore();
  };

  /* 铁盘：肉夹馍和凉皮碗都摆这儿；没包纸的要提示 */
  Art.ironTray = function (ctx, z, items, max) {
    ctx.fillStyle = P.shadow;
    G.rrect(ctx, z.x + 3, z.y + 6, z.w, z.h, 12); ctx.fill();
    G.box(ctx, z.x, z.y, z.w, z.h, 12, P.steel, 4);
    G.box(ctx, z.x + 7, z.y + 6, z.w - 14, z.h - 12, 8, '#E3EAEF', 3);
    ctx.save();
    G.rrect(ctx, z.x + 7, z.y + 6, z.w - 14, z.h - 12, 8); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(z.x + 40, z.y + 6); ctx.lineTo(z.x + 76, z.y + 6);
    ctx.lineTo(z.x + 44, z.y + z.h - 6); ctx.lineTo(z.x + 8, z.y + z.h - 6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    for (var i = 0; i < max; i++) {
      var c = G.traySlot ? G.traySlot(i)
        : { x: z.x + z.w / 2 - (max - 1) * 43 + i * 86, y: z.y + z.h / 2 };
      var it = items[i];
      if (!it) {
        ctx.setLineDash([6, 6]);
        G.circle(ctx, c.x, c.y, 20, null, 3, P.steelDark);
        ctx.setLineDash([]);
        continue;
      }
      G.drop(ctx, c.x, c.y + 17, 21, 5, 0.30);
      if (it.type === 'lp') Art.item(ctx, 'lp', c.x, c.y, 0.72);
      else Art.wrapped(ctx, c.x, c.y, 0.72, it.wrapT, it.type === 'rjmp');
      if (it.wrapT < 1) {                      // 等着盖纸：画成一个落点
        ctx.setLineDash([5, 4]);
        G.circle(ctx, c.x, c.y, 28, null, 3, P.orangeDk);
        ctx.setLineDash([]);
        G.box(ctx, c.x + 16, c.y - 26, 16, 12, 2, '#F7EEDB', 2.4);
        G.text(ctx, '要包纸', c.x, c.y + 24,
          { size: 11, col: P.orangeDk, stroke: '#E3EAEF', strokeW: 5 });
      }
    }
    if (!items.length)
      G.text(ctx, '铁盘 · 夹好的肉夹馍放这儿', z.x + z.w / 2, z.y + z.h / 2,
        { size: 13, col: P.inkSoft, stroke: '#E3EAEF', strokeW: 6 });
  };

  /* 纸站：一叠油纸，按住抽一张（默认版） */
  Art.paperStack = function (ctx, z, hot) {
    ctx.fillStyle = P.shadow;
    G.rrect(ctx, z.x + 3, z.y + 6, z.w, z.h, 10); ctx.fill();
    G.box(ctx, z.x, z.y, z.w, z.h, 10, G.shade(P.wood, 0.14), 4);
    var cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    for (var i = 3; i >= 0; i--)               // 层叠的纸边
      G.box(ctx, cx - 34 + i * 2, cy - 14 + i * 3, 68, 26, 3,
        i === 0 ? '#F7EEDB' : G.shade('#E3D0AA', -i * 0.05), 2.6);
    if (hot) {
      ctx.save(); ctx.shadowColor = P.yellow; ctx.shadowBlur = 12;
      G.box(ctx, cx - 36, cy - 18, 72, 34, 5, null, 3, P.orangeDk);
      ctx.restore();
    }
    G.text(ctx, '纸', cx, cy - 1, { size: 13, col: P.inkSoft });
    G.text(ctx, '按住抽一张', cx, z.y + z.h - 7, { size: 10, col: hot ? P.orangeDk : P.inkSoft });
  };

  /* 手里捏着的那张纸 */
  Art.paperInHand = function (ctx, x, y) {
    G.drop(ctx, x, y + 16, 22, 6, 0.26);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-0.12);
    G.box(ctx, -22, -16, 44, 32, 3, '#F7EEDB', 3, '#C9B79A');
    ctx.beginPath();
    ctx.moveTo(-10, -14); ctx.lineTo(-6, 14);
    G.shape(ctx, null, 1.6, 'rgba(58,36,24,.20)');
    ctx.beginPath();                            // 捏住的那一角翘起来
    ctx.moveTo(14, -16); ctx.lineTo(22, -16); ctx.lineTo(22, -6);
    ctx.closePath();
    G.shape(ctx, '#E3D0AA', 2);
    ctx.restore();
  };

  /* 饮料架：冰峰单独放，不占铁盘的位置 */
  Art.drinkRack = function (ctx, z, n, max) {
    ctx.fillStyle = P.shadow;
    G.rrect(ctx, z.x + 3, z.y + 6, z.w, z.h, 12); ctx.fill();
    G.box(ctx, z.x, z.y, z.w, z.h, 12, P.fridgeDk, 4);
    G.box(ctx, z.x + 7, z.y + 6, z.w - 14, z.h - 12, 8, P.ice, 3);
    G.text(ctx, '冰峰', z.x + 22, z.y + z.h - 9, { size: 11, col: P.fridgeDk });
    for (var i = 0; i < max; i++) {
      var cx = z.x + z.w * ((i + 0.5) / max), cy = z.y + z.h / 2 - 4;
      if (i < n) {
        G.drop(ctx, cx, cy + 20, 12, 4, 0.30);
        Art.bingfeng(ctx, cx, cy, 0.6, false, false);
      } else {
        ctx.setLineDash([5, 5]);
        G.circle(ctx, cx, cy + 6, 13, null, 3, P.iceDk);
        ctx.setLineDash([]);
      }
    }
  };

  /* ---------- 肉的三个绘制接缝 ----------
     js/art-meat.js 会整体替换这三个函数来做更写实的肉。
     签名固定，坐标约定见各函数注释。 */

  /* 案板上那块整腊汁肉。cx/cy 是绝对坐标，sc 是「越剁越小」的缩放（0.44~1） */
  Art.meatBlock = function (ctx, cx, cy, sc) {
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(sc * 0.82, sc * 0.82);
    G.box(ctx, -50, -32, 100, 64, 20, P.meat, 5);
    G.box(ctx, -32, -20, 42, 24, 11, P.meatLite, 4);
    ctx.beginPath(); ctx.moveTo(6, 15); ctx.lineTo(36, 8);
    G.shape(ctx, null, 5, P.meatDark);
    ctx.restore();
  };

  /* 剁出来的肉馅堆。cx/cy 绝对坐标，n = 已剁出的粒数（0~Art.SCATTER.length） */
  Art.mincePile = function (ctx, cx, cy, n) {
    for (var i = 0; i < n; i++) {
      var o = Art.SCATTER[i];
      G.box(ctx, cx + 54 + o[0], cy + o[1] + o[2] * 0.5, 15, 13, 4,
        i % 3 === 0 ? P.meatDark : i % 3 === 1 ? P.meat : P.meatLite, 3);
    }
  };

  /* 肉夹馍夹缝里的肉。调用时 ctx 已经 translate 到馍心，w = 馍的半宽 */
  Art.meatFill = function (ctx, w, s, lw) {
    ctx.beginPath();
    ctx.moveTo(-w * 0.86, 1); ctx.lineTo(w * 0.86, 1);
    G.shape(ctx, null, 5 * Math.max(0.62, s), '#8A5A2A');
    G.circle(ctx, -w * 0.5, 1, 5 * s, P.meat, lw);
    G.circle(ctx, 0, 2.5 * s, 5.5 * s, P.meatLite, lw);
    G.circle(ctx, w * 0.5, 1, 5 * s, P.meatDark, lw);
  };

  /* ---------- 顾客的碎嘴小气泡 ---------- */
  Art.sayTag = function (ctx, x, y, text, life, flip) {
    if (!text) return;
    var a = G.clamp(life / 0.45, 0, 1);            // 最后 0.45 秒淡出
    var w = text.length * 13 + 18, h = 24;
    var bx = flip ? x - 58 - w : x + 58;
    bx = G.clamp(bx, 4, G.W - w - 4);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(58,36,24,.18)';
    G.rrect(ctx, bx + 2, y + 3, w, h, 11); ctx.fill();
    G.box(ctx, bx, y, w, h, 11, P.cream, 3);
    var tipX = flip ? bx + w : bx;                 // 小尾巴指向本人
    ctx.beginPath();
    ctx.moveTo(tipX, y + 8);
    ctx.lineTo(tipX + (flip ? 9 : -9), y + 14);
    ctx.lineTo(tipX, y + 19);
    G.shape(ctx, P.cream, 3);
    G.text(ctx, text, bx + w / 2, y + h / 2 + 1, { size: 12, col: P.inkSoft });
    ctx.restore();
  };

  /* ---------- 第一天的引导指示器 ---------- */
  Art.tutor = function (ctx, x, y, text, now) {
    var pu = 1 + Math.sin(now * 5) * 0.10;
    ctx.save();
    ctx.globalAlpha = 0.55 + Math.sin(now * 5) * 0.2;
    G.circle(ctx, x, y, 34 * pu, null, 5, P.yellow);
    ctx.globalAlpha = 1;
    G.circle(ctx, x, y, 27, null, 4, P.orangeDk);

    // 气泡放在上方；太靠顶就翻到下方
    var up = y > 200;
    var by = up ? y - 84 : y + 50;
    var w = Math.min(G.W - 24, text.length * 15 + 34), bx = G.clamp(x - w / 2, 12, G.W - w - 12);
    ctx.fillStyle = 'rgba(58,36,24,.22)';
    G.rrect(ctx, bx + 3, by + 5, w, 40, 12); ctx.fill();
    G.box(ctx, bx, by, w, 40, 12, P.cream, 4, P.orangeDk);
    ctx.beginPath();
    if (up) { ctx.moveTo(x - 10, by + 39); ctx.lineTo(x, by + 56); ctx.lineTo(x + 10, by + 39); }
    else    { ctx.moveTo(x - 10, by + 1);  ctx.lineTo(x, by - 16); ctx.lineTo(x + 10, by + 1); }
    G.shape(ctx, P.cream, 0);
    ctx.beginPath();
    if (up) { ctx.moveTo(x - 10, by + 37); ctx.lineTo(x, by + 56); ctx.lineTo(x + 10, by + 37); }
    else    { ctx.moveTo(x - 10, by + 3);  ctx.lineTo(x, by - 16); ctx.lineTo(x + 10, by + 3); }
    G.shape(ctx, null, 4, P.orangeDk);
    G.text(ctx, text, bx + w / 2, by + 21, { size: 15, col: P.meatDark });
    ctx.restore();
  };

  /* 首次有成品时给一条不挡工位的手势提示。它只出现几秒，
     让双击 / 滑动这种「知道后很快、不知道就永远不会试」的快捷操作有入口。 */
  Art.gestureHint = function (ctx, text, now) {
    var w = Math.min(G.W - 36, Math.max(260, text.length * 13 + 28));
    var x = G.W / 2 - w / 2, y = 270;
    var a = 0.78 + Math.sin(now * 4) * 0.12;
    ctx.save(); ctx.globalAlpha = G.clamp(a, 0.5, 1);
    G.box(ctx, x + 3, y + 4, w, 30, 11, 'rgba(58,36,24,.22)', 0);
    G.box(ctx, x, y, w, 30, 11, '#FFF0B4', 3, P.orangeDk);
    G.text(ctx, text, G.W / 2, y + 16, { size: 13, col: P.meatDark, weight: 700 });
    ctx.restore();
  };

  /* ---------- 彩蛋：那一小堆（默认版，js/art-poop.js 会覆盖）---------- */
  function poopBlob(ctx, x, y, r) {
    G.circle(ctx, x, y + r * 0.5, r, '#6B4423', 3.2);
    G.circle(ctx, x + r * 0.12, y - r * 0.25, r * 0.68, '#7A5029', 3);
    G.circle(ctx, x - r * 0.06, y - r * 0.85, r * 0.42, '#8B5E34', 2.6);
    G.circle(ctx, x - r * 0.30, y + r * 0.30, r * 0.20, 'rgba(255,255,255,.28)', 0);
  }
  Art.poopPile = function (ctx, z, n, hot) {
    if (n <= 0) return;
    var cx = z.x + z.w / 2, cy = z.y + z.h - 8;
    G.drop(ctx, cx, cy + 5, z.w * 0.44, 5, 0.30);
    for (var i = 0; i < Math.min(n, 3); i++)
      poopBlob(ctx, cx + (i - 1) * 13, cy - i * 2, 8);
    if (hot) {
      ctx.setLineDash([4, 4]);
      G.circle(ctx, cx, cy - 4, 22, null, 2, '#8B5E34');
      ctx.setLineDash([]);
    }
  };
  Art.poopInHand = function (ctx, x, y) {
    G.drop(ctx, x, y + 13, 15, 5, 0.26);
    poopBlob(ctx, x, y, 11);
  };
  Art.poopFly = function (ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(t * 9);
    poopBlob(ctx, 0, 0, 10);
    ctx.restore();
  };
  Art.splat = function (ctx, x, y, t, s) {
    s = s || 1;
    var e = G.clamp(t, 0, 1), i;
    var burstR = 40 * s * (1 - e);
    ctx.save();
    ctx.globalAlpha = 1 - e;
    for (i = 0; i < 7; i++) {
      var a = i * 0.897;
      G.circle(ctx, x + Math.cos(a) * burstR, y + Math.sin(a) * burstR, 4 * s, '#6B4423', 0);
    }
    ctx.globalAlpha = 1;
    var r = 8 * s + e * 12 * s;
    G.circle(ctx, x, y, r, '#6B4423', 2.6);
    G.circle(ctx, x - r * 0.4, y - r * 0.3, r * 0.42, '#7A5029', 0);
    if (e > 0.4) {
      ctx.beginPath();
      ctx.moveTo(x - r * 0.4, y + r * 0.6);
      ctx.lineTo(x - r * 0.3, y + r * (0.6 + (e - 0.4) * 1.6));
      ctx.moveTo(x + r * 0.5, y + r * 0.4);
      ctx.lineTo(x + r * 0.42, y + r * (0.4 + (e - 0.4) * 1.2));
      G.shape(ctx, null, 3.4 * s, '#5A3A1E');
    }
    ctx.restore();
  };

  /* ---------- 彩椒的两个接缝（js/art-food.js 会覆盖成更像的）---------- */

  /* 一整个彩椒。cx/cy 中心，sc 缩放，col 外皮色（可缺省） */
  Art.bellPepper = function (ctx, cx, cy, sc, col) {
    var c0 = col || '#D6342B';
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    G.drop(ctx, 0, 26, 30, 7, 0.30);
    ctx.beginPath();                       // 四瓣灯笼形
    ctx.moveTo(0, -20);
    ctx.bezierCurveTo(24, -22, 34, -4, 30, 10);
    ctx.bezierCurveTo(27, 22, 14, 28, 0, 26);
    ctx.bezierCurveTo(-14, 28, -27, 22, -30, 10);
    ctx.bezierCurveTo(-34, -4, -24, -22, 0, -20);
    ctx.closePath();
    G.shape(ctx, c0, 4.4, null, [-22, 28]);
    ctx.save(); ctx.clip();                // 纵向的棱
    [-16, 0, 16].forEach(function (lx) {
      ctx.beginPath();
      ctx.moveTo(lx, -20); ctx.quadraticCurveTo(lx * 1.25, 4, lx * 0.9, 27);
      G.shape(ctx, null, 2.4, 'rgba(58,36,24,.22)');
    });
    ctx.beginPath();                       // 竖直高光带
    ctx.ellipse(-13, -2, 6, 15, -0.15, 0, Math.PI * 2);
    G.shape(ctx, 'rgba(255,255,255,.46)', 0);
    ctx.restore();
    G.box(ctx, -5, -30, 10, 12, 3, '#3E7C2E', 3.4);   // 梗
    ctx.beginPath();                                   // 蒂
    ctx.ellipse(0, -19, 12, 6, 0, 0, Math.PI * 2);
    G.shape(ctx, '#4FA83D', 3.4);
    ctx.restore();
  };

  /* 肉夹馍夹缝里露出的彩椒丁 */
  Art.pepFill = function (ctx, w, s, lw) {
    G.box(ctx, -w * 0.74, -4 * s, 10 * s, 9 * s, 2.5 * s, P.pepper, lw);
    G.box(ctx, w * 0.18, -5 * s, 10 * s, 9 * s, 2.5 * s, P.pepperLt, lw);
    G.box(ctx, -w * 0.12, 3 * s, 9 * s, 8 * s, 2.5 * s, P.pepperDk, lw);
  };

  /* 成品肉夹馍；pep=true 为加青椒版
   *
   * 关键是要读成「馍是剖开的、肉从豁口里鼓出来」，而不是「圆饼上抹了条肉」。
   * 之前就是后者：肉的竖向厚度只有馍高的 22%，那条夹缝又整条被肉盖住，
   * 放大看就是一张饼上糊了一道酱。所以现在分三层摆：
   *   1) 先挖一个比肉团大一圈的深色豁口，边上露出一圈暗边 = 馍的断面；
   *   2) 肉团竖向拉长坐进豁口里（肉是软的，非等比拉伸不露馅，描边按比例调细）；
   *   3) 上唇往肉上投一道阴影，肉才「在里面」而不是「贴在外面」。
   */
  Art.roujiamo = function (ctx, x, y, s, pep) {
    Art.bun(ctx, x, y, s, 1, false);
    var w = 34 * s, lw = Math.max(2.4, 3 * s);
    var mw = w * 0.95, mh = 15 * s;        // 豁口的半宽 / 半高
    ctx.save();
    ctx.translate(x, y);

    function mouthPath() {
      ctx.beginPath();
      ctx.moveTo(-mw, 1.2 * s);
      ctx.quadraticCurveTo(0, -mh, mw, 0.6 * s);
      ctx.quadraticCurveTo(0, mh * 1.12, -mw, 1.2 * s);
      ctx.closePath();
    }

    mouthPath();                            // 1) 馍的断面
    G.shape(ctx, '#7A4420', 0);

    ctx.save();
    mouthPath(); ctx.clip();                // 肉只许长在豁口里
    ctx.save();
    ctx.translate(0, 2.2 * s);
    ctx.scale(1, 1.62);
    Art.meatFill(ctx, w, s, lw / 1.35);     // 2) 肉团坐进去
    ctx.restore();
    // 彩椒丁不跟着拉伸 —— 肉是软的拉长了不露馅，椒丁是硬的，
    // 一拉就成了长方块，看着像糖果不像切开的彩椒
    if (pep) {
      ctx.save();
      ctx.translate(0, 2.6 * s);
      Art.pepFill(ctx, w, s, lw);
      ctx.restore();
    }

    ctx.beginPath();                        // 3) 上唇的投影
    ctx.moveTo(-mw, 1.2 * s);
    ctx.quadraticCurveTo(0, -mh, mw, 0.6 * s);
    ctx.quadraticCurveTo(0, -mh + 7 * s, -mw, 1.2 * s + 4 * s);
    G.shape(ctx, 'rgba(58,26,10,.34)', 0);
    ctx.restore();

    ctx.beginPath();                        // 断面的上下唇边，把「剖开」说死
    ctx.moveTo(-mw, 1.2 * s);
    ctx.quadraticCurveTo(0, -mh, mw, 0.6 * s);
    G.shape(ctx, null, Math.max(1.6, 2.2 * s), '#6B3A1B');
    ctx.restore();
  };

  /* 拌凉皮：stage 0 空碗 / 1 只有凉皮 / 2 加了调料 / 3 拌好 */
  Art.bowl = function (ctx, x, y, s, stage) {
    var lw = Math.max(2.6, 4 * s);
    ctx.save();
    ctx.translate(x, y);
    // 碗身
    ctx.beginPath();
    ctx.moveTo(-30 * s, -4 * s);
    ctx.lineTo(30 * s, -4 * s);
    ctx.quadraticCurveTo(26 * s, 24 * s, 0, 24 * s);
    ctx.quadraticCurveTo(-26 * s, 24 * s, -30 * s, -4 * s);
    ctx.closePath();
    G.shape(ctx, P.bowl, lw);
    // 碗口
    ctx.beginPath();
    ctx.ellipse(0, -4 * s, 30 * s, 8 * s, 0, 0, Math.PI * 2);
    G.shape(ctx, '#FFFFFF', lw, P.bowlRim);

    if (stage >= 1) {
      // 凉皮堆
      ctx.beginPath();
      ctx.ellipse(0, -9 * s, 25 * s, 10 * s, 0, 0, Math.PI * 2);
      G.shape(ctx, P.noodle, lw * 0.8);
      G.box(ctx, -19 * s, -14 * s, 16 * s, 5 * s, 2.5 * s, P.noodleDk, 0);
      G.box(ctx,   1 * s, -11 * s, 17 * s, 5 * s, 2.5 * s, P.noodleDk, 0);
      G.box(ctx, -10 * s,  -6 * s, 15 * s, 5 * s, 2.5 * s, P.noodleDk, 0);
    }
    if (stage >= 2) {
      // 辣油 + 黄瓜丝 + 芝麻
      G.circle(ctx, 4 * s, -13 * s, 6.5 * s, P.chiliOil, 0);
      G.circle(ctx, -9 * s, -9 * s, 4.5 * s, P.chili, 0);
      G.box(ctx, -20 * s, -12 * s, 12 * s, 4 * s, 2 * s, P.pepper, 0);
      G.box(ctx,  10 * s,  -8 * s, 11 * s, 4 * s, 2 * s, P.pepperLt, 0);
      G.circle(ctx, -3 * s, -16 * s, 1.6 * s, P.cream, 0);
      G.circle(ctx, 13 * s, -14 * s, 1.6 * s, P.cream, 0);
    }
    if (stage >= 3) {
      // 拌匀了：多几缕红油挂汁
      G.box(ctx, -16 * s, -16 * s, 13 * s, 4 * s, 2 * s, P.chiliOil, 0);
      G.box(ctx,   2 * s,  -6 * s, 14 * s, 4 * s, 2 * s, P.chiliOil, 0);
    }
    ctx.restore();
  };

  /* 冰峰玻璃瓶 */
  Art.bingfeng = function (ctx, x, y, s, capped, fizz) {
    var lw = Math.max(2.6, 4 * s);
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(-11 * s, 18 * s);
    ctx.lineTo(-11 * s, -4 * s);
    ctx.quadraticCurveTo(-11 * s, -12 * s, -5 * s, -16 * s);
    ctx.lineTo(-5 * s, -24 * s);
    ctx.lineTo(5 * s, -24 * s);
    ctx.lineTo(5 * s, -16 * s);
    ctx.quadraticCurveTo(11 * s, -12 * s, 11 * s, -4 * s);
    ctx.lineTo(11 * s, 18 * s);
    ctx.quadraticCurveTo(11 * s, 23 * s, 6 * s, 23 * s);
    ctx.lineTo(-6 * s, 23 * s);
    ctx.quadraticCurveTo(-11 * s, 23 * s, -11 * s, 18 * s);
    ctx.closePath();
    G.shape(ctx, P.soda, lw);
    // 高光
    G.box(ctx, -8 * s, -2 * s, 3.5 * s, 16 * s, 2 * s, 'rgba(255,255,255,.55)', 0);
    // 商标带
    G.box(ctx, -11 * s, 1 * s, 22 * s, 12 * s, 2 * s, P.cream, lw * 0.7);
    G.box(ctx, -8 * s, 4 * s, 16 * s, 3 * s, 1.5 * s, '#1B5FA8', 0);
    G.circle(ctx, 0, 10 * s, 2 * s, '#1B5FA8', 0);
    if (capped) G.box(ctx, -6.5 * s, -30 * s, 13 * s, 7 * s, 2 * s, P.steelDark, lw * 0.7);
    if (fizz) {
      G.circle(ctx, -3 * s, -30 * s, 3 * s, P.ice, lw * 0.6);
      G.circle(ctx,  5 * s, -36 * s, 2.2 * s, P.ice, lw * 0.6);
      G.circle(ctx, -1 * s, -42 * s, 1.8 * s, P.ice, lw * 0.6);
    }
    ctx.restore();
  };

  /* 统一的菜品图标入口 */
  Art.item = function (ctx, type, x, y, s) {
    if (type === 'rjm')       Art.roujiamo(ctx, x, y, s, false);
    else if (type === 'rjmp') Art.roujiamo(ctx, x, y, s, true);
    else if (type === 'lp')   Art.bowl(ctx, x, y, s * 0.92, 3);
    else if (type === 'bf')   Art.bingfeng(ctx, x, y, s * 0.86, false, false);
  };

  /* ============ 工位外壳 ============ */

  Art.panel = function (ctx, z, title, fill) {
    ctx.fillStyle = 'rgba(58,36,24,.10)';
    G.rrect(ctx, z.x + 6, z.y + 12, z.w, z.h, 18); ctx.fill();
    ctx.fillStyle = 'rgba(58,36,24,.16)';
    G.rrect(ctx, z.x + 2, z.y + 5, z.w, z.h, 18); ctx.fill();
    G.box(ctx, z.x, z.y, z.w, z.h, 18, fill || '#FFF1D6', 4);
    G.box(ctx, z.x, z.y, z.w, 26, 18, P.woodDark, 4);
    // 标题带下沿的一道亮线，做出压印感
    ctx.beginPath();
    ctx.moveTo(z.x + 6, z.y + 27.5); ctx.lineTo(z.x + z.w - 6, z.y + 27.5);
    G.shape(ctx, null, 2.5, 'rgba(255,255,255,.5)');
    // 面板内侧倒角
    ctx.save();
    G.rrect(ctx, z.x, z.y, z.w, z.h, 18); ctx.clip();
    G.rrect(ctx, z.x + 2.5, z.y + 2.5, z.w - 5, z.h - 5, 16);
    G.shape(ctx, null, 3, 'rgba(255,255,255,.42)');
    ctx.restore();
    G.text(ctx, title, z.x + 12, z.y + 13,
      { size: 15, align: 'left', col: P.cream, stroke: 'rgba(58,36,24,.45)', strokeW: 3 });
  };

  Art.hint = function (ctx, z, str, col) {
    G.text(ctx, str, z.x + 14, z.y + z.h - 11,
      { size: 13, align: 'left', col: col || P.inkSoft, weight: 700 });
  };

  Art.locked = function (ctx, z, day) {
    Art.panel(ctx, z, '？ ？ ？', '#E8DCC6');
    G.box(ctx, z.x, z.y, z.w, z.h, 18, P.lock, 0);
    var cx = z.x + z.w / 2, cy = z.y + z.h / 2;
    ctx.beginPath();
    ctx.arc(cx, cy - 16, 13, Math.PI, 0);
    G.shape(ctx, null, 6, P.cream);
    G.box(ctx, cx - 19, cy - 14, 38, 30, 7, P.cream, 0);
    G.circle(ctx, cx, cy + 1, 4, P.lock, 0);
    G.text(ctx, '第 ' + day + ' 天解锁', cx, cy + 34, { size: 16, col: P.cream });
  };

  /* 烤馍炉 */
  Art.grill = function (ctx, z, slots, now) {
    Art.panel(ctx, z, '烤 馍 炉');
    var c = Art.content(z), n = slots.length, gh = c.h - 16;
    G.box(ctx, c.x, c.y, c.w, gh, 12, P.steelDark, 4);
    G.box(ctx, c.x + 4, c.y + 4, c.w - 8, gh - 8, 10, P.steel, 3);

    var r = Math.min(24, c.w / n / 2 - 6);   // 灶眼数越多，单个越小
    var rr = r + 4, bs = r / 35;

    // 有馍在烤，铁板下缘就透出跳动的火光
    var hot = false;
    for (var h = 0; h < n; h++) if (slots[h].state === 'toasting') hot = true;
    if (hot) {
      ctx.globalAlpha = 0.30 + Math.sin(now * 14) * 0.13;
      for (var f = 0; f < 4; f++)
        G.circle(ctx, c.x + c.w * ((f + 0.5) / 4), c.y + gh - 3,
          7 + Math.sin(now * 11 + f * 2.1) * 4, P.orange, 0);
      ctx.globalAlpha = 1;
    }

    for (var i = 0; i < n; i++) {
      var s = slots[i];
      var cx = c.x + c.w * ((i + 0.5) / n), cy = c.y + gh / 2;
      G.circle(ctx, cx, cy, r, '#6E7C87', 3);
      G.circle(ctx, cx, cy, r * 0.73, '#5A6670', 0);

      if (s.state === 'empty') {
        G.text(ctx, '+', cx, cy, { size: r * 1.15, col: '#CFD8DE' }); continue;
      }
      if (s.state === 'dough') {                       // 面团 → 摊开
        G.drop(ctx, cx, cy + r * 0.5, r * 0.7, r * 0.2, 0.30);
        Art.dough(ctx, cx, cy, s.press, r);
        ctx.beginPath();
        ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * s.press);
        G.shape(ctx, null, 5, '#D9A05A');
        continue;
      }

      var ready = s.t >= (G.bunTiming ? G.bunTiming(s, 'good') : G.CFG.toastGood);
      var burnt = s.t >= (G.bunTiming ? G.bunTiming(s, 'burn') : G.CFG.toastBurn);
      var crispy = s.t >= (G.bunTiming ? G.bunTiming(s, 'crispy') :
        (G.CFG.toastCrispy || G.CFG.toastGood));
      if (ready && !burnt) {
        var readyCol = crispy ? P.orangeDk : P.green;
        ctx.save(); ctx.shadowColor = readyCol; ctx.shadowBlur = 12;
        G.circle(ctx, cx, cy, rr, null, 3 + Math.sin(now * 12) * 1.6, readyCol);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(cx, cy, rr, -Math.PI / 2,
        -Math.PI / 2 + Math.PI * 2 * G.clamp(s.t /
          (G.bunTiming ? G.bunTiming(s, 'burn') : G.CFG.toastBurn), 0, 1));
      G.shape(ctx, null, 5, burnt ? P.red : ready ? (crispy ? P.orangeDk : P.green) : '#9FB0BC');

      G.drop(ctx, cx, cy + r * 0.42, r * 0.78, r * 0.22, 0.34);
      Art.bun(ctx, cx, cy - 1, bs,
        G.clamp(s.t / (G.bunTiming ? G.bunTiming(s, 'good') : G.CFG.toastGood), 0, 1) *
        (s.style === 'crust' ? 1.14 : s.style === 'whole' ? 0.48 : 0.95), burnt);
      if (burnt) {
        for (var k = 0; k < 3; k++) {
          var pz = (now * 0.9 + k / 3) % 1;
          ctx.globalAlpha = (1 - pz) * 0.5;
          G.circle(ctx, cx + Math.sin(pz * 7 + k) * 8, cy - rr * 0.6 - pz * 32,
            4 + pz * 7, '#8E8E8E', 0);
        }
        ctx.globalAlpha = 1;
      } else if (crispy) {
        G.text(ctx, '酥脆', cx, cy - rr - 7,
          { size: 9, col: P.orangeDk, weight: 800 });
      }
    }
    Art.hint(ctx, z, '放面团 → 拍平 → 变绿取', P.inkSoft);
  };

  /* 夹馍位：一个馍 + 填充进度 */
  function bunSlot(ctx, d) {
    var x = d.slotC.x, y = d.slotC.y;
    if (!d.slot) {
      ctx.setLineDash([6, 5]);
      G.circle(ctx, x, y, 27, null, 3, P.steelDark);
      ctx.setLineDash([]);
      G.text(ctx, '放个馍', x, y, { size: 12, col: P.inkSoft });
      G.text(ctx, '点一下', x, y + 40, { size: 11, col: P.inkSoft });
      return;
    }
    var f = G.clamp(d.slot.meat / d.need, 0, 1), ready = d.slot.meat >= d.need;
    G.drop(ctx, x, y + 20, 28, 6, 0.32);
    if (ready) {
      ctx.save(); ctx.shadowColor = P.yellow; ctx.shadowBlur = 12;
      G.circle(ctx, x, y, 31, null, 4, P.orange); ctx.restore();
    }
    var bunCrisp = d.slot.bun === 'crispy';
    Art.bun(ctx, x, y, 0.86, bunCrisp ? 1 : 0.68, false);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x, y, 30, 24, 0, 0, Math.PI * 2); ctx.clip();
    var w = 26 * (0.3 + f * 0.7);
    ctx.beginPath(); ctx.moveTo(x - w, y + 1); ctx.lineTo(x + w, y + 1);
    G.shape(ctx, null, 5, '#8A5A2A');
    for (var i = 0; i < 4; i++) {
      if ((i + 0.5) / 4 > f + 0.12) break;
      G.circle(ctx, x - w + 6 + (w * 0.62) * i, y + (i % 2 ? 3 : 0), 4.6,
        i % 2 ? P.meat : P.meatDark, 2.2);
    }
    if (d.slot.pep >= d.pepNeed) {                 // 走接缝，和新的厚彩椒丁一个精细度
      ctx.save(); ctx.translate(x, y);
      Art.pepFill(ctx, 26, 0.78, 2.4);
      ctx.restore();
    }
    ctx.restore();
    G.bar(ctx, x - 25, y + 24, 50, 7, f, ready ? P.green : P.meat);
    G.text(ctx, bunCrisp ? '酥脆' : '软糯', x, y - 34,
      { size: 10, col: bunCrisp ? P.orangeDk : P.inkSoft, weight: 700 });
    G.text(ctx, ready ? '点一下夹好' : Math.round(d.slot.meat) + '/' + d.need + 'g',
      x, y + 40, { size: 11, col: ready ? '#1D8A3C' : P.inkSoft });
    var fatPct = Math.round(G.clamp((d.slot.fat || 0) /
      Math.max(1, d.slot.meat || d.need), 0, 1) * 100);
    G.text(ctx, fatPct + '%肥 · 油' + (d.slot.juice || 0) + '勺', x, y + 54,
      { size: 9, col: fatPct > 55 ? P.meatDark : P.inkSoft });
  }

  /* 通用「木案板 + 刀」，剁肉和切青椒共用 */
  function cuttingBoard(ctx, z) {
    var c = Art.content(z), bh = c.h - 4;
    G.box(ctx, c.x, c.y, c.w, bh, 10, P.wood, 4);
    ctx.strokeStyle = 'rgba(58,36,24,.22)'; ctx.lineWidth = 3;
    for (var i = 1; i * 34 < c.w - 12; i++) {
      ctx.beginPath();
      ctx.moveTo(c.x + i * 34, c.y + 5);
      ctx.lineTo(c.x + i * 34, c.y + bh - 5); ctx.stroke();
    }
    // 器材栏很窄，整组按宽度等比缩小，肉的局部坐标约定不变
    return { c: c, k: Math.min(1, (c.w - 6) / 172), cy: c.y + bh / 2 };
  }

  function knife(ctx, x, y, s, tilt) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
    G.box(ctx, -42, -2, 80, 40, 6, P.steel, 4);
    G.box(ctx, -42, 30, 80, 10, 4, '#EDF2F5', 3);
    G.box(ctx, 36, 5, 40, 15, 7, P.woodDark, 4);
    ctx.restore();
  }

  var SCATTER = Art.SCATTER = [];
  (function () {
    for (var i = 0; i < 8; i++)
      SCATTER.push([(i % 4) * 19 - 4 + (i > 3 ? 9 : 0), (i > 3 ? 15 : -5), (i * 37 % 22) - 11]);
  })();

  /* 案板剁肉 */
  Art.board = function (ctx, z, d, knifeY, now) {
    Art.panel(ctx, z, '案 板 · 剁 肉 夹 馍');
    var b = cuttingBoard(ctx, z);

    // 整块肉：随剩余量连续变小
    var sc = 0.42 + d.block * 0.58;
    G.drop(ctx, d.blk.x, d.blk.y + 24 * sc, 42 * sc, 9 * sc, 0.32);
    Art.meatBlock(ctx, d.blk.x, d.blk.y, sc);
    knife(ctx, d.blk.x + 6, d.blk.y - 46 + knifeY, 0.62, -0.18);

    // 剁出来的肉馅堆（连续量）
    ctx.save();
    ctx.translate(d.pileC.x, d.pileC.y); ctx.scale(0.68, 0.68);
    Art.mincePileC(ctx, 0, 0, d.pile);
    ctx.restore();
    G.text(ctx, Math.round(d.grams) + ' g', d.pileC.x, d.pileC.y + 32,
      { size: 11, col: d.full ? P.orangeDk : P.inkSoft });

    // 夹馍位
    bunSlot(ctx, d);

    Art.hint(ctx, z, d.full ? '肉馅盆满了' : '点一下按节奏剁 · 按住连剁 · 按住肉堆抓',
      d.full ? P.orangeDk : P.inkSoft);
  };

  /* 青椒板 */
  Art.pepperBoard = function (ctx, z, d, knifeY, now) {
    Art.panel(ctx, z, '彩 椒 板');
    var b = cuttingBoard(ctx, z);

    var sc = 0.45 + d.block * 0.55;
    Art.bellPepper(ctx, d.blk.x, d.blk.y + 2, sc * 0.8, d.pepCol);
    knife(ctx, d.blk.x + 4, d.blk.y - 40 + knifeY, 0.54, -0.14);

    ctx.save();
    ctx.translate(d.pileC.x, d.pileC.y); ctx.scale(0.5, 0.5);
    Art.pepPileC(ctx, 0, 0, d.pile);
    ctx.restore();
    G.text(ctx, Math.round(d.grams) + ' g', d.pileC.x, d.pileC.y + 26,
      { size: 11, col: d.full ? P.orangeDk : P.inkSoft });

    Art.hint(ctx, z, d.full ? '青椒够了' : '按住连切 · 按住抓',
      d.full ? P.orangeDk : P.inkSoft);
  };

  /* 冰峰冰柜 */
  Art.fridge = function (ctx, z, state, now) {
    Art.panel(ctx, z, '冰 峰');
    var c = Art.content(z);
    G.box(ctx, c.x, c.y, c.w, 42, 9, P.fridge, 4);
    G.box(ctx, c.x, c.y, c.w, 15, 9, P.fridgeDk, 4);
    G.text(ctx, '冰', c.x + c.w / 2, c.y + 8, { size: 11, col: P.cream });
    for (var i = 0; i < 3; i++)
      G.box(ctx, c.x + 8 + i * 22, c.y + 19, 15, 18, 4, P.ice, 3);

    var sx = c.x + c.w / 2, sy = c.y + 70;
    if (state === 'empty') {
      ctx.setLineDash([6, 5]);
      G.circle(ctx, sx, sy, 22, null, 3, P.steelDark);
      ctx.setLineDash([]);
      G.text(ctx, '取瓶', sx, sy, { size: 14, col: P.inkSoft });
      Art.hint(ctx, z, '点击取瓶', P.inkSoft);
    } else if (state === 'capped') {
      ctx.save(); ctx.shadowColor = P.yellow; ctx.shadowBlur = 12 + Math.sin(now * 10) * 5;
      G.circle(ctx, sx, sy, 22, P.orange, 4, P.orangeDk); ctx.restore();
      G.drop(ctx, sx, sy + 20, 13, 4, 0.32);
      Art.bingfeng(ctx, sx, sy + 2, 0.74, true, false);
      Art.hint(ctx, z, '再点开盖', P.orangeDk);
    } else {
      G.circle(ctx, sx, sy, 22, P.ice, 4, P.iceDk);
      G.drop(ctx, sx, sy + 20, 13, 4, 0.32);
      Art.bingfeng(ctx, sx, sy + 2, 0.74, false, true);
      Art.hint(ctx, z, '上桌中', '#1D8A3C');
    }
  };

  /* 凉皮台 */
  Art.noodleBar = function (ctx, z, st, now) {
    Art.panel(ctx, z, '凉 皮 台');
    var c = Art.content(z);
    // 凉皮盆
    G.box(ctx, c.x, c.y + 2, 46, 32, 8, '#E7EEF3', 4);
    G.box(ctx, c.x + 4, c.y + 7, 38, 12, 6, P.noodle, 3);
    G.box(ctx, c.x + 7, c.y + 16, 32, 10, 5, P.noodleDk, 3);
    G.text(ctx, '凉皮', c.x + 23, c.y + 28, { size: 11, col: P.inkSoft });
    // 调料瓶
    G.box(ctx, c.x + 54, c.y + 8, 22, 28, 7, P.chili, 4);
    G.box(ctx, c.x + 60, c.y + 1, 10, 9, 3, P.chiliOil, 3);
    G.text(ctx, '料', c.x + 65, c.y + 22, { size: 11, col: P.cream });

    var bx = c.x + 70, by = c.y + 56;
    var stage = st.state === 'empty' ? 0 : st.state === 'noodle' ? 1
              : st.state === 'seasoned' ? 2 : 3;

    if (st.state === 'seasoned') {
      var pr = G.clamp(st.mix / G.CFG.mixNeed, 0, 1);
      ctx.beginPath();
      ctx.arc(bx, by, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pr);
      G.shape(ctx, null, 5, P.chiliOil);
      ctx.save(); ctx.globalAlpha = 0.75;
      var a = now * 3.4;
      G.circle(ctx, bx + Math.cos(a) * 34, by + Math.sin(a) * 34, 5, P.yellow, 3);
      ctx.restore();
    } else if (st.state === 'done') {
      ctx.save(); ctx.shadowColor = P.green; ctx.shadowBlur = 10;
      G.circle(ctx, bx, by, 34, null, 4, P.green); ctx.restore();
    }

    G.drop(ctx, bx, by + 22, 27, 6, 0.34);
    Art.bowl(ctx, bx, by, 0.92, stage);

    if (st.state === 'seasoned' && st.mix > 0.2) {   // 红油跟着搅拌转起来
      ctx.save();
      ctx.beginPath(); ctx.ellipse(bx, by - 8, 22, 9, 0, 0, Math.PI * 2); ctx.clip();
      ctx.translate(bx, by - 8); ctx.rotate(st.mix * 1.1); ctx.translate(-bx, -(by - 8));
      G.box(ctx, bx - 15, by - 13, 12, 4, 2, P.chiliOil, 0);
      G.box(ctx, bx + 2,  by - 7,  13, 4, 2, P.chiliOil, 0);
      G.box(ctx, bx - 7,  by - 1,  11, 4, 2, P.pepperLt, 0);
      ctx.restore();
    }

    var hints = {
      empty:    ['点击抓凉皮', P.inkSoft],
      noodle:   ['点击加调料', P.orangeDk],
      seasoned: ['画圈搅拌', P.chili],
      done:     ['上桌中', '#1D8A3C']
    };
    Art.hint(ctx, z, hints[st.state][0], hints[st.state][1]);
    return { x: bx, y: by, r: 44 };
  };

  /* 夹馍台：两个按钮 */
  Art.make = function (ctx, z, btns, okA, okB, now) {
    Art.panel(ctx, z, '夹 馍 台');
    var defs = [
      { b: btns.a, ok: okA, type: 'rjm',  label: '肉夹馍 ¥8' },
      { b: btns.b, ok: okB, type: 'rjmp', label: '加青椒 ¥10' }
    ];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i], b = d.b;
      if (d.ok) {
        ctx.save(); ctx.shadowColor = P.yellow; ctx.shadowBlur = 9 + Math.sin(now * 9 + i) * 4;
        G.box(ctx, b.x, b.y, b.w, b.h, 11, P.orange, 4, P.orangeDk);
        ctx.restore();
      } else {
        G.box(ctx, b.x, b.y, b.w, b.h, 11, '#EFE2CB', 4, '#C9B79A');
      }
      ctx.globalAlpha = d.ok ? 1 : 0.42;
      Art.item(ctx, d.type, b.x + 24, b.y + b.h / 2, 0.52);
      ctx.globalAlpha = 1;
      G.text(ctx, d.label, b.x + 43, b.y + b.h / 2 + 1,
        { size: 12, align: 'left', col: d.ok ? P.cream : P.inkSoft });
    }
    Art.hint(ctx, z, '馍+肉馅(+青椒)', P.inkSoft);
  };

  /* 出餐口 */
  Art.tray = function (ctx, z, items, max) {
    ctx.fillStyle = P.shadow;
    G.rrect(ctx, z.x + 3, z.y + 6, z.w, z.h, 16); ctx.fill();
    G.box(ctx, z.x, z.y, z.w, z.h, 16, P.steel, 4);
    G.box(ctx, z.x + 8, z.y + 7, z.w - 16, z.h - 14, 11, '#E3EAEF', 3);
    // 不锈钢斜向反光
    ctx.save();
    G.rrect(ctx, z.x + 8, z.y + 7, z.w - 16, z.h - 14, 11); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.moveTo(z.x + 44, z.y + 7); ctx.lineTo(z.x + 84, z.y + 7);
    ctx.lineTo(z.x + 48, z.y + z.h - 7); ctx.lineTo(z.x + 8, z.y + z.h - 7);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    for (var i = 0; i < max; i++) {
      var cx = z.x + z.w * ((i + 0.5) / max), cy = z.y + z.h / 2;
      if (i < items.length) {
        G.drop(ctx, cx, cy + (max > 4 ? 15 : 18), max > 4 ? 19 : 23, 5, 0.30);
        Art.item(ctx, items[i], cx, cy, max > 4 ? 0.62 : 0.76);
      }
      else {
        ctx.setLineDash([6, 6]);
        G.circle(ctx, cx, cy, max > 4 ? 18 : 22, null, 3, P.steelDark);
        ctx.setLineDash([]);
      }
    }
    if (!items.length)
      G.text(ctx, '出餐口 · 做好的东西放这儿，点顾客递出', z.x + z.w / 2, z.y + z.h / 2,
        { size: 14, col: P.inkSoft, stroke: '#E3EAEF', strokeW: 7 });
  };

  /* 库存徽章 */
  Art.badge = function (ctx, x, y, kind, n, max) {
    var w = 62, h = 26;
    G.box(ctx, x - w / 2, y - h / 2, w, h, 13, n >= max ? P.yellow : P.cream, 3);
    if (kind === 'bun') Art.bun(ctx, x - 17, y, 0.42, 1, false);
    else if (kind === 'pep') {
      G.box(ctx, x - 23, y - 5, 10, 9, 3, P.pepper, 2);
      G.box(ctx, x - 15, y - 1, 10, 9, 3, P.pepperDk, 2);
    } else {
      G.box(ctx, x - 23, y - 5, 10, 9, 3, P.meat, 2);
      G.box(ctx, x - 15, y - 1, 10, 9, 3, P.meatDark, 2);
    }
    G.text(ctx, n + '/' + max, x + 13, y + 1, { size: 14, col: P.ink });
  };

  /* ============ HUD ============ */

  Art.coin = function (ctx, x, y, r) {
    G.circle(ctx, x, y, r, P.yellow, 4);
    G.circle(ctx, x, y, r * 0.62, '#FFE08A', 3);
    G.text(ctx, '¥', x, y + 1, { size: r * 1.1, col: '#B07800' });
  };

  /* 飞行中的小金币，比 Art.coin 便宜，粒子用 */
  Art.coinSmall = function (ctx, x, y, r) {
    G.circle(ctx, x, y, r, P.yellow, Math.max(1.4, r * 0.26));
    G.circle(ctx, x, y, r * 0.48, '#FFE08A', 0);
  };

  Art.heart = function (ctx, x, y, s, on) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.bezierCurveTo(-14, -2, -11, -14, 0, -7);
    ctx.bezierCurveTo(11, -14, 14, -2, 0, 9);
    ctx.closePath();
    G.shape(ctx, on ? P.red : '#D9C7AE', 4);
    ctx.restore();
  };

  /* 一天的时间轴：客流高峰段标成橙色，走过的部分压暗 */
  Art.dayBar = function (ctx, x, y, w, h, p, waves) {
    G.box(ctx, x, y, w, h, h / 2, '#EFE3CB', 3);
    ctx.save();
    G.rrect(ctx, x, y, w, h, h / 2); ctx.clip();
    var from = 0;
    for (var i = 0; i < waves.length; i++) {
      var seg = waves[i];
      if (seg.mul < 0.8) {
        ctx.fillStyle = seg.mul < 0.68 ? '#F09A55' : '#F6BE8C';
        ctx.fillRect(x + w * from, y, w * (seg.to - from), h);
      }
      from = seg.to;
    }
    ctx.fillStyle = 'rgba(58,36,24,.34)';
    ctx.fillRect(x, y, w * G.clamp(p, 0, 1), h);
    ctx.restore();
    G.rrect(ctx, x, y, w, h, h / 2); G.shape(ctx, null, 3);
    var mx = x + w * G.clamp(p, 0, 1);

    var cur = null;                                  // 当前落在哪一段
    for (var j = 0; j < waves.length; j++) if (p < waves[j].to) { cur = waves[j]; break; }
    if (cur && cur.mul < 0.8) {                      // 高峰中：游标加脉冲
      var nw2 = (G.S && G.S.anim) || 0;
      ctx.globalAlpha = 0.45 + Math.sin(nw2 * 9) * 0.3;
      G.circle(ctx, mx, y + h / 2, 8 + Math.sin(nw2 * 9) * 2.5, null, 3, P.orangeDk);
      ctx.globalAlpha = 1;
    }

    ctx.beginPath(); ctx.moveTo(mx, y - 3); ctx.lineTo(mx, y + h + 3);
    G.shape(ctx, null, 3, P.ink);
  };

  /* 经营中只给一条“下一步”视觉线索：轻轻呼吸的目标环 + 短标签。
     目标可能在工位、顶栏或顾客身上，全部采用同一套形状语言；source
     只给包纸这种跨工位动作画一条淡线，帮助玩家理解“纸要拖到哪”。 */
  Art.focusCue = function (ctx, cue, now) {
    if (!cue || !cue.target) return;
    var x = +cue.target.x, y = +cue.target.y;
    if (!isFinite(x) || !isFinite(y)) return;
    var col = cue.col || '#D2660A';
    var t = isFinite(+now) ? +now : 0;
    var pulse = 0.5 + 0.5 * Math.sin(t * 7.5);
    var rr = cue.kind === 'serve' ? 34 : cue.kind === 'paper' ? 30 : 27;

    ctx.save();
    ctx.globalAlpha = 0.18 + pulse * 0.12;
    ctx.setLineDash([7, 5]);
    ctx.beginPath(); ctx.arc(x, y, rr + 7 + pulse * 3, 0, Math.PI * 2);
    G.shape(ctx, null, 5, col);
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.72 + pulse * 0.22;
    ctx.beginPath(); ctx.arc(x, y, rr + 2 + pulse * 1.5, 0, Math.PI * 2);
    G.shape(ctx, null, 2.5, col);
    ctx.restore();

    if (cue.kind === 'paper' && cue.source && isFinite(+cue.source.x) && isFinite(+cue.source.y)) {
      var sx = +cue.source.x, sy = +cue.source.y;
      ctx.save(); ctx.globalAlpha = 0.30 + pulse * 0.10;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(x, y);
      G.shape(ctx, null, 2.2, col);
      ctx.setLineDash([]);
      var a = Math.atan2(y - sy, x - sx);
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a - 0.45) * 10, y - Math.sin(a - 0.45) * 10);
      ctx.lineTo(x - Math.cos(a + 0.45) * 10, y - Math.sin(a + 0.45) * 10);
      ctx.closePath(); G.shape(ctx, col, 0);
      ctx.restore();
    }

    var label = String(cue.label || '下一步');
    var w = G.clamp(label.length * 11 + 24, 88, 196);
    var by = y - rr - 32;
    /* 顶栏按钮的提示放到按钮下方；其余目标默认放上方，避免遮住工位内容。 */
    if (by < 50) by = y + rr + 9;
    var bx = G.clamp(x - w / 2, 6, G.W - w - 6);
    ctx.save();
    ctx.globalAlpha = 0.90;
    G.box(ctx, bx + 2, by + 2, w, 22, 8, 'rgba(58,36,24,.16)', 0);
    G.box(ctx, bx, by, w, 22, 8, 'rgba(255,248,236,.96)', 2, col);
    G.text(ctx, label, bx + w / 2, by + 12,
      { size: 11, col: cue.urgent ? P.red : P.meatDark, weight: 900 });
    ctx.restore();
  };

  Art.hud = function (ctx, s) {
    G.box(ctx, 8, 4, G.W - 16, 42, 13, 'rgba(255,248,236,.95)', 4);
    var pu = (G.FX && G.FX.coinPulse) ? G.FX.coinPulse() : 0;
    var mn = (G.FX && G.FX.money)     ? G.FX.money()     : s.money;
    Art.coin(ctx, 34, 25, 13 + pu * 3);
    G.text(ctx, '' + mn, 52, 26, { size: 22 + pu * 2.5, align: 'left', col: P.ink });

    /* 前二十天不是隐藏的数值补丁：给玩家一个轻量的“练习期 / 换挡期 /
       熟练期”标记，让保护线能被理解成教学节奏。 */
    var practice = G.practiceForDay ? G.practiceForDay(s.day) : null;
    var waitingPlus = Number(G.CFG && G.CFG.waitingBonus) || 0;
    var practiceOn = practice && (practice.interval > 0 || practice.lastChance > 0);
    if (practiceOn || waitingPlus > 0) {
      G.box(ctx, 88, 11, 54, 22, 9, '#DDEBD5', 2, '#6B9861');
      var stageLabel = practiceOn
        ? (s.day >= 17 && s.day <= 20 ? '熟练期'
          : s.day >= 14 && s.day <= 16 ? '换挡期' : '练习期')
        : '等待';
      /* 等待加成是给玩家读单的真实空间，不该只藏在数值里。沿用原来的
         54px 胶囊，把“阶段 + 秒数”压成短标签；第 8~20 天也保留它，
         让玩家知道换挡仍有呼吸，而不是误以为自己突然变慢了；正式经营期
         继续显示“等待 +2s”，把全局缓冲也明确交代出来。 */
      if (waitingPlus > 0) {
        var stageShort = stageLabel.replace('期', '');
        stageLabel = stageShort + '+' + Math.round(waitingPlus) + 's';
      }
      G.text(ctx, stageLabel, 115, 22, { size: 10, col: '#357A38', weight: 900 });
    }

    /* 两个常用的状态 / 快捷键放进顶栏，避免把案板再切碎成更小的触控区。 */
    var pref = G.PREF || { x: 148, y: 4, w: 112, h: 42 };
    var sauce = G.SAUCE || { x: 268, y: 4, w: 116, h: 42 };
    var bunStyle = G.BUNSTYLE || { x: 650, y: 4, w: 118, h: 42 };
    var weatherBox = G.WEATHERHUD || { x: 778, y: 4, w: 142, h: 42 };
    var styles = G.CUT_STYLES || [{ short: '均匀' }];
    var si = s.chopStyle >= 0 && s.chopStyle < styles.length ? s.chopStyle : 0;
    G.box(ctx, pref.x, pref.y + 3, pref.w, pref.h - 6, 10,
      si === 1 ? '#F6D59B' : si === 2 ? '#DCE8D2' : '#E8D9BF', 2, P.woodDark);
    G.text(ctx, '刀法 ' + (styles[si].short || '均匀'), pref.x + pref.w / 2, 26,
      { size: 13, col: P.meatDark, weight: 700 });
    G.box(ctx, sauce.x, sauce.y + 3, sauce.w, sauce.h - 6, 10,
      (s.sauceStock || 0) <= 1 ? '#F7D1C4' : '#F2E0B4', 2,
      (s.sauceStock || 0) <= 1 ? P.red : P.woodDark);
    G.text(ctx, '辣椒油 ' + (s.sauceStock || 0), sauce.x + sauce.w / 2, 26,
      { size: 13, col: (s.sauceStock || 0) <= 1 ? P.red : P.meatDark, weight: 700 });
    var refill = G.Events && G.Events.refillState ? G.Events.refillState() : null;
    if (refill) {
      G.box(ctx, sauce.x, sauce.y + 3, sauce.w, sauce.h - 6, 10, '#FFF0B4', 3, P.red);
      G.bar(ctx, sauce.x + 9, sauce.y + 27, sauce.w - 18, 7,
        refill.fix / Math.max(1, refill.need), P.orangeDk);
      G.text(ctx, '点我补货 ' + refill.fix + '/' + refill.need,
        sauce.x + sauce.w / 2, sauce.y + 16, { size: 12, col: P.red, weight: 800 });
    }
    var buns = G.BUN_STYLES || [{ short: '白吉' }];
    var bi = s.bunStyle >= 0 && s.bunStyle < buns.length ? s.bunStyle : 0;
    G.box(ctx, bunStyle.x, bunStyle.y + 3, bunStyle.w, bunStyle.h - 6, 10,
      bi === 1 ? '#F8D5B7' : bi === 2 ? '#DCE3C8' : '#E8D9BF', 2, P.woodDark);
    G.text(ctx, '馍胚 ' + (buns[bi].short || '白吉'),
      bunStyle.x + bunStyle.w / 2, 26, { size: 13, col: P.meatDark, weight: 700 });
    var ww = s.weather || null, ss = s.scene || null;
    G.box(ctx, weatherBox.x, weatherBox.y + 3, weatherBox.w, weatherBox.h - 6, 10,
      ww && ww.id === 'heat' ? '#F6D2C0' : ww && ww.id !== 'clear' ? '#D9E5F0' : '#F2E0B4',
      2, ww && ww.col ? ww.col : P.woodDark);
    G.text(ctx, (ss ? ss.short + ' · ' : '') + (ww ? ww.name : '晴天'),
      weatherBox.x + weatherBox.w / 2, 26,
      { size: 12, col: ww && ww.col ? ww.col : P.meatDark, weight: 700 });
    if (s.hype > 0)
      G.text(ctx, '流量 +' + s.hype, 398, 26,
        { size: 12, align: 'right', col: '#D34C83', weight: 800 });

    var ch = s.chapter, st = G.Story;
    var chapterStatus = ch && st && st.status ? st.status(ch) : null;
    G.text(ctx, '第 ' + s.day + ' 天' + (chapterStatus ? ' · 剧情 ' + chapterStatus : ''),
      G.W / 2, 13, { size: chapterStatus ? 10 : 12, col: P.inkSoft });
    var p = 1 - G.clamp(s.timeLeft / G.CFG.dayLength, 0, 1);
    Art.dayBar(ctx, G.W / 2 - 68, 23, 136, 13, p, G.WAVE);

    if (s.combo >= 2) {                            // 手稳连击
      var guardReady = s.day >= 4 && s.day <= 7 && !s.comboGuardUsed;
      var cw = guardReady ? 142 : 96;
      G.box(ctx, G.W / 2 - cw / 2, 50, cw, 24, 12, P.yellow, 3);
      G.text(ctx, guardReady ? '手稳 ×' + s.combo + ' · 护栏可用' : '手稳 ×' + s.combo,
        G.W / 2, 62, { size: guardReady ? 11 : 14, col: P.meatDark });
    }

    /* 前期候场票用完前，门口客人会短暂等一会再决定离开。
       这不是额外座位，而是一段「先救谁」的可见窗口；把剩余秒数和
       进度条钉在 HUD 里，玩家不用只靠中间一闪而过的提示来猜。 */
    /* 手稳连击卡片本身占用 y=50..74；后面的回流 / 顺风 / 事件卡片从
       80 开始排，避免玩家刚刚打出连击时，绿色正反馈被下一张卡盖住。 */
    var hudY = s.combo >= 2 ? 80 : 50;
    var qht = Number(s.queueHoldT);
    if (isFinite(qht) && qht > 0) {
      qht = G.clamp(qht, 0, 3.2);
      var qw = 312, qx = G.W - 320, qy = hudY;
      G.box(ctx, qx, qy, qw, 32, 12, '#FFF0B4', 3, P.orangeDk);
      G.text(ctx, '回流客 · 先腾一个位', qx + 12, qy + 9,
        { size: 12, align: 'left', col: P.meatDark, weight: 900 });
      G.bar(ctx, qx + 164, qy + 5, 105, 8, qht / 3.2, P.orangeDk);
      G.text(ctx, qht.toFixed(1) + 's', qx + qw - 10, qy + 9,
        { size: 11, align: 'right', col: P.orangeDk, weight: 900 });
      G.text(ctx, '腾位后会接住', qx + 12, qy + 22,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }
    var qt = Number(s.queueGrace);
    if (!(qht > 0) && isFinite(qt) && qt > 0) {
      var tw = 312, tx = G.W - 320, ty = hudY;
      G.box(ctx, tx, ty, tw, 32, 12, '#E2EEF1', 3, '#357A9B');
      G.text(ctx, '取号券 ×' + Math.round(qt), tx + 12, ty + 10,
        { size: 12, align: 'left', col: '#245C73', weight: 900 });
      G.text(ctx, '满位时让下一位客人再等一会', tx + 12, ty + 23,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }

    var qrt = Number(s.queueRecoveryT);
    if (isFinite(qrt) && qrt > 0) {
      qrt = G.clamp(qrt, 0, Math.max(0.1, Number(s.queueRecoveryMax) || 1));
      var qrw = 312, qrx = G.W - 320, qry = hudY;
      var qrm = Math.max(0.1, Number(s.queueRecoveryMax) || 1);
      G.box(ctx, qrx, qry, qrw, 32, 12, '#DDEBD5', 3, '#357A38');
      G.text(ctx, '整队缓冲 · 先清队首', qrx + 12, qry + 10,
        { size: 12, align: 'left', col: '#285F2D', weight: 900 });
      G.bar(ctx, qrx + 164, qry + 7, 105, 8,
        G.clamp(qrt / qrm, 0, 1), '#357A38');
      G.text(ctx, qrt.toFixed(1) + 's', qrx + qrw - 10, qry + 11,
        { size: 11, align: 'right', col: '#357A38', weight: 900 });
      G.text(ctx, '只推迟下一次满位判定 · 不增加座位', qrx + 12, qry + 23,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }

    var fht = Number(s.flowT);
    if (isFinite(fht) && fht > 0) {
      fht = G.clamp(fht, 0, 2.4);
      var fw = 312, fx = G.W - 320, fy = hudY;
      G.box(ctx, fx, fy, fw, 32, 12, '#DDEBD5', 3, '#357A38');
      G.text(ctx, '三单顺风 · 客人慢一点', fx + 12, fy + 10,
        { size: 12, align: 'left', col: '#285F2D', weight: 900 });
      G.bar(ctx, fx + 164, fy + 7, 105, 8, fht / 2.4, '#357A38');
      G.text(ctx, fht.toFixed(1) + 's', fx + fw - 10, fy + 11,
        { size: 11, align: 'right', col: '#357A38', weight: 900 });
      G.text(ctx, '连续出餐的奖励窗口', fx + 12, fy + 23,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }

    var bht = Number(s.serveBufferT);
    if (isFinite(bht) && bht > 0) {
      var bw = 312, bx = G.W - 320, by = hudY;
      var bmax = Math.max(0.1, Number(s.serveBufferMax) || 1);
      G.box(ctx, bx, by, bw, 32, 12, '#D9ECF1', 3, '#357A9B');
      G.text(ctx, '出餐腾位 · 下一位有缓冲', bx + 12, by + 10,
        { size: 12, align: 'left', col: '#245C73', weight: 900 });
      G.bar(ctx, bx + 164, by + 7, 105, 8,
        G.clamp(bht / bmax, 0, 1), '#357A9B');
      G.text(ctx, bht.toFixed(1) + 's', bx + bw - 10, by + 11,
        { size: 11, align: 'right', col: '#357A9B', weight: 900 });
      G.text(ctx, '满位出餐后的安全拍', bx + 12, by + 23,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }

    var eht = Number(s.eventCalmT);
    var cht = Number(s.comebackT);
    var mht = Number(s.mistakeRecoveryT);
    var eventActive = isFinite(eht) && eht > 0;
    var comebackActive = isFinite(cht) && cht > 0;
    var mistakeActive = isFinite(mht) && mht > 0;
    if (eventActive) {
      eht = G.clamp(eht, 0, Math.max(0.1, Number(s.eventCalmMax) || 2));
      var ew = 312, ex = G.W - 320, ey = hudY;
      var emax = Math.max(0.1, Number(s.eventCalmMax) || 1);
      var eventTitle = mistakeActive
        ? (comebackActive ? '稳住一口气 · 事件 + 重整 + 复盘' : '事件处理后 · 稳住 + 复盘')
        : (comebackActive ? '稳住一口气 · 事件 + 重整' : '事件处理后 · 稳住一口气');
      var eventSub = mistakeActive ? '三种回气叠加 · 仍不会停表'
        : (comebackActive ? '两种回气叠加 · 仍不会停表' : '顾客耐心消耗暂时变慢');
      G.box(ctx, ex, ey, ew, 32, 12, '#DDEBD5', 3, '#357A38');
      G.text(ctx, eventTitle, ex + 12, ey + 10,
        { size: 12, align: 'left', col: '#285F2D', weight: 900 });
      G.bar(ctx, ex + 164, ey + 7, 105, 8,
        G.clamp(eht / emax, 0, 1), '#357A38');
      G.text(ctx, eht.toFixed(1) + 's', ex + ew - 10, ey + 11,
        { size: 11, align: 'right', col: '#357A38', weight: 900 });
      G.text(ctx, eventSub, ex + 12, ey + 23,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }

    /* 事件回气和低谷回气同时存在时合并成一张说明卡：两种倍率仍在
       game.js 中独立计算，这里只减少重复视觉元素，避免玩家把“稳住”
       误读成两项新的待办。事件结束后，重新组织卡会自然露出来；复盘
       缓冲同样并入这张卡，避免失误后 HUD 突然堆出三张恢复提示。 */
    if (comebackActive && !eventActive) {
      cht = G.clamp(cht, 0, Math.max(0.1, Number(s.comebackMax) || 2));
      var cw2 = 312, cx2 = G.W - 320, cy2 = hudY;
      var cmax2 = Math.max(0.1, Number(s.comebackMax) || 1);
      G.box(ctx, cx2, cy2, cw2, 32, 12, '#E2EEF1', 3, '#357A9B');
      G.text(ctx, mistakeActive ? '重新组织 · 复盘缓冲' : '重新组织 · 下一单还能救', cx2 + 12, cy2 + 10,
        { size: 12, align: 'left', col: '#245C73', weight: 900 });
      G.bar(ctx, cx2 + 164, cy2 + 7, 105, 8,
        G.clamp(cht / cmax2, 0, 1), '#357A9B');
      G.text(ctx, cht.toFixed(1) + 's', cx2 + cw2 - 10, cy2 + 11,
        { size: 11, align: 'right', col: '#357A9B', weight: 900 });
      G.text(ctx, mistakeActive ? '跑单与误操作后的有限回气 · 不停表'
        : '第一次跑单后的有限回气 · 不加座位', cx2 + 12, cy2 + 23,
        { size: 9, align: 'left', col: P.inkSoft, weight: 700 });
      hudY += 36;
    }

    /* 没有其他回气卡时，单独显示复盘缓冲的剩余时间。它是一次性、
       短时的失误保护，文案明确“仍在走表”，避免玩家误以为暂停。 */
    if (mistakeActive && !eventActive && !comebackActive) {
