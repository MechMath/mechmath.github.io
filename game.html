    // 已经有人在说话就闭嘴 —— 三个气泡一起冒出来就成噪音了
    var talking = false;
    for (var tk = 0; tk < G.SLOT.length; tk++)
      if (S.cust[tk] && S.cust[tk] !== c && S.cust[tk].sayT > 0) talking = true;
    var hello = (!talking && !special && G.Regulars && G.Regulars.hello) ? G.Regulars.hello(c) : null;
    if (special) saySome(c, special === 'blogger' ? '超大份！我要拍视频'
      : special === 'picky' ? '馍得酥，肉得烂'
      : special === 'driver' ? '赶高铁，越快越好！'
      : special === 'foodie' ? '我只看肥瘦和火候'
      : '卫生要过关啊');
    else if (hello) saySome(c, hello);
    else if (!talking && Math.random() < 0.45)
      saySome(c, G.pick(SAY.arrive[type] || SAY.arrive.normal));
    G.Snd.arrive();
    return true;
  }

  /* 出餐口里是否有这位顾客还要的东西 */
  function servable(c) {
    if (!c || c.state !== 'wait') return false;
    for (var o = 0; o < c.items.length; o++) {
      var it = c.items[o]; if (it.done) continue;
      if (it.type === 'bf') { if (S.drinks > 0) return true; continue; }
      for (var t = 0; t < S.tray.length; t++)
        if (S.tray[t].type === it.type && S.tray[t].wrapT >= 1 &&
            (!it.giant || (S.tray[t].meat || 0) >= (G.CFG.giantNeed || 170)) &&
            G.qualityMatch(it, S.tray[t]).ok) return true;
    }
    return false;
  }

  /* ---------- 下一步观察器 ----------
     多工位真正难的地方不是“不会点”，而是同时有三件事能点时不知道先点
     哪件。这个观察器只读当前台面，给一个可执行的单步建议：对口成品先
     递、已有成品先包纸、正在夹的先补肉/椒/卤汁，其余才回到烤炉和备料。
     它不替玩家做决定，也不改任何数值；教程或新工位首遇提示存在时让位，
     保持屏幕一次只说一件事。 */
  function focusBlocked(key) {
    return !!(G.Events && G.Events.active && G.Events.active(key));
  }

  function focusCue(kind, point, label, k, ratio, key, source, col) {
    if (!point || !isFinite(+point.x) || !isFinite(+point.y)) return null;
    if (key && focusBlocked(key)) return null;
    return { kind: kind, target: { x: +point.x, y: +point.y }, label: label,
      customer: k, ratio: ratio, urgent: ratio < 0.34, key: key || null,
      source: source || null, col: col || (kind === 'serve' ? '#357A38' : '#D2660A') };
  }

  function focusRatio(c) {
    return G.clamp((+c.patience || 0) / Math.max(1, +c.pmax || 1), 0, 1);
  }

  function focusMainItem(c) {
    var fallback = null;
    for (var i = 0; i < (c.items || []).length; i++) {
      var it = c.items[i];
      if (!it || it.done) continue;
      if (it.type === 'rjm' || it.type === 'rjmp') return it;
      if (!fallback) fallback = it;
    }
    return fallback;
  }

  function focusPaper(c, k, ratio) {
    for (var ti = 0; ti < S.tray.length; ti++) {
      var made = S.tray[ti];
      if (!made || made.wrapT >= 1) continue;
      for (var qi = 0; qi < (c.items || []).length; qi++) {
        var need = c.items[qi];
        if (!need || need.done || need.type !== made.type) continue;
        var enough = made.type === 'lp' || !G.qualityMatch || G.qualityMatch(need, made).ok;
        var hefty = (made.meat || 0) >= G.CFG.bigNeed;
        var giant = (made.meat || 0) >= (G.CFG.giantNeed || 170);
        if (need.big && !hefty) enough = false;
        if (need.giant && !giant) enough = false;
        if (!enough) continue;
        return focusCue('paper', G.PAPER, '拿纸包这份 · ' + (k + 1) + '号', k,
          ratio, 'paper', G.traySlot(ti), '#D2660A');
      }
    }
    return null;
  }

  /* 同菜但还差一项口味的成品也有“保单”价值：最后一轮递餐会收下它，
     只是小费按命中比例降低。把这条退路明确说出来，玩家能在排队压力
     下主动选择“先保住订单”还是继续追求满分，而不是把一次偏肥/偏干
     误判成只能整份重做。大份与大胃王的硬性肉量仍不能用近似出餐绕过。 */
  function focusApprox(c, k, ratio) {
    for (var ti = 0; ti < S.tray.length; ti++) {
      var made = S.tray[ti];
      if (!made || made.wrapT < 1 || !G.qualityMatch) continue;
      for (var qi = 0; qi < (c.items || []).length; qi++) {
        var need = c.items[qi];
        if (!need || need.done || need.type !== made.type ||
            (made.type !== 'rjm' && made.type !== 'rjmp')) continue;
        var hefty = (made.meat || 0) >= G.CFG.bigNeed;
        var giant = (made.meat || 0) >= (G.CFG.giantNeed || 170);
        if (need.big && !hefty) continue;
        if (need.giant && !giant) continue;
        var qm = G.qualityMatch(need, made);
        if (qm.total <= 0 || qm.ok) continue;
        return focusCue('serveNear', { x: G.SLOT[k].cx, y: 205 },
          '可先递 · 口味命中 ' + Math.round(qm.score * 100) + '%', k, ratio,
          'customer', G.traySlot(ti), '#B07800');
      }
    }
    return null;
  }

  function focusMain(c, k, ratio, need) {
    if (!need) return null;
    var goal = need.giant ? (G.CFG.giantNeed || 170)
      : need.big ? G.CFG.bigNeed : G.CFG.bunNeed;

    if (S.slot) {
      if (S.slot.meat < goal - 0.5) {
        var meatPoint = S.mince > 0 ? G.PILE : G.BLK;
        return focusCue('meat', meatPoint, S.mince > 0 ? '补肉到 ' + goal + 'g' : '先剁一把肉',
          k, ratio, 'board', null, '#8E2B22');
      }
      if (need.type === 'rjmp' && S.slot.pep < G.CFG.bunPep - 0.5) {
        var pepPoint = S.pep > 0 ? G.PPILE : G.PBLK;
        return focusCue('pepper', pepPoint, S.pep > 0 ? '补青椒 · ' + (k + 1) + '号' : '先切一根青椒',
          k, ratio, 'pepper', null, '#357A38');
      }
      if (need.juiceNeed && S.slot.juice < (need.sauceNeed || 1)) {
        var sauce = G.SAUCE;
        return focusCue('sauce', { x: sauce.x + sauce.w / 2, y: sauce.y + sauce.h / 2 },
          '加卤汁 ' + (S.slot.juice || 0) + '/' + (need.sauceNeed || 1),
          k, ratio, 'board', null, '#D2660A');
      }
      return focusCue('make', G.BSLOT, '点一下夹好 · ' + (k + 1) + '号', k,
        ratio, 'board', null, '#357A38');
    }

    if (S.bun > 0)
      return focusCue('slot', G.BSLOT, '放热馍 · ' + (k + 1) + '号', k, ratio, 'board');

    /* 烤炉是当前瓶颈时，优先给出“现在能点”的灶眼；都在慢慢烤就不
       画一个假动作，玩家只需等火候，避免提示反而制造焦虑。 */
    for (var gi = 0; gi < S.grill.length; gi++) {
      var g = S.grill[gi];
      if (g.state === 'toasting' && g.t >= G.bunTiming(g, 'good'))
        return focusCue('grill', grillSpot(gi), '取热馍', k, ratio, 'grill');
      if (g.state === 'dough' && !g.pressing)
        return focusCue('grill', grillSpot(gi), '拍平馍胚', k, ratio, 'grill');
    }
    for (var ei = 0; ei < S.grill.length; ei++) {
      if (S.grill[ei].state === 'empty')
        return focusCue('grill', grillSpot(ei), '放面团 · 先备一只', k, ratio, 'grill');
    }
    if (S.mince <= 0)
      return focusCue('meat', G.BLK, '先剁一把肉', k, ratio, 'board', null, '#8E2B22');
    return null;
  }

  /* 没有顾客排队时也不让玩家掉出节奏：把“闲时备料”拆成一条可选的
     下一步，优先收走已经到火候的馍，再处理夹馍位、纸站和空灶眼。
     它不创造订单、不自动消耗材料；只是把等待客人出现的空白，变成
     玩家可以主动准备的一口。顾客一出现，下面的顾客优先级会立即接管。 */
  function focusIdle() {
    if (!G.S || G.S.timeLeft <= 0) return null;
    /* 有事件在场但尚未进入临界段时，宁可留出观察空间，也不把“闲时
       备料”叠到移动靶上；等事件结束后下一帧再恢复备料提示。 */
    if (G.Events && G.Events.haz && G.Events.haz.length) return null;
    var ratio = 1;
    if (S.bun > 0 && !S.slot && S.tray.length < G.CFG.maxTray)
      return focusCue('slot', G.BSLOT, '闲时备料 · 放一只热馍', -1, ratio, 'board', null, '#357A38');
    for (var gi = 0; gi < S.grill.length; gi++) {
      var g = S.grill[gi];
      if (g.state === 'toasting' && g.t >= G.bunTiming(g, 'good'))
        return focusCue('grill', grillSpot(gi), '闲时取热馍 · 先备一只', -1, ratio, 'grill');
    }
    for (var pi = 0; pi < S.tray.length; pi++) {
      if (S.tray[pi] && S.tray[pi].wrapT < 1)
        return focusCue('paper', G.PAPER, '闲时先包好备用', -1, ratio, 'paper', G.traySlot(pi), '#D2660A');
    }
    for (var di = 0; di < S.grill.length; di++) {
      if (S.grill[di].state === 'dough' && !S.grill[di].pressing)
        return focusCue('grill', grillSpot(di), '闲时拍平馍胚', -1, ratio, 'grill');
    }
    for (var ei = 0; ei < S.grill.length; ei++) {
      if (S.grill[ei].state === 'empty')
        return focusCue('grill', grillSpot(ei), '闲时备一只馍 · 放面团', -1, ratio, 'grill');
    }
    if (S.mince <= 0)
      return focusCue('meat', G.BLK, '闲时剁肉备料', -1, ratio, 'board', null, '#8E2B22');
    return null;
  }

  /* 对外暴露给渲染层和自检：返回 null 或一条稳定的当前优先级。 */
  G.focusForPlayer = function () {
    if (S.mode !== 'play' || (S.tut !== null && S.tut !== undefined) || S.uTip ||
        (S.hand && S.hand.amt > 0)) return null;
    /* 突发事件进入临界段时先让事件层说话；它自己的倒计时 / 目标比
       普通顾客制作建议更不可逆。事件不紧急时返回 null，下面仍按顾客
       → 成品 → 工位的顺序给建议。 */
    if (G.Events && G.Events.focusForPlayer) {
      var eventFocus = G.Events.focusForPlayer();
      if (eventFocus) return eventFocus;
    }
    /* 庆祝反馈只让普通导航暂时让位；事件是不可逆的临界问题，必须继续
       抢在“刚做对了”之后出现，不能因为浮字停留就延迟救火。 */
    if ((+S.focusQuietT || 0) > 0) return null;
    var best = -1, bestScore = 99;
    for (var k = 0; k < G.SLOT.length; k++) {
      var c = S.cust[k];
      if (!c || c.state !== 'wait' || !c.items) continue;
      var ratio = focusRatio(c), score = ratio;
      if (servable(c)) score -= 1.20;  // 已经能递出的永远排在制作建议前
      if (c.urgent) score -= 0.18;
      if (score < bestScore) { best = k; bestScore = score; }
    }
    if (best < 0) return focusIdle();
    var customer = S.cust[best], r = focusRatio(customer);
    /* 先锁定真正能完成交付的目标。托盘里可能同时有一份“差一项”的
       近似馍和一份精准命中的馍；如果先扫近似品，提示会把玩家从确定的
       正反馈带到次优分支。精准出餐永远是这一帧最值得做的动作。 */
    var readyNow = servable(customer);
    if (readyNow)
      return focusCue('serve', { x: G.SLOT[best].cx, y: 205 },
        '优先递给 ' + (best + 1) + '号', best, r, 'customer', null, '#357A38');
    /* 已有一份完全对口、只是还没包纸的成品时，包纸是确定的满分路径；
       不能让另一份“差一点但能保底”的成品抢走注意力。 */
    var paper = focusPaper(customer, best, r);
    if (paper) return paper;
    var approximate = focusApprox(customer, best, r);
    if (approximate) return approximate;
    if (!readyNow && r > 0.72 && !customer.urgent) {
      /* 门口快满时给一次“预告”，但只在下一位快要进场的短窗口出现。
         它指向当前最值得先处理的人，不送耐心、不延后计时，只把“再不
         腾位就会流失”提前说清楚；没有临近来客时保持安静，避免常驻焦虑。 */
      var queueFull = true;
      for (var qi = 0; qi < G.SLOT.length; qi++) {
        if (!S.cust[qi] || S.cust[qi].state !== 'wait') {
          queueFull = false; break;
        }
      }
      var nextIn = Number(S.spawnT);
      if (queueFull && isFinite(nextIn) && nextIn <= 1.2 &&
          !(S.queueHoldT > 0 || S.serveBufferT > 0 || S.queueRecoveryT > 0))
        return focusCue('queue', { x: G.SLOT[best].cx, y: 205 },
          '门口快满 · 先处理 ' + (best + 1) + '号', best, r,
          'customer', null, '#B07800');
      return null;
    }
    var need = focusMainItem(customer);
    if (!need) return null;
    if (need.type === 'bf') {
      if (S.drinks <= 0)
        return focusCue('fridge', { x: G.ZONE.fridge.x + G.ZONE.fridge.w / 2,
          y: G.ZONE.fridge.y + G.ZONE.fridge.h / 2 }, '冰峰：取瓶 → 开盖', best, r, 'fridge');
      return null;
    }
    if (need.type === 'lp') {
      if (S.noodle.state !== 'done') {
        var noodleLabel = S.noodle.state === 'seasoned' ? '绕圈拌凉皮' :
          S.noodle.state === 'noodle' ? '加调料到凉皮' : '先做一碗凉皮';
        return focusCue('noodle', G.BOWL, noodleLabel, best, r, 'noodle');
      }
      return null;
    }
    return focusMain(customer, best, r, need);
  };

  /* ---------- 每帧更新 ---------- */
  G.update = function (dt) {
    S.anim += dt;
    /* 街头环境声底：让耳朵和 art-ambient 的光走同一条曲线。
       只有 play 模式才更新进度 —— 菜单和商店里街还在，环境声停在上一个时段。
       tick 内部自带 100ms 节流，每帧调也只干 10 次/秒的活。 */
    G.Snd.tick(S.mode === 'play' ?
      G.clamp(1 - S.timeLeft / G.CFG.dayLength, 0, 1) : undefined, dt);
    if (G.FX && G.FX.update) G.FX.update(dt);

    var i, k;
    for (i = S.floats.length - 1; i >= 0; i--) {
      var f = S.floats[i]; f.life += dt; f.y -= 42 * dt;
      if (f.life > f.ttl) S.floats.splice(i, 1);
    }
    for (i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i]; p.life += dt;
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life > p.ttl) S.parts.splice(i, 1);
    }
    for (i = S.flies.length - 1; i >= 0; i--) {
      S.flies[i].t += dt;
      if (S.flies[i].t > S.flies[i].dur) S.flies.splice(i, 1);
    }
    S.cleaverY += (0 - S.cleaverY) * Math.min(1, dt * 15);
    S.pknifeY  += (0 - S.pknifeY)  * Math.min(1, dt * 15);

    if (S.mode === 'shop') { if (G.Shop && G.Shop.update) G.Shop.update(dt); return; }
    if (S.mode === 'night') { if (G.Night && G.Night.update) G.Night.update(dt); return; }
    if (S.mode === 'bunmini') { if (G.BunMini && G.BunMini.update) G.BunMini.update(dt); return; }
    if (S.mode === 'goals') { if (G.Goals && G.Goals.update) G.Goals.update(dt); return; }
    if (S.mode !== 'play') return;

    S.timeLeft = Math.max(0, S.timeLeft - dt);
    if (S.rhythmBoostT > 0)
      S.rhythmBoostT = Math.max(0, S.rhythmBoostT - dt);
    if (S.gestureHintT > 0) {
      S.gestureHintT = Math.max(0, S.gestureHintT - dt);
      if (S.gestureHintT <= 0) S.gestureHint = null;
    }
    if (S.softHintT > 0) {
      S.softHintT = Math.max(0, S.softHintT - dt);
      if (S.softHintT <= 0) S.softHintKey = '';
    }
    if (S.focusQuietT > 0)
      S.focusQuietT = Math.max(0, S.focusQuietT - dt);

    if (S.timeLeft > 0) {
      autoChop(dt);
      var prog = 1 - S.timeLeft / G.CFG.dayLength;
      var wv = waveAt(prog), wi = G.WAVE.indexOf(wv);
      if (wi !== S.wave) {                       // 进入新波次
        S.wave = wi;
        if (wv.mul < 0.8) {
          G.Snd.bell(); fxOn('rush', G.W / 2, 200, wv.name);
          fx(wv.name + '！', G.W / 2, 200, P.orangeDk, 30);
        }
      }
      S.spawnT -= dt;
      if (S.spawnT <= 0) {
        var entered = spawn();
        /* 网红带来的不是一个只在 HUD 上闪的称号：人气期间来客间隔
           实际缩短约 12%，再叠加耐心加成，玩家会明显感到「流量」而不是
           只在结算页多一行字。 */
        var sm = S.scene ? S.scene.spawnMul : 1;
        var wm = S.weather ? S.weather.spawnMul : 1;
        S.spawnT = S.d.interval * wv.mul * sm * wm * G.rand(0.85, 1.2) *
          (S.hype > 0 ? (G.CFG.hypeTrafficMul || 0.77) : 1);
        if (!entered && S.queueHoldT > 0) S.spawnT = Math.min(S.spawnT, 0.75);
        else if (!entered && S.serveBufferT > 0) S.spawnT = Math.min(S.spawnT, 0.35);
        else if (!entered && S.queueRecoveryT > 0)
          /* 整队缓冲的目的是真正推迟下一次满位判定。原先用 min 会让
             满队在 0.45 秒后反复判定，慢手玩家反而连续收到“没位置”；
             保留一小段余温，让玩家有时间清掉队首再接下一位。 */
          S.spawnT = Math.max(S.spawnT, S.queueRecoveryT + 0.25);
      }
    }
    if (S.queueHoldT > 0) S.queueHoldT = Math.max(0, S.queueHoldT - dt);
    if (S.serveBufferT > 0) {
      S.serveBufferT = Math.max(0, S.serveBufferT - dt);
      if (S.serveBufferT <= 0) S.serveBufferMax = 0;
    }
    if (S.queueRecoveryT > 0) {
      S.queueRecoveryT = Math.max(0, S.queueRecoveryT - dt);
      if (S.queueRecoveryT <= 0) S.queueRecoveryMax = 0;
    }
    if (S.flowT > 0) {
      S.flowT = Math.max(0, S.flowT - dt);
      if (S.flowT <= 0) S.flowMul = 1;
    }
    if (S.eventCalmT > 0) {
      S.eventCalmT = Math.max(0, S.eventCalmT - dt);
      if (S.eventCalmT <= 0) {
        S.eventCalmMax = 0;
        S.eventCalmMul = 1;
      }
    }
    if (S.comebackT > 0) {
      S.comebackT = Math.max(0, S.comebackT - dt);
      if (S.comebackT <= 0) {
        S.comebackMax = 0;
        S.comebackMul = 1;
      }
    }
    if (S.mistakeRecoveryT > 0) {
      S.mistakeRecoveryT = Math.max(0, S.mistakeRecoveryT - dt);
      if (S.mistakeRecoveryT <= 0) {
        S.mistakeRecoveryMax = 0;
        S.mistakeRecoveryMul = 1;
      }
    }

    var anyCust = false;
    for (k = 0; k < G.SLOT.length; k++) {
      var c = S.cust[k]; if (!c) continue;
      anyCust = true;
      c.life += dt; c.inT = Math.min(1, c.inT + dt * 4);
      if (c.sayT > 0) c.sayT -= dt;
      if (c.state === 'wait' && !c.sayT && !c.grumbled &&
          c.patience / c.pmax < 0.34) {              // 快没耐心了，抱怨一句
        c.grumbled = 1; saySome(c, G.pick(SAY.wait));
      }
      if (c.state === 'wait' && !c.warned && c.patience / c.pmax < 0.20) {
        c.warned = 1; c.urgent = 1;
        G.Snd.warn();
        fx('快没耐心了！', G.SLOT[k].cx, 112, P.red, 16);
      }
      if (c.state === 'wait') {
        var practice = G.practiceForDay ? G.practiceForDay(S.day) : null;
        var lastChance = practice ? (practice.lastChance || 0) : 0;
        var ready = servable(c);
        if (ready && !c.readySeen) {
          c.readySeen = 1;
          if (!S.readyFeedback) {
            S.readyFeedback = 1;
            cheer('readyOrder', '对口成品！顾客会多等一会', G.SLOT[k].cx, 140,
              '#357A38', 15);
          } else if (!c.readyCueShown) {
            c.readyCueShown = 1;
            fx('这份对口 · 先递 ' + (k + 1) + '号', G.SLOT[k].cx, 140,
              '#357A38', 13);
          }
        } else if (!ready) {
          c.readySeen = 0;
          /* 套餐送掉一项后，下一项重新变成可出餐时还应再给一次小反馈；
             由 readySeen 的边沿控制，不会在同一帧或同一状态刷屏。 */
          c.readyCueShown = 0;
        }
        if (c.lastChanceT > 0) {
          /* 耐心归零后的短暂停顿：不再继续扣负数，给玩家一个清晰的
             红色救援时刻；救回它仍按零耐心结算，所以只保住本金，不送小费。 */
          c.lastChanceT = Math.max(0, c.lastChanceT - dt);
          if (c.lastChanceT <= 0) {
            c.state = 'leaving'; c.anim = 0;
            S.lost++; noteLost(c);
            if (G.triggerComeback) G.triggerComeback();
            G.Snd.angry();
            fxOn('angry', G.SLOT[k].cx, 170);
            fx('跑单！', G.SLOT[k].cx, 170, P.red, 26);
          }
        } else {
          var readyMul = ready ? (G.readyPatienceMul ? G.readyPatienceMul(S.day) : 1) : 1;
          var flowMul = S.flowT > 0 ? G.clamp(+S.flowMul || 1, 0.65, 1) : 1;
          var calmMul = S.eventCalmT > 0 ? G.clamp(+S.eventCalmMul || 1, 0.50, 1) : 1;
          var comebackMul = S.comebackT > 0 ? G.clamp(+S.comebackMul || 1, 0.50, 1) : 1;
          var mistakeMul = S.mistakeRecoveryT > 0 ?
            G.clamp(+S.mistakeRecoveryMul || 1, 0.50, 1) : 1;
          var patienceMul = G.patienceDrainMul
            ? G.patienceDrainMul(S.day, ready, S.flowT > 0, flowMul,
                S.eventCalmT > 0, calmMul, S.shockT > 0,
                S.comebackT > 0, comebackMul,
                S.mistakeRecoveryT > 0, mistakeMul)
            : (S.shockT > 0 ? 1.8 : 1) * readyMul * flowMul * calmMul * comebackMul * mistakeMul;
          c.patience -= dt * (c.patRate || 1) * patienceMul;
          if (c.patience <= 0) {
            if (lastChance > 0 && !c.lastChance) {
              c.lastChance = 1; c.lastChanceT = lastChance; c.urgent = 1;
              G.Snd.warn();
              fx('最后一口气！赶紧递', G.SLOT[k].cx, 140, P.orangeDk, 16);
            } else {
              c.state = 'leaving'; c.anim = 0;
              S.lost++; noteLost(c);
              if (G.triggerComeback) G.triggerComeback();
              G.Snd.angry();
              fxOn('angry', G.SLOT[k].cx, 170);
              fx('跑单！', G.SLOT[k].cx, 170, P.red, 26);
            }
          }
        }
      } else {
        c.anim += dt;
        if (c.state === 'hit') c.splat = Math.min(1, c.anim / 0.35);
        if (c.anim > (c.state === 'hit' ? 1.6 : 0.6)) S.cust[k] = null;
      }
    }

    for (k = 0; k < S.grill.length; k++) {
      var g = S.grill[k];
      if (g.state === 'dough' && g.pressing) {     // 摊开的过程，看得见
        g.press = Math.min(1, g.press + dt / G.CFG.pressTime);
        if (g.press >= 1) {
          g.state = 'toasting'; g.t = 0; g.flag = 0; g.pressing = 0;
          var gc = Art.content(G.ZONE.grill);
          var gx = gc.x + gc.w * ((k + 0.5) / G.CFG.grillSlots), gy = gc.y + (gc.h - 4) / 2;
          G.Snd.sizzle(); fxOn('pop', gx, gy);
          fx('下铛了', gx, gy - 30, P.orangeDk, 13);
        }
        continue;
      }
      if (g.state !== 'toasting') continue;
      g.t += dt;
      if (g.flag === 0 && g.t >= G.bunTiming(g, 'good')) { g.flag = 1; G.Snd.bell(); }
      if (g.flag === 1 && g.t >= G.bunTiming(g, 'burn')) { g.flag = 2; G.Snd.burn(); }
    }

    // 做好的冰峰 / 凉皮，出餐口一有空位就自己上桌
    if (S.fridge === 'open' && S.drinks < G.CFG.maxDrink) {
      S.drinks++; S.fridge = 'empty'; G.Snd.glass();
      if (S.drinks === 1) cheer('firstDrink', '冰峰开盖！可以出餐',
        G.ZONE.fridge.x + G.ZONE.fridge.w / 2, G.ZONE.fridge.y + 52, '#357A9B', 15);
    }
    if (S.noodle.state === 'done' && S.tray.length < G.CFG.maxTray) {
      S.tray.push({ type: 'lp', wrapT: 1 });          // 碗不用包纸
      S.noodle = { state: 'empty', mix: 0, ang: null }; G.Snd.take();
      cheer('firstNoodle', '凉皮拌好了！', G.BOWL.x, G.BOWL.y - 58, '#B07800', 15);
    }

    if (S.uTip && UTIP[S.uTip] && UTIP[S.uTip].ok()) {
      S.uTip = null;
      G.Snd.tutStep();
    }

    if (S.shockT > 0) S.shockT = Math.max(0, S.shockT - dt);
    if (S.throwFly) {                              // 飞行 → 命中
      S.throwFly.t += dt;
      if (S.throwFly.t >= S.throwFly.dur) {
        var tk = S.throwFly.k; S.throwFly = null;
        hitCustomer(tk);
      }
    }

    for (var w2 = 0; w2 < S.tray.length; w2++) {   // 盖上纸之后自动裹好
      var it2 = S.tray[w2];
      if (it2.wrapping && it2.wrapT < 1) {
        it2.wrapT = Math.min(1, it2.wrapT + dt / 0.32);
        if (it2.wrapT >= 1) {
          it2.wrapping = 0; S.wrapped = (S.wrapped || 0) + 1;
          var tc2 = G.traySlot(w2);
          G.Snd.done(); fx('包好了', tc2.x, tc2.y - 26, '#1D8A3C', 14);
          burst(tc2.x, tc2.y - 8, 5, [P.cream, '#F3E7CF', P.yellow]);
        }
      }
    }

    if (G.Events && G.Events.update) G.Events.update(dt);

    if (S.tut !== null && S.tut !== undefined) {   // 引导推进
      var ts = TUT[S.tut];
      if (!ts) S.tut = null;
      else if (ts.ok()) {
        S.tut++;
        if (S.tut >= TUT.length) {
          S.tut = null;
          G.Snd.unlock();
          fx('上手了！剩下的看着办', G.W / 2, 200, '#1D8A3C', 24);
        } else G.Snd.tutStep();
      }
    }

    // 没有爱心了：跑单只是丢生意，一天就是一天
    if (S.timeLeft <= 0 && !anyCust) endDay('ok');
  };

  /* 按钮只有 62~74px 高（真机 6.6~7.8mm），够不上一指必中的 9mm。
     画面一点不动，只把命中矩形四周放 7px —— next 和 home 之间原本留
     16px，两边各吃 7 还剩 2px，不会粘连。 */
  function inBtn(x, y, b) {
    return x >= b.x - 7 && x <= b.x + b.w + 7 && y >= b.y - 7 && y <= b.y + b.h + 7;
  }

  /* 顶栏按钮视觉上保持紧凑，但上下各留 5px 的触控缓冲。
     三个按钮横向间距很窄，因此只扩高不扩宽，避免相邻按钮抢触控。 */
  function inTopBtn(x, y, b) {
    return x >= b.x && x <= b.x + b.w &&
      y >= Math.max(0, b.y - 5) && y <= b.y + b.h + 5;
  }

  /* ---------- 输入派发 ---------- */
  G.tap = function (x, y) {
    /* 首次标题/漫画 Touch 也主动解锁 AudioContext；snd.js 会吞掉
       未获许可的 Promise，且不会在这里提前创建噪声 buffer。 */
    if (G.Snd.resume) G.Snd.resume(); else G.Snd.init();
    if (S.mode === 'night') { if (G.Night) G.Night.tap(x, y); return; }
    if (S.mode === 'bunmini') { if (G.BunMini) G.BunMini.tap(x, y); return; }
    if (S.mode === 'comic') { if (G.Story && G.Story.tap) G.Story.tap(x, y); return; }
    if (S.mode === 'shop')   { if (G.Shop) G.Shop.tap(x, y); return; }
    if (S.mode === 'goals')  { if (G.Goals) G.Goals.tap(x, y); else G.toTitle(); return; }
    if (S.mode === 'title')  {
      if (inBtn(x, y, BTN.start)) { G.startDay(S.nextDay || 1); return; }
      if (G.Goals && inBtn(x, y, BTN.book)) G.toGoals();
      if (G.Story && G.Story.openComic && inBtn(x, y, BTN.comic))
        G.Story.openComic(S.nextDay || 1);
      return;
    }
    if (S.mode === 'result') {
      if (inBtn(x, y, BTN.next)) {
        var nd = S.reason === 'ok' ? S.day + 1 : S.day;
        if (G.Shop) G.toShop(nd); else G.startDay(nd);
      } else if (inBtn(x, y, BTN.home)) G.toTitle();
      return;
    }

    if (inTopBtn(x, y, G.PREF)) { G.cycleChopStyle(); return; }
    if (inTopBtn(x, y, G.SAUCE)) { G.actSauce(); return; }
    if (inTopBtn(x, y, G.BUNSTYLE)) { G.cycleBunStyle(); return; }

    // 事件（苍蝇、猫之类）优先吃掉这一下
    if (G.Events && G.Events.tap && G.Events.tap(x, y)) return;

    for (var k = 0; k < G.SLOT.length; k++)
      if (G.inRect(x, y, G.SLOT[k].hit)) { actServe(k); return; }

    var Z = G.ZONE;
    // 触控铁盘的上沿占用工位最底下 10px 留白；烤炉真正的内容在更上方。
    if (G.inRect(x, y, Z.grill) && y < TRAY_HIT_TOP) {
      if (blocked('grill')) return;
      var n = G.CFG.grillSlots;
      // 用 zone.w 而不是 content.w 来分格：后者两头被 clamp 吃进去，
      // 实际是 70/60/70，中间那格真机上只有 6.35mm。摊匀成 66.7
      actGrill(G.clamp(Math.floor((x - Z.grill.x) / (Z.grill.w / n)), 0, n - 1));
      return;
    }
    if (G.inRect(x, y, Z.board) && y < TRAY_HIT_TOP) {
      if (blocked('board')) return;
      if (nearer(x, y, G.BSLOT)) { actSlot(); return; }
      if (nearer(x, y, G.BLK)) { actChop(); return; }
      softHint('boardAim', '按住肉堆抓料 · 馍位点一下', G.PILE.x, G.PILE.y - 44,
        P.orangeDk);
      return;                                // 肉堆靠「按住」抓
    }
    if (G.inRect(x, y, Z.pepper)) {
      if (!unlocked('pepper')) { lockedMsg('pepper'); return; }
      if (!blocked('pepper'))
        softHint('pepperGesture', '按住左边切 · 右边抓青椒', G.PBLK.x + 50,
          G.PBLK.y - 42, '#357A38');
      return;                                // 同上
    }
    if (G.inRect(x, y, Z.noodle)) {
      if (!unlocked('noodle')) { lockedMsg('noodle'); return; }
      if (!blocked('noodle')) actNoodle();
      return;
    }
    if (G.inRect(x, y, Z.fridge)) {
      if (!unlocked('fridge')) { lockedMsg('fridge'); return; }
      if (!blocked('fridge')) actFridge();
      return;
    }
    // 先认格子的触控判定 —— 视觉 ZONE.tray 只有 56px 高，真正的每格
    // 86×86 安全区已经在烤炉下沿后一像素开始，因此不会和 grill 粘连。
    var tIdx = trayIndexAt(x, y);
    if (tIdx >= 0) {
      if (S.tray[tIdx] && S.tray[tIdx].wrapT >= 1) {
        var trayK = trayTarget(tIdx);
        if (trayK >= 0) {
          actServe(trayK, tIdx);
          S.gestureHintDone = true; S.gestureHint = null; S.gestureHintT = 0;
          return;
        }
        G.Snd.nope();
        fx('先补口味，再递这份', G.traySlot(tIdx).x, G.traySlot(tIdx).y - 26,
          P.orangeDk, 13);
      } else actWrap(tIdx);
      return;
    }
    if (G.inRect(x, y, Z.tray)) { G.Snd.nope(); return; }
    if (G.inRect(x, y, Z.paper)) {
      softHint('paperGesture', '按住纸站抽纸 · 拖到成品上', G.PAPER.x, G.PAPER.y - 26,
        P.orangeDk);
      return;                                // 纸站靠「按住」抽
    }
    if (G.inRect(x, y, Z.drink)) {
      softHint('drinkAim', S.drinks > 0 ? '冰峰备好了 · 点顾客递出去' : '先点冰柜取瓶，再点顾客',
        G.ZONE.drink.x + G.ZONE.drink.w / 2, G.ZONE.drink.y - 24, '#357A9B');
      return;
    }
  };

  /* 拖动：案板/青椒板 = 连续切，凉皮碗 = 画圈搅拌 */
  G.drag = function (x, y, dist) {
    if (S.mode !== 'play') return;
    if (unlocked('noodle') && !evBlocked('noodle') && S.noodle.state === 'seasoned') {
      var dx = x - G.BOWL.x, dy = y - G.BOWL.y;
      if (dx * dx + dy * dy > G.BOWL.r * G.BOWL.r) { S.noodle.ang = null; return; }
      var a = Math.atan2(dy, dx);
      if (S.noodle.ang === null) { S.noodle.ang = a; return; }
      var d = Math.abs(G.angDiff(a, S.noodle.ang));
      S.noodle.ang = a;
      if (d > 0.012 && d < 1.0) mix(d);
    }
  };

  G.up = function () { if (S.noodle) S.noodle.ang = null; };

  /* 双击 / 上滑属于高阶快捷键，普通点按仍是完整可用的主路径。 */
  G.doubleTap = function (x, y) {
    if (S.mode !== 'play') return false;
    var ti = trayIndexAt(x, y);
    if (ti >= 0 && S.tray[ti] && S.tray[ti].wrapT < 1) {
      var ok = applyPaper(ti);
      if (ok) { S.gestureHintDone = true; S.gestureHint = null; S.gestureHintT = 0; }
      return ok;                                 // 双击成品 = 快速装盘 / 开始包纸
    }
    return false;
  };

  G.swipe = function (sx, sy, ex, ey) {
    if (S.mode !== 'play') return false;
    var ti = trayIndexAt(sx, sy), i;
    if (ti < 0 || !S.tray[ti] || S.tray[ti].wrapT < 1) return false;
    for (i = 0; i < G.SLOT.length; i++) {
      if (!G.inRect(ex, ey, G.SLOT[i].hit)) continue;
      /* 滑动是“把这格递给这位”，保留起点索引，避免自动配对拿走别格。 */
      actServe(i, ti);
      S.gestureHintDone = true; S.gestureHint = null; S.gestureHintT = 0;
      return true;
    }
    return false;
  };

  /* 按住肉堆 / 青椒堆 = 连续地把料抓进手里 */
  /* 按住不放：剁肉 / 切青椒 / 抽一张纸 / 抓一把料 */
  G.hold = function (x, y, dt) {
    if (S.mode !== 'play' || !S.hand) return;
    S.hand.x = x; S.hand.y = y;

    if (S.hand.amt <= 0) {                       // 手空着，先看要不要剁料或抽纸
      if (G.inRect(x, y, G.ZONE.board) && nearer(x, y, G.BLK) && !evBlocked('board')) {
        chopHold(dt); return;
      }
      // 油纸要排在彩椒之前：油纸圈往上探进彩椒板矩形 12px，
      // 二分之后那条带子会被「剁青椒」抢走，先判就还给油纸站
      if (nearer(x, y, G.PAPER)) {
        S.hand.kind = 'paper'; S.hand.amt = 1;
        G.Snd.pull();
        return;
      }
      if (unlocked('pepper') && G.inRect(x, y, G.ZONE.pepper) &&
          pepSide(x, y) === 'blk' && !evBlocked('pepper')) { pepHold(dt); return; }
      if (S.poop > 0 && nearer(x, y, G.POOP)) {     // 彩蛋：抓一坨
        S.poop--; S.hand.kind = 'poop'; S.hand.amt = 1;
        G.Snd.put();
        return;
      }
    }
    if (S.hand.kind === 'paper' || S.hand.kind === 'poop') return;   // 拿住就行

    var kind = null;
    if (G.inRect(x, y, G.ZONE.board) && nearer(x, y, G.PILE) && !evBlocked('board')) kind = 'meat';
    else if (unlocked('pepper') && G.inRect(x, y, G.ZONE.pepper) &&
             pepSide(x, y) === 'pile' && !evBlocked('pepper')) kind = 'pep';
    if (!kind) return;
    if (S.hand.amt > 0 && S.hand.kind !== kind) return;
    var src = kind === 'meat' ? S.mince : S.pep;
    var room = G.CFG.handMax - S.hand.amt;
    if (src <= 0 || room <= 0) return;
    var take = Math.min(G.CFG.grabRate * dt, src, room);
    if (kind === 'meat') {
      syncMinceFat();
      var fatTake = take * G.minceFatRatio();
      S.mince -= take; S.minceFat = Math.max(0, (S.minceFat || 0) - fatTake);
      S.hand.fat = (S.hand.fat || 0) + fatTake;
    } else S.pep -= take;
    S.hand.kind = kind; S.hand.amt += take;
    if (Math.random() < dt * 7) G.Snd.grab();
  };

  /* 松手：在夹馍位上就填进馍里，否则掉回原处（不惩罚） */
  G.release = function (x, y) {
    G.Snd.tierReset();          // 松手＝这一把结束，下次再抓第一档也要能响
    if (!S.hand || S.hand.amt <= 0) { if (S.hand) { S.hand.amt = 0; S.hand.kind = null; } return; }
    var amt = S.hand.amt, kind = S.hand.kind;
    var fatAmt = S.hand.fat || (kind === 'meat' ? amt * cutStyle().fat : 0);
    S.hand.amt = 0; S.hand.fat = 0; S.hand.kind = null;
    if (S.mode !== 'play') return;

    if (kind === 'poop') {                       // 彩蛋：朝顾客扔过去
      for (var pk = 0; pk < G.SLOT.length; pk++) {
        if (!G.inRect(x, y, G.SLOT[pk].hit)) continue;
        if (!S.cust[pk] || S.cust[pk].state !== 'wait') break;
        S.throwFly = { x0: x, y0: y, x1: G.SLOT[pk].cx, y1: 176,
                       t: 0, dur: 0.22, k: pk };
        G.Snd.throwWhoosh();
        return;
      }
      S.poop = Math.min(G.CFG.poopMax, S.poop + 1);   // 没扔中就放回去
      G.Snd.nope();
      return;
    }

    if (kind === 'paper') {                      // 纸盖到没包的成品上
      var pi = trayIndexAt(x, y);
      if (pi >= 0 && applyPaper(pi)) return;
      G.Snd.nope(); fx('纸没盖上', x, y - 26, P.inkSoft, 13);
      return;
    }

    if (S.slot && nearer(x, y, G.BSLOT)) {
      // 手抓不准：真正落进馍里的量是随机的，所以「再抓一把还是就这样夹」
      // 每次都是个真的判断题
      var v = G.grabVarForDay ? G.grabVarForDay(S.day) : G.CFG.grabVar;
      var got = amt * (1 - v + Math.random() * v * 2);
      if (kind === 'meat') {
        S.slot.meat += got;
        S.slot.fat = (S.slot.fat || 0) + got * (amt > 0 ? fatAmt / amt : cutStyle().fat);
      } else S.slot.pep += got;
      fx(Math.round(got) + 'g', G.BSLOT.x, G.BSLOT.y - 24,
        kind === 'meat' ? P.meatDark : P.pepperDk, 15);
      G.Snd.put(); fxOn('make', G.BSLOT.x, G.BSLOT.y);
      burst(G.BSLOT.x, G.BSLOT.y - 6, 4,
        kind === 'meat' ? [P.meat, P.meatDark] : [P.pepper, P.pepperDk]);
      if (S.slot.meat > G.CFG.bunOver) {
        S.slot.meat = G.CFG.bunOver;
        fx('塞太多了，撒了一点', G.BSLOT.x, G.BSLOT.y - 42, P.red, 13);
      }
      return;
    }
    if (kind === 'meat') {
      S.mince = Math.min(minceCap(), S.mince + amt);
      S.minceFat = Math.min(S.mince, (S.minceFat || 0) + fatAmt);
    }
    else S.pep = Math.min(pepCap(), S.pep + amt);
    G.Snd.nope();
    fx('掉回去了', x, y - 26, P.inkSoft, 13);
  };

  /* ---------- 渲染 ---------- */
  function drawFx(ctx) {
    var i;
    for (i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      ctx.globalAlpha = 1 - p.life / p.ttl;
      G.box(ctx, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s, 2, p.col, 0);
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < S.flies.length; i++) {
      var f = S.flies[i], t = f.t / f.dur;
      var fx2 = G.lerp(f.x0, f.x1, t);
      var fy2 = G.lerp(f.y0, f.y1, t) - Math.sin(t * Math.PI) * 90;
      if (f.type === 'rjm' || f.type === 'rjmp')
        Art.wrapped(ctx, fx2, fy2, 0.9, 1, f.type === 'rjmp');
      else Art.item(ctx, f.type, fx2, fy2, 0.9);
    }
    for (i = 0; i < S.floats.length; i++) {
      var fl = S.floats[i];
      ctx.globalAlpha = 1 - Math.pow(fl.life / fl.ttl, 3);
      G.text(ctx, fl.txt, fl.x, fl.y, { size: fl.size, col: fl.col, stroke: P.cream, strokeW: 6 });
    }
    ctx.globalAlpha = 1;
  }

  function drawPlay(ctx) {
    var prog = G.clamp(1 - S.timeLeft / G.CFG.dayLength, 0, 1);   // 今天过了多久
    Art.scene(ctx, S.scene);
    if (Art.ambientBack) Art.ambientBack(ctx, prog, S.anim);
    if (Art.weatherBack) Art.weatherBack(ctx, S.weather, S.anim);

    for (var k = 0; k < G.SLOT.length; k++) {
      var c = S.cust[k]; if (!c) continue;
      var x = G.SLOT[k].cx;
      ctx.save();
      if (c.state === 'happy') {
        ctx.translate(0, -Math.sin(c.anim / 0.6 * Math.PI) * 26);
        ctx.globalAlpha = 1 - c.anim / 0.6;
      } else if (c.state === 'hit') {
        if (c.anim > 0.7) {
          var hq = (c.anim - 0.7) / 0.9;
          ctx.translate(0, hq * 74); ctx.globalAlpha = 1 - hq;
        } else {
          ctx.translate(Math.sin(c.anim * 42) * 3.5, 0);   // 挨了一下的哆嗦
        }
      } else if (c.state === 'leaving') {
        ctx.translate(0, c.anim / 0.6 * 60);
        ctx.globalAlpha = 1 - c.anim / 0.6;
      } else {
        ctx.translate(0, (1 - c.inT) * 80);
      }
      var t = c.patience / c.pmax;
      Art.customer(ctx, x, c, c.state === 'wait' ? t : 1);
      if (c.sayT > 0 && Art.sayTag)
        Art.sayTag(ctx, x, 152, c.say, c.sayT, k >= G.SLOT.length / 2);
      if (c.state === 'wait') {
        var ct = G.CTYPE[c.type] || G.CTYPE.normal;
        var specialCt = c.special ? G.SPECIAL[c.special] : null;
      Art.bubble(ctx, x, c.items, t, servable(c),
          specialCt ? specialCt.tag : ct.tag,
          specialCt ? specialCt.col : ct.col, c.preference, c.urgent,
          c.recipeTag, c.takeout, c.secretHint, c.lastChanceT);
      }
      else if (c.state === 'hit') {
        // 糊在胸口不糊脸 —— 受惊/暴怒的表情才是重点
        if (Art.splat) Art.splat(ctx, x, 212, c.splat || 0, 0.95);
        G.text(ctx, c.expr === 'scared' ? '救命啊！' : '我投诉你！', x, 76,
          { size: 20, col: P.red, stroke: P.cream });
      } else G.text(ctx, c.state === 'happy' ? '好吃！' : '不等了！', x, 76,
        { size: 22, col: c.state === 'happy' ? '#1D8A3C' : P.red, stroke: P.cream });
      ctx.restore();
    }

    Art.counter(ctx);
    if (Art.poopPile)
      Art.poopPile(ctx, G.ZONE.poop, S.poop,
        S.poop > 0 && !(S.hand && S.hand.amt > 0));

    var Z = G.ZONE;
    Art.grill(ctx, Z.grill, S.grill, S.anim);

    Art.board(ctx, Z.board, {
      block: S.block,
      pile: G.clamp(S.mince / minceCap(), 0, 1),
      grams: S.mince, cap: minceCap(),
      slot: S.slot, need: G.CFG.bunNeed, pepNeed: G.CFG.bunPep,
      blk: G.BLK, pileC: G.PILE, slotC: G.BSLOT,
      full: S.mince >= minceCap() - 0.5
    }, S.cleaverY, S.anim);

    if (unlocked('pepper')) Art.pepperBoard(ctx, Z.pepper, {
      block: S.pblock,
      pile: G.clamp(S.pep / pepCap(), 0, 1),
      grams: S.pep, cap: pepCap(), pepCol: S.pepCol,
      blk: G.PBLK, pileC: G.PPILE,
      full: S.pep >= pepCap() - 0.5
    }, S.pknifeY, S.anim);
    else Art.locked(ctx, Z.pepper, G.UNLOCK.pepper);

    if (unlocked('noodle')) Art.noodleBar(ctx, Z.noodle, S.noodle, S.anim);
    else Art.locked(ctx, Z.noodle, G.UNLOCK.noodle);

    if (unlocked('fridge')) Art.fridge(ctx, Z.fridge, S.fridge, S.anim);
    else Art.locked(ctx, Z.fridge, G.UNLOCK.fridge);

    /* 铁盘额外显示“→几号”提示，帮助玩家在多份同类成品中快速认出
       当前对口的一份；真正的质量判定仍走 actServe 的统一逻辑。 */
    Art.ironTray(ctx, Z.tray, S.tray, G.CFG.maxTray, S.cust);
    var needPaper = false;
    for (var q2 = 0; q2 < S.tray.length; q2++) if (S.tray[q2].wrapT < 1) needPaper = true;
    Art.paperStack(ctx, Z.paper,
      needPaper && !(S.hand && S.hand.kind === 'paper'));
